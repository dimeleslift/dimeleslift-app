a barra. Sácala con la zona lumbar firme y ubícate. Pies más anchos enfatizan espalda, glúteos, aductores e isquiotibiales; más juntos, cuádriceps. Mira al frente.","Con espalda, hombros y core firmes, empuja rodillas y cadera hacia afuera y baja llevando la cadera atrás hasta sentarte en el cajón, idealmente con las canillas verticales. Pausa y relaja los flexores de cadera. Nunca rebotes.","Con el peso en los talones y empujando pies y rodillas hacia afuera, sube guiando con la cabeza y con tensión de pies a cabeza. Devuelve la barra al rack con cuidado."],"en":"Box Squat with Bands","ines":1,"f":"push","m":"c","sec":["abductores","aductores","espalda_baja","gemelos","gluteos","isquios"]},"fdb-Box_Squat_with_Chains":{"nombre":"Sentadilla al cajón con cadenas","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Fuerza","inst":["Ponte en un rack con un cajón detrás a la altura adecuada (normalmente la que te deja en paralelo).","Pasa la cadena guía por las mangas de la barra y engancha la cadena pesada con un mosquetón. Ajusta el largo para que, arriba, algunos eslabones sigan en el suelo.","Métete bajo la barra y apóyala en la parte alta de la espalda. Junta las escápulas y lleva los codos adelante. Sácala con la zona lumbar firme y ubícate. Pies más anchos enfatizan cadena posterior; más juntos, cuádriceps. Mira al frente.","Con espalda, hombros y core firmes, empuja rodillas y cadera hacia afuera y baja hasta sentarte en el cajón, idealmente con las canillas verticales. Pausa y relaja los flexores de cadera. Nunca rebotes.","Con el peso en los talones y empujando pies y rodillas hacia afuera, sube guiando con la cabeza y con tensión de pies a cabeza."],"en":"Box Squat with Chains","ines":1,"f":"push","m":"c","sec":["abductores","aductores","espalda_baja","gemelos","gluteos","isquios"]},"fdb-Brachialis-SMR":{"nombre":"Braquial con foam roller","grupos":["biceps"],"eq":"Foam roller","niv":"Intermedio","cat":"Elongación","inst":["Lie on your side, with your upper arm against the foam roller. The upper arm should be more or less aligned with your body, with the outside of the bicep pressed against the foam roller.","Raise your hips off of the floor, supporting your weight on your arm and on your feet. Hold for 10-30 seconds, and then switch sides."],"en":"Brachialis-SMR","f":"static"},"fdb-Bradford_Rocky_Presses":{"nombre":"Press Bradford","grupos":["hombros"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en un banco de press militar con la barra a la altura de los hombros y agarre prono, más ancho que los hombros (antebrazo y brazo forman 90° abajo). Esta es la posición inicial.","Sube la barra sobre la cabeza bloqueando los brazos.","Bájala lento por detrás de la cabeza inspirando.","Súbela de vuelta botando el aire.","Bájala lento por delante hasta la posición inicial inspirando. Eso es una repetición.","Alterna así hasta completar las repeticiones."],"en":"Bradford/Rocky Presses","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Butt-Ups":{"nombre":"Elevación de glúteos en plancha","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Ponte en plancha sobre los antebrazos, codos a 90°.","Deja la espalda levemente redondeada en vez de totalmente recta.","Sube los glúteos hacia el techo apretando el abdomen para acercar costillas y cadera, hasta quedar en un puente alto. Bota el aire.","Baja lento a la posición inicial inspirando, sin dejar que la espalda se hunda.","Repite las repeticiones indicadas."],"en":"Butt-Ups","ines":1,"f":"pull","m":"c"},"fdb-Butt_Lift_Bridge":{"nombre":"Puente de glúteos","grupos":["gluteos"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con las manos a los lados, rodillas flectadas y pies al ancho de hombros. Esta es la posición inicial.","Empujando sobre todo con los talones, sube la cadera con la espalda recta, botando el aire. Sostén un segundo arriba.","Baja lento a la posición inicial inspirando."],"en":"Butt Lift (Bridge)","ines":1,"f":"push","m":"i","sec":["isquios"]},"fdb-Butterfly":{"nombre":"Peck deck (mariposa)","grupos":["pectoral"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina con la espalda apoyada en el respaldo.","Toma los agarres. Ajusta la máquina para que los brazos queden paralelos al suelo. Esta es la posición inicial.","Junta los agarres lento apretando el pecho, botando el aire. Sostén un segundo.","Vuelve lento a la posición inicial inspirando, hasta estirar bien el pecho.","Repite las repeticiones indicadas."],"en":"Butterfly","ines":1,"f":"pull","m":"i"},"fdb-Cable_Chest_Press":{"nombre":"Press de pecho en polea","grupos":["pectoral"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Ajusta la carga y siéntate tomando los agarres. Brazos a unos 45° del cuerpo, cabeza y pecho arriba, codos a unos 90°. Esta es la posición inicial.","Extiende los codos empujando los agarres al frente hasta juntarlos, con las escápulas retraídas.","Tras una pausa con los brazos estirados, vuelve a la posición inicial manteniendo la tensión en los cables.","También puedes hacerlo sin respaldo, en inclinado, declinado o alternando brazos."],"en":"Cable Chest Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Cable_Crossover":{"nombre":"Cruce de poleas","grupos":["pectoral"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon las poleas arriba (sobre la cabeza), elige la carga y toma un agarre en cada mano.","Da un paso al frente de la línea entre ambas poleas juntando los brazos frente a ti, con el torso levemente inclinado. Esta es la posición inicial.","Con los codos levemente flectados, abre los brazos hacia los lados en un arco amplio hasta sentir estiramiento en el pecho, inspirando. Solo se mueve el hombro.","Vuelve por el mismo arco a la posición inicial botando el aire.","Sostén un segundo y repite las repeticiones indicadas."],"en":"Cable Crossover","ines":1,"f":"push","m":"i","sec":["hombros"]},"fdb-Cable_Crunch":{"nombre":"Crunch en polea","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Arrodíllate bajo una polea alta con cuerda.","Toma la cuerda y bájala hasta que las manos queden junto a la cara.","Flecta levemente la cadera y deja que la carga extienda la zona lumbar. Esta es la posición inicial.","Con la cadera quieta, flecta el tronco contrayendo el abdomen para llevar los codos hacia la mitad de los muslos, botando el aire. Sostén un segundo.","Vuelve lento inspirando, con tensión constante en el abdomen. No uses tanta carga que la zona lumbar haga el trabajo.","Repite las repeticiones indicadas."],"en":"Cable Crunch","ines":1,"f":"pull","m":"i"},"fdb-Cable_Deadlifts":{"nombre":"Peso muerto en polea","grupos":["cuadriceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon las poleas abajo, elige la carga y párate justo entre ambas torres.","Baja flectando cadera y rodillas hasta alcanzar los agarres.","Tómalos y sube empujando con los talones, extendiendo cadera y rodillas con las manos colgando a los costados. Cabeza y pecho arriba.","Al quedar de pie, vuelve a la posición inicial y repite."],"en":"Cable Deadlifts","ines":1,"f":"pull","m":"c","sec":["antebrazos","espalda_baja","gluteos","isquios"]},"fdb-Cable_Hammer_Curls_-_Rope_Attachment":{"nombre":"Curl martillo en polea con cuerda","grupos":["biceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon una cuerda en la polea baja y párate frente a la máquina a unos 30 cm.","Toma la cuerda con agarre neutro (palmas enfrentadas), de pie, con el torso quieto.","Codos pegados al cuerpo y fijos todo el movimiento; solo se mueven los antebrazos. Esta es la posición inicial.","Flecta los codos subiendo la cuerda botando el aire, hasta que el bíceps toque el antebrazo.","Aprieta un segundo y baja lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"Cable Hammer Curls - Rope Attachment","ines":1,"f":"pull","m":"i"},"fdb-Cable_Hip_Adduction":{"nombre":"Aducción de cadera en polea","grupos":["cuadriceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Párate junto a una polea baja, con una pierna cerca de ella y la otra más lejos.","Pon la tobillera en el tobillo de la pierna más cercana y engánchala al cable.","Aléjate de la máquina con los pies bien separados y afírmate de la estructura.","Apóyate en el pie lejano y deja que la pierna con tobillera se vaya hacia la polea. Esta es la posición inicial.","Lleva la pierna con tobillera por delante de la otra usando los aductores, botando el aire.","Vuelve lento a la posición inicial inspirando.","Repite las repeticiones indicadas y cambia de pierna."],"en":"Cable Hip Adduction","ines":1,"f":"pull","m":"i"},"fdb-Cable_Incline_Pushdown":{"nombre":"Pushdown en polea en banco inclinado","grupos":["dorsales"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco inclinado de espaldas a una polea alta con barra recta.","Toma la barra sobre la cabeza con agarre prono al ancho de hombros y estira los brazos al frente, con la barra a unos 5 cm de los muslos. Esta es la posición inicial.","Con los brazos estirados, llévalos hacia atrás en semicírculo hasta que la barra quede sobre la cabeza, inspirando.","Vuelve lento a la posición inicial usando los dorsales y aprieta al llegar, botando el aire.","Repite las repeticiones indicadas."],"en":"Cable Incline Pushdown","ines":1,"f":"pull","m":"i"},"fdb-Cable_Incline_Triceps_Extension":{"nombre":"Extensión de tríceps en polea en banco inclinado","grupos":["triceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco inclinado de espaldas a una polea alta con barra recta.","Toma la barra sobre la cabeza con agarre prono estrecho y codos recogidos. Los brazos forman unos 25° con el suelo.","Sin mover los brazos, extiende los codos contrayendo los tríceps, botando el aire. Sostén un segundo.","Vuelve lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"Cable Incline Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Cable_Internal_Rotation":{"nombre":"Rotación interna en polea","grupos":["hombros"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Siéntate de lado junto a una polea baja (o en un banco si puedes subir la polea) y toma el agarre con el brazo más cercano.","Codo pegado al costado, flectado a 90° y antebrazo apuntando a la polea. Esta es la posición inicial.","Lleva el agarre hacia tu cuerpo rotando el hombro hacia adentro, hasta que el antebrazo cruce el abdomen. El antebrazo se mantiene perpendicular al torso.","Vuelve lento a la posición inicial.","Repite las repeticiones indicadas y cambia de brazo."],"en":"Cable Internal Rotation","ines":1,"f":"pull","m":"c"},"fdb-Cable_Iron_Cross":{"nombre":"Cruz de hierro en polea","grupos":["pectoral"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon las poleas arriba, elige la carga y toma un agarre en cada mano.","Párate justo entre ambas poleas con los brazos estirados a los lados, cabeza y pecho arriba, formando una “T”. Esta es la posición inicial.","Con los codos estirados, baja los brazos hacia los costados.","Tras una pausa en la contracción, vuelve a la posición inicial.","Repite las repeticiones indicadas."],"en":"Cable Iron Cross","ines":1,"f":"push","m":"i"},"fdb-Cable_Judo_Flip":{"nombre":"Judo flip en polea","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon una cuerda en la polea más baja. Párate de lado al cable con los pies bien separados y toma la cuerda con ambas manos.","Gira el cuerpo alejándote de la polea mientras llevas la cuerda sobre el hombro, como una proyección de judo.","Pasa el peso de un pie al otro mientras giras y te encoges hacia adelante, tirando el cable hacia abajo.","Vuelve a la posición inicial y repite hasta el fallo.","Luego cambia de lado y repite."],"en":"Cable Judo Flip","ines":1,"f":"pull","m":"c"},"fdb-Cable_Lying_Triceps_Extension":{"nombre":"Extensión de tríceps acostado en polea","grupos":["triceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco plano y toma la barra recta de una polea baja con agarre prono estrecho. Lo más fácil es que alguien te pase la barra.","Con los brazos estirados, ubica la barra sobre el torso, formando 90° entre brazos y torso. Esta es la posición inicial.","Baja la barra flectando los codos, con los brazos quietos y codos recogidos, hasta rozar la frente, inspirando.","Extiende los codos con los tríceps hasta la posición inicial, botando el aire.","Sostén un segundo y repite las repeticiones indicadas."],"en":"Cable Lying Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Cable_One_Arm_Tricep_Extension":{"nombre":"Extensión de tríceps a una mano en polea","grupos":["triceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Con la mano derecha, toma un agarre simple de la polea alta en supino (palma hacia arriba), de pie frente a la máquina.","Baja el agarre hasta fijar el brazo y el codo al costado, con un ángulo menor a 90° entre brazo y antebrazo. Puedes adelantar una pierna para estabilizarte. Esta es la posición inicial.","Contrayendo el tríceps, baja el agarre hasta estirar el brazo, botando el aire. Solo se mueve el antebrazo.","Aprieta un segundo.","Vuelve lento a la posición inicial.","Repite las repeticiones indicadas y cambia de brazo."],"en":"Cable One Arm Tricep Extension","ines":1,"f":"push","m":"i"},"fdb-Cable_Preacher_Curl":{"nombre":"Curl Scott en polea","grupos":["biceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco Scott a unos 60 cm de una polea.","Engancha una barra recta en la polea baja.","Siéntate con codos y brazos firmes sobre el cojín y pide que te pasen la barra.","Toma la barra con los brazos estirados sobre el cojín. Esta es la posición inicial.","Sube la carga hacia los hombros y aprieta fuerte el bíceps arriba, botando el aire. Sostén un segundo.","Baja lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"Cable Preacher Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Cable_Rear_Delt_Fly":{"nombre":"Vuelo posterior en polea","grupos":["hombros"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Ajusta la altura de las poleas (sobre la cabeza) y la carga.","Toma la polea izquierda con la mano derecha y la derecha con la izquierda, cruzándolas frente a ti. Esta es la posición inicial.","Lleva los brazos hacia atrás y afuera, siempre estirados.","Pausa al final y vuelve a la posición inicial."],"en":"Cable Rear Delt Fly","ines":1,"f":"pull","m":"i"},"fdb-Cable_Reverse_Crunch":{"nombre":"Crunch invertido en polea","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon una tobillera en una polea baja y una colchoneta frente a ella.","Siéntate con los pies hacia la polea y engancha el cable a los tobillos.","Acuéstate, sube las piernas y flecta las rodillas a 90°. Piernas y cable deben quedar alineados; ajusta la polea si no.","Con las manos detrás de la cabeza, lleva las rodillas hacia el torso despegando la cadera del suelo.","Pausa y, lento y controlado, baja la cadera y vuelve a los 90°, sin perder tensión en el abdomen.","Repite hasta el fallo."],"en":"Cable Reverse Crunch","ines":1,"f":"pull","m":"i"},"fdb-Cable_Rope_Overhead_Triceps_Extension":{"nombre":"Extensión de tríceps sobre la cabeza con cuerda en polea baja","grupos":["triceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon una cuerda en la polea baja.","Tómala con ambas manos y estira los brazos sobre la cabeza con agarre neutro. Codos cerca de la cabeza, brazos perpendiculares al suelo y nudillos hacia el techo. Esta es la posición inicial.","Baja lento la cuerda detrás de la cabeza sin mover los brazos, inspirando, y pausa con el tríceps bien estirado.","Vuelve a la posición inicial contrayendo el tríceps, botando el aire.","Repite las repeticiones indicadas."],"en":"Cable Rope Overhead Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Cable_Rope_Rear-Delt_Rows":{"nombre":"Remo con cuerda para deltoides posterior","grupos":["hombros"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina de remo bajo como para un remo sentado.","Pon una cuerda y tómala con agarre prono, brazos estirados y paralelos al suelo, codos hacia afuera.","Zona lumbar erguida y cadera atrás, con las rodillas levemente flectadas. Esta es la posición inicial.","Tira la cuerda hacia la parte alta del pecho, bajo el cuello, con los codos arriba y afuera, botando el aire, hasta que los codos pasen un poco detrás de la espalda. Brazos siempre horizontales.","Vuelve a la posición inicial estirando los hombros hacia adelante, inspirando.","Repite las repeticiones indicadas."],"en":"Cable Rope Rear-Delt Rows","ines":1,"f":"pull","m":"c","sec":["biceps","dorsales"]},"fdb-Cable_Russian_Twists":{"nombre":"Giro ruso en polea","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un agarre simple en la polea a media altura.","Acuéstate sobre un fitball perpendicular al cable, a un brazo de distancia, con tensión en el cable.","Toma el agarre con ambas manos y estira los brazos sobre el pecho, alineados con la polea (ajústala si no).","Cadera arriba y abdomen activo. Gira el torso un cuarto de vuelta alejándote de la polea, con el cuerpo plano de cabeza a rodillas.","Pausa y vuelve lento y controlado a la posición inicial, sin perder tensión.","Repite hasta el fallo.","Luego cambia de lado y repite."],"en":"Cable Russian Twists","ines":1,"f":"pull","m":"c"},"fdb-Cable_Seated_Crunch":{"nombre":"Crunch sentado en polea","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en un banco plano de espaldas a una polea alta.","Toma la cuerda con ambas manos (palmas enfrentadas) y pon las manos sobre los hombros. Deja que la carga extienda levemente la zona lumbar. Esta es la posición inicial.","Con la cadera quieta, flecta el tronco llevando los codos hacia la cadera, botando el aire.","Vuelve lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Cable Seated Crunch","ines":1,"f":"pull","m":"i"},"fdb-Cable_Seated_Lateral_Raise":{"nombre":"Elevación lateral sentado en polea","grupos":["hombros"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Párate entre dos poleas bajas enfrentadas y pon un banco plano detrás de ti, perpendicular. Elige la carga en cada polea.","Siéntate en el borde del banco con los pies delante de las rodillas.","Inclínate con la espalda plana y apoya el torso en los muslos.","Pide que te pasen los agarres: el izquierdo en la mano derecha y el derecho en la izquierda, pasando bajo las rodillas. Brazos estirados, palmas enfrentadas y codos levemente flectados. Esta es la posición inicial.","Sube los brazos hacia los lados hasta la altura de los hombros, botando el aire. Sostén un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas, con los brazos perpendiculares al torso y el codo fijo levemente flectado."],"en":"Cable Seated Lateral Raise","ines":1,"f":"pull","m":"i","sec":["dorsales","trapecio"]},"fdb-Cable_Shoulder_Press":{"nombre":"Press de hombros en polea","grupos":["hombros"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon las poleas abajo y elige la carga.","Párate entre ambas torres y toma los agarres a la altura de los hombros, palmas al frente. Esta es la posición inicial.","Con cabeza y pecho arriba, extiende los codos empujando los agarres sobre la cabeza.","Pausa arriba, vuelve a la posición inicial y repite."],"en":"Cable Shoulder Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Cable_Shrugs":{"nombre":"Encogimiento de hombros en polea","grupos":["trapecio"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Toma una barra de polea baja con agarre prono al ancho de hombros o algo más.","De pie, cerca de la polea, con los brazos estirados sosteniendo la barra. Esta es la posición inicial.","Sube los hombros lo más alto posible botando el aire y sostén un segundo. Brazos siempre estirados; solo se mueven los hombros.","Baja a la posición inicial.","Repite las repeticiones indicadas."],"en":"Cable Shrugs","ines":1,"f":"pull","m":"i"},"fdb-Cable_Wrist_Curl":{"nombre":"Curl de muñeca en polea","grupos":["antebrazos"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco plano frente a una polea baja con barra recta.","Toma la barra con agarre supino (palmas arriba), estrecho o al ancho de hombros, y apoya los antebrazos sobre los muslos con las muñecas pasado las rodillas.","Flecta las muñecas hacia arriba botando el aire y sostén un segundo.","Baja lento a la posición inicial inspirando.","Los antebrazos no se mueven; solo trabaja la muñeca.","Repite las repeticiones indicadas."],"en":"Cable Wrist Curl","ines":1,"f":"pull","m":"i"},"fdb-Calf-Machine_Shoulder_Shrug":{"nombre":"Encogimiento de hombros en máquina de gemelos","grupos":["trapecio"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Ubícate en la máquina de pantorrillas con los cojines sobre los hombros, torso recto y brazos a los lados. Esta es la posición inicial.","Sube los hombros hacia las orejas botando el aire y sostén un segundo completo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Calf-Machine Shoulder Shrug","ines":1,"f":"pull","m":"i"},"fdb-Calf_Press":{"nombre":"Press de gemelos","grupos":["gemelos"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Ajusta el asiento para que las piernas queden apenas flectadas al inicio, con la parte delantera de los pies firme en la plataforma.","Elige la carga y toma los agarres. Esta es la posición inicial.","Extiende las rodillas levantando apenas la carga, con el tobillo flectado y puntas hacia arriba. Empuja con la parte delantera de los pies lo más que puedas.","Tras una breve pausa, vuelve y repite."],"en":"Calf Press","ines":1,"f":"push","m":"i"},"fdb-Calf_Press_On_The_Leg_Press_Machine":{"nombre":"Gemelos en prensa","grupos":["gemelos"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la prensa y apoya los pies en la plataforma al ancho de hombros.","Quita los seguros y empuja la plataforma hasta estirar las piernas sin bloquear las rodillas (si tu máquina permite dejar los seguros puestos, mejor). Apoya solo las puntas y la parte delantera de los pies en el borde inferior, con los talones afuera. Esta es la posición inicial.","Empuja subiendo los talones lo más alto posible, botando el aire y contrayendo la pantorrilla. Las rodillas no se flectan. Sostén un segundo.","Baja lento los talones hasta estirar la pantorrilla, inspirando.","Repite las repeticiones indicadas."],"en":"Calf Press On The Leg Press Machine","ines":1,"f":"push","m":"i"},"fdb-Calf_Raise_On_A_Dumbbell":{"nombre":"Elevación de gemelos sobre mancuerna","grupos":["gemelos"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Afírmate de algo firme y párate sobre el mango de una mancuerna, idealmente con discos redondos para que ruede y debas estabilizarte más.","Rueda el pie un poco adelante para estirar bien la pantorrilla. Esta es la posición inicial.","Sube rodando el pie sobre el mango hasta la extensión completa, botando el aire. Aprieta fuerte un segundo; al subir, la mancuerna rueda un poco atrás.","Baja inspirando mientras la mancuerna rueda un poco adelante para estirar más.","Repite las repeticiones indicadas."],"en":"Calf Raise On A Dumbbell","ines":1,"f":"push","m":"i"},"fdb-Calf_Raises_-_With_Bands":{"nombre":"Elevación de gemelos con bandas","grupos":["gemelos"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Párate con las puntas sobre una banda, con el mismo largo a cada lado.","Sube los agarres junto a la cabeza como para un press de hombros, palmas al frente y codos a los lados, tensando la banda. Esta es la posición inicial.","Con las manos junto a los hombros, sube en puntas de pie botando el aire y aprieta fuerte las pantorrillas.","Tras un segundo, baja lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"Calf Raises - With Bands","ines":1,"f":"push","m":"i"},"fdb-Calf_Stretch_Elbows_Against_Wall":{"nombre":"Estiramiento de gemelos con codos en la pared","grupos":["gemelos"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Stand facing a wall from a couple feet away.","Lean against the wall, placing your weight on your forearms.","Attempt to keep your heels on the ground. Hold for 10-20 seconds. You may move further or closer the wall, making it more or less difficult, respectively."],"en":"Calf Stretch Elbows Against Wall","f":"static","m":"i"},"fdb-Calf_Stretch_Hands_Against_Wall":{"nombre":"Estiramiento de gemelos con manos en la pared","grupos":["gemelos"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Stand facing a wall from several feet away. Stagger your stance, placing one foot forward.","Lean forward and rest your hands on the wall, keeping your heel, hip and head in a straight line.","Attempt to keep your heel on the ground. Hold for 10-20 seconds and then switch sides."],"en":"Calf Stretch Hands Against Wall","f":"static","m":"i"},"fdb-Calves-SMR":{"nombre":"Gemelos con foam roller","grupos":["gemelos"],"eq":"Foam roller","niv":"Intermedio","cat":"Elongación","inst":["Begin seated on the floor. Place a foam roller underneath your lower leg. Your other leg can either be crossed over the opposite or be placed on the floor, supporting some of your weight. This will be your starting position.","Place your hands to your side or just behind you, and press down to raise your hips off of the floor, placing much of your weight against your calf muscle. Roll from below the knee to above the ankle, pausing at points of tension for 10-30 seconds. Repeat for the other leg."],"en":"Calves-SMR","f":"static"},"fdb-Car_Deadlift":{"nombre":"Peso muerto con auto","grupos":["cuadriceps"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["Este aparato suele tener agarres neutros, aunque algunos tienen barra recta como un peso muerto normal. Se carga con un vehículo u objetos pesados como neumáticos o barriles.","Ubícate al centro de los agarres si eres fuerte en sentadilla, o unos centímetros atrás si eres fuerte en peso muerto. Pies al ancho de cadera. Flecta la cadera para tomar los agarres, toma aire, baja la cadera y flecta las rodillas.","Mira al frente, pecho arriba y espalda firme, y empuja con los talones. Al subir, junta las escápulas mientras llevas la cadera adelante.","Baja flectando la cadera y guiando la carga al suelo."],"en":"Car Deadlift","ines":1,"f":"pull","m":"c","sec":["antebrazos","espalda_baja","gluteos","isquios","trapecio"]},"fdb-Car_Drivers":{"nombre":"Volante con disco","grupos":["hombros"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie, sostén un disco con ambas manos en posición de 3 y 9 del reloj, palmas enfrentadas y brazos estirados al frente. Esta es la posición inicial.","Gira el disco lo más posible hacia un lado, como un volante.","Gíralo hacia el lado contrario hasta el final.","Repite las repeticiones indicadas."],"en":"Car Drivers","ines":1,"f":"push","m":"i","sec":["antebrazos"]},"fdb-Carioca_Quick_Step":{"nombre":"Carioca rápida","grupos":["aductores"],"eq":"","niv":"Principiante","cat":"Pliometría","inst":["Begin with your feet a few inches apart and your left arm up in a relaxed, athletic position.","With your right foot, quick step behind and pull the knee up.","Fire your arms back up when you pull the right knee, being sure that your knee goes straight up and down. Avoid turning your feet as you move and continue to look forward as you move to the side."],"en":"Carioca Quick Step","sec":["abductores","core","cuadriceps","gemelos","gluteos","isquios"]},"fdb-Cat_Stretch":{"nombre":"Estiramiento del gato","grupos":["espalda_baja"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Position yourself on the floor on your hands and knees.","Pull your belly in and round your spine, lower back, shoulders, and neck, letting your head drop.","Hold for 15 seconds."],"en":"Cat Stretch","f":"static","sec":["dorsales","trapecio"]},"fdb-Catch_and_Overhead_Throw":{"nombre":"Atrapar y lanzar sobre la cabeza","grupos":["dorsales"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["Begin standing while facing a wall or a partner.","Using both hands, position the ball behind your head, stretching as much as possible, and forcefully throw the ball forward.","Ensure that you follow your throw through, being prepared to receive your rebound from your throw. If you are throwing against the wall, make sure that you stand close enough to the wall to receive the rebound, and aim a little higher than you would with a partner."],"en":"Catch and Overhead Throw","f":"push","m":"c","sec":["core","hombros","pectoral"]},"fdb-Chain_Handle_Extension":{"nombre":"Extensión de tríceps con cadenas","grupos":["triceps"],"eq":"Otro","niv":"Intermedio","cat":"Powerlifting","inst":["Necesitas dos agarres de polea, un banco plano y cadenas. Engancha el centro de las cadenas a los agarres y acuéstate en el banco con los codos apuntando al techo.","Extiende los codos sin mover los brazos, con las muñecas en prono.","Pausa al bloquear y vuelve a la posición inicial."],"en":"Chain Handle Extension","ines":1,"f":"push","m":"i"},"fdb-Chain_Press":{"nombre":"Press con cadenas","grupos":["pectoral"],"eq":"Otro","niv":"Intermedio","cat":"Powerlifting","inst":["Engancha las cadenas a los agarres de polea. Acuéstate en el banco plano como para un press con mancuernas, muñecas en prono y brazos perpendiculares al suelo. Esta es la posición inicial.","Baja las cadenas flectando los codos, dejando que parte de la cadena se apoye en el suelo.","Sigue hasta que el codo forme 90° y vuelve extendiendo hasta bloquear."],"en":"Chain Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Chair_Leg_Extended_Stretch":{"nombre":"Estiramiento en silla con pierna estirada","grupos":["isquios"],"eq":"Otro","niv":"Principiante","cat":"Elongación","inst":["Sit upright in a chair and grip the seat on the sides.","Raise one leg, extending the knee, flexing the ankle as you do so.","Slowly move that leg outward as far as you can, and then back to the center and down.","Repeat for your other leg."],"en":"Chair Leg Extended Stretch","f":"static","m":"i","sec":["aductores"]},"fdb-Chair_Lower_Back_Stretch":{"nombre":"Estiramiento lumbar en silla","grupos":["dorsales"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Sit upright on a chair.","Bend to one side with your arm over your head. You can hold onto the chair with your free hand.","Hold for 10 seconds, and repeat for your other side."],"en":"Chair Lower Back Stretch","f":"static","m":"i","sec":["espalda_baja"]},"fdb-Chair_Squat":{"nombre":"Sentadilla a la silla","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon la barra a la altura adecuada, cárgala, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con las palmas al frente y sácala del rack extendiendo las piernas.","Adelanta los pies unos 45 cm respecto de la barra, al ancho de hombros y con las puntas levemente afuera. Mira al frente con la columna neutra. Esta es la posición inicial.","Baja lento flectando las rodillas con la postura firme, hasta pasar los 90° entre muslo y pierna.","Sube botando el aire, empujando el suelo con los talones y extendiendo las rodillas.","Repite las repeticiones indicadas."],"en":"Chair Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Chair_Upper_Body_Stretch":{"nombre":"Estiramiento de tren superior en silla","grupos":["hombros"],"eq":"Otro","niv":"Principiante","cat":"Elongación","inst":["Sit on the edge of a chair, gripping the back of it.","Straighten your arms, keeping your back straight, and pull your upper body forward so you feel a stretch. Hold for 20-30 seconds."],"en":"Chair Upper Body Stretch","f":"static","sec":["biceps","pectoral"]},"fdb-Chest_And_Front_Of_Shoulder_Stretch":{"nombre":"Estiramiento de pecho y hombro anterior","grupos":["pectoral"],"eq":"Otro","niv":"Principiante","cat":"Elongación","inst":["Start off by standing with your legs together, holding a bodybar or a broomstick.","Take a slightly wider than shoulder width grip on the pole and hold it in front of you with your palms facing down.","Carefully lift the pole up and behind your head."],"en":"Chest And Front Of Shoulder Stretch","f":"static","m":"i","sec":["hombros"]},"fdb-Chest_Push_from_3_point_stance":{"nombre":"Empuje de pecho desde tres apoyos","grupos":["pectoral"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["Begin in a three point stance, squatted down with your back flat and one hand on the ground. Place the medicine ball directly in front of you.","To begin, take your first step as you pull the ball to your chest, positioning both hands to prepare for the throw.","As you execute the second step, explosively release the ball forward as hard as possible."],"en":"Chest Push from 3 point stance","f":"push","m":"c","sec":["core","hombros","triceps"]},"fdb-Chest_Push_multiple_response":{"nombre":"Empuje de pecho continuo","grupos":["pectoral"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["Begin in a kneeling position facing a wall or utilize a partner. Hold the ball with both hands tight into the chest.","Execute the pass by exploding forward and outward with the hips while pushing the ball as hard as possible.","Follow through by falling forward, catching yourself with your hands.","Immediately return to an upright position. Repeat for the desired number of repetitions."],"en":"Chest Push (multiple response)","f":"push","m":"c","sec":["core","hombros","triceps"]},"fdb-Chest_Push_single_response":{"nombre":"Empuje de pecho simple","grupos":["pectoral"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["Begin in a kneeling position holding the medicine ball with both hands tightly into the chest.","Execute the pass by exploding forward and outward with the hips while pushing the ball as far as possible.","Follow through by falling forward, catching yourself with your hands."],"en":"Chest Push (single response)","f":"push","m":"c","sec":["core","hombros","triceps"]},"fdb-Chest_Push_with_Run_Release":{"nombre":"Empuje de pecho con salida en carrera","grupos":["pectoral"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["Begin in an athletic stance with the knees bent, hips back, and back flat. Hold the medicine ball near your legs. This will be your starting position.","While taking your first step draw the medicine ball into your chest.","As you take the second step, explosively push the ball forward, immediately sprinting for 10 yards after the release. If you are really fast, you can catch your own pass!"],"en":"Chest Push with Run Release","f":"push","m":"c","sec":["core","hombros","triceps"]},"fdb-Chest_Stretch_on_Stability_Ball":{"nombre":"Estiramiento de pecho en fitball","grupos":["pectoral"],"eq":"Fitball","niv":"Principiante","cat":"Elongación","inst":["Get on your hands and knees next to an exercise ball.","Place your elbows on top of the ball, keeping your arm out to your side. This will be your starting position.","Lower your torso towards the floor, keeping your elbow on top of the ball. Hold the stretch for 20-30 seconds, and repeat with the other arm."],"en":"Chest Stretch on Stability Ball","f":"static","m":"i"},"fdb-Childs_Pose":{"nombre":"Postura del niño","grupos":["espalda_baja"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Get on your hands and knees, walk your hands in front of you.","Lower your buttocks down to sit on your heels. Let your arms drag along the floor as you sit back to stretch your entire spine.","Once you settle onto your heels, bring your hands next to your feet and relax. \"breathe\" into your back. Rest your forehead on the floor. Avoid this position if you have knee problems."],"en":"Child's Pose","f":"static","sec":["dorsales","gluteos"]},"fdb-Chin-Up":{"nombre":"Dominada supina","grupos":["dorsales"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Toma la barra con las palmas hacia ti y un agarre más estrecho que los hombros.","Con los brazos estirados, mantén el torso lo más recto posible, saca pecho y deja una leve curva lumbar. Esta es la posición inicial. Un torso recto da más trabajo al bíceps y menos a la espalda.","Botando el aire, sube hasta que la cabeza llegue más o menos a la altura de la barra, pensando en el bíceps y con los codos cerca del cuerpo. Solo se mueven los brazos; los antebrazos solo sostienen.","Aprieta un segundo arriba y baja lento hasta estirar los brazos, inspirando.","Repite las repeticiones indicadas."],"en":"Chin-Up","ines":1,"f":"pull","m":"c","sec":["antebrazos","biceps"]},"fdb-Chin_To_Chest_Stretch":{"nombre":"Estiramiento de mentón al pecho","grupos":["cuello"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Get into a seated position on the floor.","Place both hands at the rear of your head, fingers interlocked, thumbs pointing down and elbows pointing straight ahead. Slowly pull your head down to your chest. Hold for 20-30 seconds."],"en":"Chin To Chest Stretch","f":"static","sec":["trapecio"]},"fdb-Circus_Bell":{"nombre":"Circus bell","grupos":["hombros"],"eq":"Otro","niv":"Avanzado","cat":"Strongman","inst":["La circus bell es una mancuerna gigante de mango grueso. Empieza con ella entre los pies y tómala con ambas manos.","Haz clean extendiendo cadera y rodillas para llevarla al hombro deseado, soltando la otra mano.","Ubica uno de los extremos detrás del hombro para no desequilibrarte. Para subirla, flecta un poco las rodillas y empuja hacia arriba extendiendo el brazo, inclinándote levemente hacia el lado contrario.","Guíala de vuelta al suelo con el mayor control posible. Mejor hacerlo sobre una goma gruesa para no dañar el piso."],"en":"Circus Bell","ines":1,"f":"push","m":"c","sec":["antebrazos","espalda_baja","gluteos","isquios","trapecio","triceps"]},"fdb-Clean":{"nombre":"Cargada (clean)","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Con la barra en el suelo cerca de las canillas, toma agarre prono o de gancho justo por fuera de las piernas. Baja la cadera con el peso en los talones, espalda recta, mirada al frente, pecho arriba y hombros un poco delante de la barra. Esta es la posición inicial.","Primer tirón: empuja con los talones extendiendo las rodillas, sin cambiar el ángulo de la espalda y con los brazos estirados. Sube controlado hasta pasar las rodillas.","Segundo tirón, la principal fuente de aceleración: cuando la barra llega a mitad de muslo, extiende cadera, rodillas y tobillos como en un salto. No tires con los brazos; al final quedas totalmente extendido, levemente inclinado atrás y con los brazos aún estirados.","Tercer tirón: encoge los hombros con fuerza y flecta los brazos con los codos arriba y afuera. En la máxima extensión, métete con fuerza bajo la barra girando los codos por debajo. Recíbela en sentadilla frontal (la profundidad depende de la altura alcanzada), apoyada sobre los hombros, rozando la garganta y con las manos relajadas. Baja hasta el fondo; eso ayuda a la recuperación.","Recupera de inmediato empujando con los talones, con el torso erguido y los codos arriba, hasta quedar de pie."],"en":"Clean","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","espalda_baja","gemelos","gluteos","hombros","trapecio"]},"fdb-Clean_Deadlift":{"nombre":"Peso muerto de cargada","grupos":["isquios"],"eq":"Barra","niv":"Principiante","cat":"Halterofilia","inst":["De pie, con la barra cerca de las canillas, pies bajo la cadera con las puntas levemente afuera. Agarre prono o de gancho al ancho de hombros. Baja a la barra con la columna en extensión, hombros delante de la barra y espalda lo más vertical posible.","Empuja el suelo con la parte delantera de los talones. Mientras la barra sube, mantén el ángulo de la espalda y abre las rodillas para sacarlas del camino de la barra.","Pasada la rodilla, termina llevando la cadera hacia la barra hasta extender cadera y rodillas."],"en":"Clean Deadlift","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","dorsales","espalda_baja","gluteos","trapecio"]},"fdb-Clean_Pull":{"nombre":"Tirón de cargada","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Con la barra en el suelo cerca de las canillas, toma agarre prono o de gancho justo por fuera de las piernas. Baja la cadera con el peso en los talones, espalda recta, mirada al frente, pecho arriba y hombros un poco delante de la barra. Esta es la posición inicial.","Primer tirón: empuja con los talones extendiendo las rodillas, sin cambiar el ángulo de la espalda, con los brazos estirados y los codos afuera. Sube controlado hasta pasar las rodillas.","Segundo tirón: cuando la barra llega a mitad de muslo, extiende cadera, rodillas y tobillos como en un salto. No tires con los brazos; al final quedas totalmente extendido, levemente inclinado atrás y con los brazos estirados. La extensión debe ser violenta y breve."],"en":"Clean Pull","ines":1,"f":"pull","m":"c","sec":["antebrazos","espalda_baja","gluteos","isquios","trapecio"]},"fdb-Clean_Shrug":{"nombre":"Encogimiento de cargada","grupos":["trapecio"],"eq":"Barra","niv":"Principiante","cat":"Halterofilia","inst":["Toma la barra al ancho de hombros con agarre prono o de gancho, colgando a mitad de muslo, espalda recta y levemente inclinada adelante.","Encoge los hombros hacia las orejas. Aunque se puede cargar más que en un clean, no uses tanta carga que el movimiento se vuelva lento."],"en":"Clean Shrug","ines":1,"f":"pull","m":"c","sec":["antebrazos","hombros"]},"fdb-Clean_and_Jerk":{"nombre":"Cargada y envión","grupos":["hombros"],"eq":"Barra","niv":"Avanzado","cat":"Halterofilia","inst":["Con la barra en el suelo cerca de las canillas, toma agarre prono o de gancho justo por fuera de las piernas. Baja la cadera con el peso en los talones, espalda recta, mirada al frente, pecho arriba y hombros un poco delante de la barra. Esta es la posición inicial.","Primer tirón: empuja con los talones extendiendo las rodillas, sin cambiar el ángulo de la espalda y con los brazos estirados, hasta pasar las rodillas.","Segundo tirón: a mitad de muslo, extiende cadera, rodillas y tobillos como en un salto, sin tirar con los brazos, hasta quedar totalmente extendido y levemente inclinado atrás.","Tercer tirón: encoge los hombros y flecta los brazos con los codos arriba y afuera, métete con fuerza bajo la barra girando los codos y recíbela en sentadilla frontal, apoyada sobre los hombros y rozando la garganta. Baja hasta el fondo.","Recupera de inmediato empujando con los talones, con el torso erguido y los codos arriba, hasta quedar de pie.","Segunda fase, el envión (jerk): con la barra sobre la parte delantera de los hombros, haz el dip: pies bajo la cadera, flecta las rodillas sin llevar la cadera atrás, baja poco y cambia de dirección con toda la potencia posible.","Empuja con los talones generando la mayor velocidad y fuerza, y saca la cabeza del camino cuando la barra deje los hombros.","Al despegar, lleva los pies rápido a la posición de recepción en tijera, un pie adelante y otro atrás; el empuje de la barra hacia arriba te lleva hacia abajo. Recíbela con los brazos bloqueados sobre la cabeza y vuelve a quedar de pie."],"en":"Clean and Jerk","ines":1,"f":"push","m":"c","sec":["core","cuadriceps","espalda_baja","gluteos","isquios","trapecio","triceps"]},"fdb-Clean_and_Press":{"nombre":"Cargada y press","grupos":["hombros"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Pies al ancho de hombros, rodillas por dentro de los brazos. Con la espalda plana, flecta rodillas y cadera para tomar la barra con agarre prono algo más ancho que los hombros, brazos estirados y codos hacia afuera. Barra cerca de las canillas y hombros sobre o un poco delante de ella. Esta es la posición inicial.","Despega la barra extendiendo las rodillas. La cadera y los hombros suben al mismo ritmo, sin cambiar el ángulo de la espalda, con la barra pegada al cuerpo.","Al pasar la rodilla, extiende con fuerza tobillos, rodillas y cadera, como un salto. Encoge los hombros y usa el impulso para subir la barra lo más alto posible, pegada al cuerpo y con los codos afuera.","En el punto más alto, los pies se despegan y empiezas a meterte bajo la barra, bajando a sentadilla.","Gira los codos alrededor y bajo la barra y recíbela sobre la parte delantera de los hombros, con el torso erguido y absorbiendo con cadera y rodillas.","Ponte de pie con la barra en posición de clean.","Sin mover los pies, empuja la barra sobre la cabeza botando el aire. Bájala controlada."],"en":"Clean and Press","ines":1,"f":"push","m":"c","sec":["core","cuadriceps","dorsales","espalda_baja","gemelos","gluteos","isquios","trapecio","triceps"]},"fdb-Clean_from_Blocks":{"nombre":"Cargada desde bloques","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Con la barra sobre cajones o soportes a la altura deseada, toma agarre prono o de gancho justo por fuera de las piernas. Baja la cadera con el peso en los talones, espalda recta, mirada al frente, pecho arriba y hombros un poco delante de la barra. Esta es la posición inicial.","Empuja con los talones extendiendo las rodillas, sin cambiar el ángulo de la espalda, con los brazos estirados y los codos afuera.","Al lograr la extensión completa, encoge los hombros y flecta los brazos con los codos arriba y afuera, métete con fuerza bajo la barra girando los codos y recíbela en sentadilla frontal, apoyada sobre los hombros y rozando la garganta. Baja hasta el fondo.","Recupera de inmediato empujando con los talones, torso erguido y codos arriba, hasta quedar de pie. Devuelve la barra a los cajones para la siguiente repetición."],"en":"Clean from Blocks","ines":1,"f":"pull","m":"c","sec":["gemelos","gluteos","hombros","isquios","trapecio"]},"fdb-Clock_Push-Up":{"nombre":"Flexión de reloj","grupos":["pectoral"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Ponte boca abajo apoyado en manos y puntas de pie.","Brazos estirados con las manos al ancho de hombros y el cuerpo recto todo el movimiento. Esta es la posición inicial.","Baja flectando los codos llevando el pecho al suelo.","Abajo, empuja lo más rápido posible hasta despegar del suelo, buscando “saltar” 30-45 cm hacia un lado.","Al subir, mueve el pie de afuera en sentido contrario. En el aire, gira el cuerpo unos 30° para la siguiente repetición.","Repite dando la vuelta completa hasta volver a donde empezaste."],"en":"Clock Push-Up","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Close-Grip_Barbell_Bench_Press":{"nombre":"Press banca cerrado con barra","grupos":["triceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco plano. Con agarre cerrado (al ancho de hombros), saca la barra del rack y sostenla sobre ti con los brazos estirados. Esta es la posición inicial.","Inspirando, baja lento hasta sentir la barra en la mitad del pecho. A diferencia de la banca normal, mantén los codos pegados al torso para dar más trabajo al tríceps.","Tras una pausa, empuja la barra de vuelta con los tríceps botando el aire. Bloquea, sostén un segundo y vuelve a bajar lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas.","Al terminar, deja la barra en el rack."],"en":"Close-Grip Barbell Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Close-Grip_Dumbbell_Press":{"nombre":"Press cerrado con mancuerna","grupos":["triceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Pon una mancuerna de pie sobre un banco plano.","Asegurando que no se caiga, acuéstate cruzado sobre el banco con solo los hombros apoyados, cadera bajo el banco, rodillas flectadas y pies firmes.","Toma la mancuerna con ambas manos y sostenla sobre el pecho con los brazos estirados, palmas contra la cara interna de un disco. Esta es la posición inicial.","Baja la mancuerna hasta el pecho.","Vuelve a la posición inicial extendiendo los codos."],"en":"Close-Grip Dumbbell Press","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Close-Grip_EZ-Bar_Curl_with_Band":{"nombre":"Curl cerrado con barra Z y banda","grupos":["biceps"],"eq":"Barra Z","niv":"Principiante","cat":"Fuerza","inst":["Engancha una banda a cada extremo de la barra Z y pisa el centro de la banda. De pie, con agarre supino estrecho y codos cerca del torso. Esta es la posición inicial.","Sin mover los brazos, flecta los codos para hacer el curl, botando el aire.","Sube hasta que la barra llegue a los hombros y aprieta fuerte el bíceps un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Close-Grip EZ-Bar Curl with Band","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Close-Grip_EZ-Bar_Press":{"nombre":"Press cerrado con barra Z","grupos":["triceps"],"eq":"Barra Z","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco plano con una barra Z cargada.","Con agarre estrecho, sostén la barra sobre el torso con los codos recogidos y brazos perpendiculares al suelo. Esta es la posición inicial.","Baja la barra a la parte baja del pecho inspirando, con los codos recogidos.","Empuja con los tríceps extendiendo los codos hasta la posición inicial, botando el aire.","Repite."],"en":"Close-Grip EZ-Bar Press","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Close-Grip_EZ_Bar_Curl":{"nombre":"Curl cerrado con barra Z","grupos":["biceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie, erguido, toma una barra Z por los agarres internos, palmas al frente levemente giradas hacia adentro y codos cerca del torso. Esta es la posición inicial.","Sin mover los brazos, flecta los codos subiendo la barra botando el aire. Solo se mueven los antebrazos.","Sube hasta que la barra llegue a los hombros y aprieta fuerte el bíceps un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Close-Grip EZ Bar Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Close-Grip_Front_Lat_Pulldown":{"nombre":"Jalón al pecho agarre cerrado","grupos":["dorsales"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina de jalón con barra en la polea alta. Ajusta el cojín de las rodillas para que la carga no te levante.","Toma la barra con las palmas al frente y agarre cerrado (más estrecho que los hombros).","Con los brazos estirados, inclina el torso unos 30° atrás, saca pecho y deja una leve curva lumbar. Esta es la posición inicial.","Botando el aire, baja la barra hasta la parte alta del pecho llevando hombros y brazos abajo y atrás. Aprieta la espalda abajo; el torso no se mueve y los antebrazos solo sostienen.","Tras un segundo con las escápulas juntas, sube lento hasta estirar los brazos y los dorsales, inspirando.","Repite las repeticiones indicadas."],"en":"Close-Grip Front Lat Pulldown","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Close-Grip_Push-Up_off_of_a_Dumbbell":{"nombre":"Flexión cerrada sobre mancuerna","grupos":["triceps"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Apoya las manos sobre una mancuerna parada en el suelo. Sobre manos y puntas de pie, con el torso rígido, codos recogidos y brazos estirados. Esta es la posición inicial.","Baja flectando los codos inspirando, con el cuerpo recto: la cadera no sube ni se hunde.","Empuja de vuelta extendiendo los codos, botando el aire.","Tras una pausa arriba, repite las repeticiones indicadas."],"en":"Close-Grip Push-Up off of a Dumbbell","ines":1,"f":"push","m":"c","sec":["core","hombros","pectoral"]},"fdb-Close-Grip_Standing_Barbell_Curl":{"nombre":"Curl de pie con barra agarre cerrado","grupos":["biceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Toma una barra con ambas manos, palmas arriba y separadas pocos centímetros.","De pie, torso recto y cabeza arriba, pies al ancho de hombros y codos cerca del torso. Esta es la posición inicial. Brazos y codos no se mueven.","Sube la barra en semicírculo hasta que los antebrazos toquen el bíceps, botando el aire, y aprieta fuerte un segundo. No arquees la espalda ni balancees.","Baja lento inspirando.","Repite las repeticiones indicadas."],"en":"Close-Grip Standing Barbell Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Cocoons":{"nombre":"Capullos (cocoons)","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con las piernas estiradas y los brazos estirados detrás de la cabeza. Esta es la posición inicial.","Lleva las rodillas al pecho rotando la pelvis para despegar los glúteos. Al mismo tiempo, flecta la columna trayendo los brazos sobre la cabeza en un crunch.","Tras una breve pausa, vuelve a la posición inicial."],"en":"Cocoons","ines":1,"f":"pull","m":"c"},"fdb-Conans_Wheel":{"nombre":"Rueda de Conan","grupos":["cuadriceps"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["Con el implemento cargado, sujeta el extremo en posición Zercher: barra en el pliegue del codo y manos tomándose las muñecas, intentando no cargar los antebrazos.","Despega la carga del suelo. Con postura firme y erguida, camina con pasos cortos y rápidos, mirando arriba y lejos mientras giras en círculo. No aguantes la respiración. Sigue hasta completar una o más vueltas."],"en":"Conan's Wheel","ines":1,"m":"c","sec":["antebrazos","biceps","core","espalda_baja","gemelos","hombros","trapecio"]},"fdb-Concentration_Curls":{"nombre":"Curl concentrado","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en un banco plano con una mancuerna entre los pies, piernas separadas, rodillas flectadas y pies en el suelo.","Toma la mancuerna con la mano derecha y apoya la parte de atrás del brazo en la cara interna del muslo derecho. Palma al frente, brazo estirado y mancuerna sin tocar el suelo. Esta es la posición inicial.","Sin mover el brazo, sube la mancuerna contrayendo el bíceps, botando el aire, hasta la altura del hombro. Arriba, el meñique queda más alto que el pulgar. Aprieta un segundo.","Baja lento a la posición inicial inspirando, sin balancear.","Repite las repeticiones indicadas y cambia al brazo izquierdo."],"en":"Concentration Curls","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Cross-Body_Crunch":{"nombre":"Crunch cruzado","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con las rodillas flectadas a unos 60°.","Pies apoyados y manos sueltas detrás de la cabeza. Esta es la posición inicial.","Encógete llevando el codo y hombro derecho hacia la rodilla izquierda mientras la traes hacia ti, intentando tocarla. Bota el aire. Piensa en llevar el hombro, no solo el codo, y en contraer el abdomen.","Vuelve a la posición inicial inspirando y repite con codo izquierdo y rodilla derecha.","Alterna así hasta completar las repeticiones."],"en":"Cross-Body Crunch","ines":1,"f":"pull","m":"c"},"fdb-Cross_Body_Hammer_Curl":{"nombre":"Curl martillo cruzado","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, con una mancuerna en cada mano a los costados y palmas hacia adentro.","Sin girar el brazo, sube la mancuerna derecha cruzando hacia el hombro izquierdo, botando el aire. Toca el hombro y sostén un segundo.","Baja lento por el mismo camino inspirando y repite con el brazo izquierdo.","Alterna así hasta completar las repeticiones de cada brazo."],"en":"Cross Body Hammer Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Cross_Over_-_With_Bands":{"nombre":"Cruce con bandas","grupos":["pectoral"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Ancla una banda a un poste fijo.","De espaldas al poste, toma los agarres y avanza hasta tensar la banda.","Abre los brazos a los lados, paralelos al suelo y formando una “T” con el torso, palmas al frente y codos levemente flectados. Esta es la posición inicial.","Con los brazos estirados, júntalos al frente en semicírculo botando el aire y apretando el pecho. Sostén un segundo.","Vuelve lento inspirando.","Repite las repeticiones indicadas."],"en":"Cross Over - With Bands","ines":1,"f":"push","m":"c","sec":["biceps","hombros"]},"fdb-Crossover_Reverse_Lunge":{"nombre":"Zancada inversa cruzada","grupos":["espalda_baja"],"eq":"","niv":"Intermedio","cat":"Elongación","inst":["Stand with your feet shoulder width apart. This will be your starting position.","Perform a rear lunge by stepping back with one foot and flexing the hips and front knee. As you do so, rotate your torso across the front leg.","After a brief pause, return to the starting position and repeat on the other side, continuing in an alternating fashion."],"en":"Crossover Reverse Lunge","f":"pull","sec":["abductores","core","cuadriceps","gluteos","isquios"]},"fdb-Crucifix":{"nombre":"Crucifijo","grupos":["hombros"],"eq":"Otro","niv":"Principiante","cat":"Strongman","inst":["En el crucifijo sostienes cargas con los brazos estirados a los lados por tiempo. Puedes practicar con mancuernas, aunque mejor con los implementos de competencia (hachas, martillos), porque se sienten distinto.","De pie, sube los brazos a los lados sosteniendo los implementos, paralelos al suelo. En competencia, jueces o sensores avisan si bajas del paralelo. Sostén lo más que puedas; la carga debería hacerte fallar en 30-60 segundos."],"en":"Crucifix","ines":1,"f":"static","m":"i","sec":["antebrazos"]},"fdb-Crunch_-_Hands_Overhead":{"nombre":"Crunch con brazos sobre la cabeza","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con las rodillas flectadas a unos 60°.","Pies apoyados y brazos estirados sobre la cabeza con las palmas cruzadas. Esta es la posición inicial.","Encoge el tronco despegando apenas las escápulas, con los brazos siempre alineados con cabeza y hombros. Bota el aire y sostén un segundo.","Baja lento inspirando.","Repite las repeticiones indicadas."],"en":"Crunch - Hands Overhead","ines":1,"f":"pull","m":"i"},"fdb-Crunch_-_Legs_On_Exercise_Ball":{"nombre":"Crunch con piernas sobre fitball","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con los pies sobre un fitball y las rodillas a 90°.","Separa los pies unos 8-10 cm y junta las puntas.","Pon las manos suavemente a los lados de la cabeza con los codos adentro, sin entrelazar los dedos.","Presiona la zona lumbar contra el suelo. Esta es la posición inicial.","Despega los hombros unos 10 cm sin despegar la zona lumbar, botando el aire. Aprieta fuerte un segundo arriba. Lento y sin impulso.","Baja lento inspirando.","Repite las repeticiones indicadas."],"en":"Crunch - Legs On Exercise Ball","ines":1,"f":"pull","m":"i"},"fdb-Crunches":{"nombre":"Crunch","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con los pies en el suelo o sobre un banco con las rodillas a 90°. Si usas banco, separa los pies 8-10 cm y junta las puntas.","Pon las manos suavemente a los lados de la cabeza con los codos adentro, sin entrelazar los dedos.","Presionando la zona lumbar contra el suelo, despega los hombros.","Contrae el abdomen botando el aire; los hombros suben unos 10 cm y la zona lumbar no se despega. Aprieta fuerte un segundo arriba. Lento y sin impulso.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Crunches","ines":1,"f":"pull","m":"i"},"fdb-Cuban_Press":{"nombre":"Press cubano","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["De pie, con una mancuerna en cada mano en agarre prono. Sube los brazos hasta que queden paralelos al suelo, con los antebrazos colgando (posición de “espantapájaros”). Esta es la posición inicial.","Rota los hombros hacia afuera, sin mover los brazos, hasta que las muñecas queden sobre los codos y los antebrazos perpendiculares al suelo.","Empuja las mancuernas sobre la cabeza extendiendo los codos.","Vuelve a la posición inicial deshaciendo los pasos, inspirando.","Repite las repeticiones indicadas."],"en":"Cuban Press","ines":1,"f":"push","m":"c","sec":["trapecio"]},"fdb-Dancers_Stretch":{"nombre":"Estiramiento de bailarina","grupos":["espalda_baja"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Sit up on the floor.","Cross your right leg over your left, keeping the knee bent. Your left leg is straight and down on the floor.","Place your left arm on your right leg and your right hand on the floor.","Rotate your upper body to the right, and hold for 10-20 seconds. Switch sides."],"en":"Dancer's Stretch","f":"static","sec":["abductores","gluteos"]},"fdb-Dead_Bug":{"nombre":"Dead bug","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con los brazos estirados hacia el techo.","Lleva pies, rodillas y cadera a 90°.","Bota el aire con fuerza para bajar las costillas y pegar la espalda al suelo, rotando la pelvis y apretando los glúteos. Mantén esa posición todo el ejercicio. Esta es la posición inicial.","Estira una pierna extendiendo rodilla y cadera hasta dejarla justo sobre el suelo.","No pierdas la posición lumbar y pélvica: la espalda va a querer arquearse.","Con tensión, vuelve la pierna a la posición inicial.","Repite con el otro lado y alterna hasta completar la serie."],"en":"Dead Bug","ines":1,"f":"pull","m":"c"},"fdb-Deadlift_with_Bands":{"nombre":"Peso muerto con bandas","grupos":["espalda_baja"],"eq":"Barra","niv":"Avanzado","cat":"Powerlifting","inst":["Con bandas cortas, pásalas sobre la barra y párate dentro de ellas. Con bandas largas, ánclalas a una base firme, como mancuernas pesadas o un rack.","Con pies y agarre listos, toma aire, baja la cadera y flecta las rodillas hasta que las canillas toquen la barra. Mira al frente, pecho arriba y espalda firme, y empuja con los talones. Pasada la rodilla, tira la barra hacia atrás juntando las escápulas mientras llevas la cadera hacia la barra.","Baja la barra flectando la cadera y guiándola al suelo."],"en":"Deadlift with Bands","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","dorsales","gluteos","isquios","trapecio"]},"fdb-Deadlift_with_Chains":{"nombre":"Peso muerto con cadenas","grupos":["espalda_baja"],"eq":"Barra","niv":"Avanzado","cat":"Powerlifting","inst":["Puedes enganchar las cadenas a las mangas o colgarlas por el centro sobre la barra para que la carga aumente más al subir.","Acércate a la barra hasta que quede sobre el centro de los pies, separados al ancho de cadera. Flecta la cadera para tomarla al ancho de hombros, dejando que las escápulas se separen. Usa agarre prono o mixto en series pesadas. Toma aire, baja la cadera y flecta las rodillas hasta que las canillas toquen la barra.","Mira al frente, pecho arriba y espalda firme, y empuja con los talones. Pasada la rodilla, tira la barra hacia atrás juntando las escápulas mientras llevas la cadera hacia la barra.","Baja la barra flectando la cadera y guiándola al suelo."],"en":"Deadlift with Chains","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","dorsales","gluteos","isquios","trapecio"]},"fdb-Decline_Barbell_Bench_Press":{"nombre":"Press banca declinado con barra","grupos":["pectoral"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Fija las piernas en el extremo del banco declinado y acuéstate lento.","Con agarre medio, saca la barra del rack y sostenla sobre ti con los brazos estirados y perpendiculares al suelo. Esta es la posición inicial. Para cuidar el manguito rotador, idealmente que alguien te ayude a sacarla.","Inspirando, baja lento hasta sentir la barra en la parte baja del pecho.","Tras una pausa, empuja de vuelta con el pecho botando el aire. Bloquea, aprieta un segundo y vuelve a bajar lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas.","Al terminar, deja la barra en el rack."],"en":"Decline Barbell Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Decline_Close-Grip_Bench_To_Skull_Crusher":{"nombre":"Banca cerrada declinada a rompecráneos","grupos":["triceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Fija las piernas en el extremo del banco declinado y acuéstate lento.","Con agarre algo más estrecho que los hombros, saca la barra y sostenla sobre ti con los brazos estirados, codos adentro y perpendiculares al suelo. Esta es la posición inicial. Idealmente, que alguien te ayude a sacarla.","Baja la barra a la parte baja del pecho inspirando, con los codos recogidos.","Empuja con los tríceps hasta la posición inicial botando el aire.","Sin mover los brazos, baja la barra en semicírculo flectando los codos hasta rozar la frente, inspirando.","Súbela de vuelta contrayendo los tríceps, botando el aire.","Repite los pasos 3 a 6 hasta completar las repeticiones."],"en":"Decline Close-Grip Bench To Skull Crusher","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Decline_Crunch":{"nombre":"Crunch declinado","grupos":["core"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Fija las piernas en el extremo del banco declinado y acuéstate.","Pon las manos suavemente a los lados de la cabeza con los codos adentro, sin entrelazar los dedos.","Presionando la zona lumbar contra el banco, despega los hombros.","Contrae el abdomen botando el aire; los hombros suben unos 10 cm y la zona lumbar se queda en el banco. Aprieta fuerte un segundo arriba. Lento y sin impulso.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Decline Crunch","ines":1,"f":"pull","m":"i"},"fdb-Decline_Dumbbell_Bench_Press":{"nombre":"Press declinado con mancuernas","grupos":["pectoral"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Fija las piernas en el extremo del banco declinado y acuéstate con una mancuerna en cada mano sobre los muslos, palmas enfrentadas.","Ya acostado, lleva las mancuernas frente a ti al ancho de hombros.","Gira las muñecas para que las palmas miren hacia tus pies. Esta es la posición inicial.","Baja las mancuernas lento hacia los costados inspirando, con control y los antebrazos siempre perpendiculares al suelo.","Botando el aire, súbelas con el pecho. Bloquea, aprieta un segundo y baja lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas en tu programa."],"en":"Decline Dumbbell Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Decline_Dumbbell_Flyes":{"nombre":"Aperturas declinadas con mancuernas","grupos":["pectoral"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Fija las piernas en el extremo del banco declinado y acuéstate con una mancuerna en cada mano sobre los muslos, palmas enfrentadas.","Ya acostado, lleva las mancuernas frente a ti al ancho de hombros, palmas enfrentadas y brazos estirados perpendiculares al suelo. Esta es la posición inicial.","Con los codos levemente flectados, abre los brazos en un arco amplio hasta sentir estiramiento en el pecho, inspirando. Solo se mueve el hombro.","Vuelve por el mismo arco apretando el pecho, botando el aire.","Sostén un segundo arriba y repite las repeticiones indicadas."],"en":"Decline Dumbbell Flyes","ines":1,"f":"push","m":"c"},"fdb-Decline_Dumbbell_Triceps_Extension":{"nombre":"Extensión de tríceps declinado con mancuernas","grupos":["triceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Fija las piernas en el extremo del banco declinado y acuéstate con una mancuerna en cada mano sobre los muslos, palmas enfrentadas.","Ya acostado, lleva las mancuernas frente a ti al ancho de hombros, palmas enfrentadas y brazos estirados perpendiculares al suelo. Esta es la posición inicial.","Sin mover los brazos y con los codos adentro, baja las mancuernas en semicírculo flectando los codos hasta que los pulgares queden junto a las orejas, inspirando.","Súbelas de vuelta contrayendo los tríceps, botando el aire.","Repite las repeticiones indicadas."],"en":"Decline Dumbbell Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Decline_EZ_Bar_Triceps_Extension":{"nombre":"Extensión de tríceps declinado con barra Z","grupos":["triceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Fija las piernas en el extremo del banco declinado y acuéstate lento.","Con agarre algo más estrecho que los hombros, saca la barra Z y sostenla sobre ti con los brazos estirados, codos adentro y perpendiculares al suelo. Esta es la posición inicial. Idealmente, que alguien te ayude a sacarla.","Sin mover los brazos, baja la barra en semicírculo flectando los codos hasta rozar la frente, inspirando.","Súbela de vuelta contrayendo los tríceps, botando el aire.","Repite las repeticiones indicadas."],"en":"Decline EZ Bar Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Decline_Oblique_Crunch":{"nombre":"Crunch oblicuo declinado","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Fija las piernas en el extremo del banco declinado y acuéstate lento.","Despega el torso hasta unos 35-45° respecto del suelo.","Pon una mano junto a la cabeza y la otra sobre el muslo. Esta es la posición inicial.","Sube lento girando el torso a la izquierda, botando el aire, hasta que el codo derecho toque la rodilla izquierda. Sostén un segundo, con el abdomen firme y el movimiento controlado.","Baja lento a la posición inicial inspirando.","Completa la serie de un lado y cambia al otro. Piensa en girar de verdad el torso y sentir la contracción arriba."],"en":"Decline Oblique Crunch","ines":1,"f":"pull","m":"c"},"fdb-Decline_Push-Up":{"nombre":"Flexión declinada","grupos":["pectoral"],"eq":"","niv":"Principiante","cat":"Fuerza","inst":["Boca abajo, con las manos separadas unos 90 cm y los brazos estirados sosteniendo el torso. Sube los pies a un cajón o banco. Esta es la posición inicial.","Baja hasta que el pecho casi toque el suelo, inspirando.","Bota el aire y empuja de vuelta apretando el pecho.","Tras una breve pausa arriba, repite las veces que necesites."],"en":"Decline Push-Up","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Decline_Reverse_Crunch":{"nombre":"Crunch invertido declinado","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas en un banco declinado y afírmate de la parte superior con ambas manos, sin resbalar.","Sostén las piernas paralelas al suelo con el abdomen, rodillas y pies juntos, piernas estiradas con leve flexión de rodilla. Esta es la posición inicial.","Botando el aire, lleva las piernas hacia el torso rodando la pelvis y despegando la cadera del banco, hasta que las rodillas toquen el pecho.","Sostén un segundo y vuelve a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Decline Reverse Crunch","ines":1,"f":"pull","m":"c"},"fdb-Decline_Smith_Press":{"nombre":"Press declinado en Smith agarre ancho","grupos":["pectoral"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco declinado bajo la máquina Smith, con la barra a una altura que alcances acostado con los brazos casi estirados. Con agarre prono más ancho que los hombros, desbloquea la barra y sostenla con los brazos estirados. Esta es la posición inicial.","Inspirando, baja la barra controlada flectando los codos hasta rozar el torso.","Tras una breve pausa, súbela extendiendo los codos, botando el aire.","Repite las repeticiones indicadas.","Al terminar, bloquea la barra en el rack."],"en":"Decline Smith Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Deficit_Deadlift":{"nombre":"Peso muerto con déficit","grupos":["espalda_baja"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Párate sobre una plataforma o discos de 3-8 cm de alto. La barra queda sobre el centro de los pies, separados al ancho de cadera. Flecta la cadera para tomarla al ancho de hombros, dejando que las escápulas se separen. Usa agarre prono o mixto en series pesadas.","Con pies y agarre listos, toma aire, baja la cadera y flecta las rodillas hasta que las canillas toquen la barra. Mira al frente, pecho arriba y espalda firme, y empuja con los talones. Pasada la rodilla, tira la barra hacia atrás juntando las escápulas mientras llevas la cadera hacia la barra.","Baja la barra flectando la cadera y guiándola al suelo."],"en":"Deficit Deadlift","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","dorsales","gluteos","isquios","trapecio"]},"fdb-Depth_Jump_Leap":{"nombre":"Salto en profundidad con avance","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["For this drill you will need two boxes or benches, one 12 to 16 inches high and the other 22 to 26 inches high.","Stand on one of the two boxes with arms at the sides; feet should be together and slightly off the edge as in the depth jump. Place the other box approximately two or three feet in front of and facing the performer.","Begin by dropping off the initial box, landing and simultaneously taking off with both feet.","Rebound by driving upward and outward as intensely as possible, using the arms and full extension of the body to jump onto the higher box. Again, allow the legs to absorb the impact."],"en":"Depth Jump Leap","f":"push","m":"c","sec":["abductores","aductores","gemelos","gluteos","isquios"]},"fdb-Dip_Machine":{"nombre":"Fondos en máquina","grupos":["triceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Siéntate firme en la máquina de fondos, elige la carga y toma los agarres.","Codos pegados a los costados para enfatizar tríceps, flectados a 90°.","Contrayendo el tríceps, extiende los brazos hacia abajo botando el aire. Abajo, deja una leve flexión para no perder tensión.","Vuelve lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Dip Machine","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Dips_-_Chest_Version":{"nombre":"Fondos para pecho","grupos":["pectoral"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Necesitas paralelas. Sostén el cuerpo sobre ellas con los brazos bloqueados.","Inspirando, baja lento con el torso inclinado unos 30° adelante y los codos levemente abiertos, hasta sentir un leve estiramiento en el pecho.","Sube con el pecho hasta la posición inicial botando el aire y aprieta un segundo arriba.","Repite las repeticiones indicadas."],"en":"Dips - Chest Version","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Dips_-_Triceps_Version":{"nombre":"Fondos para tríceps","grupos":["triceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Sostén el cuerpo sobre las paralelas con los brazos casi bloqueados.","Inspira y baja lento con el torso erguido y los codos cerca del cuerpo, para enfocar el tríceps, hasta formar 90° entre brazo y antebrazo.","Bota el aire y sube con los tríceps hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Dips - Triceps Version","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Donkey_Calf_Raises":{"nombre":"Gemelos tipo burro","grupos":["gemelos"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Necesitas una máquina de gemelos tipo burro. Ubica la zona lumbar y la cadera bajo el cojín, que apoya a la altura del coxis.","Afírmate de los agarres laterales y apoya la parte delantera de los pies en el bloque con los talones afuera. Orienta las puntas según lo que quieras enfatizar y estira las rodillas sin bloquearlas. Esta es la posición inicial.","Sube los talones lo más alto posible botando el aire. Las rodillas no se flectan. Sostén un segundo.","Baja lento hasta estirar la pantorrilla, inspirando.","Repite las repeticiones indicadas."],"en":"Donkey Calf Raises","ines":1,"f":"push","m":"i"},"fdb-Double_Kettlebell_Alternating_Hang_Clean":{"nombre":"Clean colgado alternado con dos kettlebells","grupos":["isquios"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon dos kettlebells entre los pies. Lleva la cadera atrás y mira al frente.","Haz clean de una kettlebell al hombro mientras sostienes la otra.","En un movimiento fluido, baja la de arriba mientras subes la de abajo."],"en":"Double Kettlebell Alternating Hang Clean","ines":1,"f":"pull","m":"c","sec":["antebrazos","biceps","cuadriceps","espalda_baja","gemelos","gluteos","trapecio"]},"fdb-Double_Kettlebell_Jerk":{"nombre":"Envión con dos kettlebells en tijera","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Toma una kettlebell en cada mano.","Haz clean a los hombros extendiendo piernas y cadera, girando las muñecas para que las palmas miren al frente. Esta es la posición inicial.","Baja un poco flectando las rodillas, con el torso erguido.","Invierte de inmediato empujando con los talones, como un salto, para generar impulso.","Con ese impulso, empuja las kettlebells sobre la cabeza hasta bloquear los brazos.","Cae con los pies en tijera, uno adelante y otro atrás.","Con las kettlebells arriba, junta los pies y quédate de pie. Bájalas para la siguiente repetición."],"en":"Double Kettlebell Jerk","ines":1,"f":"push","m":"c","sec":["cuadriceps","gemelos","triceps"]},"fdb-Double_Kettlebell_Push_Press":{"nombre":"Push press con dos kettlebells","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Haz clean de dos kettlebells a los hombros.","Baja unos centímetros en sentadilla y sube rápido, usando el impulso de las piernas para llevar las kettlebells sobre la cabeza.","Al bloquearlas, bájalas a los hombros y repite."],"en":"Double Kettlebell Push Press","ines":1,"f":"push","m":"c","sec":["cuadriceps","gemelos","triceps"]},"fdb-Double_Kettlebell_Snatch":{"nombre":"Arranque con dos kettlebells","grupos":["hombros"],"eq":"Kettlebell","niv":"Avanzado","cat":"Fuerza","inst":["Pon dos kettlebells detrás de los pies. Flecta las rodillas y lleva la cadera atrás para tomarlas.","Balancéalas con fuerza entre las piernas e invierte la dirección.","Empuja con la cadera y bloquéalas sobre la cabeza en un solo movimiento continuo."],"en":"Double Kettlebell Snatch","ines":1,"f":"pull","m":"c","sec":["cuadriceps","gluteos","isquios"]},"fdb-Double_Kettlebell_Windmill":{"nombre":"Molino con dos kettlebells","grupos":["core"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon una kettlebell delante del pie de adelante y haz clean y press con la otra sobre la cabeza con el brazo contrario, girando la muñeca para que la palma mire al frente.","Con la kettlebell siempre bloqueada, empuja la cadera hacia el lado del brazo que la sostiene. Gira los pies unos 45° respecto de ese brazo.","Flectando la cadera hacia un lado, inclínate lento hasta tomar la kettlebell del suelo, siempre mirando la de arriba.","Pausa un segundo tras tomarla y vuelve a la posición inicial."],"en":"Double Kettlebell Windmill","ines":1,"f":"pull","sec":["gluteos","hombros","isquios","triceps"]},"fdb-Double_Leg_Butt_Kick":{"nombre":"Patada al glúteo con ambas piernas","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Pliometría","inst":["Begin standing with your knees slightly bent.","Quickly squat a short distance, flexing the hips and knees, and immediately extend to jump for maximum vertical height.","As you go up, tuck your heels by flexing the knees, attempting to touch the buttocks.","Finish the motion by landing with the knees only
