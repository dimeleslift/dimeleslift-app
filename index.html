<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programación Dime Les Lift</title>
<link rel="icon" type="image/png" sizes="256x256" href="https://s3.amazonaws.com/webflow-prod-assets/5ebdb74cbf289733fdfaa0b2/6ade7447641c1a522357ae5d_webclip-dimeles-256.png">
<link rel="apple-touch-icon" sizes="256x256" href="https://s3.amazonaws.com/webflow-prod-assets/5ebdb74cbf289733fdfaa0b2/6ade7447641c1a522357ae5d_webclip-dimeles-256.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
:root{
  /* Marca Dimeleslift — según el Manual de marca Dimeleslift.
     Fondo negro #000000, superficie #141414, línea #2A2A2A, borde de campo #3A3A3A,
     texto crema #F4F1EC, texto suave #D6D2CB, texto tenue #B8B3AB.
     Magenta #DA45A4 sobre negro (identidad: LES, títulos, etiquetas) y #B02E82 en rellenos/fondos claros.
     Lima #A3E850 = acción y logro (botones principales, estados activos), siempre con texto negro.
     Ámbar, rojo y la escala RPE solo como colores de estado.
     Logo en Nunito Sans 400/800; todo lo demás en League Spartan. */
  --ink:#000000;
  --panel:#141414;
  --panel2:#000000;
  --line:#2A2A2A;
  --campo:#3A3A3A;
  --text:#F4F1EC;
  --soft:#D6D2CB;
  --muted:#B8B3AB;
  --pink:#DA45A4;
  --magenta:#DA45A4;
  --green:#A3E850;
  --acc:#A3E850;
  --warn:#f2b84b;
  --bad:#ff6b6b;
  --display:"League Spartan","Arial Black",system-ui,sans-serif;
  --body:"League Spartan",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.5rem;text-transform:uppercase}
h3{font-size:1.1rem;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:1px solid var(--line)}
.topin{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-family:"Nunito Sans",var(--body);font-size:1.45rem;line-height:1;font-weight:400;letter-spacing:-.01em;color:#fff}
.logo b{font-weight:800;color:var(--pink);letter-spacing:-.02em}
.brand small{font-family:var(--body);font-weight:600;font-size:.72rem;color:var(--ink);background:var(--green);padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.04em}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600}
.tab:hover{color:var(--text);background:var(--panel)}
.tab[aria-current="true"]{color:var(--ink);background:var(--green)}

.main{max-width:1040px;margin:0 auto;padding:18px 16px 120px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.hl{border-color:var(--pink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

.btn{border:1px solid var(--campo);background:var(--panel2);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--green);border-color:var(--green);color:#000;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.btn.ok{background:var(--green);border-color:var(--green);color:#000;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.btn.ghost{background:none}
.btn.sm{padding:4px 9px;font-size:.85rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
input,select,textarea{background:var(--ink);border:1px solid var(--campo);border-radius:12px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--pink);outline:none}
input[type=number]{width:70px}
textarea{width:100%;min-height:60px;resize:vertical}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid var(--campo);background:var(--panel2);white-space:nowrap}
.chip.ok{color:var(--ink);background:var(--green);border-color:var(--green)}
.chip.pk{color:var(--pink);background:transparent;border-color:var(--pink)}
.chip.warn{color:var(--ink);background:var(--warn);border-color:var(--warn)}
.chip.bad{color:var(--ink);background:var(--bad);border-color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}

.bar{display:inline-block;background:var(--green);color:var(--ink);font-family:var(--display);font-weight:800;text-transform:uppercase;padding:2px 8px}
.bar.pk{background:var(--magenta);color:#fff}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem;color:var(--muted);font-weight:600}

.day{background:var(--panel2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.exrow{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp input[type=number]{width:58px}
.x{color:var(--muted)}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:.9rem}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
.tablewrap{overflow-x:auto}

.setgrid{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:6px;align-items:center}
.setgrid input{width:100%}
.setgrid .h{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase}
.sugg{font-size:.85rem;color:var(--green);font-weight:600}
.fb{border-left:3px solid var(--green);background:var(--panel2);padding:8px 10px;border-radius:0 6px 6px 0;font-size:.9rem}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--magenta);color:#fff}
.savebar .in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:700}
.savebar .btn{background:#fff;color:var(--ink);border-color:#fff}
.savebar .btn.ghost{background:none;color:#fff;border-color:#fff}

.timer{position:fixed;right:16px;bottom:16px;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.timer .t{font-family:var(--display);font-size:1.5rem;font-weight:800;min-width:64px;font-variant-numeric:tabular-nums}
.timer.ring{border-color:var(--green);background:rgba(163,232,80,.12)}
@media (max-width:640px){.timer{left:0;right:0;bottom:0;max-width:none;border-radius:12px 12px 0 0;justify-content:space-between}.main{padding-bottom:96px}}

.banner{background:var(--green);color:var(--ink);border-radius:8px;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.pk{background:var(--magenta);color:#000}
.banner .btn{background:var(--ink);color:var(--text);border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:40;background:var(--text);color:var(--ink);padding:9px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad)}

.body svg{width:100%;height:auto;max-width:420px}
.legend{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.88rem}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.vid{display:flex;flex-direction:column;gap:4px}
.vid video{width:100%;max-height:260px;background:#000;border-radius:6px}
.upl{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
table.macro td,table.macro th{padding:4px 6px;font-size:.8rem;border:1px solid var(--line);text-align:center;white-space:nowrap}
table.macro th{text-align:left;background:var(--panel)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.star{display:inline-block;width:14px;height:14px;vertical-align:-1px}
@media (max-width:560px){ .nav{margin-left:0;width:100%} .tab{flex:1;padding:8px 6px;font-size:.88rem} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
/* Vista alumno estilo Tarimapp */
.ent{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:860px){.ent{grid-template-columns:minmax(0,1fr)}}
.daytabs{display:flex;gap:6px;flex-wrap:wrap}
.daytab{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
.daytab[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.daytab .ok{color:var(--green)}
.exc{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.exh{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;width:100%;background:none;border:0;color:inherit;text-align:left}
.ring{--p:0;width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.72rem;font-weight:800;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--panel2) 0)}
.ring span{width:34px;height:34px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.exh h3{text-transform:none;font-size:1.05rem}
.exb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.grpbox{border-left:3px solid var(--pink);border-radius:12px;background:var(--panel);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.grpbox>.lbl{padding:4px 14px;font-size:.75rem;font-weight:800;color:var(--pink);letter-spacing:.05em}
.grpbox .exc{border:0;background:none}
.lset{display:grid;grid-template-columns:40px 60px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:6px 8px;border-radius:10px;border:1px solid transparent}
.lset.now{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 8%,transparent)}
.lset.done{opacity:.75}
.lset input{width:100%;text-align:center}
.lset .h{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;text-align:center}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:none;color:var(--ink);cursor:pointer;font-weight:900;padding:0}
.chk[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.nowtag{font-size:.65rem;font-weight:800;color:var(--pink);margin-left:4px}
.warm{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:.88rem}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:70px}
.donebtn{border:1px dashed var(--line);background:none;color:var(--text);border-radius:12px;padding:14px;font-weight:700;cursor:pointer}
.donebtn[aria-pressed="true"]{border-style:solid;border-color:var(--green);color:var(--green)}
/* Sumado: calendario, cuestionario, testimonios, entrenador */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal span{font-size:.72rem;color:var(--muted);text-align:center;font-weight:700}
.cal div{border-radius:7px;background:var(--panel2);padding:5px 6px;font-size:.82rem;min-height:38px;position:relative;font-variant-numeric:tabular-nums}
.cal .o{opacity:.3}.cal .t{outline:2px solid var(--pink)}.cal .dn{background:var(--green);color:var(--ink);font-weight:800}
.cal .cp::after{content:"";position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:9px;background:var(--pink)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.qgrid select{width:100%}
.prompt{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:10px 12px}
.prompt p{margin:0;flex:1;font-size:.92rem}

/* ---- Manual de marca Dimeleslift (nov 2026): tarjetas 20 px, botones y chips píldora, campos 12 px ---- */
.card{border-radius:20px}
.btn{border-radius:999px}
input,select,textarea{border-radius:12px}
.exc{border-radius:20px}
.tab{border-radius:999px}
.btn.pill{border-radius:999px;padding:10px 18px}
.sechead{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--acc);margin:8px 2px -2px}
/* Selector Guiado / Planilla */
.modesel{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;align-self:flex-start}
.modeb{border:0;background:none;color:var(--muted);font-weight:800;padding:8px 18px;border-radius:999px;cursor:pointer;font-family:var(--display);text-transform:uppercase;letter-spacing:.03em}
.modeb[aria-pressed="true"]{background:var(--acc);color:#000000}
/* Modo guiado */
.gd{max-width:560px;width:100%;margin:0 auto;gap:14px}
.gd-kicker{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--acc)}
.gd-title{font-size:1.9rem;line-height:1.05;text-transform:none}
.gd-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.gd-list li span:first-child{font-weight:700;margin-right:6px}
.gd-cta{width:100%;border:0;border-radius:999px;background:#A3E850;color:#000000;font-family:var(--display);font-weight:800;font-size:1.15rem;text-transform:uppercase;letter-spacing:.03em;padding:16px 20px;cursor:pointer}
.gd-cta:disabled{opacity:.4;cursor:not-allowed}
.gd-prog{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.gd-prog span{display:block;height:100%;background:var(--acc);border-radius:9px}
.pillchip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;background:var(--panel2);font-size:.82rem;font-weight:700}
.pillchip.acc{background:var(--acc);color:#000000}
.gd-steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gd-step{background:var(--panel2);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.gd-lbl{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center}
.gd-stepin{display:flex;align-items:center;gap:6px;width:100%}
.gd-stepin input{flex:1;width:100%;min-width:0;text-align:center;font-family:var(--display);font-weight:800;font-size:2rem;background:none;border:0;padding:4px 0}
.gd-pm{width:44px;height:44px;flex:none;border-radius:999px;border:1px solid var(--line);background:var(--ink);font-size:1.5rem;font-weight:700;cursor:pointer;line-height:1}
.gd-unit{font-size:.72rem;color:var(--muted)}
.gd-bar{width:100%;max-width:340px;margin:0 auto;display:block}
.gd-rest{text-align:center;align-items:center}
.gd-clock{font-family:var(--display);font-weight:800;font-size:5rem;line-height:1;font-variant-numeric:tabular-nums}
.gd-clock.done{color:var(--acc)}
.gd-next{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border-radius:20px;padding:12px 16px;width:100%}
.gd-next b{font-family:var(--display);font-size:1.25rem}
.gd-sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
.gd-sheet{position:fixed;left:0;right:0;bottom:0;z-index:46;background:var(--panel);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:12px 18px 22px;display:flex;flex-direction:column;gap:12px;max-width:600px;margin:0 auto}
.gd-grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.gd-sheet h3{text-transform:none;font-size:1.3rem;text-align:center}
.gd-rpe{display:flex;flex-direction:column;gap:8px}
.gd-sec{display:flex;flex-direction:column;gap:8px}
.gd-checks{display:flex;flex-direction:column;gap:8px}
.gd-check{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:12px 14px;cursor:pointer;color:var(--text)}
.gd-box{width:28px;height:28px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:#000000;flex:none}
.gd-check[aria-pressed="true"] .gd-box{background:var(--acc);border-color:var(--acc)}
.gd-dolor{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
@media (max-width:480px){.gd-dolor{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}}
.pillbtn{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:8px 0;font-weight:800;cursor:pointer;color:var(--text)}
.pillbtn[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#000000}
.gd-big{font-family:var(--display);font-weight:800;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.gd-big small{font-size:1.4rem;color:var(--muted)}
.gd-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gd-tiles div{background:var(--panel2);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:2px}
.gd-tiles b{font-family:var(--display);font-size:1.3rem}
.gd-tiles span{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.gd-carga{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gd-carga>div{display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:var(--panel2);border-radius:14px;padding:10px 12px}
.gd-carga>div.sg{border:1px solid var(--acc)}
.gd-carga b{font-size:1.1rem}
.gd-carga .btn{margin-top:6px}
#gdtmr{text-align:center;margin:6px 0}
.gd-ind{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border-radius:14px;padding:10px}
.gd-ind b{font-size:1.3rem}
.gd-aviso{background:var(--panel2);border-left:4px solid var(--acc);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.92rem}
.charttip{position:fixed;z-index:9000;display:none;max-width:320px;background:#141414;color:#F4F1EC;border:1px solid #2A2A2A;border-radius:12px;padding:10px 12px;font-size:.82rem;line-height:1.45;white-space:pre-line;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tipdot{cursor:pointer}
svg circle:not(.tipdot),svg text,svg polyline{pointer-events:none}
.gd-calc{display:flex;flex-direction:column;gap:8px}
.gd-calcrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--panel2)}
.gd-calcrow:last-child{border-bottom:0}
.gd-calcrow b{white-space:nowrap}
.gd-calcrow .small{grid-column:1/-1}
.gd-total{margin-top:10px;font-size:1.05rem}
.gd-bars{display:flex;flex-direction:column;gap:8px}
.gd-barrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.88rem}
.gd-barrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gd-barrow div{height:10px;background:var(--panel2);border-radius:9px;overflow:hidden}
.gd-barrow i{display:block;height:100%;background:var(--acc);border-radius:9px}

    } } }, [el('label', { text: 'Código' }), input, btn, box]);
    var p = el('p');
    p.appendChild(document.createTextNode('Te mandamos un correo a '));
    p.appendChild(el('b', { text: email }));
    p.appendChild(document.createTextNode(' con un código de 6 dígitos (asunto «Tu enlace para entrar · Dimeleslift»). Escríbelo aquí. Si no llega en un par de minutos, revisa spam.'));
    open([
      el('h2', { text: 'Revisa tu correo' }), p, form,
      el('button', { class: 'l', type: 'button', text: 'Usar otro correo o pedir un código nuevo', on: { click: function () { pasoCorreo(null, email); } } })
    ]);
  }

  /* Paso 3: crear contraseña */
  function pasoClave(cerrable) {
    var box = el('div', { class: 'm' });
    var a = el('input', { type: 'password', autocomplete: 'new-password', placeholder: 'Mínimo 8 caracteres' });
    var b = el('input', { type: 'password', autocomplete: 'new-password', placeholder: 'Repítela' });
    var btn = el('button', { class: 'p', type: 'submit', text: 'Guardar mi contraseña' });
    var form = el('form', { on: { submit: function (e) {
      e.preventDefault();
      if (a.value.length < 8) { msg(box, 'Usa al menos 8 caracteres.', 'err'); return; }
      if (a.value !== b.value) { msg(box, 'Las dos contraseñas no coinciden.', 'err'); return; }
      btn.disabled = true; msg(box, 'Guardando…');
      sb().auth.updateUser({ password: a.value }).then(function (r) {
        btn.disabled = false;
        if (r.error) {
          var t = traducir(r.error);
          if (t === 'SAME') { listo('Esa ya era tu contraseña, así que no cambió nada.'); return; }
          msg(box, t, 'err'); return;
        }
        listo('Tu contraseña quedó guardada. Desde ahora entras con tu correo y esta contraseña.');
      }).catch(function (e) { btn.disabled = false; msg(box, traducir(e), 'err'); });
    } } }, [el('label', { text: 'Nueva contraseña' }), a, el('label', { text: 'Repite la contraseña' }), b, btn, box]);
    open([
      el('h2', { text: 'Crea tu contraseña' }),
      el('p', { text: 'Esta es la contraseña que vas a usar siempre para entrar.' }),
      form
    ], !!cerrable);
  }

  function listo(texto) {
    setFlag(null);
    open([
      el('h2', { text: '¡Listo!' }),
      el('p', { text: texto }),
      el('button', { class: 'p', type: 'button', text: 'Entrar a mi espacio', on: { click: function () { location.replace(location.pathname); } } })
    ], false);
  }

  function appMuestraCrear() {
    return Array.prototype.some.call(document.querySelectorAll('h1,h2,h3'), function (h) {
      return /crea tu contrase/i.test(h.textContent) && h.offsetParent !== null && !h.closest('#dll-auth');
    });
  }

  function esperarSesion(ms) {
    var fin = Date.now() + ms;
    return new Promise(function (res) {
      (function vuelta() {
        sb().auth.getSession().then(function (r) {
          var s = r && r.data && r.data.session;
          if (s || Date.now() > fin) res(s); else setTimeout(vuelta, 400);
        }).catch(function () { if (Date.now() > fin) res(null); else setTimeout(vuelta, 400); });
      })();
    });
  }

  /* El enlace del login abre este flujo en vez del correo con enlace */
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest && e.target.closest('a,button');
    if (!t || t.closest('#dll-auth')) return;

      if (sb()) pasoCorreo();
    }
  }, true);

  ready(function () {
    setTimeout(function () {
      if (!sb()) return;
      if (early.error) {
        pasoCorreo('Ese enlace ya venció o ya se usó. A veces el correo lo abre solo para revisarlo y lo gasta. Pide un código aquí, es más seguro.');

      }
      var vieneDelCorreo = early.token && /recovery|invite|signup|magiclink/.test(early.type || '');
      if (vieneDelCorreo || getFlag()) {
        esperarSesion(6000).then(function (s) {
          if (s) { if (!appMuestraCrear()) pasoClave(!vieneDelCorreo); }
          else if (vieneDelCorreo) pasoCorreo('Ese enlace ya venció o ya se usó. Pide un código aquí.');
        });
      }
    }, 400);
  });
})();

uéstate en un banco plano con una mancuerna en cada mano, palmas hacia el techo, brazos paralelos al suelo junto a los muslos y codos levemente flectados. Esta es la posición inicial.","Lleva las mancuernas en semicírculo desde los muslos hasta sobre la cabeza, con los brazos siempre paralelos al suelo, inspirando.","Vuelve por el mismo camino a la posición inicial botando el aire."],"en":"Around The Worlds","ines":1,"f":"push","m":"c","sec":["hombros"]},"fdb-Atlas_Stone_Trainer":{"nombre":"Entrenador de piedra atlas","grupos":["espalda_baja"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["Este implemento, hecho de extremos de barra o caño pesado, sirve para desarrollar la fuerza de las piedras atlas si no tienes piedras.","Cárgalo con el peso deseado. Párate sobre él, rodéalo con los brazos y flecta la cadera.","Súbelo pasando las rodillas, extendiendo la cadera. Al pasar las rodillas, apóyalo sobre los muslos sentándote atrás y abrazándolo fuerte contra el pecho.","Termina extendiendo cadera y rodillas para subirlo lo más alto posible. Puedes volver a apoyarlo en los muslos o en el suelo para la siguiente repetición."],"en":"Atlas Stone Trainer","ines":1,"f":"pull","m":"c","sec":["antebrazos","biceps","cuadriceps","gluteos","isquios"]},"fdb-Atlas_Stones":{"nombre":"Piedras atlas","grupos":["espalda_baja"],"eq":"Otro","niv":"Avanzado","cat":"Strongman","inst":["Empieza con la piedra entre los pies. Flecta la cadera y rodéala con los brazos, intentando meter los dedos por debajo. Muchas piedras tienen una parte plana abajo que ayuda a sujetarla.","Pegando la piedra al torso, empuja con la mitad trasera de los pies para despegarla del suelo.","Al pasar las rodillas, siéntate atrás y apóyala sobre los muslos.","Quédate bajo, sube la piedra al pecho y cambia el agarre para rodearla por arriba. Ponte de pie empujando con la cadera, acércate a la plataforma e inclínate atrás extendiendo la cadera para subirla lo más alto posible."],"en":"Atlas Stones","ines":1,"f":"pull","m":"c","sec":["aductores","antebrazos","biceps","core","cuadriceps","dorsales","gemelos","gluteos","isquios","trapecio"]},"fdb-Axle_Deadlift":{"nombre":"Peso muerto con barra axle","grupos":["espalda_baja"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["Acércate a la barra gruesa (axle) hasta que quede sobre el centro de los pies, separados al ancho de cadera. Flecta la cadera para tomarla al ancho de hombros, dejando que las escápulas se separen. Normalmente se usa agarre mixto.","Con pies y agarre listos, toma aire, baja la cadera y flecta las rodillas hasta que las canillas toquen la barra. Mira al frente, pecho arriba y espalda firme, y empuja con los talones.","Pasada la rodilla, tira la barra hacia atrás juntando las escápulas mientras llevas la cadera hacia la barra.","Baja la barra flectando la cadera y guiándola al suelo."],"en":"Axle Deadlift","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","dorsales","gluteos","isquios","trapecio"]},"fdb-Back_Flyes_-_With_Bands":{"nombre":"Aperturas posteriores con bandas","grupos":["hombros"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Pasa una banda alrededor de un poste fijo, como el de un rack.","Toma la banda por los agarres y aléjate hasta que tenga tensión.","Estira los brazos al frente, paralelos al suelo, con los pies al ancho de hombros. Esta es la posición inicial.","Botando el aire, abre los brazos hacia los lados y atrás, siempre estirados y paralelos al suelo.","Tras una pausa, vuelve a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Back Flyes - With Bands","ines":1,"f":"pull","m":"c","sec":["dorsales","triceps"]},"fdb-Backward_Drag":{"nombre":"Arrastre hacia atrás","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Strongman","inst":["Carga un trineo y engánchale una cuerda o correas para sujetarte.","Camina hacia atrás la distancia indicada. Inclinado atrás, extiende las piernas con pasos cortos para moverte lo más rápido posible."],"en":"Backward Drag","ines":1,"f":"pull","m":"c","sec":["antebrazos","espalda_baja","gemelos","gluteos","isquios"]},"fdb-Backward_Medicine_Ball_Throw":{"nombre":"Lanzamiento de balón medicinal hacia atrás","grupos":["hombros"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["This exercise is best done with a partner. If you lack a partner, the ball can be thrown and retrieved or thrown against a wall.","Begin standing a few meters in front of your partner, both facing the same direction. Begin holding the ball between your legs.","Squat down and then forcefully reverse direction, coming to full extension and you toss the ball over your head to your partner.","Your partner can then roll the ball back to you. Repeat for the desired number of repetitions."],"en":"Backward Medicine Ball Throw","f":"push","m":"c"},"fdb-Balance_Board":{"nombre":"Tabla de equilibrio","grupos":["gemelos"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Pon una tabla de equilibrio frente a ti.","Súbete y busca el equilibrio.","Mantén el equilibrio el tiempo que quieras."],"en":"Balance Board","ines":1,"m":"c","sec":["cuadriceps","isquios"]},"fdb-Ball_Leg_Curl":{"nombre":"Curl femoral con fitball","grupos":["isquios"],"eq":"Fitball","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con los pies sobre un fitball.","Ubica el balón de modo que, con las piernas estiradas, los tobillos queden encima. Esta es la posición inicial.","Sube la cadera del suelo, con el peso en las escápulas y los pies.","Flecta las rodillas acercando el balón lo más posible, contrayendo los isquiotibiales.","Tras una breve pausa, vuelve a la posición inicial."],"en":"Ball Leg Curl","ines":1,"f":"pull","m":"i","sec":["gemelos","gluteos"]},"fdb-Band_Assisted_Pull-Up":{"nombre":"Dominada asistida con banda","grupos":["dorsales"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Amarra la banda al centro de la barra de dominadas. Bandas distintas dan distinta asistencia.","Tira el extremo de la banda hacia abajo y mete una rodilla flectada en el lazo, asegurando que no se salga. Toma la barra con agarre medio a ancho. Esta es la posición inicial.","Sube contrayendo los dorsales y llevando los codos a los costados, intentando pasar el mentón sobre la barra. Evita balanceos y tirones.","Tras una breve pausa, vuelve a la posición inicial."],"en":"Band Assisted Pull-Up","ines":1,"m":"c","sec":["antebrazos","core"]},"fdb-Band_Good_Morning":{"nombre":"Good morning con banda","grupos":["isquios"],"eq":"Bandas","niv":"Principiante","cat":"Powerlifting","inst":["Párate sobre un extremo de una banda larga con los pies levemente separados. Inclínate desde la cadera para pasar el otro extremo detrás del cuello. Esta es la posición inicial.","Con las piernas estiradas, extiende la cadera hasta quedar casi vertical.","Al bajar a la posición inicial, no redondees la espalda."],"en":"Band Good Morning","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gluteos"]},"fdb-Band_Good_Morning_Pull_Through":{"nombre":"Pull through con banda","grupos":["isquios"],"eq":"Bandas","niv":"Principiante","cat":"Powerlifting","inst":["Pasa la banda alrededor de un poste. Aléjate un poco y pasa el otro extremo por detrás del cuello; puedes ayudarte con las manos.","Inclínate desde la cadera llevándola lo más atrás posible, con la espalda plana, hasta unos 90°. Las rodillas apenas flectadas.","Vuelve a quedar de pie empujando con la cadera."],"en":"Band Good Morning (Pull Through)","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gluteos"]},"fdb-Band_Hip_Adductions":{"nombre":"Abducción de cadera con banda","grupos":["aductores"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Ancla una banda a un poste firme.","Párate con el lado izquierdo hacia el poste y pasa el pie derecho por la banda, a la altura del tobillo.","Mantente derecho y afírmate del poste si lo necesitas. Esta es la posición inicial.","Con la rodilla estirada, lleva la pierna derecha hacia el lado lo más que puedas.","Vuelve a la posición inicial y repite las repeticiones indicadas.","Cambia de lado."],"en":"Band Hip Adductions","ines":1,"f":"pull","m":"i"},"fdb-Band_Pull_Apart":{"nombre":"Band pull apart","grupos":["hombros"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Estira los brazos al frente sosteniendo la banda con ambas manos.","Abre los brazos hacia los lados, como un vuelo invertido.","Con los codos estirados, lleva la banda hasta el pecho, manteniendo los hombros atrás.","Pausa al final y vuelve controlado a la posición inicial."],"en":"Band Pull Apart","ines":1,"f":"pull","m":"i","sec":["dorsales","trapecio"]},"fdb-Band_Skull_Crusher":{"nombre":"Rompecráneos con banda","grupos":["triceps"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Fija una banda a la base de un rack o del banco. Acuéstate en el banco con la banda alineada con tu cabeza.","Toma la banda y sube los codos hasta que el brazo quede perpendicular al suelo. Con el codo flectado, la banda queda sobre tu cabeza. Esta es la posición inicial.","Extiende el codo sin mover el brazo. Pausa arriba y vuelve a la posición inicial."],"en":"Band Skull Crusher","ines":1,"f":"push","m":"i"},"fdb-Barbell_Ab_Rollout":{"nombre":"Rollout abdominal con barra","grupos":["core"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Ponte en posición de flexión de brazos, pero con las manos en una barra olímpica cargada con 2-5 kg por lado. Esta es la posición inicial.","Con una leve curva en la espalda, sube la cadera y rueda la barra hacia los pies botando el aire. Los glúteos suben, el abdomen se mantiene firme y los brazos quedan perpendiculares al suelo; si no, trabajan más hombros y espalda que abdomen.","Tras un segundo arriba, rueda la barra lento de vuelta a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Barbell Ab Rollout","ines":1,"f":"pull","m":"c","sec":["espalda_baja","hombros"]},"fdb-Barbell_Ab_Rollout_-_On_Knees":{"nombre":"Rollout abdominal con barra de rodillas","grupos":["core"],"eq":"Barra","niv":"Avanzado","cat":"Fuerza","inst":["Toma una barra olímpica cargada con 2-5 kg por lado y arrodíllate en el suelo.","Apoya la barra frente a ti, quedando en cuatro apoyos. Esta es la posición inicial.","Rueda la barra lentamente hacia adelante estirando el cuerpo, lo más lejos que puedas sin tocar el suelo, inspirando.","Tras un segundo estirado, vuelve a la posición inicial botando el aire. Ve lento y con el abdomen firme."],"en":"Barbell Ab Rollout - On Knees","ines":1,"f":"pull","m":"c","sec":["espalda_baja","hombros"]},"fdb-Barbell_Bench_Press_-_Medium_Grip":{"nombre":"Press banca con barra agarre medio","grupos":["pectoral"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco plano. Con agarre medio (los antebrazos forman 90° con el brazo a mitad del movimiento), saca la barra del rack y sostenla sobre ti con los brazos estirados. Esta es la posición inicial.","Inspira y baja lento hasta que la barra toque la mitad del pecho.","Tras una breve pausa, empuja la barra de vuelta botando el aire, pensando en empujar con el pecho. Bloquea arriba, aprieta un segundo y vuelve a bajar lento. Idealmente, bajar dura el doble que subir.","Repite las repeticiones indicadas.","Al terminar, deja la barra en el rack."],"en":"Barbell Bench Press - Medium Grip","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Barbell_Curl":{"nombre":"Curl con barra","grupos":["biceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie y erguido, toma una barra con agarre al ancho de hombros, palmas al frente y codos pegados al cuerpo. Esta es la posición inicial.","Sin mover los brazos, flecta los codos subiendo la barra mientras botas el aire. Solo se mueven los antebrazos.","Sube hasta que la barra llegue a la altura de los hombros y aprieta el bíceps un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Barbell Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Barbell_Curls_Lying_Against_An_Incline":{"nombre":"Curl con barra apoyado en banco inclinado","grupos":["biceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Apoya el pecho contra un banco inclinado con los brazos colgando y sosteniendo una barra. Esta es la posición inicial.","Sin mover los brazos, sube la barra lo más alto que puedas apretando el bíceps, botando el aire. Solo se mueven los antebrazos; no balancees.","Tras un segundo arriba, baja lento a la posición inicial inspirando, hasta abajo del todo.","Repite las repeticiones indicadas."],"en":"Barbell Curls Lying Against An Incline","ines":1,"f":"pull","m":"i"},"fdb-Barbell_Deadlift":{"nombre":"Peso muerto con barra","grupos":["espalda_baja"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Párate frente a la barra cargada.","Con la espalda lo más recta posible, flecta las rodillas, inclínate y toma la barra con agarre prono al ancho de hombros. Esta es la posición inicial. Si cuesta sostenerla, usa agarre mixto o straps.","Inicia empujando con las piernas mientras llevas el torso a vertical, botando el aire. Arriba, saca pecho y junta las escápulas.","Vuelve a la posición inicial flectando las rodillas e inclinando el torso desde la cadera, con la espalda recta. Cuando los discos tocan el suelo, estás lista o listo para la siguiente repetición.","Haz las repeticiones indicadas en tu programa."],"en":"Barbell Deadlift","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","dorsales","gemelos","gluteos","isquios","trapecio"]},"fdb-Barbell_Full_Squat":{"nombre":"Sentadilla profunda con barra","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack. Pon la barra un poco bajo la altura de los hombros. Con la barra cargada, métete debajo y apóyala en la parte alta de la espalda, bajo el cuello.","Toma la barra con ambas manos y sácala del rack empujando con las piernas mientras enderezas el torso.","Aléjate del rack y ubica los pies al ancho de hombros, con las puntas levemente hacia afuera. Cabeza arriba y espalda neutra. Esta es la posición inicial.","Baja lento flectando rodillas y llevando la cadera atrás, con el torso firme. Baja hasta que los isquiotibiales toquen las pantorrillas, inspirando.","Sube botando el aire, empujando el suelo con todo el pie mientras extiendes rodillas y cadera hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Barbell Full Squat","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios"]},"fdb-Barbell_Glute_Bridge":{"nombre":"Puente de glúteos con barra","grupos":["gluteos"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Siéntate en el suelo con una barra cargada sobre las piernas. Una barra gruesa o un cojín reduce mucho la molestia. Rueda la barra hasta que quede sobre la cadera y acuéstate de espaldas.","Empuja con los talones extendiendo la cadera hacia arriba contra la barra. El peso queda en la parte alta de la espalda y los talones.","Extiende lo más que puedas y vuelve a la posición inicial."],"en":"Barbell Glute Bridge","ines":1,"f":"push","m":"c","sec":["gemelos","isquios"]},"fdb-Barbell_Guillotine_Bench_Press":{"nombre":"Press banca guillotina","grupos":["pectoral"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Con agarre medio, saca la barra del rack y sostenla sobre el cuello con los brazos estirados. Esta es la posición inicial.","Inspirando, baja lento hasta que la barra quede a unos 2-3 cm del cuello.","Tras una pausa, empuja la barra de vuelta con el pecho botando el aire. Bloquea arriba, aprieta un segundo y vuelve a bajar lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas.","Al terminar, deja la barra en el rack."],"en":"Barbell Guillotine Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Barbell_Hack_Squat":{"nombre":"Sentadilla hack con barra","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["De pie, sostén una barra detrás de ti con los brazos estirados y los pies al ancho de hombros, con agarre al ancho de hombros y palmas hacia atrás. Puedes usar straps. Esta es la posición inicial.","Con la cabeza arriba y la espalda recta, baja hasta que los muslos queden paralelos al suelo, inspirando.","Sube empujando sobre todo con los talones, botando el aire.","Repite las repeticiones indicadas."],"en":"Barbell Hack Squat","ines":1,"f":"push","m":"c","sec":["antebrazos","gemelos","isquios"]},"fdb-Barbell_Hip_Thrust":{"nombre":"Hip thrust con barra","grupos":["gluteos"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Siéntate en el suelo con un banco justo detrás y una barra cargada sobre las piernas. Una barra gruesa o un cojín reduce mucho la molestia.","Rueda la barra hasta la cadera y apoya la espalda en el banco, con las escápulas cerca del borde.","Empuja con los pies extendiendo la cadera hacia arriba contra la barra. El peso queda en las escápulas y los pies. Extiende lo más que puedas y vuelve a la posición inicial."],"en":"Barbell Hip Thrust","ines":1,"f":"push","m":"c","sec":["gemelos","isquios"]},"fdb-Barbell_Incline_Bench_Press_-_Medium_Grip":{"nombre":"Press inclinado con barra agarre medio","grupos":["pectoral"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco inclinado. Con agarre medio, saca la barra del rack y sostenla sobre ti con los brazos estirados. Esta es la posición inicial.","Inspirando, baja lento hasta sentir la barra en la parte alta del pecho.","Tras una pausa, empuja la barra de vuelta con el pecho botando el aire. Bloquea, aprieta un segundo y vuelve a bajar lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas.","Al terminar, deja la barra en el rack."],"en":"Barbell Incline Bench Press - Medium Grip","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Barbell_Incline_Shoulder_Raise":{"nombre":"Elevación de hombros con barra en banco inclinado","grupos":["hombros"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco inclinado. Con agarre algo más ancho que los hombros, saca la barra del rack y sostenla sobre ti con los brazos estirados. Esta es la posición inicial.","Sin flectar los codos, sube la barra separando las escápulas y despegando los hombros del banco, botando el aire.","Vuelve a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Barbell Incline Shoulder Raise","ines":1,"f":"push","m":"c","sec":["pectoral"]},"fdb-Barbell_Lunge":{"nombre":"Zancada con barra","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack. Pon la barra un poco bajo la altura de los hombros, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con ambas manos y sácala del rack empujando con las piernas mientras enderezas el torso.","Aléjate del rack, da un paso al frente con la pierna derecha y baja con la cadera, torso erguido y equilibrio, inspirando.","Empuja con todo el pie de adelante para volver a la posición inicial, botando el aire.","Repite las repeticiones indicadas y luego cambia a la pierna izquierda."],"en":"Barbell Lunge","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Barbell_Rear_Delt_Row":{"nombre":"Remo con barra para deltoides posterior","grupos":["hombros"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie, toma una barra con agarre prono más ancho que los hombros.","Flecta levemente las rodillas e inclínate manteniendo la curva natural de la espalda, con los brazos colgando. Con el torso paralelo al suelo, abre los codos hacia afuera; torso y brazos forman una “T”.","Con los brazos perpendiculares al torso, tira la barra hacia la parte alta del pecho apretando los deltoides posteriores, botando el aire. Es como un press banca al revés: los brazos solo hacen de ganchos, no tires con bíceps.","Vuelve lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Barbell Rear Delt Row","ines":1,"f":"pull","m":"c","sec":["biceps","dorsales"]},"fdb-Barbell_Rollout_from_Bench":{"nombre":"Rollout con barra desde banco","grupos":["core"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Pon una barra cargada en el suelo cerca del extremo de un banco. Arrodíllate sobre el banco y toma la barra con agarre medio a estrecho. Esta es la posición inicial.","Extiende la cadera para rodar la barra lentamente hacia adelante. Al avanzar, flecta los hombros para llevarla por delante de la cabeza, siempre con los brazos estirados.","Cuando llegues lo más lejos posible, vuelve a la posición inicial."],"en":"Barbell Rollout from Bench","ines":1,"f":"pull","m":"c","sec":["dorsales","gluteos","hombros","isquios"]},"fdb-Barbell_Seated_Calf_Raise":{"nombre":"Elevación de gemelos sentado con barra","grupos":["gemelos"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Pon un bloque unos 30 cm delante de un banco plano.","Siéntate en el banco y apoya la parte delantera de los pies en el bloque.","Pide que te pongan una barra sobre los muslos, unos 8 cm sobre las rodillas, y sostenla ahí. Esta es la posición inicial.","Sube en puntas de pie lo más alto posible apretando las pantorrillas, botando el aire.","Tras un segundo arriba, baja lento a la posición inicial, estirando bien las pantorrillas.","Repite las repeticiones indicadas."],"en":"Barbell Seated Calf Raise","ines":1,"f":"push","m":"i"},"fdb-Barbell_Shoulder_Press":{"nombre":"Press de hombros con barra","grupos":["hombros"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Siéntate en un banco con respaldo dentro de un rack, con la barra justo sobre la cabeza. Tómala con agarre prono (palmas al frente).","Con el ancho de agarre correcto, saca la barra sobre la cabeza con los brazos estirados. Esta es la posición inicial.","Baja lento la barra hasta los hombros, inspirando.","Súbela de vuelta a la posición inicial botando el aire.","Repite las repeticiones indicadas."],"en":"Barbell Shoulder Press","ines":1,"f":"push","m":"c","sec":["pectoral","triceps"]},"fdb-Barbell_Shrug":{"nombre":"Encogimiento de hombros con barra","grupos":["trapecio"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie, pies al ancho de hombros, sostén una barra frente a ti con agarre prono (palmas hacia los muslos), un poco más ancho que los hombros. Puedes usar straps. Esta es la posición inicial.","Sube los hombros lo más que puedas botando el aire y sostén un segundo. No tires con los bíceps.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Barbell Shrug","ines":1,"f":"pull","m":"i"},"fdb-Barbell_Shrug_Behind_The_Back":{"nombre":"Encogimiento de hombros con barra por detrás","grupos":["trapecio"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie, pies al ancho de hombros, sostén una barra detrás de ti con agarre prono (palmas hacia atrás), un poco más ancho que los hombros. Puedes usar straps. Esta es la posición inicial.","Sube los hombros lo más que puedas botando el aire y sostén un segundo. Los brazos siempre estirados; no tires con los bíceps.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Barbell Shrug Behind The Back","ines":1,"f":"pull","m":"i","sec":["antebrazos","dorsales"]},"fdb-Barbell_Side_Bend":{"nombre":"Inclinación lateral con barra","grupos":["core"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie, con una barra en la parte alta de la espalda y los pies al ancho de hombros. Esta es la posición inicial.","Con la espalda recta y la cabeza arriba, inclínate solo desde la cintura hacia la derecha lo más posible, inspirando. Sostén un segundo y vuelve botando el aire. El resto del cuerpo no se mueve.","Repite hacia la izquierda, sostén un segundo y vuelve.","Repite las repeticiones indicadas."],"en":"Barbell Side Bend","ines":1,"f":"pull","m":"i","sec":["espalda_baja"]},"fdb-Barbell_Side_Split_Squat":{"nombre":"Sentadilla lateral con barra","grupos":["cuadriceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie, con una barra en la parte alta de la espalda, pies bien separados y el pie de la pierna que guía girado hacia afuera. Esta es la posición inicial.","Baja hacia el lado del pie girado flectando rodilla y cadera de esa pierna, con la otra apenas flectada, inspirando.","Vuelve extendiendo cadera y rodilla de la pierna que guía, botando el aire.","Tras las repeticiones indicadas, cambia de pierna."],"en":"Barbell Side Split Squat","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","isquios"]},"fdb-Barbell_Squat":{"nombre":"Sentadilla con barra","grupos":["cuadriceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack. Pon la barra un poco bajo la altura de los hombros. Con la barra cargada, métete debajo y apóyala en la parte alta de la espalda, bajo el cuello.","Toma la barra con ambas manos y sácala del rack empujando con las piernas mientras enderezas el torso.","Aléjate del rack y ubica los pies al ancho de hombros, puntas levemente hacia afuera. Cabeza arriba y espalda neutra. Esta es la posición inicial.","Baja lento flectando rodillas y cadera con el torso firme, hasta que el ángulo entre muslo y pantorrilla sea algo menor a 90°, inspirando. Es normal que las rodillas avancen sobre los pies; lo importante es que sigan la dirección de las puntas.","Sube botando el aire, empujando el suelo con todo el pie hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Barbell Squat","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios"]},"fdb-Barbell_Squat_To_A_Bench":{"nombre":"Sentadilla con barra a banco","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack. Pon un banco plano o un cajón detrás de ti: te enseña a llevar la cadera atrás y a llegar a la profundidad.","Pon la barra a la altura adecuada, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con ambas manos y sácala del rack empujando con las piernas mientras enderezas el torso.","Aléjate del rack, pies al ancho de hombros y puntas levemente hacia afuera. Mira al frente (mirar abajo te desequilibra) y mantén la espalda neutra. Esta es la posición inicial.","Baja lento flectando rodillas y llevando la cadera atrás hasta rozar el banco, inspirando. Las rodillas siguen la dirección de las puntas de los pies.","Sube botando el aire, empujando el suelo con todo el pie y extendiendo cadera y rodillas.","Repite las repeticiones indicadas."],"en":"Barbell Squat To A Bench","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios"]},"fdb-Barbell_Step_Ups":{"nombre":"Subida al cajón con barra","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["De pie, con una barra en la parte alta de la espalda, frente a un cajón o plataforma. Esta es la posición inicial.","Apoya el pie derecho en la plataforma y sube extendiendo cadera y rodilla derecha, empujando sobre todo con el talón. Luego sube el pie izquierdo. Bota el aire al subir.","Baja con la pierna izquierda flectando cadera y rodilla derecha, inspirando. Luego baja el pie derecho junto al izquierdo.","Repite las repeticiones indicadas con la pierna derecha y luego con la izquierda."],"en":"Barbell Step Ups","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Barbell_Walking_Lunge":{"nombre":"Zancada caminando con barra","grupos":["cuadriceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie, pies al ancho de hombros y una barra en la parte alta de la espalda.","Da un paso al frente flectando las rodillas para bajar la cadera, hasta que la rodilla de atrás casi toque el suelo. Torso erguido y rodilla de adelante sobre el pie.","Empuja con el pie de adelante y extiende ambas rodillas para subir.","Avanza con el pie de atrás y repite la zancada con la otra pierna."],"en":"Barbell Walking Lunge","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Battling_Ropes":{"nombre":"Cuerdas de batalla","grupos":["hombros"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Necesitas una cuerda pesada anclada al centro a unos 5-6 m. De frente a ella, toma un extremo en cada mano con los brazos a los lados. Esta es la posición inicial.","Sube un brazo rápido hasta la altura del hombro.","Mientras ese brazo baja, sube el otro.","Sigue alternando, azotando las cuerdas arriba y abajo lo más rápido que puedas."],"en":"Battling Ropes","ines":1,"f":"push","m":"c","sec":["antebrazos","pectoral"]},"fdb-Bear_Crawl_Sled_Drags":{"nombre":"Arrastre de trineo en cuadrupedia","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Strongman","inst":["Con un arnés o un cinturón suelto, engancha la cadena atrás, de espaldas al trineo. Agáchate con las manos en el suelo, espalda plana y rodillas flectadas. Esta es la posición inicial.","Empuja con las piernas alternando izquierda y derecha, usando las manos para equilibrarte y ayudar a tirar. Mantén la espalda plana durante toda la distancia."],"en":"Bear Crawl Sled Drags","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Behind_Head_Chest_Stretch":{"nombre":"Estiramiento de pecho con manos tras la cabeza","grupos":["pectoral"],"eq":"Otro","niv":"Avanzado","cat":"Elongación","inst":["Sit upright on the floor with your partner behind you.","Place your hands behind your hand, and push your elbows back as far as you can. Your partner should hold your elbows. This will be your starting position.","Gently attempt to pull your elbows forward with your hands still behind your head for 10 or more seconds. Your partner should prevent your elbows from moving.","Now, relax your muscles and have your partner gently pull the elbows back as far as it comfortable for you. Be sure to let your partner know when the stretch is adequate to prevent overstretching or injury."],"en":"Behind Head Chest Stretch","f":"static","m":"i","sec":["hombros"]},"fdb-Bench_Dips":{"nombre":"Fondos en banco","grupos":["triceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco detrás de ti, perpendicular al cuerpo. Mirando hacia afuera, apóyate en su borde con las manos al ancho de hombros y brazos estirados. Piernas estiradas al frente, cadera flectada. Esta es la posición inicial.","Baja lento flectando los codos hasta quedar algo por debajo de 90° entre brazo y antebrazo, inspirando. Codos cerca y antebrazos apuntando hacia abajo.","Sube con los tríceps hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Bench Dips","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Bench_Jump":{"nombre":"Salto sobre banco","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Intermedio","cat":"Pliometría","inst":["Begin with a box or bench 1-2 feet in front of you. Stand with your feet shoulder width apart. This will be your starting position.","Perform a short squat in preparation for the jump; swing your arms behind you.","Rebound out of this position, extending through the hips, knees, and ankles to jump as high as possible. Swing your arms forward and up.","Jump over the bench, landing with the knees bent, absorbing the impact through the legs.","Turn around and face the opposite direction, then jump back over the bench."],"en":"Bench Jump","f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Bench_Press_-_Powerlifting":{"nombre":"Press banca de powerlifting","grupos":["triceps"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Acuéstate en el banco con la cabeza más allá de la barra si puedes. Lleva los pies atrás y arquea la espalda. Apoyándote en la barra, despega los hombros, júntalos y retráelos. Usa los pies para empujar los trapecios contra el banco y mantén esa tensión todo el movimiento.","Con el agarre que uses, cubre las marcas de la barra. Saca la barra del rack sin separar las escápulas. Aprieta la barra como si quisieras abrirla.","Baja la barra a la parte baja del pecho o alta del abdomen, con barra, muñeca y codo siempre alineados.","Pausa al tocar el torso y empuja con toda la fuerza posible, con los codos recogidos hasta bloquear."],"en":"Bench Press - Powerlifting","ines":1,"f":"push","m":"c","sec":["antebrazos","dorsales","hombros","pectoral"]},"fdb-Bench_Press_-_With_Bands":{"nombre":"Press banca con bandas","grupos":["pectoral"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Fija una banda bajo la pata del banco plano más cercana a tu cabeza.","Toma la banda por ambos agarres y acuéstate en el banco.","Estira los brazos sosteniendo los agarres frente a ti al ancho de hombros.","Gira las muñecas para que las palmas miren hacia tus pies. Esta es la posición inicial.","Baja lento los agarres hasta que el codo forme 90°, con control total.","Botando el aire, sube con el pecho. Bloquea, aprieta un segundo y baja lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas en tu programa."],"en":"Bench Press - With Bands","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Bench_Press_with_Chains":{"nombre":"Press banca con cadenas","grupos":["triceps"],"eq":"Barra","niv":"Avanzado","cat":"Powerlifting","inst":["Ajusta la cadena guía al largo deseado y cuelga las cadenas en las mangas de la barra.","Acuéstate con la cabeza más allá de la barra si puedes. Pies atrás y espalda arqueada. Despega, junta y retrae los hombros; usa los pies para empujar los trapecios contra el banco y mantén la tensión. Cubre las marcas de la barra con el agarre.","Saca la barra sin separar las escápulas y apriétala como si quisieras abrirla. Bájala a la parte baja del pecho o alta del abdomen, con barra, muñeca y codo alineados.","Pausa al tocar el torso y empuja con toda la fuerza posible, codos recogidos hasta bloquear."],"en":"Bench Press with Chains","ines":1,"f":"push","m":"c","sec":["dorsales","hombros","pectoral"]},"fdb-Bench_Sprint":{"nombre":"Sprint en banco","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Stand on the ground with one foot resting on a bench or box with your heel close to the edge.","Push off with your foot on top of the bench, extending through the hip and knee.","Land with the opposite foot on top of the box, returning your other foot back to the start position.","Continue alternating from one foot to another to complete the set."],"en":"Bench Sprint","f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Bent-Arm_Barbell_Pullover":{"nombre":"Pullover con barra y brazos flectados","grupos":["dorsales"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate en un banco plano con una barra, agarre al ancho de hombros.","Sostén la barra sobre el pecho con los codos algo flectados. Esta es la posición inicial.","Manteniendo esa flexión, baja la barra lento en arco por detrás de la cabeza hasta sentir estiramiento en el pecho, inspirando.","Vuelve por el mismo arco a la posición inicial botando el aire.","Sostén un segundo arriba y repite las repeticiones indicadas."],"en":"Bent-Arm Barbell Pullover","ines":1,"f":"pull","m":"c","sec":["hombros","pectoral","triceps"]},"fdb-Bent-Arm_Dumbbell_Pullover":{"nombre":"Pullover con mancuerna y brazos flectados","grupos":["pectoral"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Pon una mancuerna de pie sobre un banco plano.","Asegurando que no se caiga, acuéstate cruzado sobre el banco con solo los hombros apoyados, cadera bajo el nivel del banco, rodillas flectadas, pies firmes y cabeza fuera del banco.","Toma la mancuerna con ambas manos y sostenla sobre el pecho con los codos algo flectados, palmas contra la cara interna de un disco. Esta es la posición inicial. Ojo: usa una mancuerna con discos bien fijos.","Manteniendo los codos fijos, baja la mancuerna lento en arco por detrás de la cabeza hasta sentir estiramiento en el pecho, inspirando.","Vuelve por el mismo arco a la posición inicial botando el aire.","Sostén un segundo arriba y repite las repeticiones indicadas."],"en":"Bent-Arm Dumbbell Pullover","ines":1,"f":"push","m":"c","sec":["dorsales","hombros","triceps"]},"fdb-Bent-Knee_Hip_Raise":{"nombre":"Elevación de cadera con rodillas flectadas","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con los brazos a los lados.","Flecta las rodillas a unos 75° y despega los pies unos 5 cm del suelo.","Con el abdomen bajo, acerca las rodillas hacia ti manteniendo el ángulo, hasta despegar la cadera del suelo rodando la pelvis hacia atrás. Bota el aire. Al final, las rodillas quedan sobre el pecho.","Aprieta el abdomen un segundo arriba y vuelve lento a la posición inicial inspirando, siempre controlado.","Repite las repeticiones indicadas."],"en":"Bent-Knee Hip Raise","ines":1,"f":"pull","m":"c"},"fdb-Bent_Over_Barbell_Row":{"nombre":"Remo inclinado con barra","grupos":["dorsales"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Con una barra en agarre prono, flecta levemente las rodillas e inclina el torso desde la cadera, con la espalda recta, hasta casi quedar paralelo al suelo. Cabeza neutra y brazos colgando perpendiculares al suelo. Esta es la posición inicial.","Sin mover el torso, bota el aire y tira la barra hacia ti con los codos cerca del cuerpo; los antebrazos solo sostienen. Arriba, aprieta la espalda y pausa brevemente.","Inspira y baja la barra lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"Bent Over Barbell Row","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Bent_Over_Dumbbell_Rear_Delt_Raise_With_Head_On_Bench":{"nombre":"Elevación posterior con mancuernas y frente apoyada","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie con una mancuerna en cada mano y un banco inclinado frente a ti.","Con la espalda recta y su curva natural, inclínate hasta apoyar la frente en el banco. Brazos colgando, palmas enfrentadas y torso paralelo al suelo. Esta es la posición inicial.","Sin mover el torso y con los codos levemente flectados, sube las mancuernas hacia los lados hasta que los brazos queden paralelos al suelo, botando el aire. No balancees ni lleves los brazos hacia atrás.","Tras un segundo arriba, baja lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"Bent Over Dumbbell Rear Delt Raise With Head On Bench","ines":1,"f":"pull","m":"i"},"fdb-Bent_Over_Low-Pulley_Side_Lateral":{"nombre":"Elevación lateral inclinado en polea baja","grupos":["hombros"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Elige una carga y toma el agarre de la polea baja con la mano derecha.","Inclínate desde la cadera hasta que el torso quede casi paralelo al suelo, rodillas algo flectadas y mano izquierda sobre el muslo izquierdo. El brazo derecho cuelga con el codo levemente flectado. Esta es la posición inicial.","Sube el brazo derecho hacia el lado hasta que quede paralelo al suelo y en línea con la oreja, botando el aire.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas y cambia de brazo."],"en":"Bent Over Low-Pulley Side Lateral","ines":1,"f":"pull","m":"i","sec":["dorsales","espalda_baja","trapecio"]},"fdb-Bent_Over_One-Arm_Long_Bar_Row":{"nombre":"Remo a una mano con barra landmine","grupos":["dorsales"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Carga un extremo de una barra olímpica. Pon el otro extremo en una esquina o bloquéalo con algo pesado para que no se deslice.","Inclínate hasta dejar el torso lo más paralelo posible al suelo, con las rodillas algo flectadas.","Toma la barra con una mano justo detrás de los discos y apoya la otra en la rodilla. Esta es la posición inicial.","Tira la barra hacia arriba con el codo pegado hasta que los discos toquen la parte baja del pecho. Aprieta la espalda y sostén un segundo, botando el aire. Solo se mueve el brazo; nada de balanceo.","Baja lento estirando bien el dorsal, sin que los discos toquen el suelo. Discos chicos (unos 10 kg) dan mejor rango que los grandes.","Repite las repeticiones indicadas y cambia de brazo."],"en":"Bent Over One-Arm Long Bar Row","ines":1,"f":"pull","m":"c","sec":["biceps","espalda_baja","trapecio"]},"fdb-Bent_Over_Two-Arm_Long_Bar_Row":{"nombre":"Remo a dos manos con barra landmine","grupos":["dorsales"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Carga un extremo de una barra olímpica. Pon el otro extremo en una esquina o bloquéalo con algo pesado para que no se deslice.","Inclínate hasta dejar el torso lo más paralelo posible al suelo, con las rodillas algo flectadas.","Toma la barra con ambas manos justo detrás de los discos. Esta es la posición inicial.","Tira hacia arriba con los codos pegados hasta que los discos toquen la parte baja del pecho. Aprieta la espalda y sostén un segundo, botando el aire. Puedes enganchar un agarre en V bajo la barra.","Baja lento estirando bien los dorsales, sin que los discos toquen el suelo. Discos chicos (unos 10 kg) dan mejor rango.","Repite las repeticiones indicadas."],"en":"Bent Over Two-Arm Long Bar Row","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Bent_Over_Two-Dumbbell_Row":{"nombre":"Remo inclinado con mancuernas","grupos":["dorsales"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Con una mancuerna en cada mano (palmas hacia el torso), flecta levemente las rodillas e inclina el torso desde la cadera, espalda recta, hasta casi quedar paralelo al suelo. Cabeza neutra y brazos colgando. Esta es la posición inicial.","Sin mover el torso, sube las mancuernas hacia los costados botando el aire, con los codos cerca del cuerpo; los antebrazos solo sostienen. Arriba, aprieta la espalda un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Bent Over Two-Dumbbell Row","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Bent_Over_Two-Dumbbell_Row_With_Palms_In":{"nombre":"Remo inclinado con mancuernas agarre neutro","grupos":["dorsales"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Con una mancuerna en cada mano (palmas enfrentadas), flecta levemente las rodillas e inclina el torso desde la cadera, espalda recta, hasta casi quedar paralelo al suelo. Cabeza neutra y brazos colgando. Esta es la posición inicial.","Sin mover el torso, sube las mancuernas hacia los costados botando el aire y juntando las escápulas. Arriba, aprieta la espalda un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Bent Over Two-Dumbbell Row With Palms In","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Bent_Press":{"nombre":"Bent press","grupos":["core"],"eq":"Kettlebell","niv":"Avanzado","cat":"Fuerza","inst":["Haz clean de una kettlebell al hombro extendiendo piernas y cadera, girando la muñeca al recibirla. Esta es la posición inicial.","Inclínate hacia el lado contrario a la kettlebell hasta tocar el suelo con la mano libre, mirando la kettlebell. Mientras bajas, empuja la carga extendiendo el codo, con el brazo perpendicular al suelo.","Vuelve a quedar de pie con la kettlebell sobre la cabeza. Bájala al hombro y repite las repeticiones indicadas."],"en":"Bent Press","ines":1,"f":"pull","m":"c","sec":["cuadriceps","espalda_baja","gluteos","hombros","isquios","triceps"]},"fdb-Bicycling":{"nombre":"Ciclismo","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Cardio","inst":["To begin, seat yourself on the bike and adjust the seat to your height."],"en":"Bicycling","sec":["gemelos","gluteos","isquios"]},"fdb-Bicycling_Stationary":{"nombre":"Bicicleta estática","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Cardio","inst":["To begin, seat yourself on the bike and adjust the seat to your height.","Select the desired option from the menu. You may have to start pedaling to turn it on. You can use the manual setting, or you can select a program to use. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. The level of resistance can be changed throughout the workout. The handles can be used to monitor your heart rate to help you stay at an appropriate intensity."],"en":"Bicycling, Stationary","sec":["gemelos","gluteos","isquios"]},"fdb-Board_Press":{"nombre":"Board press","grupos":["triceps"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Acuéstate en el banco con la cabeza más allá de la barra si puedes. Usa de 1 a 5 tablas atornilladas, sostenidas por un compañero, con bandas o metidas bajo la polera.","Pies atrás y espalda arqueada. Despega, junta y retrae los hombros; usa los pies para empujar los trapecios contra el banco y mantén la tensión.","Usa tu agarre de banca habitual o al ancho de hombros para enfatizar tríceps. Saca la barra sin separar las escápulas, con barra, muñeca y codo alineados, apretándola como si quisieras abrirla.","Baja la barra hasta las tablas y empuja con toda la fuerza posible, codos recogidos hasta bloquear."],"en":"Board Press","ines":1,"f":"push","m":"c","sec":["antebrazos","dorsales","hombros","pectoral"]},"fdb-Body-Up":{"nombre":"Body-up","grupos":["triceps"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Ponte en plancha sobre antebrazos y puntas de pie, torso recto y antebrazos al ancho de hombros. Esta es la posición inicial.","Presiona las palmas contra el suelo y extiende los codos para subir el cuerpo, con el torso rígido.","Baja lento a los antebrazos flectando los codos.","Repite."],"en":"Body-Up","ines":1,"f":"push","m":"i","sec":["antebrazos","core"]},"fdb-Body_Tricep_Press":{"nombre":"Press de tríceps con peso corporal","grupos":["triceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra en el rack a la altura del pecho.","De pie, tómala al ancho de hombros y retrocede 1-2 m con los pies juntos y brazos estirados, inclinado sobre la barra. Esta es la posición inicial.","Flecta los codos bajando hacia la barra.","Pausa y vuelve extendiendo los codos.","Para progresar, agrega cadenas sobre los hombros."],"en":"Body Tricep Press","ines":1,"f":"push","m":"i"},"fdb-Bodyweight_Flyes":{"nombre":"Aperturas con peso corporal","grupos":["pectoral"],"eq":"Barra Z","niv":"Intermedio","cat":"Fuerza","inst":["Pon dos barras Z con la misma carga en el suelo, una junto a la otra, que puedan rodar.","Ponte en posición de flexión de brazos sobre ellas, brazos estirados y cuerpo recto.","Apoya una mano en cada barra. Esta es la posición inicial.","Lento y controlado, separa las manos rodando las barras hacia afuera, inspirando.","Cuando llegues lo más lejos posible, júntalas de vuelta botando el aire."],"en":"Bodyweight Flyes","ines":1,"f":"push","m":"i","sec":["core","hombros","triceps"]},"fdb-Bodyweight_Mid_Row":{"nombre":"Remo medio con peso corporal","grupos":["dorsales"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Toma una barra de dominadas con agarre medio a ancho y palmas hacia afuera. Colgando, lleva las rodillas al pecho, inclínate atrás y pasa las piernas sobre la barra. Esta es la posición inicial.","Desde brazos estirados, flecta los codos y junta las escápulas para subir hasta que las piernas toquen la barra.","Tras una breve pausa, vuelve a la posición inicial."],"en":"Bodyweight Mid Row","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Bodyweight_Squat":{"nombre":"Sentadilla sin carga","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["De pie, pies al ancho de hombros. Puedes poner las manos detrás de la cabeza. Esta es la posición inicial.","Flecta rodillas y cadera llevando la cadera atrás.","Baja a profundidad completa si puedes y sube rápido a la posición inicial. Mantén cabeza y pecho arriba y empuja las rodillas hacia afuera."],"en":"Bodyweight Squat","ines":1,"f":"push","m":"c","sec":["gluteos","isquios"]},"fdb-Bodyweight_Walking_Lunge":{"nombre":"Zancada caminando sin carga","grupos":["cuadriceps"],"eq":"","niv":"Principiante","cat":"Fuerza","inst":["De pie, pies al ancho de hombros y manos en la cintura.","Da un paso al frente flectando las rodillas para bajar la cadera, hasta que la rodilla de atrás casi toque el suelo. Torso erguido y rodilla de adelante sobre el pie.","Empuja con el pie de adelante y extiende ambas rodillas para subir.","Avanza con el pie de atrás y repite con la otra pierna."],"en":"Bodyweight Walking Lunge","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Bosu_Ball_Cable_Crunch_With_Side_Bends":{"nombre":"Crunch en polea sobre Bosu con inclinaciones laterales","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un agarre en cada polea, en la posición más baja.","Ubica un Bosu al centro, frente a la máquina.","Acuéstate sobre el Bosu con la zona lumbar curvada sobre él; el trasero cerca del suelo sin tocarlo.","Estira los brazos atrás y toma un agarre con cada mano.","Con los pies bien separados, lleva los brazos estirados al frente, entre las rodillas, a la altura de ellas.","Con los brazos rectos y en línea con el cable, sube el torso en un crunch sin bajar ni flectar los brazos.","Manteniendo los brazos rígidos, baja lento a la posición inicial con el abdomen estirado.","Repite hasta el fallo.","Al llegar al fallo, con el abdomen firme, sube el torso a una plancha despegando la espalda del Bosu.","Baja los brazos estirados a los lados y haz inclinaciones laterales alternadas, buscando los talones. Este remate trabaja oblicuos."],"en":"Bosu Ball Cable Crunch With Side Bends","ines":1,"f":"pull","m":"i"},"fdb-Bottoms-Up_Clean_From_The_Hang_Position":{"nombre":"Clean invertido desde colgado","grupos":["antebrazos"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["De pie, con una kettlebell en una mano.","Balancéala con fuerza hacia atrás y luego hacia adelante. Aprieta el mango lo más fuerte posible y llévala al hombro con la base hacia arriba."],"en":"Bottoms-Up Clean From The Hang Position","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Bottoms_Up":{"nombre":"Bottoms up","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con las piernas estiradas y los brazos a los lados. Esta es la posición inicial.","Lleva las rodillas al pecho flectando cadera y rodillas. Luego estira las piernas hacia arriba, perpendiculares al suelo, y rota la pelvis para despegar los glúteos del suelo.","Tras una breve pausa, vuelve a la posición inicial."],"en":"Bottoms Up","ines":1,"f":"pull","m":"c"},"fdb-Box_Jump_Multiple_Response":{"nombre":"Saltos al cajón continuos","grupos":["isquios"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Assume a relaxed stance facing the box or platform approximately an arm's length away. Arms should be down at the sides and legs slightly bent.","Using the arms to aid in the initial burst, jump upward and forward, landing with feet simultaneously on top of the box or platform.","Immediately drop or jump back down to the original starting place; then repeat the sequence."],"en":"Box Jump (Multiple Response)","f":"push","m":"c","sec":["abductores","aductores","cuadriceps","gemelos","gluteos"]},"fdb-Box_Skip":{"nombre":"Skip al cajón","grupos":["isquios"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["You will need several boxes lined up about 8 feet apart.","Begin facing the first box with one leg slightly behind the other.","Drive off the back leg, attempting to gain as much height with the hips as possible.","Immediately upon landing on the box, drive the other leg forward and upward to gain height and distance, leaping from the box. Land between the first two boxes with the same leg that landed on the first box.","Then, step to the next box and repeat."],"en":"Box Skip","f":"push","m":"c","sec":["abductores","aductores","cuadriceps","gemelos","gluteos"]},"fdb-Box_Squat":{"nombre":"Sentadilla al cajón","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["La sentadilla al cajón te deja controlar la profundidad y desarrollar fuerza explosiva. Ponte en un rack con un cajón detrás a la altura adecuada; normalmente uno que te deje en paralelo, aunque puedes usarlo más alto o más bajo.","Métete bajo la barra y apóyala en la parte alta de la espalda. Junta las escápulas y lleva los codos hacia adelante como si quisieras doblar la barra. Sácala del rack con la zona lumbar firme y ubícate. Pies más anchos enfatizan espalda, glúteos, aductores e isquiotibiales; más juntos, cuádriceps. Mira al frente.","Con espalda, hombros y core firmes, empuja rodillas y cadera hacia afuera y baja llevando la cadera atrás hasta sentarte en el cajón. Idealmente, las canillas quedan perpendiculares al suelo. Pausa en el cajón y relaja los flexores de cadera. Nunca rebotes.","Con el peso en los talones y empujando pies y rodillas hacia afuera, sube desde el cajón guiando con la cabeza y manteniendo la tensión de pies a cabeza."],"en":"Box Squat","ines":1,"f":"push","m":"c","sec":["aductores","espalda_baja","gemelos","gluteos","isquios"]},"fdb-Box_Squat_with_Bands":{"nombre":"Sentadilla al cajón con bandas","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Powerlifting","inst":["Ponte en un rack con un cajón detrás a la altura adecuada (normalmente la que te deja en paralelo). Fija las bandas a las mangas de la barra y a los ganchos, al rack o a mancuernas pesadas que no se muevan. Para más tensión, ancla las bandas más separadas o estrangúlalas.","Métete bajo la barra y apóyala en la parte alta de la espalda. Junta las escápulas y lleva los codos adelante como si quisieras doblar l
