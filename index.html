":"c","sec":["biceps"]},"fdb-Straight_Raises_on_Incline_Bench":{"nombre":"Elevaciones rectas en banco inclinado","grupos":["hombros"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra en el suelo detrás de la cabecera de un banco inclinado.","Acuéstate boca abajo y toma la barra en prono con los brazos estirados, dejándola colgar. Esta es la posición inicial.","Sube la barra al frente de la cabeza con los brazos estirados.","Vuelve a la posición inicial."],"en":"Straight Raises on Incline Bench","ines":1,"f":"push","m":"i","sec":["trapecio"]},"fdb-Stride_Jump_Crossover":{"nombre":"Salto de zancada cruzado","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Stand to the side of a box with your inside foot on top of it, close to the edge.","Begin by swinging the arms upward as you push through the top leg, jumping upward as high as possible. Attempt to drive the opposite knee upward.","Land in the opposite position that you started, on the opposite side of the box. The foot that was initially on the box will now be on the ground, with the opposite foot now on the box.","Repeat the movement, crossing back over to the other side."],"en":"Stride Jump Crossover","f":"push","m":"c","sec":["abductores","aductores","gemelos","isquios"]},"fdb-Sumo_Deadlift":{"nombre":"Peso muerto sumo","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Con la barra cargada en el suelo, acércate hasta que cruce el medio de los pies, con los pies muy separados, cerca de los collarines. Flecta la cadera para tomar la barra con los brazos justo bajo los hombros, por dentro de las piernas; agarre prono, mixto o gancho. Relaja los hombros para “alargar” los brazos.","Toma aire, baja la cadera mirando al frente con el pecho arriba. Empuja el suelo separando los pies, con el peso en la mitad trasera del pie, extendiendo cadera y rodillas.","Al pasar la rodilla, échate atrás y lleva la cadera hacia la barra juntando las escápulas.","Baja la barra al suelo flectando la cadera, controlando la bajada."],"en":"Sumo Deadlift","ines":1,"f":"pull","m":"c","sec":["aductores","antebrazos","cuadriceps","dorsales","espalda_baja","gluteos","trapecio"]},"fdb-Sumo_Deadlift_with_Bands":{"nombre":"Peso muerto sumo con bandas","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Con bandas cortas, pásalas sobre la barra y párate dentro de ellas, bajo la mitad trasera del pie, justo donde empujas el suelo.","Con la barra cargada en el suelo, acércate hasta que cruce el medio de los pies, con los pies muy separados. Flecta la cadera para tomar la barra con los brazos bajo los hombros, por dentro de las piernas; agarre prono, mixto o gancho.","Toma aire, baja la cadera mirando al frente con el pecho arriba. Empuja el suelo separando los pies, con el peso en la mitad trasera, extendiendo cadera y rodillas.","Al pasar la rodilla, échate atrás y lleva la cadera hacia la barra juntando las escápulas.","Baja la barra al suelo flectando la cadera, controlando la bajada."],"en":"Sumo Deadlift with Bands","ines":1,"f":"pull","m":"c","sec":["aductores","antebrazos","cuadriceps","dorsales","espalda_baja","gluteos","trapecio"]},"fdb-Sumo_Deadlift_with_Chains":{"nombre":"Peso muerto sumo con cadenas","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Engancha las cadenas a las mangas o cuélgalas por el centro sobre la barra para que la carga aumente al subir. Mantén los extremos lejos de los discos.","Con la barra cargada en el suelo, acércate hasta que cruce el medio de los pies, con los pies muy separados. Flecta la cadera para tomar la barra con los brazos bajo los hombros, por dentro de las piernas; agarre prono, mixto o gancho. Relaja los hombros.","Toma aire, baja la cadera mirando al frente con el pecho arriba. Empuja el suelo separando los pies, con el peso en la mitad trasera, extendiendo cadera y rodillas.","Al pasar la rodilla, échate atrás y lleva la cadera hacia la barra juntando las escápulas.","Baja la barra al suelo flectando la cadera, controlando la bajada."],"en":"Sumo Deadlift with Chains","ines":1,"f":"pull","m":"c","sec":["abductores","aductores","antebrazos","cuadriceps","dorsales","espalda_baja","gluteos","trapecio"]},"fdb-Superman":{"nombre":"Superman","grupos":["espalda_baja"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["To begin, lie straight and face down on the floor or exercise mat. Your arms should be fully extended in front of you. This is the starting position.","Simultaneously raise your arms, legs, and chest off of the floor and hold this contraction for 2 seconds. Tip: Squeeze your lower back to get the best results from this exercise. Remember to exhale during this movement. Note: When holding the contracted position, you should look like superman when he is flying.","Slowly begin to lower your arms, legs and chest back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions prescribed in your program."],"en":"Superman","f":"static","m":"c","sec":["gluteos","isquios"]},"fdb-Supine_Chest_Throw":{"nombre":"Lanzamiento de pecho acostado","grupos":["triceps"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["This drill is great for chest passes when you lack a partner or a wall of sufficient strength. Lay on the ground on your back with your knees bent.","Begin with the ball on your chest, held with both hands on the bottom.","Explode up, extending through the elbow to throw the ball directly above you as high as possible.","Catch the ball with both hands as it comes down."],"en":"Supine Chest Throw","f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Supine_One-Arm_Overhead_Throw":{"nombre":"Lanzamiento sobre la cabeza acostado a una mano","grupos":["core"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["Lay on the ground on your back with your knees bent. Hold the ball with one hand, extending the arm fully behind your head. This will be your starting position.","Initiate the movement at the shoulder, throwing the ball directly forward of you as you sit up, attempting to go for maximum distance.","The ball can be thrown to a partner or bounced off of a wall."],"en":"Supine One-Arm Overhead Throw","f":"pull","m":"c","sec":["dorsales","hombros","pectoral"]},"fdb-Supine_Two-Arm_Overhead_Throw":{"nombre":"Lanzamiento sobre la cabeza acostado a dos manos","grupos":["core"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["Lay on the ground on your back with your knees bent.","Hold the ball with both hands, extending the arms fully behind your head. This will be your starting position.","Initiate the movement at the shoulder, throwing the ball directly forward of you as you sit up, attempting to go for maximum distance.","The ball can be thrown to a partner or bounced off of a wall."],"en":"Supine Two-Arm Overhead Throw","f":"pull","m":"c","sec":["dorsales","hombros","pectoral"]},"fdb-Suspended_Fallout":{"nombre":"Fallout en suspensión","grupos":["core"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Ajusta las correas para que los agarres queden bajo la cintura.","De pie, toma los agarres e inclínate hacia ellos hasta quedar como en una flexión inclinada. Esta es la posición inicial.","Con los brazos rectos, inclínate más acercando el cuerpo al suelo mientras los brazos suben por sobre la cabeza.","Columna neutra y cuerpo recto; solo se mueven los hombros.","Pausa en el punto máximo y vuelve a la posición inicial."],"en":"Suspended Fallout","ines":1,"f":"pull","m":"i","sec":["espalda_baja","hombros","pectoral"]},"fdb-Suspended_Push-Up":{"nombre":"Flexión en suspensión","grupos":["pectoral"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Ancla bien las correas de suspensión arriba de un rack u otro soporte.","Inclinándote hacia ellas, toma un agarre en cada mano y ponte en plancha alta, lo más paralelo al suelo que puedas, con los brazos estirados y buena postura.","Con el torso recto y rígido, baja lento flectando los codos.","Baja hasta pasar los 90° de codo, pausa y extiende para volver."],"en":"Suspended Push-Up","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Suspended_Reverse_Crunch":{"nombre":"Crunch invertido en suspensión","grupos":["core"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Fija las correas con los agarres a unos 30 cm del suelo. Ponte en plancha alta de espaldas al rack.","Mete los pies en los agarres, con el cuerpo recto y sin hundir la cadera. Esta es la posición inicial.","Flecta rodillas y cadera llevando las rodillas al torso, inclinando la pelvis y dejando que la columna se flecte.","Al final, controlado, vuelve a la posición inicial."],"en":"Suspended Reverse Crunch","ines":1,"f":"pull","m":"i"},"fdb-Suspended_Row":{"nombre":"Remo en suspensión","grupos":["dorsales"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Ajusta las correas a la altura del pecho. Toma un agarre en cada mano e inclínate atrás con el cuerpo recto, cabeza y pecho arriba y brazos estirados. Esta es la posición inicial.","Flecta los codos juntando las escápulas.","Pausa al final y vuelve a la posición inicial."],"en":"Suspended Row","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Suspended_Split_Squat":{"nombre":"Sentadilla búlgara en suspensión","grupos":["cuadriceps"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Ajusta las correas con los agarres a 45-75 cm del suelo.","De espaldas a ellas, mete el pie de atrás en el agarre. Mira al frente con el pecho arriba y la rodilla levemente flectada. Esta es la posición inicial.","Baja flectando rodilla y cadera, con el peso en el pie de adelante y buena postura.","Abajo, extiende cadera y rodilla para volver a la posición inicial."],"en":"Suspended Split Squat","ines":1,"f":"push","m":"c","sec":["abductores","aductores","gemelos","gluteos","isquios"]},"fdb-Svend_Press":{"nombre":"Press Svend","grupos":["pectoral"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["De pie.","Junta dos discos livianos entre las palmas y sostenlos cerca del pecho apretándolos, con los dedos al frente. Esta es la posición inicial.","Sin dejar de apretar, estira los brazos al frente de forma controlada.","Pausa al final y vuelve lento a la posición inicial."],"en":"Svend Press","ines":1,"f":"push","m":"c","sec":["antebrazos","hombros","triceps"]},"fdb-T-Bar_Row_with_Handle":{"nombre":"Remo T con agarre","grupos":["dorsales"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra en un landmine o en una esquina para que no se mueva y carga tu extremo.","Párate sobre la barra y engancha un agarre doble en D junto al collarín. Usando cadera y piernas, ponte de pie.","Pies separados, cadera atrás, pecho arriba y brazos estirados. Esta es la posición inicial.","Tira la carga hacia la parte alta del abdomen juntando las escápulas y flectando los codos, sin tirones ni trampa.","Tras una breve pausa, vuelve a la posición inicial."],"en":"T-Bar Row with Handle","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Tate_Press":{"nombre":"Press Tate","grupos":["triceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate en un banco plano con una mancuerna en cada mano sobre los muslos, palmas enfrentadas.","Ayudándote con los muslos, súbelas una a una frente a ti, más separadas que los hombros, en prono y con los codos hacia afuera. Esta es la posición inicial.","Sin mover los brazos, baja lento las mancuernas hacia adentro y abajo en semicírculo hasta tocar la parte alta del pecho, inspirando, con control y sin apoyarlas.","Botando el aire, súbelas con los tríceps por el mismo semicírculo, intentando mantenerlas juntas. Bloquea, sostén un segundo y baja lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas en tu programa."],"en":"Tate Press","ines":1,"f":"push","m":"i","sec":["hombros","pectoral"]},"fdb-The_Straddle":{"nombre":"Estiramiento a horcajadas","grupos":["isquios"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Begin in a seated, upright position. Start by extending your legs in front of you in a V.","With your hands on the floor, lean forward as far as possible. Hold for 10 to 20 seconds."],"en":"The Straddle","f":"static","sec":["aductores","gemelos"]},"fdb-Thigh_Abductor":{"nombre":"Abductores en máquina","grupos":["abductores"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina de abductores y elige una carga cómoda. Con las piernas bien ubicadas, toma los agarres. El tronco no se mueve. Esta es la posición inicial.","Empuja lento con las piernas separándolas, botando el aire.","Sostén un segundo y vuelve a la posición inicial inspirando, con el tronco quieto.","Repite las repeticiones indicadas."],"en":"Thigh Abductor","ines":1,"f":"push","m":"i","sec":["gluteos"]},"fdb-Thigh_Adductor":{"nombre":"Aductores en máquina","grupos":["aductores"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina de aductores y elige una carga cómoda. Con las piernas bien ubicadas en los cojines, toma los agarres. El tronco no se mueve. Esta es la posición inicial.","Empuja lento con las piernas juntándolas, botando el aire.","Sostén un segundo y vuelve a la posición inicial inspirando, con el tronco quieto y sin tirones.","Repite las repeticiones indicadas."],"en":"Thigh Adductor","ines":1,"f":"pull","m":"i","sec":["gluteos","isquios"]},"fdb-Tire_Flip":{"nombre":"Volteo de neumático","grupos":["cuadriceps"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["Toma el neumático por la parte de abajo, en la banda de rodadura, con los pies un poco atrás y el pecho empujando contra el neumático.","Para levantarlo, extiende cadera, rodillas y tobillos empujando hacia el neumático y hacia arriba.","Cuando llegue a unos 45°, da un paso adelante y empuja con una rodilla. Cambia el agarre a la parte alta y empuja hacia adelante con toda tu fuerza para voltearlo. Repite las veces necesarias."],"en":"Tire Flip","ines":1,"f":"pull","m":"c","sec":["antebrazos","espalda_baja","gemelos","gluteos","hombros","isquios","pectoral","trapecio","triceps"]},"fdb-Toe_Touchers":{"nombre":"Toque de puntas","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["To begin, lie down on the floor or an exercise mat with your back pressed against the floor. Your arms should be lying across your sides with the palms facing down.","Your legs should be touching each other. Slowly elevate your legs up in the air until they are almost perpendicular to the floor with a slight bend at the knees. Your feet should be parallel to the floor.","Move your arms so that they are fully extended at a 45 degree angle from the floor. This is the starting position.","While keeping your lower back pressed against the floor, slowly lift your torso and use your hands to try and touch your toes. Remember to exhale while perform this part of the exercise.","Slowly begin to lower your torso and arms back down to the starting position while inhaling. Remember to keep your arms straight out pointing towards your toes.","Repeat for the recommended amount of repetitions."],"en":"Toe Touchers","f":"pull","m":"i"},"fdb-Torso_Rotation":{"nombre":"Rotación de torso","grupos":["core"],"eq":"Fitball","niv":"Principiante","cat":"Elongación","inst":["Stand upright holding an exercise ball with both hands. Extend your arms so the ball is straight out in front of you. This will be your starting position.","Rotate your torso to one side, keeping your eyes on the ball as you move. Now, rotate back to the opposite direction. Repeat for 10-20 repetitions."],"en":"Torso Rotation","f":"pull"},"fdb-Trail_Running_Walking":{"nombre":"Trail running/caminata","grupos":["cuadriceps"],"eq":"","niv":"Principiante","cat":"Cardio","inst":["Running or hiking on trails will get the blood pumping and heart beating almost immediately. Make sure you have good shoes. While you use the muscles in your calves and buttocks to pull yourself up a hill, the knees, joints and ankles absorb the bulk of the pounding coming back down. Take smaller steps as you walk downhill, keep your knees bent to reduce the impact and slow down to avoid falling.","A 150 lb person can burn over 200 calories for 30 minutes walking uphill, compared to 175 on a flat surface. If running the trail, a 150 lb person can burn well over 500 calories in 30 minutes."],"en":"Trail Running/Walking","sec":["gemelos","gluteos","isquios"]},"fdb-Trap_Bar_Deadlift":{"nombre":"Peso muerto con barra hexagonal","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Carga una barra hexagonal (trap bar) en el suelo. Párate al centro y toma ambos agarres.","Baja la cadera, mira al frente y mantén el pecho arriba.","Empuja con los talones extendiendo cadera y rodillas, sin redondear la espalda.","Al terminar, baja la carga al suelo controlada."],"en":"Trap Bar Deadlift","ines":1,"f":"pull","m":"c","sec":["gluteos","isquios"]},"fdb-Tricep_Dumbbell_Kickback":{"nombre":"Patada de tríceps con mancuerna","grupos":["triceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Con una mancuerna en cada mano y palmas hacia el torso, flecta levemente las rodillas e inclina el torso con la espalda recta hasta casi quedar paralelo al suelo, cabeza neutra. Brazos pegados al torso y paralelos al suelo, antebrazos colgando a 90°. Esta es la posición inicial.","Sin mover los brazos, bota el aire y extiende los codos con los tríceps hasta estirar los brazos. Solo se mueve el antebrazo.","Tras una breve pausa, inspira y baja lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"Tricep Dumbbell Kickback","ines":1,"f":"push","m":"i"},"fdb-Tricep_Side_Stretch":{"nombre":"Estiramiento lateral de tríceps","grupos":["triceps"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Bring right arm across your body and over your left shoulder, holding your elbow with your left hand, until you feel a stretch in your tricep. Then repeat for your other arm."],"en":"Tricep Side Stretch","f":"static","sec":["hombros"]},"fdb-Triceps_Overhead_Extension_with_Rope":{"nombre":"Extensión de tríceps tras nuca con cuerda","grupos":["triceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon una cuerda en una polea baja, elige la carga, tómala con ambas manos y date vuelta, de espaldas al cable.","Manos detrás de la cabeza y codos apuntando arriba, flectados. Puedes escalonar los pies e inclinarte un poco adelante para más estabilidad. Esta es la posición inicial.","Extiende los codos sin mover los brazos, subiendo las manos sobre la cabeza.","Aprieta los tríceps arriba y baja lento a la posición inicial."],"en":"Triceps Overhead Extension with Rope","ines":1,"f":"push","m":"i"},"fdb-Triceps_Pushdown":{"nombre":"Pushdown de tríceps","grupos":["triceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra recta o angulada en una polea alta y tómala en prono al ancho de hombros.","De pie, torso recto con una leve inclinación adelante, brazos pegados al cuerpo y perpendiculares al suelo, antebrazos apuntando hacia la polea. Esta es la posición inicial.","Con los tríceps, baja la barra hasta tocar el frente de los muslos con los brazos estirados. Brazos fijos junto al torso; solo se mueven los antebrazos. Bota el aire.","Tras un segundo, sube lento la barra a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Triceps Pushdown","ines":1,"f":"push","m":"i"},"fdb-Triceps_Pushdown_-_Rope_Attachment":{"nombre":"Pushdown de tríceps con cuerda","grupos":["triceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon una cuerda en una polea alta y tómala en agarre neutro.","De pie, torso recto con una leve inclinación adelante, brazos pegados al cuerpo y perpendiculares al suelo, antebrazos hacia la polea. Esta es la posición inicial.","Con los tríceps, baja la cuerda llevando cada extremo hacia el costado de los muslos, hasta estirar los brazos. Brazos fijos; solo se mueven los antebrazos. Bota el aire.","Tras un segundo, sube lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Triceps Pushdown - Rope Attachment","ines":1,"f":"push","m":"i"},"fdb-Triceps_Pushdown_-_V-Bar_Attachment":{"nombre":"Pushdown de tríceps con agarre en V","grupos":["triceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un agarre en V en una polea alta y tómalo en prono al ancho de hombros.","De pie, torso recto con una leve inclinación adelante, brazos pegados al cuerpo y perpendiculares al suelo, antebrazos hacia la polea y pulgares más altos que los meñiques. Esta es la posición inicial.","Con los tríceps, baja el agarre hasta tocar el frente de los muslos con los brazos estirados. Brazos fijos; solo se mueven los antebrazos. Bota el aire.","Tras un segundo, sube lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Triceps Pushdown - V-Bar Attachment","ines":1,"f":"push","m":"i"},"fdb-Triceps_Stretch":{"nombre":"Estiramiento de tríceps","grupos":["triceps"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Reach your hand behind your head, grasp your elbow and gently pull. Hold for 10 to 20 seconds, then switch sides."],"en":"Triceps Stretch","f":"static","m":"i","sec":["dorsales"]},"fdb-Tuck_Crunch":{"nombre":"Crunch con piernas recogidas","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con la espalda pegada al suelo y los brazos a los lados, palmas abajo.","Cruza los tobillos y sube las piernas hasta que los muslos queden perpendiculares al suelo, con leve flexión de rodilla.","Cruza los brazos sobre el pecho. Esta es la posición inicial.","Con la zona lumbar pegada al suelo, sube lento el torso botando el aire.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Tuck Crunch","ines":1,"f":"pull","m":"i"},"fdb-Two-Arm_Dumbbell_Preacher_Curl":{"nombre":"Curl Scott con dos mancuernas","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Toma una mancuerna en cada mano y apoya los brazos sobre un banco Scott o inclinado, con las mancuernas a la altura de los hombros. Esta es la posición inicial.","Inspirando, baja lento hasta estirar los brazos y los bíceps por completo.","Botando el aire, sube con los bíceps hasta la altura de los hombros.","Aprieta fuerte un segundo y repite las repeticiones indicadas."],"en":"Two-Arm Dumbbell Preacher Curl","ines":1,"f":"pull","m":"i"},"fdb-Two-Arm_Kettlebell_Clean":{"nombre":"Clean con dos kettlebells","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon dos kettlebells entre los pies. Lleva la cadera atrás y mira al frente.","Haz clean a los hombros extendiendo piernas y cadera, girando las muñecas al recibirlas.","Bájalas a la posición inicial y repite."],"en":"Two-Arm Kettlebell Clean","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios","trapecio"]},"fdb-Two-Arm_Kettlebell_Jerk":{"nombre":"Envión con dos kettlebells en sentadilla","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Haz clean de dos kettlebells a los hombros extendiendo piernas y cadera, girando las muñecas para que las palmas miren al frente. Baja unos centímetros y sube rápido llevando ambas kettlebells arriba. Justo después del empuje, vuelve a bajar en sentadilla para meterte bajo ellas. Con las kettlebells bloqueadas, ponte de pie."],"en":"Two-Arm Kettlebell Jerk","ines":1,"f":"push","m":"c","sec":["cuadriceps","gemelos","triceps"]},"fdb-Two-Arm_Kettlebell_Military_Press":{"nombre":"Press militar con dos kettlebells","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Haz clean de dos kettlebells a los hombros extendiendo piernas y cadera, girando las muñecas para que las palmas miren al frente.","Empújalas arriba y afuera. Al pasar la cabeza, métete bajo ellas para que queden bloqueadas un poco detrás de la cabeza. Contrae dorsales, glúteos y abdomen para más estabilidad."],"en":"Two-Arm Kettlebell Military Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Two-Arm_Kettlebell_Row":{"nombre":"Remo con dos kettlebells","grupos":["dorsales"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon dos kettlebells frente a los pies. Flecta levemente las rodillas y lleva la cadera atrás lo más posible al inclinarte.","Toma ambas kettlebells y tíralas hacia el abdomen juntando las escápulas y flectando los codos, con la espalda recta. Baja y repite."],"en":"Two-Arm Kettlebell Row","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Underhand_Cable_Pulldowns":{"nombre":"Jalón supino en polea","grupos":["dorsales"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina de jalón con barra ancha en la polea alta. Ajusta el cojín de las rodillas para que la carga no te levante.","Toma la barra con las palmas hacia ti (supino), con las manos más juntas que los hombros.","Con los brazos estirados, inclina el torso unos 30° atrás, saca pecho y deja una leve curva lumbar. Esta es la posición inicial.","Botando el aire, baja la barra hasta la parte alta del pecho llevando hombros y brazos abajo y atrás, con los codos cerca del cuerpo. Aprieta la espalda; el torso no se mueve y los antebrazos solo sostienen.","Tras un segundo, inspira y sube lento hasta estirar los brazos y los dorsales.","Repite las repeticiones indicadas."],"en":"Underhand Cable Pulldowns","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Upper_Back-Leg_Grab":{"nombre":"Estiramiento de espalda alta tomando las piernas","grupos":["isquios"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["While seated, bend forward to hug your thighs from underneath with both arms.","Keep your knees together and your legs extended out as you bring your chest down to your knees. You can also stretch your middle back by pulling your back away from your knees as your hugging them."],"en":"Upper Back-Leg Grab","f":"static","sec":["dorsales","espalda_baja"]},"fdb-Upper_Back_Stretch":{"nombre":"Estiramiento de espalda alta","grupos":["dorsales"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Clasp fingers together with your thumbs pointing down, round your shoulders as you reach your hands forward."],"en":"Upper Back Stretch","f":"static"},"fdb-Upright_Barbell_Row":{"nombre":"Remo al mentón con barra","grupos":["hombros"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Toma una barra en prono, algo más estrecho que los hombros, apoyada en los muslos, brazos estirados con leve flexión de codo y espalda recta. Esta es la posición inicial.","Bota el aire y sube la barra con los deltoides laterales, llevando los codos arriba y a los lados, pegada al cuerpo, hasta casi tocar el mentón. Los codos guían y siempre van más altos que los antebrazos. Torso quieto; pausa un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Upright Barbell Row","ines":1,"f":"pull","m":"c","sec":["trapecio"]},"fdb-Upright_Cable_Row":{"nombre":"Remo al mentón en polea","grupos":["trapecio"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Toma la barra recta de una polea baja en prono, algo más estrecho que los hombros, apoyada en los muslos, brazos estirados con leve flexión de codo y espalda recta. Esta es la posición inicial.","Sube la barra con los deltoides laterales, pegada al cuerpo, hasta casi tocar el mentón, botando el aire. Los codos guían y siempre van más altos que los antebrazos. Torso quieto; pausa un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Upright Cable Row","ines":1,"f":"pull","m":"c","sec":["hombros"]},"fdb-Upright_Row_-_With_Bands":{"nombre":"Remo al mentón con bandas","grupos":["trapecio"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Párate sobre una banda de modo que tenga tensión con los brazos estirados. Toma los agarres en prono, algo más estrecho que los hombros, sobre los muslos, brazos estirados con leve flexión de codo y espalda recta. Esta es la posición inicial.","Sube los agarres con los deltoides laterales, pegados al cuerpo, hasta casi tocar el mentón, botando el aire. Los codos guían y siempre van más altos que los antebrazos. Torso quieto; pausa un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Upright Row - With Bands","ines":1,"f":"pull","m":"c","sec":["hombros"]},"fdb-Upward_Stretch":{"nombre":"Estiramiento hacia arriba","grupos":["hombros"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Extend both hands straight above your head, palms touching.","Slowly push your hands up and back, keeping your back straight."],"en":"Upward Stretch","f":"static","sec":["dorsales","pectoral"]},"fdb-V-Bar_Pulldown":{"nombre":"Jalón con agarre en V","grupos":["dorsales"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Siéntate en la máquina de jalón con un agarre en V en la polea alta.","Ajusta el cojín de las rodillas para que la carga no te levante.","Toma el agarre en neutro. Saca pecho e inclínate unos 30° atrás para activar mejor los dorsales. Esta es la posición inicial.","Con los dorsales, baja el agarre juntando las escápulas hasta que el pecho casi lo toque, botando el aire. Torso quieto.","Tras un segundo, sube lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"V-Bar Pulldown","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-V-Bar_Pullup":{"nombre":"Dominada con agarre en V","grupos":["dorsales"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Pon el centro de un agarre en V al centro de la barra de dominadas (si no hay agarres neutros), con los mangos hacia abajo para colgarte de ellos.","Con el agarre firme, cuelga tomando un mango con cada mano. Saca pecho e inclínate un poco atrás. Esta es la posición inicial.","Sube con los dorsales inclinando la cabeza un poco atrás para no golpearte, hasta que el pecho casi toque el agarre, botando el aire.","Tras un segundo, baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"V-Bar Pullup","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Vertical_Swing":{"nombre":"Swing vertical","grupos":["isquios"],"eq":"Mancuernas","niv":"Principiante","cat":"Pliometría","inst":["Allow the dumbbell to hang at arms length between your legs, holding it with both hands. Keep your back straight and your head up.","Swing the dumbbell between your legs, flexing at the hips and bending the knees slightly.","Powerfully reverse the motion by extending at the hips, knees, and ankles to propel yourself upward, swinging the dumbell over your head.","As you land, absorb the impact through your legs and draw the dumbbell to your torso before the next repetition."],"en":"Vertical Swing","f":"pull","m":"c","sec":["cuadriceps","gluteos","hombros"]},"fdb-Walking_Treadmill":{"nombre":"Caminar en trotadora","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Cardio","inst":["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than walking outside. When walking, you should move at a moderate to fast pace, not a leisurely one. Being an activity of lower intensity, walking doesn't burn as many calories as some other activities, but still provides great benefit. A 150 lb person will burn about 175 calories walking 4 miles per hour for 30 minutes, compared to 450 calories running twice as fast. Maintain proper posture as you walk, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."],"en":"Walking, Treadmill","sec":["gemelos","gluteos","isquios"]},"fdb-Weighted_Ball_Hyperextension":{"nombre":"Hiperextensión con peso en fitball","grupos":["espalda_baja"],"eq":"Fitball","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate boca abajo sobre un fitball con el torso apoyado y paralelo al suelo, con la parte delantera de los pies en el suelo para equilibrarte. Sostén un disco bajo el mentón o detrás del cuello. Esta es la posición inicial.","Sube lento el torso extendiendo la zona lumbar, botando el aire.","Sostén un segundo y baja a la posición inicial inspirando.","Repite las repeticiones indicadas en tu programa."],"en":"Weighted Ball Hyperextension","ines":1,"f":"pull","m":"c","sec":["dorsales","gluteos","isquios"]},"fdb-Weighted_Ball_Side_Bend":{"nombre":"Inclinación lateral con peso en fitball","grupos":["core"],"eq":"Fitball","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate de lado sobre un fitball con el lado izquierdo del torso (cintura, cadera y hombro) apoyado.","Pies en el suelo con las piernas cruzadas. Sostén un disco con la mano derecha junto al lado derecho de la cabeza, con la cara lisa hacia ella.","Cruza el brazo izquierdo sobre el torso con la palma sobre los oblicuos, codo a 90°. Esta es la posición inicial.","Sube el costado del torso flectando lateralmente la cintura, botando el aire.","Sostén un segundo y baja lento inspirando.","Repite las repeticiones indicadas.","Cambia de lado y repite."],"en":"Weighted Ball Side Bend","ines":1,"f":"pull","m":"i"},"fdb-Weighted_Bench_Dip":{"nombre":"Fondos en banco con peso","grupos":["triceps"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Necesitas un banco detrás de ti y otro al frente, ambos perpendiculares al cuerpo. Apóyate en el borde del banco de atrás con las manos cerca del cuerpo, al ancho de hombros y brazos estirados.","Piernas estiradas sobre el banco de adelante, paralelas al suelo, con el torso vertical. Pide a un compañero que te ponga la mancuerna sobre los muslos; hacerlo solo es difícil y riesgoso. Esta es la posición inicial.","Baja lento flectando los codos hasta quedar algo por debajo de 90°, inspirando. Codos cerca y antebrazos hacia abajo.","Sube con los tríceps hasta la posición inicial, botando el aire.","Repite las repeticiones indicadas."],"en":"Weighted Bench Dip","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Weighted_Crunches":{"nombre":"Crunch con peso","grupos":["core"],"eq":"Balón medicinal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con los pies en el suelo o sobre un banco con las rodillas a 90°.","Sostén una carga al pecho o estirada sobre el torso. Esta es la posición inicial.","Bota el aire y despega lento los hombros unos 10 cm, con la zona lumbar en el suelo.","Arriba, contrae el abdomen y pausa brevemente.","Inspira y baja lento a la posición inicial."],"en":"Weighted Crunches","ines":1,"f":"pull","m":"i"},"fdb-Weighted_Jump_Squat":{"nombre":"Sentadilla con salto con peso","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Apoya una barra liviana en la parte alta de la espalda (o usa un chaleco lastrado, saco u otra carga).","La carga debe ser liviana para no frenarte mucho. Pies un poco más separados que los hombros, cabeza y pecho arriba. Esta es la posición inicial.","Con un contramovimiento, baja parcialmente en sentadilla e invierte de inmediato saltando explosivo, extendiendo cadera, rodillas y tobillos, con buena postura.","Al caer, absorbe el impacto con las piernas."],"en":"Weighted Jump Squat","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios"]},"fdb-Weighted_Pull_Ups":{"nombre":"Dominadas lastradas","grupos":["dorsales"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Engancha una carga a un cinturón de fondos alrededor de la cintura. Toma la barra con las palmas al frente; para agarre medio, al ancho de hombros, con los brazos estirados.","Inclina el torso unos 30° atrás, saca pecho y deja una leve curva lumbar. Esta es la posición inicial.","Bota el aire y sube hasta que la cabeza pase las manos, llevando las escápulas atrás y abajo.","Tras un momento arriba, inspira y baja lento hasta estirar los brazos y los dorsales."],"en":"Weighted Pull Ups","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Weighted_Sissy_Squat":{"nombre":"Sentadilla sissy con peso","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Fuerza","inst":["De pie, pies al ancho de hombros y en puntas de pie, afírmate con una mano de un rack y con la otra sostén un disco sobre el pecho. Esta es la posición inicial.","Con una mano afirmándote, flecta las rodillas y baja el torso llevando pelvis y rodillas hacia adelante, inspirando, hasta que muslo y pierna formen casi 90°. Sostén un segundo.","Sube con los muslos hasta la posición inicial, botando el aire.","Repite las repeticiones indicadas."],"en":"Weighted Sissy Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Weighted_Sit-Ups_-_With_Bands":{"nombre":"Abdominales con bandas","grupos":["core"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Amarra las bandas a la base de un banco declinado, con los agarres hacia adentro para alcanzarlos acostado.","Fija las piernas en el banco y toma los agarres en prono. Llévalos cerca de las clavículas y gira las muñecas a neutro. Los brazos no se mueven. Esta es la posición inicial.","Sube el torso hasta quedar perpendicular al suelo, botando el aire. Sostén un segundo y baja a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Weighted Sit-Ups - With Bands","ines":1,"f":"pull","m":"i"},"fdb-Weighted_Squat":{"nombre":"Sentadilla con cinturón lastrado","grupos":["cuadriceps"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Pon dos bancos planos separados al ancho de hombros. Súbete a ellos con un cinturón lastrado en la cintura, con la carga que te acomode. Puntas de los pies hacia afuera.","De pie, con la carga colgando entre las piernas y los brazos estirados a los costados. Esta es la posición inicial.","Baja flectando las rodillas con la postura erguida, hasta quedar algo bajo el paralelo, inspirando. Las rodillas siguen la dirección de las puntas de los pies.","Sube empujando con todo el pie hasta la posición inicial, botando el aire.","Repite las repeticiones indicadas."],"en":"Weighted Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Wide-Grip_Barbell_Bench_Press":{"nombre":"Press banca abierto con barra","grupos":["pectoral"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate en un banco plano con los pies firmes. Con agarre prono ancho (unos 8 cm más afuera que los hombros por lado), saca la barra y sostenla sobre ti con los brazos estirados. Esta es la posición inicial.","Inspirando, baja lento hasta sentir la barra en la mitad del pecho.","Tras una pausa, empuja con el pecho botando el aire. Bloquea, aprieta un segundo y vuelve a bajar lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas."],"en":"Wide-Grip Barbell Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Wide-Grip_Decline_Barbell_Bench_Press":{"nombre":"Press declinado abierto con barra","grupos":["pectoral"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate en un banco declinado con los pies fijos. Con agarre prono ancho (unos 8 cm más afuera que los hombros por lado), saca la barra y sostenla sobre ti con los brazos estirados. Esta es la posición inicial.","Inspirando, baja lento hasta sentir la barra en la parte baja del pecho.","Tras una pausa, empuja con el pecho botando el aire. Bloquea, aprieta un segundo y vuelve a bajar lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas."],"en":"Wide-Grip Decline Barbell Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Wide-Grip_Decline_Barbell_Pullover":{"nombre":"Pullover declinado abierto con barra","grupos":["pectoral"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate en un banco declinado con las piernas fijas. Toma la barra detrás de la cabeza en prono, más ancho que los hombros, y súbela del suelo con los brazos.","Brazos estirados y perpendiculares al suelo. Esta es la posición inicial.","Baja la barra en semicírculo hacia atrás, como si fueras a dejarla en el suelo, y detente cuando los brazos queden paralelos al suelo. Brazos siempre estirados; solo se mueve el hombro. Inspira.","Sube la barra a la posición inicial botando el aire, con control total.","Repite las repeticiones indicadas.","Al terminar, baja lento la barra hasta la altura de la cabeza y suéltala."],"en":"Wide-Grip Decline Barbell Pullover","ines":1,"f":"pull","m":"c","sec":["hombros","triceps"]},"fdb-Wide-Grip_Lat_Pulldown":{"nombre":"Jalón al pecho abierto","grupos":["dorsales"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina de jalón con barra ancha en la polea alta. Ajusta el cojín de las rodillas para que la carga no te levante.","Toma la barra con las palmas al frente y el agarre indicado: ancho (más que los hombros), medio (al ancho de hombros) o cerrado (más estrecho).","Con los brazos estirados, inclina el torso unos 30° atrás, saca pecho y deja una leve curva lumbar. Esta es la posición inicial.","Botando el aire, baja la barra hasta la parte alta del pecho llevando hombros y brazos abajo y atrás. Aprieta la espalda; el torso no se mueve y los antebrazos solo sostienen.","Tras un segundo con las escápulas juntas, sube lento hasta estirar los brazos y los dorsales, inspirando.","Repite las repeticiones indicadas."],"en":"Wide-Grip Lat Pulldown","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Wide-Grip_Pulldown_Behind_The_Neck":{"nombre":"Jalón tras nuca abierto","grupos":["dorsales"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Siéntate en la máquina de jalón con barra ancha en la polea alta. Ajusta el cojín de las rodillas para que la carga no te levante.","Toma la barra con las palmas al frente y el agarre indicado: ancho, medio o cerrado.","Con los brazos estirados, inclina torso y cabeza adelante, de modo que la barra quede alineada con la nuca. Esta es la posición inicial.","Botando el aire, baja la barra hasta tocar la nuca llevando hombros y brazos abajo y atrás. Aprieta la espalda; el torso no se mueve y los antebrazos solo sostienen.","Tras un segundo con las escápulas juntas, sube lento hasta estirar los brazos y los dorsales, inspirando.","Repite las repeticiones indicadas."],"en":"Wide-Grip Pulldown Behind The Neck","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Wide-Grip_Rear_Pull-Up":{"nombre":"Dominada tras nuca abierta","grupos":["dorsales"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Toma la barra con las palmas al frente y agarre ancho.","Con los brazos estirados, inclina torso y cabeza adelante, de modo que la barra quede alineada con la nuca. Esta es la posición inicial.","Sube hasta que la barra quede cerca de la nuca, llevando hombros y brazos abajo y atrás con la cabeza un poco adelante, botando el aire. Aprieta la espalda; solo se mueven los brazos.","Tras un segundo, inspira y baja lento hasta estirar los brazos y los dorsales.","Repite las repeticiones indicadas."],"en":"Wide-Grip Rear Pull-Up","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Wide-Grip_Standing_Barbell_Curl":{"nombre":"Curl de pie con barra agarre abierto","grupos":["biceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie, erguido, toma una barra por la parte ancha, palmas al frente y codos cerca del torso. Esta es la posición inicial.","Sin mover los brazos, sube la barra contrayendo el bíceps, botando el aire. Solo se mueven los antebrazos.","Sube hasta que la barra llegue a los hombros y aprieta fuerte un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Wide-Grip Standing Barbell Curl","ines":1,"f":"pull","m":"i"},"fdb-Wide_Stance_Barbell_Squat":{"nombre":"Sentadilla con barra pies abiertos","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack. Pon la barra a la altura adecuada, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con ambas manos y sácala empujando con las piernas mientras enderezas el torso.","Aléjate del rack con los pies más separados que los hombros y las puntas levemente afuera. Mira al frente y mantén la espalda neutra. Esta es la posición inicial.","Baja lento flectando las rodillas con el torso firme, hasta quedar bajo el paralelo, inspirando. Las rodillas siguen la dirección de las puntas de los pies.","Sube botando el aire, empujando el suelo con todo el pie.","Repite las repeticiones indicadas."],"en":"Wide Stance Barbell Squat","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios"]},"fdb-Wide_Stance_Stiff_Legs":{"nombre":"Peso muerto piernas rígidas pies abiertos","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Empieza con una barra cargada en el suelo. Separa bien los pies y flecta la cadera para tomar la barra, con la cadera lo más atrás posible y las piernas casi rectas. Espalda recta, cabeza y pecho arriba. Esta es la posición inicial.","Lleva la cadera adelante con los brazos colgando rectos hasta quedar de pie, y vuelve lento a la posición inicial. En las repeticiones siguientes la barra no necesita tocar el suelo."],"en":"Wide Stance Stiff Legs","ines":1,"f":"pull","m":"c","sec":["aductores","espalda_baja","gluteos"]},"fdb-Wind_Sprints":{"nombre":"Sprints colgado","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Cuelga de la barra con agarre prono, brazos y piernas estirados. Esta es la posición inicial.","Sube rápido una rodilla lo más alto que puedas, sin balancear el cuerpo ni las piernas.","Bájala de inmediato mientras subes la otra rodilla lo más alto posible.","Alterna hasta completar la serie."],"en":"Wind Sprints","ines":1,"f":"pull","m":"c"},"fdb-Windmills":{"nombre":"Molinos","grupos":["abductores"],"eq":"","niv":"Intermedio","cat":"Elongación","inst":["Lie on your back with your arms extended out to the sides and your legs straight. This will be your starting position.","Lift one leg and quickly cross it over your body, attempting to touch the ground near the opposite hand.","Return to the starting position, and repeat with the opposite leg. Continue to alternate for 10-20 repetitions."],"en":"Windmills","f":"pull","sec":["espalda_baja","gluteos","isquios"]},"fdb-Worlds_Greatest_Stretch":{"nombre":"El mejor estiramiento del mundo","grupos":["isquios"],"eq":"","niv":"Intermedio","cat":"Elongación","inst":["This is a three-part stretch. Begin by lunging forward, with your front foot flat on the ground and on the toes of your back foot. With your knees bent, squat down until your knee is almost touching the ground. Keep your torso erect, and hold this position for 10-20 seconds.","Now, place the arm on the same side as your front leg on the ground, with the elbow next to the foot. Your other hand should be placed on the ground, parallel to your lead leg, to help support you during this portion of the stretch.","After 10-20 seconds, place your hands on either side of your front foot. Raise the toes of the front foot off of the ground, and straighten your leg. You may need to reposition your rear leg to do so. Hold for 10-20 seconds, and then repeat the entire sequence for the other side."],"en":"World's Greatest Stretch","f":"static","sec":["cuadriceps","gemelos","gluteos"]},"fdb-Wrist_Circles":{"nombre":"Círculos de muñeca","grupos":["antebrazos"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["Start by standing straight with your feet being shoulder width apart from each other. Elevate your arms to the side of you until they are fully extended and parallel to the floor at a height that is evenly aligned with your shoulders. Tip: Your torso and arms should form the letter \"T: Your palms should be facing down. This is the starting position.","Keeping your entire body stationary except for the wrists, begin to rotate both wrists forward in a circular motion. Tip: Pretend that you are trying to draw circles by using your hands as the brush. Breathe normally as you perform this exercise.","Repeat for the recommended amount of repetitions."],"en":"Wrist Circles","f":"pull","m":"i"},"fdb-Wrist_Roller":{"nombre":"Rodillo de muñeca","grupos":["antebrazos"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["De pie, toma un rodillo de muñeca en prono, pies al ancho de hombros.","Sube los brazos hasta estirarlos al frente, paralelos al suelo, con la cuerda desenrollada. Solo se mueven los antebrazos. Esta es la posición inicial.","Gira las muñecas de a una hacia arriba, enrollando la cuerda hasta subir la carga al rodillo.","Cuando llegue arriba, baja lento girando las muñecas hacia abajo hasta la posición inicial.","Repite las repeticiones indicadas en tu programa."],"en":"Wrist Roller","ines":1,"f":"pull","m":"i","sec":["hombros"]},"fdb-Wrist_Rotations_with_Straight_Bar":{"nombre":"Rotaciones de muñeca con barra","grupos":["antebrazos"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Toma una barra con ambas manos, palmas abajo y al ancho de hombros. Esta es la posición inicial.","Alternando manos, extiende las muñecas como si enrollaras un diario. Sigue alternando hasta el fallo.","Invierte flectando las muñecas en sentido contrario y sigue alternando hasta el fallo."],"en":"Wrist Rotations with Straight Bar","ines":1,"f":"pull","m":"i"},"fdb-Yoke_Walk":{"nombre":"Caminata con yugo","grupos":["cuadriceps"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["El yugo se hace con un aparato de yugo, aunque a veces se usan refrigeradores u otros objetos pesados.","Apoya el aparato en la parte alta de la espalda. Mirando al frente y con la espalda firme, levántalo empujando con los talones.","Camina lo más rápido posible con pasos cortos y rápidos. Puedes sujetar los postes laterales para estabilizarlo. Recorre la distancia indicada, normalmente 20-30 m, lo más rápido posible."],"en":"Yoke Walk","ines":1,"m":"c","sec":["abductores","aductores","core","espalda_baja","gemelos","gluteos","isquios"]},"fdb-Zercher_Squats":{"nombre":"Sentadilla Zercher","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack. Pon la barra entre la cintura y el pecho. Con la barra cargada, junta las manos y apoya la barra en el pliegue de los codos.","Saca la barra apoyada sobre los antebrazos, como si tuvieras los brazos cruzados con una barra encima.","Aléjate del rack, pies al ancho de hombros y puntas levemente afuera. Mira al frente y mantén la espalda neutra. Esta es la posición inicial.","Baja flectando las rodillas con el torso erguido, hasta quedar bajo el paralelo, inspirando. Las rodillas siguen la dirección de las puntas de los pies.","Sube botando el aire, empujando el suelo con todo el pie.","Repite las repeticiones indicadas."],"en":"Zercher Squats","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Zottman_Curl":{"nombre":"Curl Zottman","grupos":["biceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["De pie, erguido, con una mancuerna en cada mano y los brazos colgando, codos cerca del torso.","Palmas enfrentadas. Esta es la posición inicial.","Sin mover los brazos, sube las mancuernas contrayendo el bíceps, botando el aire, girando las muñecas a supino (palmas arriba). Solo se mueven los antebrazos. Sube hasta la altura de los hombros.","Aprieta el bíceps un segundo.","Arriba, gira las muñecas a prono (palmas abajo), con el pulgar más alto que el meñique.","Baja lento en prono.","Cerca de los muslos, gira las muñecas de vuelta a neutro.","Repite las repeticiones indicadas."],"en":"Zottman Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Zottman_Preacher_Curl":{"nombre":"Curl Zottman Scott","grupos":["biceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Toma una mancuerna en cada mano y apoya los brazos sobre un banco Scott o inclinado, con las mancuernas a la altura de los hombros, codos flectados y palmas hacia abajo. Esta es la posición inicial.","Inspirando, baja lento con las palmas abajo hasta estirar los brazos.","Abajo, gira las muñecas para que las palmas miren hacia arriba.","Botando el aire, sube con los bíceps hasta la altura de los hombros. Arriba, el meñique queda más alto que el pulgar.","Aprieta fuerte un segundo y gira las muñecas de nuevo a palmas abajo.","Repite las repeticiones indicadas."],"en":"Zottman Preacher Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"wg-197":{"nombre":"Fondos entre dos bancos","en":"Dips Between Two Benches","grupos":["triceps"],"eq":"Banco","niv":"","cat":"Fuerza","inst":["Esta es una excelente variante de los fondos para aislar y trabajar los tríceps utilizando únicamente bancos y tu peso corporal.","Instrucciones Posición: Coloca dos bancos paralelos entre sí.","Siéntate en uno y apoya las palmas de tus manos en el borde, junto a tu cadera.","Extiende las piernas y apoya los talones sobre el otro banco.","Levanta la cadera del banco, sosteniendo tu peso con los brazos.","Descenso: Manteniendo los codos apuntando hacia atrás, flexiónalos para bajar tu cuerpo de forma controlada hasta que sientas un buen estiramiento en los tríceps (aproximadamente a un ángulo de 90 grados en el codo).","Ascenso: Empuja con fuerza a través de las palmas de tus manos para volver a la posición inicial, contrayendo los tríceps.","Evita extender por completo los codos en la parte alta para mantener la tensión.","(Para hacerlo más difícil, pide a un compañero que coloque un disco sobre tus muslos.","Para hacerlo más fácil, apoya los pies en el suelo con las rodillas flexionadas)."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 3.0"},"wg-477":{"nombre":"Dominadas asistidas en máquina","en":"Pull Ups on Machine","grupos":["dorsales"],"eq":"","niv":"","cat":"Fuerza","inst":["Ajusta la carga de asistencia y apoya las rodillas o los pies en la plataforma.","Toma los agarres y sube hasta pasar el mentón sobre la barra, llevando los codos hacia los costados.","Baja controlado hasta estirar los brazos. Menos asistencia = más difícil."],"ines":1,"src":"wger","autor":"wger.de","lic":"CC-BY-SA 3.0"},"wg-289":{"nombre":"High pull con barra","en":"High Pull","grupos":["hombros"],"eq":"","niv":"","cat":"Fuerza","inst":["Usa una barra liviana, partiendo desde bajo la altura de las rodillas.","Sube la barra de forma explosiva extendiendo la cadera, hasta la altura de los hombros.","Tempo sugerido: 2-1-1-1."],"ines":1,"src":"wger","autor":"Mahoney","lic":"CC-BY-SA 3.0"},"wg-448":{"nombre":"Remo Pendlay","en":"Pendelay Rows","grupos":["dorsales","trapecio"],"eq":"Barra","niv":"","cat":"Fuerza","inst":["Inclínate con la espalda paralela al suelo y la barra en el suelo bajo el pecho.","Toma la barra al ancho de hombros y tírala hacia el pecho sin perder la inclinación; solo se mueven los brazos.","Devuelve la barra al suelo en cada repetición."],"ines":1,"src":"wger","autor":"Nallitnas","lic":"CC-BY-SA 3.0"},"wg-713":{"nombre":"Flexión en la pared","en":"Wall Pushup","grupos":["hombros","pectoral","triceps"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["De pie frente a una pared, apoya las manos a la altura del pecho.","Flecta los codos llevando el pecho a la pared, con el cuerpo recto, y empuja de vuelta."],"ines":1,"src":"wger","autor":"Dexter","lic":"CC-BY-SA 3.0"},"wg-331":{"nombre":"Swing con kettlebell a dos manos","en":"Kettlebell Swings","grupos":["gluteos"],"eq":"Kettlebell","niv":"","cat":"Fuerza","inst":["Toma la kettlebell firme con ambas manos y mantén la espalda plana todo el movimiento.","Con las rodillas “blandas”, lleva la cadera atrás y deja que la kettlebell pase entre las rodillas, flectando la cadera lo más posible sin redondear la espalda.","Lleva la cadera adelante con fuerza hasta quedar erguido y firme. Ese impulso hace que la kettlebell suba al frente; no la levantes con los brazos.","Según la carga y la velocidad de la cadera, llegará más o menos a la altura de los hombros.","Arriba, vuelve a llevar la cadera atrás mientras la kettlebell baja entre las piernas, y repite."],"ines":1,"src":"wger","autor":"J120290,cerin","lic":"CC-BY-SA 3.0"},"wg-445":{"nombre":"Press banca con pausa","en":"Pause Bench","grupos":["pectoral"],"eq":"Barra, Banco","niv":"","cat":"Fuerza","inst":["Baja la barra al pecho y haz una pausa de 2 segundos sin relajarte ni apoyarla.","Empuja de vuelta. Es la pausa que se exige en competencia."],"ines":1,"src":"wger","autor":"Mens Fitness","lic":"CC0"},"wg-31":{"nombre":"Sostén de hacha (axe hold)","en":"Axe Hold","grupos":["biceps"],"eq":"Mancuernas","niv":"","cat":"Fuerza","inst":["Toma un par de mancuernas, extiende los brazos hacia los lados y mantén la posición el mayor tiempo que puedas."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 3.0"},"wg-284":{"nombre":"Pilares de Hércules","en":"Hercules Pillars","grupos":["biceps","triceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Toma dos cables, uno con cada mano, y párate al medio para que ambos tengan tensión.","Sostén la posición con los brazos abiertos el mayor tiempo posible."],"ines":1,"src":"wger","autor":"GrosseHund","lic":"CC-BY-SA 3.0"},"wg-57":{"nombre":"Caminata del oso","en":"Bear Walk 2","grupos":["hombros","gemelos","pectoral","core","triceps"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Instrucciones: Posición Inicial: Colócate en cuatro apoyos (manos y pies) con las manos directamente debajo de los hombros y las rodillas debajo de las caderas.","Desde ahí, levanta las rodillas del suelo unos pocos centímetros, manteniendo la espalda recta y el core activado.","El peso debe estar sobre las palmas de las manos y las puntas de los pies.","Movimiento: Para avanzar, da un paso simultáneo con tu mano derecha y tu pie izquierdo, seguido inmediatamente por un paso con tu mano izquierda y tu pie derecho.","La clave es este movimiento contralateral, como un oso caminando.","Intensidad y Medición: Muévete tan rápido como puedas manteniendo una buena forma.","Las series se miden normalmente por distancia (ej: avanzar 20 o 30 metros) o por tiempo (ej: 45 segundos continuos).","Músculos Trabajados: Es un ejercicio muy completo que involucra: pectorales, deltoides, tríceps, trapecios, dorsales, abdominales y espalda baja (core), flexores de cadera, cuádriceps, glúteos y pantorrillas."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-279":{"nombre":"Hand grip (fortalecedor de agarre)","en":"Hand Grip","grupos":["biceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Esta herramienta, comúnmente llamada \"hand grip\", está diseñada para aislar y desarrollar la fuerza de agarre ( crushing strength ) y los músculos flexores del antebrazo.","Instrucciones Posición: Sostén el \"hand grip\" firmemente en una mano.","Contracción: Aprieta con la máxima fuerza posible, intentando que los dos mangos se toquen.","Concéntrate en la presión que ejercen tus dedos y la palma de tu mano.","Regreso: Sostén la contracción por uno o dos segundos y luego abre la mano de forma lenta y controlada.","Es crucial resistir la tensión del resorte en la fase de apertura para trabajar el músculo de forma completa."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-604":{"nombre":"Peso muerto de velocidad","en":"Speed Deadlift","grupos":["cuadriceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Peso muerto con carga submáxima, levantando lo más rápido posible y con descansos cortos (menos de 1 minuto) entre series."],"ines":1,"src":"wger","autor":"MrSteele","lic":"CC-BY-SA 4.0"},"wg-124":{"nombre":"Sentadilla con disco al frente","en":"Braced Squat","grupos":["cuadriceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Sostén un disco frente al pecho con los brazos estirados o flectados.","Baja en sentadilla con el torso erguido y sube empujando con todo el pie."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-182":{"nombre":"Colgado pasivo en barra (dead hang)","en":"Deadhang","grupos":["biceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Cuelga de una barra con los brazos estirados y el cuerpo relajado.","Sostén el tiempo indicado. Sirve para agarre y descompresión de hombros."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-132":{"nombre":"Burpees","en":"Burpees","grupos":["pectoral"],"eq":"","niv":"","cat":"Fuerza","inst":["El burpee es uno de los ejercicios de acondicionamiento metabólico más completos, combinando fuerza de empuje, potencia de piernas y alta exigencia cardiovascular.","La secuencia del movimiento completo es: Agáchate y apoya las manos en el suelo.","Salta hacia atrás a una posición de plancha y realiza una flexión de pecho (el pecho toca el suelo).","Salta hacia adelante para volver a la posición de cuclillas.","Termina con un salto vertical explosivo, usualmente con un aplauso sobre la cabeza.","Esa es una repetición.","El ejercicio se realiza de forma continua y fluida."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-711":{"nombre":"Pino contra la pared","en":"Wall Handstand","grupos":["hombros"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Flexiones a pino contra ma pared (pecho cara a la pared).","Progresión de las flexiones a pino.","Ideal para ganar fuerza en deltoides"],"ines":1,"src":"wger","autor":"Nash","lic":"CC-BY-SA 4.0"},"wg-454":{"nombre":"Flexiones pica","en":"Pike Push Ups","grupos":["pectoral"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Posición de mirada fija: Perro mirando hacia abajo:Tu cuerpo debe hacer una forma de V, con la espalda, los brazos y las piernas rectas.","Las caderas deben estar en el aire.Puedes llegar a esta posición caminando con las manos hacia atrás desde una plancha alta.","Pasos: 1.Dobla los codos hacia los lados, manteniendo la espalda y las piernas rectas y acercando la cabeza al suelo.","Estira los brazos, empujando las caderas hacia atrás y manteniendo la espalda y las piernas rectas.","Repite la operación."],"ines":1,"src":"wger","autor":"Nash","lic":"CC-BY-SA 4.0"},"wg-297":{"nombre":"Hollow hold (cuerpo hueco)","en":"Hollow Hold","grupos":["core"],"eq":"Colchoneta, Peso corporal","niv":"","cat":"Fuerza","inst":["Acuéstate de espaldas en una colchoneta.","Contrae el abdomen y sube piernas, cabeza y hombros con los brazos estirados sobre la cabeza.","Mantén la zona lumbar pegada al suelo y sostén."],"ines":1,"src":"wger","autor":"Behrooz","lic":"CC0"},"wg-718":{"nombre":"Sentadilla isométrica en pared","en":"Wall Squat","grupos":["isquios","cuadriceps"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Apóyese en la pared, mirando hacia adelante y con los pies plantados firmemente en el suelo, sus hombros deben separarse y estar a 50 centímetros de la pared Deslízate por la pared, manteniendo la espalda presionada a ella, hasta que las piernas estén en ángulo recto.","Las rodillas deben estar directamente sobre los tobillosEl dolor en el cuádriceps es normal, deténgase si siente dolor en la rodilla o en la rótula"],"ines":1,"src":"wger","autor":"Blablabla","lic":"CC0"},"wg-397":{"nombre":"Sentadilla al cajón bajo con pies abiertos","en":"Low Box Squat - Wide Stance","grupos":["gluteos","cuadriceps"],"eq":"Barra","niv":"","cat":"Fuerza","inst":["Saca la barra y separa bien los pies, más allá de la cadera.","Lleva la cadera atrás y siéntate en un cajón que te deje bajo el paralelo. Siéntate por completo, sin rebotar.","Levántate de forma explosiva, con la espalda alta y el torso firmes todo el movimiento."],"ines":1,"src":"wger","autor":"taylorbarbell","lic":"CC-BY-SA 4.0"},"wg-650":{"nombre":"Thruster con barra","en":"Thruster","grupos":["hombros"],"eq":"Barra","niv":"","cat":"Fuerza","inst":["Haz una sentadilla frontal.","Al subir, aprovecha el impulso para empujar la barra sobre la cabeza.","Baja la barra a los hombros y repite."],"ines":1,"src":"wger","autor":"BeLikeWater","lic":"CC0"},"wg-500":{"nombre":"Plancha invertida","en":"Reverse Plank","grupos":["core"],"eq":"","niv":"","cat":"Fuerza","inst":["Siéntate con las piernas estiradas y las manos apoyadas detrás de la cadera.","Sube la cadera hasta formar una línea recta de hombros a talones, con el abdomen hacia el techo, y sostén."],"ines":1,"src":"wger","autor":"spacetowaste","lic":"CC-BY-SA 4.0"},"wg-468":{"nombre":"Retracción escapular boca abajo","en":"Prone Scapular Retraction - Arms at Side","grupos":["trapecio"],"eq":"","niv":"","cat":"Fuerza","inst":["Acuéstate boca abajo con la frente sobre una toalla y los brazos estirados a los lados.","Sube lento los brazos juntando las escápulas y sostén 3 segundos.","Baja controlado y repite."],"ines":1,"src":"wger","autor":"donaddon","lic":"CC-BY-SA 4.0"},"wg-716":{"nombre":"Deslizamientos en pared (wall slides)","en":"Wall Slides","grupos":["biceps","isquios","pectoral","trapecio","triceps"],"eq":"Peso corporal","niv":"","cat":"Elongación","inst":["Párate con talones, cadera, espalda y nuca contra la pared.","Brazos a los lados con los codos a 90°, apoyados en la pared.","Estira los brazos hacia arriba deslizándolos por la pared, como un press, sin despegar la espalda ni arquearte. Vuelve y repite."],"ines":1,"src":"wger","autor":"Whythebigpaws","lic":"CC-BY-SA 4.0"},"wg-632":{"nombre":"Sentadilla sumo","en":"Sumo Squats","grupos":["gluteos","cuadriceps"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Pies más separados que los hombros, puntas a unos 45° y la barra en la espalda.","Con la espalda recta, baja flectando rodillas y cadera hasta que los muslos queden paralelos al suelo.","Sube empujando con todo el pie, con el peso repartido entre talón y antepié."],"ines":1,"src":"wger","autor":"sophialj","lic":"CC-BY-SA 4.0"},"wg-291":{"nombre":"Sentadilla hindú","en":"Hindu Squats","grupos":["cuadriceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Esta es una sentadilla fluida y dinámica con peso corporal, enfocada en la resistencia, el equilibrio y un rango de movimiento completo, a diferencia de una sentadilla tradicional con peso.","Instrucciones Posición Inicial: De pie, con los pies separados al ancho de los hombros y los brazos a los costados o ligeramente detrás de la espalda.","Descenso: Inicia el descenso y, al mismo tiempo, levanta los talones del suelo.","Baja a una sentadilla profunda mientras balanceas los brazos hacia atrás.","Mantén el torso lo más vertical posible.","Ascenso: Sube de forma explosiva, balanceando los brazos hacia adelante y hacia arriba para generar impulso.","Los talones deben volver a apoyarse en el suelo justo al final del movimiento, cuando estás completamente de pie."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-320":{"nombre":"Jumping jacks","en":"Jumping Jacks","grupos":["cuadriceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Párese con los pies juntos y los brazos a los lados Salte a una posición con las piernas abiertas y las manos tocandose por encima de la cabeza Repita"],"ines":1,"src":"wger","autor":"student1234","lic":"CC-BY-SA 4.0"},"wg-702":{"nombre":"Elevación de gemelos a una pierna","en":"Calf raises, one legged","grupos":["gemelos"],"eq":"","niv":"","cat":"Fuerza","inst":["Párate en un escalón sobre la parte delantera de un pie, afirmándote de algo.","Sube el talón lo más alto posible, sostén un segundo y baja hasta estirar la pantorrilla.","Completa las repeticiones y cambia de pierna."],"ines":1,"src":"wger","autor":"McMarcel13","lic":"CC-BY-SA 4.0"},"wg-386":{"nombre":"Flexiones diamante","en":"Diamond push ups","grupos":["pectoral"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Ponte en posición de flexión con las manos juntas bajo el pecho, formando un rombo con pulgares e índices.","Baja con los codos pegados al cuerpo y empuja de vuelta. Enfatiza tríceps."],"ines":1,"src":"wger","autor":"notdefine","lic":"CC-BY-SA 4.0"},"wg-346":{"nombre":"Press landmine","en":"Landmine press","grupos":["hombros"],"eq":"Barra","niv":"","cat":"Fuerza","inst":["Sostén el extremo de una barra anclada en un landmine a la altura del hombro.","Empújala hacia arriba y adelante hasta estirar el brazo (o ambos), con el core firme.","Baja controlado al hombro y repite."],"ines":1,"src":"wger","autor":"Torsten Linnecke","lic":"CC-BY-SA 4.0"},"wg-909":{"nombre":"Curl nórdico inverso","en":"Reverse Nordic Curl","grupos":["cuadriceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Arrodíllate con los tobillos asegurados por un compañero o un objeto fijo.","Manteniendo una línea recta desde las rodillas hasta la cabeza, inclínate lentamente hacia atrás, controlando el movimiento con tus cuádriceps.","Usa la misma fuerza para volver a la posición inicial.","Es una alternativa muy efectiva a la máquina de extensión de piernas."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-959":{"nombre":"Remo en TRX","en":"TRX Rows","grupos":["hombros","biceps","dorsales"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Ejercicio clave para construir la fuerza necesaria para las dominadas (pull-ups).","Sujeta las agarraderas del TRX e inclínate hacia atrás, manteniendo el cuerpo en una línea recta.","Desde ahí, jala tu pecho hacia tus manos, contrayendo fuertemente los músculos de la espalda.","La dificultad del ejercicio se ajusta con el ángulo de tu cuerpo: mientras más horizontal estés, más difícil será."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-975":{"nombre":"Curl con kettlebell a una mano","en":"one-handed kettlebell curls","grupos":["biceps"],"eq":"Kettlebell","niv":"","cat":"Fuerza","inst":["De pie, sostén una kettlebell en una mano con el brazo totalmente extendido.","Comienza el movimiento flexionando el codo y levantando la pesa hasta que tu mano alcance la altura del hombro, contrayendo fuertemente el bíceps.","Para realizar el ejercicio correctamente, evita impulsarte con la espalda o balancear el cuerpo; el codo debe permanecer relativamente fijo a un costado de tu torso.","El movimiento debe ser controlado, enfocándose únicamente en la fuerza del brazo."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-980":{"nombre":"Dominadas comando","en":"commando pull-ups","grupos":["hombros","biceps","dorsales","trapecio"],"eq":"Barra de dominadas","niv":"","cat":"Fuerza","inst":["Variación del ejercicio de dominadas (pull-ups).","Se realiza con un agarre mixto, con una mano en supinación y la otra en pronación.","No gires el torso para volver al frente; la cabeza pasa una vez por un lado de la barra y la siguiente vez por el otro."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-983":{"nombre":"Rodillas arriba (high knees)","en":"High knees","grupos":[],"eq":"Peso corporal","niv":"","cat":"Cardio","inst":["Trote en el lugar, con las rodillas tan altas como pueda y cambie de pierna a un ritmo rápido"],"ines":1,"src":"wger","autor":"wger.de","lic":"CC-BY-SA 4.0"},"wg-1003":{"nombre":"Peso muerto con kettlebell","en":"Kettlebell deadlifts","grupos":["dorsales"],"eq":"Kettlebell","niv":"","cat":"Fuerza","inst":["Coloca la pesa rusa entre tus pies.","La clave es mantener la espalda completamente recta y empujar la cadera hacia atrás (es una bisagra de cadera, no una sentadilla) para tomar el agarre.","Desde esa posición, contrae los glúteos y el abdomen para ponerte de pie con fuerza.","Regresa al suelo de la misma manera controlada, iniciando de nuevo con la cadera hacia atrás."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-1006":{"nombre":"Retracción cervical (chin tuck)","en":"Chin tuck","grupos":["dorsales"],"eq":"Peso corporal","niv":"","cat":"Elongación","inst":["Este es un ejercicio postural clave para corregir la postura de \"cabeza adelantada\" y aliviar la tensión en el cuello.","Instrucciones: De pie o sentado con la espalda y el cuello rectos, mira hacia el frente.","Suavemente, lleva tu mentón y tu cabeza rectos hacia atrás, como si intentaras crear una \"papada\", hasta sentir un estiramiento en la nuca.","Es un movimiento horizontal, no debes inclinar la cabeza hacia abajo.","Sostén la posición por 5 segundos, relaja y repite.","Puedes usar tus dedos en el mentón para guiar el movimiento."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-1022":{"nombre":"Remo en plancha a un brazo","en":"Single Arm Plank to Row","grupos":["hombros","biceps","dorsales","core"],"eq":"Kettlebell","niv":"","cat":"Fuerza","inst":["Comienza en una posición de plancha alta (como para hacer una flexión), pero con las manos agarrando unas mancuernas que están apoyadas en el suelo.","Separa los pies un poco más que el ancho de tus caderas para tener una base más estable.","Desde ahí, manteniendo el abdomen y los glúteos apretados para que tu cuerpo no se gire, jala una mancuerna hacia tu costado, llevando el codo hacia el techo.","Haz una pausa arriba, baja la mancuerna de forma controlada y repite el movimiento.","Completa todas las repeticiones de un lado antes de cambiar al otro."],"ines":1,"src":"wger","autor":"wgerjhn","lic":"CC-BY-SA 4.0"},"wg-1028":{"nombre":"Rotación torácica en cuadrupedia","en":"Quadruped thoracic rotation left","grupos":["dorsales"],"eq":"Peso corporal","niv":"","cat":"Elongación","inst":["En cuatro apoyos, rodillas al ancho de hombros. Mano izquierda detrás de la cabeza y la derecha apoyada en el suelo.","Inspirando, lleva el codo izquierdo hacia la mano derecha.","Botando el aire, gira abriendo el codo izquierdo hacia el techo. Repite y cambia de lado."],"ines":1,"src":"wger","autor":"tinman","lic":"CC-BY-SA 4.0"},"wg-1080":{"nombre":"Flexiones hindúes","en":"Hindu Pushups","grupos":["hombros","pectoral"],"eq":"","niv":"","cat":"Fuerza","inst":["Ejercicio para fortalecer los hombros y pectorales.","Su nombre se debe a que se empieza en la postura de Yoga \"Perro boca abajo\", pasando a \"Cobra\" pero sin apoyar las piernas ni torso en el suelo para finalmente acabar con una flexión normal.","El ejercicio también se puede realizar hacia atrás (de vuelta a la postura inicial).","Como variación, tras hacer la flexión, se puede elevar la cadera para volver a la postura del perro boca abajo"],"ines":1,"src":"wger","autor":"Imobard","lic":"CC-BY-SA 4.0"},"wg-1081":{"nombre":"Dislocaciones de hombro con bastón","en":"Shoulder dislocates","grupos":["hombros"],"eq":"","niv":"","cat":"Elongación","inst":["De pie con la espalda recta, toma una banda, toalla o bastón con agarre prono y las manos bien separadas.","Con los brazos estirados, rótalos por sobre la cabeza hasta llevarlos detrás, hacia los glúteos.","Vuelve por el mismo camino hasta adelante. Separa más las manos si no logras pasar con los brazos rectos."],"ines":1,"src":"wger","autor":"tinman","lic":"CC-BY-SA 4.0"},"wg-1082":{"nombre":"Remo inclinado con rotación externa","en":"Bent over row to external rotation","grupos":["dorsales"],"eq":"","niv":"","cat":"Fuerza","inst":["Inclínate apoyando la frente en un respaldo o mesa, con la espalda recta y los brazos colgando.","Sube los codos hasta la altura de los hombros, con los antebrazos colgando a 90°. Sostén.","Rota los antebrazos hacia arriba lo más que puedas y sostén.","Vuelve a la posición anterior, baja los brazos y repite."],"ines":1,"src":"wger","autor":"tinman","lic":"CC-BY-SA 4.0"},"wg-1083":{"nombre":"Y-W-T boca abajo","en":"YWTs","grupos":["dorsales"],"eq":"","niv":"","cat":"Fuerza","inst":["Acuéstate boca abajo con los brazos estirados en “Y” (unos 45°), pulgares arriba.","Despega levemente el pecho y los brazos del suelo y sostén 15-30 segundos.","Sin bajar el pecho, flecta los codos a una “W” y sostén lo mismo.","Abre los brazos en “T”, perpendiculares al cuerpo, y sostén.","Vuelve de T a W y de W a Y. Repite."],"ines":1,"src":"wger","autor":"tinman","lic":"CC-BY-SA 4.0"},"wg-1087":{"nombre":"Power clean colgado con mancuernas","en":"Dumbbell Hang Power Cleans","grupos":["dorsales"],"eq":"Mancuernas","niv":"","cat":"Fuerza","inst":["De pie con una mancuerna a cada lado.","Flecta la cadera bajando las mancuernas a la altura de las rodillas.","Sube con un pequeño salto, usando el impulso para llevar las mancuernas a los hombros.","Ponte de pie, baja controlado a los costados y repite. Rápido y explosivo."],"ines":1,"src":"wger","autor":"philip","lic":"CC-BY-SA 4.0"},"wg-1091":{"nombre":"Plancha con toques de hombro","en":"Plank Shoulder Taps","grupos":["hombros","gluteos","core"],"eq":"Colchoneta","niv":"","cat":"Fuerza","inst":["En la posición de plancha correcta, coloque los pies a una distancia ligeramente superior a la anchura de los hombros.","Levante y toque alternativamente el hombro opuesto con una mano."],"ines":1,"src":"wger","autor":"clafal","lic":"CC-BY-SA 4.0"},"wg-1100":{"nombre":"Wall balls","en":"Wall balls","grupos":["hombros","gluteos","cuadriceps"],"eq":"Fitball","niv":"","cat":"Fuerza","inst":["Toma un balón medicinal, pies al ancho de hombros y frente a una pared.","Baja en sentadilla y, al subir, lanza el balón lo más alto posible contra la pared.","Atrápalo y baja directo a la siguiente sentadilla."],"ines":1,"src":"wger","autor":"philip","lic":"CC-BY-SA 4.0"},"wg-1200":{"nombre":"Elevación de tibial anterior","en":"Tibialis raises","grupos":["gemelos"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Pararse derecho Levantar la punta de los pies, apoyándose sobre el talón."],"ines":1,"src":"wger","autor":"cynomops","lic":"CC-BY-SA 4.0"},"wg-1202":{"nombre":"Abducción de cadera de lado","en":"Side Lying Hip Abduction","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Acuéstate de lado con la pierna de arriba estirada y la de abajo flectada como apoyo.","Sube la pierna de arriba, sostén arriba y baja controlado."],"ines":1,"src":"wger","autor":"wakanda90","lic":"CC-BY-SA 4.0"},"wg-1208":{"nombre":"Sentadilla prisionero","en":"Prisoner Squat","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["De pie, pecho levemente arriba, pies al ancho de cadera y puntas al frente.","Manos detrás de la cabeza con los dedos entrelazados y los codos hacia los lados.","Lleva la cadera atrás y flecta las rodillas con el torso lo más erguido posible, empujando las rodillas hacia afuera.","Mantén los codos a la altura de las orejas apretando entre las escápulas. Baja tanto como puedas sin redondear la espalda.","Sube empujando con talones y glúteos."],"ines":1,"src":"wger","autor":"lxmx","lic":"CC-BY-SA 4.0"},"wg-1214":{"nombre":"Front lever recogido","en":"Front lever tuck","grupos":["hombros","biceps","dorsales"],"eq":"Barra de dominadas","niv":"","cat":"Fuerza","inst":["Colgado de la barra, lleva el cuerpo a horizontal con las rodillas recogidas al pecho y los brazos estirados.","Sostén con escápulas deprimidas y retraídas. Trabaja sobre todo dorsal ancho, redondo mayor, deltoides posterior y bíceps."],"ines":1,"src":"wger","autor":"clafal","lic":"CC-BY-SA 4.0"},"wg-1215":{"nombre":"Ángel de nieve invertido","en":"Reverse Snow Angel","grupos":["trapecio"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Acuéstate boca abajo con los brazos estirados al frente y las piernas estiradas.","Despega los brazos del suelo y llévalos lento hacia los costados, como un ángel de nieve.","Vuelve al frente y repite."],"ines":1,"src":"wger","autor":"mike6426","lic":"CC-BY-SA 4.0"},"wg-1218":{"nombre":"Flexiones de r
