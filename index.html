s"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Stand with your feet shoulder width apart. This will be your starting position.","Begin the movement by flexing your knees and hips, sitting back with your hips.","Continue until you have squatted a portion of the way down, but are above parallel, and quickly reverse the motion until you return to the starting position. Repeat for 5-10 repetitions."],"en":"Sit Squats","f":"push","sec":["abductores","gluteos","isquios"]},"fdb-Skating":{"nombre":"Patinador","grupos":["cuadriceps"],"eq":"Otro","niv":"Intermedio","cat":"Cardio","inst":["Roller skating is a fun activity which can be effective in improving cardiorespiratory fitness and muscular endurance. It requires relatively good balance and coordination. It is necessary to learn the basics of skating including turning and stopping and to wear protective gear to avoid possible injury.","You can skate at a comfortable pace for 30 minutes straight. If you want a cardio challenge, do interval skating — speed skate two minutes of every five minutes, using the remaining three minutes to recover. A 150 lb person will typically burn about 175 calories in 30 minutes skating at a comfortable pace, similar to brisk walking."],"en":"Skating","sec":["abductores","aductores","gemelos","gluteos","isquios"]},"fdb-Sled_Drag_-_Harness":{"nombre":"Arrastre de trineo con arnés","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Strongman","inst":["Carga el trineo y engancha la correa de arrastre. Puedes tirar con agarres, arnés o enganchada a un cinturón.","Ya sea hacia adelante o hacia atrás, inclínate en la dirección del movimiento y avanza extendiendo cadera y rodillas."],"en":"Sled Drag - Harness","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Sled_Overhead_Backward_Walk":{"nombre":"Caminata atrás con trineo sobre la cabeza","grupos":["hombros"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Engancha un doble agarre a un trineo con cuerda o cadena, con carga liviana.","De frente al trineo, retrocede hasta tensar la cuerda. Lleva las manos sobre la cabeza con los codos estirados. Esta es la posición inicial.","Camina hacia atrás con los brazos arriba, sin tirones."],"en":"Sled Overhead Backward Walk","ines":1,"f":"pull","m":"c","sec":["cuadriceps","dorsales","gemelos"]},"fdb-Sled_Overhead_Triceps_Extension":{"nombre":"Extensión de tríceps sobre la cabeza con trineo","grupos":["triceps"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Engancha un doble agarre a un trineo con cadena o cuerda y cárgalo adecuadamente.","De espaldas al trineo, aléjate hasta tensar la cuerda. Sube las manos sobre la cabeza, juntas y con las palmas enfrentadas, codos flectados apuntando arriba. Esta es la posición inicial.","Extiende los codos hasta estirar los brazos, sin mover los brazos para aislar el tríceps.","Al extender por completo, da un paso adelante para quitar la holgura de la cuerda. Puedes escalonar los pies para más estabilidad."],"en":"Sled Overhead Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Sled_Push":{"nombre":"Empuje de trineo","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Strongman","inst":["Carga el trineo de empuje.","En postura atlética, inclínate sobre el trineo con los brazos estirados tomando los agarres. Empuja lo más rápido posible, enfocándote en extender cadera y rodillas para trabajar la cadena posterior."],"en":"Sled Push","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios","pectoral","triceps"]},"fdb-Sled_Reverse_Flye":{"nombre":"Vuelo posterior con trineo","grupos":["hombros"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Engancha un doble agarre a un trineo con cuerda o cadena, con carga liviana.","De frente al trineo, retrocede hasta tensar la cuerda. Toma ambos agarres con los brazos estirados a la altura de la cintura, rodillas levemente flectadas y pecho y cabeza arriba. Esta es la posición inicial.","Sin flectar los codos, tira los agarres hacia arriba y afuera en un vuelo invertido con algo de rotación externa, palmas al frente.","Vuelve a la posición inicial y retrocede un par de pasos para quitar la holgura."],"en":"Sled Reverse Flye","ines":1,"f":"pull","m":"i"},"fdb-Sled_Row":{"nombre":"Remo con trineo","grupos":["dorsales"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Engancha un doble agarre a un trineo con cuerda o cadena y cárgalo. De frente al trineo, retrocede hasta tensar la cuerda.","Con un agarre en cada mano, rodillas levemente flectadas, cabeza y pecho arriba y brazos estirados.","Flecta los codos juntando las escápulas, tirando el trineo hacia ti.","Retrocede uno o dos pasos para tensar la cuerda y repite."],"en":"Sled Row","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Sledgehammer_Swings":{"nombre":"Golpes con mazo","grupos":["core"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["You will need a tire and a sledgehammer for this exercise. Stand in front of the tire about two feet away from it with a staggered stance. Grip the sledgehammer.","If you are right handed, your left hand should be at the bottom of the handle, and your right hand should be choking up closer to the head.","As you bring the sledge up, your right hand slides toward the head; as you swing down, your right hand will slide down to join your left hand. Slam it down as hard as you can against the tire. Control the bounce of the hammer off of the tire.","Repeat on the other side."],"en":"Sledgehammer Swings","f":"pull","m":"c","sec":["antebrazos","dorsales","gemelos","hombros"]},"fdb-Smith_Incline_Shoulder_Raise":{"nombre":"Elevación de hombros inclinado en Smith","grupos":["hombros"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco inclinado bajo la Smith con la barra a una altura que alcances acostado con los brazos casi estirados. Acuéstate con los hombros justo bajo la barra.","Con agarre prono al ancho de hombros, desbloquea la barra y sostenla sobre ti con los codos levemente flectados. Esta es la posición inicial.","Botando el aire, sube la barra separando las escápulas hasta estirar los brazos; la contracción se siente en los hombros.","Tras una pausa, baja a la posición inicial inspirando.","Repite las repeticiones indicadas.","Al terminar, bloquea la barra en el rack."],"en":"Smith Incline Shoulder Raise","ines":1,"f":"push","m":"i","sec":["pectoral"]},"fdb-Smith_Machine_Behind_the_Back_Shrug":{"nombre":"Encogimiento por detrás en Smith","grupos":["trapecio"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Con la barra de la Smith a la altura de los muslos, cárgala adecuadamente.","De pie con la barra detrás de ti, tómala en prono al ancho de hombros y desbloquéala. Erguido, cabeza y pecho arriba y brazos estirados. Esta es la posición inicial.","Sube los hombros en línea recta, sin flectar brazos ni muñecas.","Tras una breve pausa, vuelve a la posición inicial.","Repite las repeticiones indicadas y bloquea la barra con los ganchos."],"en":"Smith Machine Behind the Back Shrug","ines":1,"f":"pull","m":"i","sec":["hombros"]},"fdb-Smith_Machine_Bench_Press":{"nombre":"Press banca en Smith","grupos":["pectoral"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco plano bajo la Smith con la barra a una altura que alcances acostado con los brazos casi estirados. Con agarre prono más ancho que los hombros, desbloquea la barra y sostenla con los brazos estirados. Esta es la posición inicial.","Inspirando, baja lento hasta sentir la barra en la mitad del pecho.","Tras una pausa, empuja con el pecho botando el aire. Bloquea, sostén un segundo y vuelve a bajar lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas.","Al terminar, bloquea la barra en el rack."],"en":"Smith Machine Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Smith_Machine_Bent_Over_Row":{"nombre":"Remo inclinado en Smith","grupos":["dorsales"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon la barra de la Smith unos 5 cm bajo las rodillas.","Flecta levemente las rodillas e inclina el torso desde la cadera, espalda recta, hasta casi quedar paralelo al suelo, cabeza neutra.","Toma la barra en prono y desbloquéala, dejándola colgar con los brazos estirados. Esta es la posición inicial.","Sin mover el torso, tira la barra hacia ti botando el aire, con los codos cerca del cuerpo; los antebrazos solo sostienen. Aprieta la espalda arriba un segundo.","Baja lento inspirando.","Repite las repeticiones indicadas."],"en":"Smith Machine Bent Over Row","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Smith_Machine_Calf_Raise":{"nombre":"Gemelos en Smith","grupos":["gemelos"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon un bloque o disco bajo la barra de la Smith y ajusta la barra a tu altura. Súbete al disco con la parte delantera de los pies y apoya la barra en la parte alta de la espalda.","Toma la barra con ambas manos y gírala para desbloquearla. Esta es la posición inicial.","Sube los talones lo más alto posible, contrayendo la pantorrilla, con las rodillas estiradas. Sostén un segundo.","Baja lento los talones inspirando.","Repite las repeticiones indicadas."],"en":"Smith Machine Calf Raise","ines":1,"f":"push","m":"i"},"fdb-Smith_Machine_Close-Grip_Bench_Press":{"nombre":"Press banca cerrado en Smith","grupos":["triceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco plano bajo la Smith con la barra a una altura que alcances acostado. Con agarre prono cerrado (al ancho de hombros), desbloquea la barra y sostenla con los brazos estirados. Esta es la posición inicial.","Inspirando, baja lento hasta sentir la barra en la mitad del pecho, con los codos pegados al torso para dar más trabajo al tríceps.","Tras una pausa, empuja con los tríceps botando el aire. Bloquea, sostén un segundo y vuelve a bajar lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas.","Al terminar, bloquea la barra en el rack."],"en":"Smith Machine Close-Grip Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Smith_Machine_Decline_Press":{"nombre":"Press declinado en Smith","grupos":["pectoral"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco declinado en la Smith de modo que la barra quede sobre el pecho. Carga la barra y acuéstate.","Gira la barra para desbloquearla y estira los brazos, con la espalda levemente arqueada y las escápulas retraídas. Esta es la posición inicial.","Flecta los brazos bajando la barra al pecho.","Pausa breve y extiende los brazos de vuelta.","Al terminar, gira la barra para bloquearla."],"en":"Smith Machine Decline Press","ines":1,"m":"c","sec":["hombros","triceps"]},"fdb-Smith_Machine_Hang_Power_Clean":{"nombre":"Cargada de potencia colgada en Smith","grupos":["isquios"],"eq":"Máquina","niv":"Intermedio","cat":"Fuerza","inst":["Pon la barra a la altura de las rodillas y cárgala.","Tómala en prono, más ancho que los hombros, y desbloquéala. Brazos estirados, cabeza y pecho arriba, codos hacia afuera, hombros atrás y abajo, y cadera atrás cargando los isquiotibiales. Esta es la posición inicial.","Extiende con fuerza cadera y rodillas acelerando la barra, con los brazos estirados.","Tras la extensión completa, vuelve a flectar cadera y rodillas para bajar a recibir.","Flecta los brazos y gira los codos alrededor de la barra para recibirla sobre los hombros.","Extiende cadera y rodillas hasta quedar de pie con la barra en los hombros."],"en":"Smith Machine Hang Power Clean","ines":1,"f":"pull","m":"c","sec":["cuadriceps","espalda_baja","gluteos","hombros","trapecio"]},"fdb-Smith_Machine_Hip_Raise":{"nombre":"Elevación de cadera en Smith","grupos":["core"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco en la Smith y carga la barra. Acuéstate y apoya las plantas de los pies contra la barra. Desbloquéala y estira las piernas (ayúdate con las manos si hace falta). Afírmate de los lados de la máquina. Esta es la posición inicial.","Rota la pelvis y flecta la columna para despegar la cadera del banco, con las rodillas levemente flectadas.","Tras una breve pausa, vuelve a apoyar la cadera.","Repite las repeticiones indicadas."],"en":"Smith Machine Hip Raise","ines":1,"f":"pull","m":"i"},"fdb-Smith_Machine_Incline_Bench_Press":{"nombre":"Press inclinado en Smith","grupos":["pectoral"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco inclinado bajo la Smith con la barra a una altura que alcances acostado, alineada con la parte alta del pecho. Con agarre prono más ancho que los hombros, desbloquea la barra y sostenla con los brazos estirados. Esta es la posición inicial.","Inspirando, baja lento hasta sentir la barra en la parte alta del pecho.","Tras una pausa, empuja con el pecho botando el aire. Bloquea, sostén un segundo y vuelve a bajar lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas.","Al terminar, bloquea la barra en el rack."],"en":"Smith Machine Incline Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Smith_Machine_Leg_Press":{"nombre":"Prensa en Smith","grupos":["cuadriceps"],"eq":"Máquina","niv":"Intermedio","cat":"Fuerza","inst":["Pon la barra de la Smith a unos 60 cm del suelo, sobre los seguros. Cárgala y acuéstate debajo. Apoya el medio de los pies en la barra con las rodillas hacia el pecho. Esta es la posición inicial.","Empuja con los pies subiendo la barra, extendiendo cadera y rodillas sin bloquearlas.","Pausa breve arriba y vuelve a la posición inicial."],"en":"Smith Machine Leg Press","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Smith_Machine_One-Arm_Upright_Row":{"nombre":"Remo al mentón a una mano en Smith","grupos":["hombros"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Con la barra de la Smith a la altura de los muslos, cárgala.","Tómala con agarre ancho, desbloquéala y suelta la otra mano. Brazo estirado, de pie, cabeza y pecho arriba. Esta es la posición inicial.","Flecta el codo subiendo el brazo con el codo hacia afuera, hasta que el brazo quede paralelo al suelo.","Tras una breve pausa, vuelve a la posición inicial.","Repite las repeticiones indicadas y bloquea la barra con los ganchos."],"en":"Smith Machine One-Arm Upright Row","ines":1,"f":"pull","m":"c","sec":["biceps","trapecio"]},"fdb-Smith_Machine_Overhead_Shoulder_Press":{"nombre":"Press de hombros en Smith","grupos":["hombros"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco (idealmente con respaldo) bajo la Smith, con la barra a una altura que alcances sentado con los brazos casi estirados.","Siéntate un poco detrás de la barra, de modo que quede alineada con la punta de tu nariz, con los pies fijos. Toma la barra con las palmas al frente, desbloquéala y estira los brazos. Esta es la posición inicial.","Baja lento la barra hasta la altura del mentón, inspirando.","Súbela de vuelta con los hombros botando el aire.","Repite las repeticiones indicadas."],"en":"Smith Machine Overhead Shoulder Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Smith_Machine_Pistol_Squat":{"nombre":"Sentadilla pistol en Smith","grupos":["cuadriceps"],"eq":"Máquina","niv":"Intermedio","cat":"Fuerza","inst":["Ajusta la barra de la Smith a tu altura, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con las palmas al frente, desbloquéala y sácala extendiendo las piernas.","Adelanta un pie unos 30 cm respecto de la barra y estira la otra pierna al frente, sin apoyarla. Mira al frente con la columna neutra. Esta es la posición inicial.","Con buena postura, baja flectando rodilla y cadera tan profundo como tu movilidad permita.","Pausa breve abajo y sube empujando con el talón, extendiendo rodilla y cadera."],"en":"Smith Machine Pistol Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Smith_Machine_Reverse_Calf_Raises":{"nombre":"Elevación de puntas en Smith","grupos":["gemelos"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Ajusta la barra de la Smith a tu altura y pon una plataforma justo debajo.","Párate sobre la plataforma con los talones apoyados y la parte delantera de los pies fuera del borde, puntas al frente y pies al ancho de hombros.","Ubica los hombros bajo la barra y súbela extendiendo cadera y rodillas hasta quedar erguido, con las rodillas levemente flectadas. La barra es solo para equilibrio. Esta es la posición inicial.","Sube las puntas de los pies lo más alto posible, botando el aire. Las rodillas no se mueven. Sostén un segundo.","Baja lento las puntas inspirando.","Repite las repeticiones indicadas."],"en":"Smith Machine Reverse Calf Raises","ines":1,"f":"push","m":"i"},"fdb-Smith_Machine_Squat":{"nombre":"Sentadilla en Smith","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Ajusta la barra a tu altura, cárgala, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con ambas manos (palmas al frente), desbloquéala y sácala empujando con las piernas mientras enderezas el torso.","Pies al ancho de hombros con las puntas levemente afuera. Cabeza arriba y espalda neutra. Esta es la posición inicial.","Baja lento flectando las rodillas, hasta quedar bajo el paralelo, inspirando. Las rodillas siguen la dirección de las puntas de los pies.","Sube botando el aire, empujando el suelo con todo el pie.","Repite las repeticiones indicadas."],"en":"Smith Machine Squat","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios"]},"fdb-Smith_Machine_Stiff-Legged_Deadlift":{"nombre":"Peso muerto piernas rígidas en Smith","grupos":["isquios"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon la barra de la Smith a mitad de muslo, cárgala y tómala en prono al ancho de hombros. Con cargas altas puedes usar straps.","Desbloquéala con los brazos estirados y la espalda recta. Pies al ancho de hombros o más juntos y rodillas levemente flectadas. Esta es la posición inicial.","Con las rodillas fijas, baja la barra hacia los pies inclinándote desde la cadera con la espalda recta, hasta sentir estiramiento en los isquiotibiales.","Al sentir el estiramiento, sube extendiendo la cadera hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Smith Machine Stiff-Legged Deadlift","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gluteos"]},"fdb-Smith_Machine_Upright_Row":{"nombre":"Remo al mentón en Smith","grupos":["trapecio"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon la barra de la Smith a mitad de muslo, cárgala y tómala en prono al ancho de hombros. Con cargas altas puedes usar straps.","Desbloquéala con los brazos estirados, espalda recta y codos levemente flectados. Esta es la posición inicial.","Sube la barra con los deltoides laterales, pegada al cuerpo, hasta casi tocar el mentón, botando el aire. Los codos guían y siempre van más altos que los antebrazos. Torso quieto; pausa un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Smith Machine Upright Row","ines":1,"f":"pull","m":"c","sec":["biceps","dorsales","hombros"]},"fdb-Smith_Single-Leg_Split_Squat":{"nombre":"Sentadilla búlgara en Smith","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco plano a 60-90 cm detrás de la Smith. Ajusta la barra a tu altura, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con ambas manos (palmas al frente), desbloquéala y sácala empujando con las piernas.","Pon un pie un poco adelante bajo la barra y lleva la otra pierna atrás con el empeine sobre el banco. Esta es la posición inicial.","Baja lento flectando la rodilla de adelante con el torso firme, hasta quedar bajo el paralelo, inspirando. La rodilla sigue la dirección de la punta del pie.","Sube botando el aire, empujando con todo el pie de adelante.","Repite las repeticiones indicadas.","Cambia de pierna y repite."],"en":"Smith Single-Leg Split Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Snatch":{"nombre":"Arranque (snatch)","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Pies al ancho de hombros con la barra justo sobre la unión entre los dedos y el resto del pie.","Con agarre prono, flecta las rodillas con la espalda plana y toma la barra más ancho que los hombros. Baja la cadera como si fueras a sentarte en una silla. Esta es la posición inicial.","Empuja el suelo con los pies y empieza a subir la barra pegada a las piernas.","Cuando la barra llegue a mitad de muslo, empuja el suelo y extiende el cuerpo por completo de forma explosiva.","Encoge los hombros mientras subes la barra, llevando los codos hacia los lados y por sobre la barra el mayor tiempo posible.","De forma muy rápida y potente, métete bajo la barra cuando esté lo suficientemente alta para controlarla, bloqueando los brazos sobre la cabeza mientras bajas a sentadilla.","Termina poniéndote de pie desde la sentadilla, con los pies alineados y los brazos totalmente estirados sosteniendo la barra arriba."],"en":"Snatch","ines":1,"f":"pull","m":"c","sec":["biceps","espalda_baja","gluteos","hombros","isquios","trapecio","triceps"]},"fdb-Snatch_Balance":{"nombre":"Snatch balance","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Pies en posición de tirón, barra en la parte alta de la espalda y manos en agarre ancho de arranque.","Haz un dip rápido con las rodillas para despegar la barra y métete con fuerza bajo ella, llevando los pies a la posición de recepción.","Recibe la barra bloqueada sobre la cabeza cerca del fondo de la sentadilla, con el torso vertical y la cadera entre las piernas.","Baja hasta la profundidad completa y vuelve a quedar de pie. Baja la barra con cuidado."],"en":"Snatch Balance","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","hombros","isquios","triceps"]},"fdb-Snatch_Deadlift":{"nombre":"Peso muerto de arranque","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["El peso muerto de arranque fortalece el primer tirón del arranque. Toma la barra en el suelo con agarre ancho de arranque, pies bajo la cadera con las puntas afuera. Baja a la barra con la espalda totalmente extendida y la mirada al frente.","Empuja con los talones subiendo la cadera. El ángulo de la espalda no cambia hasta que la barra pasa las rodillas.","Ahí, lleva la cadera hacia la barra mientras te inclinas atrás. Devuelve la barra al suelo por el mismo camino."],"en":"Snatch Deadlift","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","espalda_baja","gluteos","trapecio"]},"fdb-Snatch_Pull":{"nombre":"Tirón de arranque","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Con la barra en el suelo cerca de las canillas, toma agarre ancho de arranque. Baja la cadera con el peso en los talones, espalda recta, mirada al frente, pecho arriba y hombros un poco delante de la barra. Esta es la posición inicial.","Primer tirón: empuja con los talones extendiendo las rodillas, sin cambiar el ángulo de la espalda y con los brazos estirados. Sube controlado hasta pasar las rodillas.","Segundo tirón, la fuente principal de aceleración: cuando la barra llega a mitad de muslo, extiende la cadera y, como en un salto, extiende cadera, rodillas y tobillos para acelerar la barra.","No tires activamente con los brazos. Al final, el cuerpo queda totalmente extendido y levemente inclinado atrás. La extensión debe ser violenta y breve, sin prolongarla más de lo necesario."],"en":"Snatch Pull","ines":1,"f":"pull","m":"c","sec":["cuadriceps","espalda_baja","gemelos","gluteos","trapecio"]},"fdb-Snatch_Shrug":{"nombre":"Encogimiento de arranque","grupos":["trapecio"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Toma la barra con agarre ancho, prono o de gancho, colgando a mitad de muslo, espalda recta y levemente inclinada adelante.","Encoge los hombros hacia las orejas. Aunque se puede cargar más que en un arranque, no uses tanta carga que el movimiento se vuelva lento."],"en":"Snatch Shrug","ines":1,"f":"pull","m":"c","sec":["antebrazos","hombros"]},"fdb-Snatch_from_Blocks":{"nombre":"Arranque desde bloques","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Halterofilia","inst":["Empieza con la barra cargada sobre cajones a la altura deseada, con agarre ancho. Pies bajo la cadera con las puntas afuera. Baja la cadera con el pecho arriba y la mirada al frente, hombros un poco delante de la barra y codos afuera. Esta es la posición inicial.","Primer tirón: empuja con la parte delantera de los talones despegando la barra de los cajones.","Segundo tirón: extiende cadera, rodillas y tobillos subiendo la barra lo más rápido posible, pegada al cuerpo. En la máxima extensión, encoge los hombros y deja que los codos se flecten hacia los lados.","Mientras llevas los pies a la recepción, justo por fuera de la cadera, métete con fuerza bajo la barra subiéndola sobre la cabeza. Recíbela lo más abajo posible con los brazos totalmente estirados.","Con la barra sobre la parte delantera de los talones, cabeza y pecho arriba, empuja con los talones hasta quedar de pie. Devuelve la barra a los cajones con cuidado."],"en":"Snatch from Blocks","ines":1,"f":"pull","m":"c","sec":["antebrazos","espalda_baja","gemelos","gluteos","hombros","isquios","trapecio","triceps"]},"fdb-Speed_Band_Overhead_Triceps":{"nombre":"Extensión de tríceps sobre la cabeza con banda (velocidad)","grupos":["triceps"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Ancla una banda al suelo (por ejemplo, a la base de un banco inclinado) o párate sobre ella.","Lleva la banda detrás de la cabeza, en prono y con los codos arriba. Esta es la posición inicial.","Extiende los codos hasta estirar los brazos, sin mover los brazos.","Pausa y vuelve a la posición inicial."],"en":"Speed Band Overhead Triceps","ines":1,"f":"push","m":"i"},"fdb-Speed_Box_Squat":{"nombre":"Sentadilla al cajón de velocidad","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Engancha a la barra bandas bien ancladas cerca del suelo; estrangúlalas si necesitas más tensión.","Usa un cajón a la altura adecuada. Carga una barra que exija esfuerzo sin perder velocidad, típicamente 50-70% de tu 1RM.","Apoya la barra en la parte alta de la espalda, escápulas juntas, espalda firme y tensión de pies a cabeza. Esta es la posición inicial.","Saca la barra y ubícate frente al cajón. Lleva la cadera atrás hasta sentarte, bajando controlado y sin caer sobre el cajón.","Pausa breve y sal explosivo del cajón extendiendo cadera y rodillas."],"en":"Speed Box Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Speed_Squats":{"nombre":"Sentadillas de velocidad","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack. Pon la barra a la altura adecuada, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con ambas manos y sácala del rack empujando con las piernas mientras enderezas el torso.","Aléjate del rack, pies al ancho de hombros y puntas levemente afuera. Mira al frente y mantén la espalda neutra. Esta es la posición inicial.","Baja flectando las rodillas con el torso firme, hasta quedar bajo el paralelo, inspirando. Las rodillas siguen la dirección de las puntas de los pies.","Sube lo más rápido posible, sin rebote ni impulso, botando el aire y empujando con todo el pie. La técnica no se pierde por la velocidad.","Repite las repeticiones indicadas."],"en":"Speed Squats","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios"]},"fdb-Spell_Caster":{"nombre":"Spell caster","grupos":["core"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Sostén una mancuerna en cada mano en prono, con los pies bien separados y cadera y rodillas extendidas. Esta es la posición inicial.","Lleva ambas mancuernas a un lado junto a la cadera, rotando el torso.","Con los brazos estirados y las mancuernas paralelas al suelo, rota el torso para llevarlas al otro lado.","Sigue alternando de lado a lado hasta completar la serie."],"en":"Spell Caster","ines":1,"f":"pull","m":"c","sec":["gluteos","hombros"]},"fdb-Spider_Crawl":{"nombre":"Gateo de araña","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Boca abajo, apóyate en manos y puntas de pie con los pies juntos y el cuerpo recto, codos flectados a 90°. Esta es la posición inicial.","Despega un pie, rota la pierna hacia afuera y lleva la rodilla hacia el codo lo más adelante posible.","Vuelve esa pierna a la posición inicial y repite con el otro lado."],"en":"Spider Crawl","ines":1,"f":"pull","m":"c","sec":["hombros","pectoral","triceps"]},"fdb-Spider_Curl":{"nombre":"Curl araña","grupos":["biceps"],"eq":"Barra Z","niv":"Principiante","cat":"Fuerza","inst":["Pon la barra sobre el asiento del banco Scott, bien equilibrada para que no se caiga.","Ubícate en el lado del cojín de brazos, inclinado a unos 45° con el torso y el abdomen contra la parte delantera del banco.","Pies (sobre todo las puntas) bien apoyados, y los brazos sobre la cara interna del cojín.","Toma la barra en supino al ancho de hombros o algo más estrecho.","Sube la barra lento botando el aire. Aprieta el bíceps un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Spider Curl","ines":1,"f":"pull","m":"i"},"fdb-Spinal_Stretch":{"nombre":"Estiramiento de columna","grupos":["dorsales"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Sit in a chair so your back is straight and your feet planted on the floor.","Interlace your fingers behind your head, elbows out and your chin down.","Twist your upper body to one side about 3 times as far as you can. Then lean forward and twist your torso to reach your elbow to the floor on the inside of your knee.","Return to upright position and then repeat for your other side."],"en":"Spinal Stretch","f":"static","m":"i","sec":["cuello","espalda_baja","trapecio"]},"fdb-Split_Clean":{"nombre":"Cargada en tijera","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Con la barra en el suelo cerca de las canillas, toma agarre prono justo por fuera de las piernas. Baja la cadera con el peso en los talones, espalda recta, mirada al frente, pecho arriba y hombros un poco delante de la barra. Esta es la posición inicial.","Primer tirón: empuja con los talones extendiendo las rodillas, sin cambiar el ángulo de la espalda y con los brazos estirados, hasta pasar las rodillas.","Segundo tirón: a mitad de muslo, extiende cadera, rodillas y tobillos como en un salto, sin tirar con los brazos, hasta quedar totalmente extendido y levemente inclinado atrás.","Tercer tirón: encoge los hombros y flecta los brazos con los codos arriba y afuera. En la máxima extensión, métete con fuerza bajo la barra girando los codos por debajo.","Recibe la barra con los pies en tijera, llevando con fuerza un pie adelante y otro atrás. La barra se apoya sobre los hombros, rozando la garganta, con las manos relajadas. Baja hasta el fondo.","Recupera de inmediato empujando con los talones, torso erguido y codos arriba, y junta los pies al ponerte de pie."],"en":"Split Clean","ines":1,"f":"pull","m":"c","sec":["antebrazos","espalda_baja","gemelos","gluteos","hombros","isquios","trapecio"]},"fdb-Split_Jerk":{"nombre":"Envión en tijera (split jerk)","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Con la barra sobre la parte delantera de los hombros, haz el dip: pies bajo la cadera, flecta las rodillas sin llevar la cadera atrás.","Baja poco e invierte con toda la potencia posible, empujando con los talones, y saca la cabeza del camino cuando la barra deje los hombros. Al despegar, lleva los pies rápido a la posición de recepción.","El empuje de la barra hacia arriba te lleva hacia abajo. Cae en tijera, un pie adelante y otro atrás, con las rodillas semiflectadas, y recibe la barra con los brazos bloqueados sobre la cabeza.","Vuelve a quedar de pie juntando los pies."],"en":"Split Jerk","ines":1,"f":"push","m":"c","sec":["gluteos","hombros","isquios","triceps"]},"fdb-Split_Jump":{"nombre":"Salto en tijera","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Pliometría","inst":["Assume a lunge stance position with one foot forward with the knee bent, and the rear knee nearly touching the ground.","Ensure that the front knee is over the midline of the foot.","Extending through both legs, jump as high as possible, swinging your arms to gain lift.","As you jump, bring your feet together, and move them back to their initial positions as you land.","Absorb the impact by reverting back to the starting position."],"en":"Split Jump","f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Split_Snatch":{"nombre":"Arranque en tijera","grupos":["isquios"],"eq":"Barra","niv":"Avanzado","cat":"Halterofilia","inst":["Empieza con la barra cargada en el suelo, cerca o tocando las canillas, con agarre ancho. Pies bajo la cadera con las puntas afuera según necesites. Baja la cadera con el pecho arriba y la mirada al frente, hombros un poco delante de la barra. Esta es la posición inicial.","Primer tirón: empuja con la parte delantera de los talones despegando la barra. El ángulo de la espalda no cambia hasta pasar las rodillas.","Segundo tirón: extiende cadera, rodillas y tobillos subiendo la barra lo más rápido posible, pegada al cuerpo. En la máxima extensión, encoge los hombros y deja que los codos se flecten hacia los lados.","Mientras llevas los pies con fuerza a una tijera (uno adelante y otro atrás), métete bajo la barra subiéndola sobre la cabeza. Recíbela lo más abajo posible con los brazos totalmente estirados.","Con la barra sobre la parte delantera de los talones, cabeza y pecho arriba, empuja con los talones hasta quedar de pie, juntando los pies.","Devuelve la barra al suelo con cuidado."],"en":"Split Snatch","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","espalda_baja","gemelos","gluteos","hombros","trapecio","triceps"]},"fdb-Split_Squat_with_Dumbbells":{"nombre":"Sentadilla búlgara con mancuernas","grupos":["cuadriceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Ponte en tijera con el pie de atrás elevado y el de adelante al frente.","Sostén una mancuerna en cada mano a los costados. Esta es la posición inicial.","Baja flectando rodilla y cadera, con buena postura y la rodilla de adelante alineada con el pie.","Abajo, empuja con el pie de adelante extendiendo rodilla y cadera hasta la posición inicial."],"en":"Split Squat with Dumbbells","ines":1,"f":"push","m":"c","sec":["gluteos","isquios"]},"fdb-Split_Squats":{"nombre":"Sentadilla split","grupos":["isquios"],"eq":"","niv":"Intermedio","cat":"Elongación","inst":["Being in a standing position. Jump into a split leg position, with one leg forward and one leg back, flexing the knees and lowering your hips slightly as you do so.","As you descend, immediately reverse direction, standing back up and jumping, reversing the position of your legs. Repeat 5-10 times on each leg."],"en":"Split Squats","f":"push","sec":["cuadriceps","gemelos","gluteos"]},"fdb-Squat_Jerk":{"nombre":"Envión en sentadilla","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Fuerza","inst":["De pie con la barra apoyada sobre la parte delantera de los hombros, haz el dip: pies bajo la cadera, flecta las rodillas sin llevar la cadera atrás. Baja poco y cambia de dirección con toda la potencia posible, empujando con los talones. Saca la cabeza del camino cuando la barra deje los hombros.","Cuando los pies se despegan, llévalos rápido a la posición de recepción, justo por fuera de la cadera. Al empujar la barra arriba, el cuerpo baja: recíbela en sentadilla completa con los brazos totalmente estirados.","Con la barra sobre la parte delantera de los talones, cabeza y pecho arriba, empuja con los talones hasta quedar de pie. Devuelve la barra al suelo con cuidado."],"en":"Squat Jerk","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","hombros","isquios","triceps"]},"fdb-Squat_with_Bands":{"nombre":"Sentadilla con bandas","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Fija las bandas a las mangas de la barra y a los ganchos, al rack o a mancuernas, con tensión adecuada.","Métete bajo la barra y apóyala en la parte alta de la espalda. Junta las escápulas y lleva los codos adelante. Sácala con la zona lumbar firme y ubícate con los pies anchos para enfatizar cadena posterior. Mira al frente.","Con espalda, hombros y core firmes, empuja rodillas y cadera hacia afuera y baja llevando la cadera atrás, idealmente con las canillas verticales. Con barra baja, el torso se inclina más. Baja hasta romper el paralelo (pliegue de cadera bajo la parte superior de la rodilla).","Con el peso en los talones y empujando pies y rodillas hacia afuera, sube guiando con la cabeza y con tensión de pies a cabeza."],"en":"Squat with Bands","ines":1,"f":"push","m":"c","sec":["aductores","espalda_baja","gemelos","gluteos","isquios"]},"fdb-Squat_with_Chains":{"nombre":"Sentadilla con cadenas","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Pasa la cadena guía por las mangas de la barra y engancha la cadena pesada con un mosquetón. Ajusta el largo para que, arriba, algunos eslabones sigan en el suelo.","Métete bajo la barra y apóyala en la parte alta de la espalda. Junta las escápulas y lleva los codos adelante. Sácala con la zona lumbar firme y ubícate con los pies anchos. Mira al frente.","Con espalda, hombros y core firmes, empuja rodillas y cadera hacia afuera y baja llevando la cadera atrás, idealmente con las canillas verticales. Baja hasta romper el paralelo.","Con el peso en los talones y empujando pies y rodillas hacia afuera, sube guiando con la cabeza y con tensión de pies a cabeza."],"en":"Squat with Chains","ines":1,"f":"push","m":"c","sec":["aductores","espalda_baja","gemelos","gluteos","isquios"]},"fdb-Squat_with_Plate_Movers":{"nombre":"Sentadilla con traslado de disco","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Pon la barra en el rack un poco bajo los hombros y un disco en el suelo a un par de pasos detrás. Con la barra cargada, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con ambas manos y sácala empujando con las piernas mientras enderezas el torso.","Aléjate del rack y ubícate con los pies bien separados, puntas levemente afuera y un pie sobre el disco. Cabeza arriba. Esta es la posición inicial.","Baja lento flectando rodillas y cadera hasta pasar levemente los 90°.","Sube botando el aire, empujando con los talones y extendiendo cadera y rodillas.","Arriba, da un paso lateral juntando los pies al otro lado del disco.","Con el pie de adentro, empuja el disco deslizándolo hasta donde estabas parado.","Apoya ese pie sobre el disco, con los pies separados, para la siguiente repetición."],"en":"Squat with Plate Movers","ines":1,"f":"push","m":"c","sec":["abductores","aductores","gemelos","gluteos","isquios"]},"fdb-Squats_-_With_Bands":{"nombre":"Sentadilla con bandas (de pie sobre la banda)","grupos":["cuadriceps"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Párate al centro de la banda con los pies al ancho de hombros, con el mismo largo de banda a cada lado.","Sostén los agarres a la misma altura, en prono y junto a la cara. Esta es la posición inicial.","Flecta lento las rodillas hasta que los muslos queden paralelos al suelo, inspirando.","Sube empujando con todo el pie, botando el aire.","Repite las repeticiones indicadas."],"en":"Squats - With Bands","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios"]},"fdb-Stairmaster":{"nombre":"Escaladora (Stairmaster)","grupos":["cuadriceps"],"eq":"Máquina","niv":"Intermedio","cat":"Cardio","inst":["To begin, step onto the stairmaster and select the desired option from the menu. You can choose a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise.","Pump your legs up and down in an established rhythm, driving the pedals down but not all the way to the floor. It is recommended that you maintain your grip on the handles so that you don't fall. The handles can be used to monitor your heart rate to help you stay at an appropriate intensity.","Stairmasters offer convenience, cardiovascular benefits, and usually have less impact than running outside. They are typically much harder than other cardio equipment. A 150 lb person will typically burn over 300 calories in 30 minutes, compared to about 175 calories walking."],"en":"Stairmaster","sec":["gemelos","gluteos","isquios"]},"fdb-Standing_Alternating_Dumbbell_Press":{"nombre":"Press de pie alternado con mancuernas","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, con una mancuerna en cada mano a la altura de los hombros, palmas al frente y codos hacia afuera. Esta es la posición inicial.","Empuja una mancuerna hacia arriba estirando el brazo, con la otra quieta. No te inclines ni des tirones.","Tras una breve pausa, vuelve a la posición inicial.","Repite con el otro lado y sigue alternando."],"en":"Standing Alternating Dumbbell Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Standing_Barbell_Calf_Raise":{"nombre":"Gemelos de pie con barra","grupos":["gemelos"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack. Pon la barra a la altura adecuada, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con ambas manos y sácala empujando con las piernas mientras enderezas el torso.","Aléjate del rack, pies al ancho de hombros y puntas levemente afuera. Mira al frente, espalda recta y rodillas levemente flectadas, nunca bloqueadas. Esta es la posición inicial. Para más rango, puedes apoyar la parte delantera de los pies en un bloque firme, aunque exige más equilibrio.","Sube los talones lo más alto posible botando el aire. Las rodillas no se mueven. Sostén un segundo.","Baja lento hasta estirar las pantorrillas, inspirando.","Repite las repeticiones indicadas."],"en":"Standing Barbell Calf Raise","ines":1,"f":"push","m":"i"},"fdb-Standing_Barbell_Press_Behind_Neck":{"nombre":"Press tras nuca de pie con barra","grupos":["hombros"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Usa un rack para tomar la barra más fácil. Pon la barra a la altura adecuada, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con ambas manos y sácala empujando con las piernas mientras enderezas el torso.","Aléjate del rack, pies al ancho de hombros y puntas levemente afuera, espalda recta. Esta es la posición inicial.","Empuja la barra sobre la cabeza hasta estirar los brazos, botando el aire.","Sostén un segundo y baja a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Standing Barbell Press Behind Neck","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Standing_Bent-Over_One-Arm_Dumbbell_Triceps_Extension":{"nombre":"Patada de tríceps de pie a una mano","grupos":["triceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Con una mancuerna en una mano y la palma hacia el torso, flecta levemente las rodillas e inclina el torso con la espalda recta hasta casi quedar paralelo al suelo, cabeza neutra.","El brazo va pegado al torso y paralelo al suelo, con el antebrazo colgando a 90°. Esta es la posición inicial.","Sin mover el brazo, extiende el codo con el tríceps hasta estirar el brazo, botando el aire. Solo se mueve el antebrazo.","Tras un segundo arriba, baja lento inspirando.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"Standing Bent-Over One-Arm Dumbbell Triceps Extension","ines":1,"f":"push","m":"i","sec":["hombros"]},"fdb-Standing_Bent-Over_Two-Arm_Dumbbell_Triceps_Extension":{"nombre":"Patada de tríceps de pie con dos mancuernas","grupos":["triceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Con una mancuerna en cada mano y palmas hacia el torso, flecta levemente las rodillas e inclina el torso con la espalda recta hasta casi quedar paralelo al suelo, cabeza neutra. Brazos pegados al torso y paralelos al suelo, antebrazos colgando a 90°. Esta es la posición inicial.","Sin mover los brazos, extiende los codos con los tríceps hasta estirar los brazos, botando el aire. Solo se mueven los antebrazos.","Tras un segundo arriba, baja lento inspirando.","Repite las repeticiones indicadas."],"en":"Standing Bent-Over Two-Arm Dumbbell Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Standing_Biceps_Cable_Curl":{"nombre":"Curl de bíceps de pie en polea","grupos":["biceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["De pie, erguido, toma la barra de una polea baja al ancho de hombros en supino, con los codos cerca del torso. Esta es la posición inicial.","Sin mover los brazos, flecta los codos subiendo la barra botando el aire, hasta la altura de los hombros. Solo se mueven los antebrazos. Aprieta un segundo.","Baja lento inspirando.","Repite las repeticiones indicadas."],"en":"Standing Biceps Cable Curl","ines":1,"f":"pull","m":"i"},"fdb-Standing_Biceps_Stretch":{"nombre":"Estiramiento de bíceps de pie","grupos":["biceps"],"eq":"Otro","niv":"Principiante","cat":"Elongación","inst":["Clasp your hands behind your back with your palms together, straighten arms and then rotate them so your palms face downward.","Raise your arms up and hold until you feel a stretch in your biceps."],"en":"Standing Biceps Stretch","f":"static","m":"i","sec":["hombros","pectoral"]},"fdb-Standing_Bradford_Press":{"nombre":"Press Bradford de pie","grupos":["hombros"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra cargada en el rack a la altura de los hombros. Con agarre prono al ancho de hombros, apóyala sobre la parte delantera de los hombros. Esta es la posición inicial.","Extiende los codos empujando la barra sobre la cabeza, sin bloquear del todo al pasarla hacia atrás.","Bájala por detrás de la cabeza hasta que el codo forme 90°.","Súbela de vuelta sobre la cabeza extendiendo los codos.","Bájala por delante a la posición inicial.","Alterna así hasta completar las repeticiones."],"en":"Standing Bradford Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Standing_Cable_Chest_Press":{"nombre":"Press de pecho de pie en polea","grupos":["pectoral"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon ambas poleas a la altura del pecho y elige la carga. Párate a 30-60 cm delante de los cables, con uno en cada mano; puedes escalonar los pies.","Brazos a 90° y escápulas juntas. Esta es la posición inicial.","Sin mover el resto del cuerpo, extiende los codos empujando los agarres al frente hasta juntarlos.","Pausa al final y vuelve a la posición inicial."],"en":"Standing Cable Chest Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Standing_Cable_Lift":{"nombre":"Leñador ascendente en polea","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un agarre simple en la polea más baja.","De lado al cable, toma el agarre con una mano y aléjate a un brazo de distancia, con tensión en el cable y el brazo alineado con él.","Pies al ancho de hombros, baja en sentadilla y toma el agarre con ambas manos, brazos estirados.","En un solo movimiento, tira el agarre hacia arriba cruzando el cuerpo hasta dejar los brazos estirados sobre la cabeza.","Espalda recta y brazos cerca del cuerpo mientras giras el pie de atrás y estiras las piernas para completar el rango.","Recoge los brazos y luego el cuerpo, volviendo lento y controlado al centro.","Repite hasta el fallo.","Luego cambia de lado y repite."],"en":"Standing Cable Lift","ines":1,"f":"pull","m":"c","sec":["hombros"]},"fdb-Standing_Cable_Wood_Chop":{"nombre":"Leñador descendente en polea","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un agarre simple en la polea más alta.","De lado al cable, toma el agarre con una mano y aléjate a un brazo de distancia, con tensión en el cable y el brazo alineado con él.","Pies al ancho de hombros, toma el agarre también con la otra mano, brazos estirados.","En un solo movimiento, tira el agarre hacia abajo cruzando el cuerpo hasta la rodilla de adelante, rotando el torso.","Espalda y brazos rectos y core firme mientras giras el pie de atrás y flectas las rodillas para completar el rango.","Mantén la postura y vuelve lento y controlado al centro.","Repite hasta el fallo.","Luego cambia de lado y repite."],"en":"Standing Cable Wood Chop","ines":1,"f":"pull","m":"c","sec":["hombros"]},"fdb-Standing_Calf_Raises":{"nombre":"Gemelos de pie en máquina","grupos":["gemelos"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Ajusta los cojines de la máquina de gemelos a tu altura.","Ubica los hombros bajo los cojines y apoya la parte delantera de los pies en el bloque, con los talones afuera y las puntas como prefieras. Empuja extendiendo cadera y rodillas hasta quedar erguido, con las rodillas levemente flectadas. Esta es la posición inicial.","Sube los talones lo más alto posible botando el aire. Las rodillas no se mueven. Sostén un segundo.","Baja lento hasta estirar las pantorrillas, inspirando.","Repite las repeticiones indicadas."],"en":"Standing Calf Raises","ines":1,"f":"push","m":"i"},"fdb-Standing_Concentration_Curl":{"nombre":"Curl concentrado de pie","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Con una mancuerna en la mano que trabaja, inclínate adelante dejando el brazo colgar perpendicular al suelo con el codo hacia afuera. Esta es la posición inicial.","Flecta el codo subiendo la mancuerna sin mover el brazo. Arriba, aprieta el bíceps y pausa.","Baja a la posición inicial.","Repite las repeticiones indicadas."],"en":"Standing Concentration Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Standing_Dumbbell_Calf_Raise":{"nombre":"Gemelos de pie con mancuernas","grupos":["gemelos"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["De pie, erguido, con una mancuerna en cada mano a los costados. Apoya la parte delantera de los pies en una tabla firme de 5-8 cm, con los talones fuera y tocando el suelo. Esta es la posición inicial.","Con las puntas al frente, hacia adentro o hacia afuera, sube los talones contrayendo las pantorrillas, botando el aire. Sostén un segundo arriba.","Inspirando, baja lento los talones a la posición inicial.","Repite las repeticiones indicadas."],"en":"Standing Dumbbell Calf Raise","ines":1,"f":"push","m":"i"},"fdb-Standing_Dumbbell_Press":{"nombre":"Press de pie con mancuernas","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, pies al ancho de hombros, con una mancuerna en cada mano a la altura de la cabeza, codos hacia afuera a unos 90°. Esta es la posición inicial.","Con técnica estricta, sin impulso de piernas ni echarte atrás, extiende los codos subiendo ambas mancuernas sobre la cabeza.","Pausa y baja lento a la posición inicial."],"en":"Standing Dumbbell Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Standing_Dumbbell_Reverse_Curl":{"nombre":"Curl invertido de pie con mancuernas","grupos":["biceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["De pie, con una mancuerna en cada mano en prono (palmas abajo), brazos estirados y pies al ancho de hombros. Esta es la posición inicial.","Sin mover los brazos, flecta los codos subiendo las mancuernas botando el aire, hasta la altura de los hombros. Solo se mueven los antebrazos. Aprieta un segundo.","Baja lento inspirando.","Repite las repeticiones indicadas."],"en":"Standing Dumbbell Reverse Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Standing_Dumbbell_Straight-Arm_Front_Delt_Raise_Above_Head":{"nombre":"Elevación frontal de pie hasta sobre la cabeza","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Sostén las mancuernas frente a los muslos, palmas hacia ellos.","Brazos rectos con leve flexión de codo, bloqueados. Esta es la posición inicial.","Sube las mancuernas en semicírculo hasta quedar sobre la cabeza con los brazos estirados, botando el aire.","Baja lento por el mismo camino inspirando.","Repite las repeticiones indicadas."],"en":"Standing Dumbbell Straight-Arm Front Delt Raise Above Head","ines":1,"f":"push","m":"i"},"fdb-Standing_Dumbbell_Triceps_Extension":{"nombre":"Extensión de tríceps de pie con mancuerna","grupos":["triceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, pies al ancho de hombros, toma una mancuerna con ambas manos y súbela sobre la cabeza hasta estirar los brazos.","La mancuerna descansa en las palmas, con los pulgares alrededor y las palmas hacia el techo. Esta es la posición inicial.","Con los brazos cerca de la cabeza (codos adentro) y perpendiculares al suelo, baja la mancuerna en semicírculo detrás de la cabeza hasta que los antebrazos toquen los bíceps, inspirando. Solo se mueven los antebrazos.","Vuelve a la posición inicial con los tríceps, botando el aire.","Repite las repeticiones indicadas."],"en":"Standing Dumbbell Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Standing_Dumbbell_Upright_Row":{"nombre":"Remo al mentón de pie con mancuernas","grupos":["trapecio"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Toma una mancuerna en cada mano en prono, un poco más estrecho que los hombros, apoyadas sobre los muslos. Brazos estirados con leve flexión de codo y espalda recta. Esta es la posición inicial.","Sube las mancuernas con los deltoides laterales, pegadas al cuerpo, hasta casi tocar el mentón, botando el aire. Los codos guían y siempre van más altos que los antebrazos. Torso quieto; pausa un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Standing Dumbbell Upright Row","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Standing_Elevated_Quad_Stretch":{"nombre":"Estiramiento de cuádriceps de pie con pie elevado","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Elongación","inst":["Start by standing with your back about two to three feet away from a bench or step.","Lift one leg behind you and rest your foot on the step,either on your instep or the ball of your foot, whichever you find most comfortable.","Keep your supporting knee slightly bent and avoid letting that knee extend out beyond your toes. Switch sides."],"en":"Standing Elevated Quad Stretch","f":"static"},"fdb-Standing_Front_Barbell_Raise_Over_Head":{"nombre":"Elevación frontal de pie con barra sobre la cabeza","grupos":["hombros"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["De pie, toma una barra en prono, con las manos más juntas que los hombros.","Pies al ancho de hombros y codos levemente flectados. Esta es la posición inicial.","Sube la barra hasta dejarla justo sobre la cabeza, botando el aire, siempre con los codos levemente flectados.","Al sentir la contracción, baja a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Standing Front Barbell Raise Over Head","ines":1,"f":"push","m":"i"},"fdb-Standing_Gastrocnemius_Calf_Stretch":{"nombre":"Estiramiento de gastrocnemio de pie","grupos":["gemelos"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Place your right heel on a step with your knee extended and lean forward to grab your right toe with your right hand. Your left knee should be slightly bent and your back should be straight.","Support your weight on your left leg and place your left hand on your left thigh.","Pull your right toes toward your knee until you feel a stretch in your calf."],"en":"Standing Gastrocnemius Calf Stretch","f":"static","sec":["isquios"]},"fdb-Standing_Hamstring_and_Calf_Stretch":{"nombre":"Estiramiento de isquiotibiales y gemelos de pie","grupos":["isquios"],"eq":"Otro","niv":"Principiante","cat":"Elongación","inst":["Being by looping a belt, band, or rope around one foot. While standing, place that foot forward.","Bend your back leg, while keeping the front one straight. Now raise the toes of your front foot off of the ground and lean forward.","Using the belt, pull on the top of the foot to increase the stretch in the calf. Hold for 10-20 seconds and repeat with the other foot."],"en":"Standing Hamstring and Calf Stretch","f":"static"},"fdb-Standing_Hip_Circles":{"nombre":"Círculos de cadera de pie","grupos":["abductores"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["Begin standing on one leg, holding to a vertical support.","Raise the unsupported knee to 90 degrees. This will be your starting position.","Open the hip as far as possible, attempting to make a big circle with your knee.","Perform this movement slowly for a number of repetitions, and repeat on the other side."],"en":"Standing Hip Circles","f":"pull","m":"i","sec":["aductores"]},"fdb-Standing_Hip_Flexors":{"nombre":"Estiramiento de flexores de cadera de pie","grupos":["cuadriceps"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Stand up straight with the spine vertical, the left foot slightly in front of the right.","Bend both knees and lift the back heel off the floor as you press the right hip forward. You can't get a thorough, deep stretch in this position, however, because it's hard to relax the hip flexor and stand on it at the same time. Switch sides."],"en":"Standing Hip Flexors","f":"static","m":"i"},"fdb-Standing_Inner-Biceps_Curl":{"nombre":"Curl interno de pie","grupos":["biceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["De pie, con una mancuerna en cada mano y los brazos colgando, codos cerca del torso y pies al ancho de hombros.","Palmas hacia adentro, en neutro. Esta es la posición inicial.","Sin mover los brazos, sube las mancuernas hacia afuera contrayendo el bíceps, botando el aire, girando las muñecas para terminar en supino (palmas arriba).","Solo se mueven los antebrazos. Sube hasta la altura de los hombros, con los antebrazos alineados con los deltoides laterales.","Aprieta el bíceps un segundo.","Baja lento inspirando, girando las muñecas de vuelta a neutro.","Repite las repeticiones indicadas."],"en":"Standing Inner-Biceps Curl","ines":1,"f":"pull","m":"i"},"fdb-Standing_Lateral_Stretch":{"nombre":"Estiramiento lateral de pie","grupos":["core"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Take a slightly wider than hip distance stance with your knees slightly bent.","Place your right hand on your right hip to support the spine.","Raise your left arm in a vertical line and place your left hand behind your head. Keep it there as you incline your torso to the right.","Keep your weight evenly distributed between both legs (don't lean into your left hip). Switch sides."],"en":"Standing Lateral Stretch","f":"static"},"fdb-Standing_Leg_Curl":{"nombre":"Curl femoral de pie","grupos":["isquios"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Ajusta la palanca a tu altura y apóyate con el torso inclinado adelante unos 30-45°, con el cojín sobre la parte de atrás de la pierna derecha (unos centímetros bajo la pantorrilla) y el frente del muslo sobre el cojín de la máquina.","Con el torso inclinado y la pierna completamente estirada, toma los agarres laterales. Esta es la posición inicial.","Botando el aire, flecta la pierna derecha lo más posible sin despegar el muslo del cojín. Sostén un segundo.","Inspirando, vuelve a la posición inicial. Repite las repeticiones indicadas.","Haz lo mismo con la pierna izquierda."],"en":"Standing Leg Curl","ines":1,"f":"pull","m":"i"},"fdb-Standing_Long_Jump":{"nombre":"Salto largo","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Pliometría","inst":["This drill is best done in sand or other soft landing surface. Ensure that you are able to measure distance. Stand in a partial squat stance with feet shoulder width apart.","Utilizing a big arm swing and a countermovement of the legs, jump forward as far as you can.","Attempt to land with your feet out in front you, reaching as far as possible with your legs.","Measure the distance from your landing point to the starting point and track results."],"en":"Standing Long Jump","f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Standing_Low-Pulley_Deltoid_Raise":{"nombre":"Elevación de deltoides de pie en polea baja","grupos":["hombros"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Párate a la derecha de una polea baja. Con la mano izquierda, cruza por delante del cuerpo y toma el agarre simple en prono, con el brazo frente a ti. La mano derecha se afirma de la máquina.","Espalda erguida y pies al ancho de hombros. Esta es la posición inicial.","Lleva la mano izquierda hacia afuera, cruzando el cuerpo, hasta la altura del hombro, botando el aire.","Sostén un segundo y baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"Standing Low-Pulley Deltoid Raise","ines":1,"f":"push","m":"i","sec":["antebrazos"]},"fdb-Standing_Low-Pulley_One-Arm_Triceps_Extension":{"nombre":"Extensión de tríceps de pie a una mano en polea baja","grupos":["triceps"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Toma un agarre simple de la polea baja con la mano izquierda y date vuelta, de espaldas a la máquina, con el brazo estirado al costado. Con ambas manos, sube el agarre sobre la cabeza con la palma al frente. Brazo vertical y la mano derecha sujetando el codo izquierdo. Esta es la posición inicial.","Con el brazo cerca de la cabeza y perpendicular al suelo, baja el agarre en semicírculo detrás de la cabeza hasta que el antebrazo toque el bíceps, inspirando. Solo se mueve el antebrazo.","Vuelve con el tríceps, botando el aire.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"Standing Low-Pulley One-Arm Triceps Extension","ines":1,"f":"push","m":"i","sec":["hombros","pectoral"]},"fdb-Standing_Military_Press":{"nombre":"Press militar de pie","grupos":["hombros"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra en el rack a la altura del pecho. Tómala en prono, más ancho que los hombros.","Flecta levemente las rodillas, apoya la barra sobre las clavículas y sácala del rack. Retrocede un paso con los pies al ancho de hombros.","Sube la barra sobre la cabeza bloqueando los brazos, un poco delante de la cabeza. Esta es la posición inicial.","Baja lento la barra hasta las clavículas inspirando.","Súbela de vuelta botando el aire.","Repite las repeticiones indicadas."],"en":"Standing Military Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Standing_Olympic_Plate_Hand_Squeeze":{"nombre":"Apretón de discos de pie","grupos":["antebrazos"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["De pie, sostén un disco en cada mano por el borde, con los brazos estirados y agarre neutro, pies al ancho de hombros. Esta es la posición inicial.","Baja los discos abriendo los dedos hasta casi estirarlos, sin soltarlos, inspirando.","Cierra las manos subiendo los discos a la posición inicial, botando el aire.","Repite las repeticiones indicadas en tu programa."],"en":"Standing Olympic Plate Hand Squeeze","ines":1,"f":"static","m":"i","sec":["biceps"]},"fdb-Standing_One-Arm_Cable_Curl":{"nombre":"Curl de pie a una mano en polea","grupos":["biceps"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Toma un agarre simple de la polea baja, lo suficientemente lejos para que el brazo sostenga la carga.","Brazo fijo, perpendicular al suelo, con el codo adentro y la palma al frente. La otra mano en la cintura para equilibrarte.","Sube lento el agarre sin mover el brazo hasta que el antebrazo toque el bíceps, botando el aire. Solo se mueve el antebrazo.","Aprieta el bíceps y baja a la posición inicial inspirando.","Repite las repeticiones indicadas.","Cambia de brazo."],"en":"Standing One-Arm Cable Curl","ines":1,"f":"pull","m":"i"},"fdb-Standing_One-Arm_Dumbbell_Curl_Over_Incline_Bench":{"nombre":"Curl a una mano sobre banco inclinado","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Párate detrás de un banco inclinado, como si fueras a ayudar a alguien. Con una mancuerna en una mano en supino, apoya el brazo sobre el respaldo.","La otra mano se afirma del banco. Pecho contra la parte alta del respaldo y pies firmes, bien separados. Esta es la posición inicial.","Sin mover el brazo, sube la mancuerna contrayendo el bíceps, botando el aire, hasta la altura del hombro. Solo se mueve el antebrazo. Sostén un segundo.","Baja lento inspirando.","Repite las repeticiones indicadas.","Cambia de brazo."],"en":"Standing One-Arm Dumbbell Curl Over Incline Bench","ines":1,"f":"pull","m":"i"},"fdb-Standing_One-Arm_Dumbbell_Triceps_Extension":{"nombre":"Extensión de tríceps de pie a una mano","grupos":["triceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, pies al ancho de hombros, estira sobre la cabeza el brazo con la mancuerna, con el meñique hacia el techo y la palma al frente.","Esta es la posición inicial.","Con el brazo cerca de la cabeza y perpendicular al suelo, baja la mancuerna en semicírculo detrás de la cabeza hasta que el antebrazo toque el bíceps, inspirando. Solo se mueve el antebrazo.","Vuelve con el tríceps, botando el aire.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"Standing One-Arm Dumbbell Triceps Extension","ines":1,"f":"push","m":"i","sec":["hombros","pectoral"]},"fdb-Standing_Overhead_Barbell_Triceps_Extension":{"nombre":"Extensión de tríceps de pie con barra sobre la cabeza","grupos":["triceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie, toma una barra o barra Z en prono, con las manos más juntas que los hombros y los pies al ancho de hombros.","Sube la barra sobre la cabeza hasta estirar los brazos, con los codos adentro. Esta es la posición inicial.","Con los brazos cerca de la cabeza y perpendiculares al suelo, baja la barra en semicírculo detrás de la cabeza hasta que los antebrazos toquen los bíceps, inspirando. Solo se mueven los antebrazos.","Vuelve con los tríceps, botando el aire.","Repite las repeticiones indicadas."],"en":"Standing Overhead Barbell Triceps Extension","ines":1,"f":"push","m":"i","sec":["hombros"]},"fdb-Standing_Palm-In_One-Arm_Dumbbell_Press":{"nombre":"Press de pie a una mano agarre neutro","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Con una mancuerna en una mano, brazo estirado al costado en agarre neutro, afírmate con la otra mano de un banco para equilibrarte.","Pies al ancho de hombros. Sube la mancuerna hasta que el codo forme 90°, con el antebrazo vertical, manteniendo el agarre neutro todo el ejercicio.","Empuja la mancuerna hasta estirar el brazo. Esta es la posición inicial.","Inspirando, baja hasta que el codo vuelva a 90°.","Siente la contracción y sube de vuelta botando el aire, firme en el banco y los pies.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"Standing Palm-In One-Arm Dumbbell Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Standing_Palms-In_Dumbbell_Press":{"nombre":"Press de pie con mancuernas agarre neutro","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Con una mancuerna en cada mano, brazos estirados a los costados en agarre neutro y pies al ancho de hombros, sube las mancuernas hasta que los codos formen 90°, con los antebrazos verticales. Esta es la posición inicial.","Manteniendo el agarre neutro, empuja las mancuernas hasta estirar los brazos.","Inspirando, baja hasta que los codos vuelvan a 90°.","Repite las repeticiones indicadas."],"en":"Standing Palms-In Dumbbell Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Standing_Palms-Up_Barbell_Behind_The_Back_Wrist_Curl":{"nombre":"Curl de muñeca de pie con barra por detrás","grupos":["antebrazos"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie, sostén una barra detrás de los glúteos con los brazos estirados, palmas hacia atrás y manos al ancho de hombros.","Mira al frente con los pies al ancho de hombros. Esta es la posición inicial.","Botando el aire, sube lento la barra flectando las muñecas en semicírculo hacia arriba. Solo se mueven las muñecas.","Sostén un segundo y baja a la posición inicial inspirando.","Repite las repeticiones indicadas.","Al terminar, deja la barra en el rack o en el suelo flectando las rodillas. Lo más fácil es tomarla del rack o que te la pasen."],"en":"Standing Palms-Up Barbell Behind The Back Wrist Curl","ines":1,"f":"pull","m":"i"},"fdb-Standing_Pelvic_Tilt":{"nombre":"Retroversión pélvica de pie","grupos":["espalda_baja"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Start off with your feet hip-distance apart.","Bend your knees slightly to keep them soft and springy.","You may want to move your pelvis forward and backward and back few times before holding the tailbone forward in this stretch."],"en":"Standing Pelvic Tilt","f":"static","m":"i","sec":["gluteos"]},"fdb-Standing_Rope_Crunch":{"nombre":"Crunch de pie con cuerda","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon una cuerda en una polea alta y elige la carga.","De espaldas a la torre, toma la cuerda con ambas manos por sobre los hombros, sujetándola a la parte alta del pecho. Esta es la posición inicial.","Flecta la columna encogiéndote hacia abajo lo más que puedas.","Sostén la contracción un momento y vuelve a la posición inicial."],"en":"Standing Rope Crunch","ines":1,"f":"pull","m":"i"},"fdb-Standing_Soleus_And_Achilles_Stretch":{"nombre":"Estiramiento de sóleo y Aquiles de pie","grupos":["gemelos"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Stand with your feet hip-distance apart, one foot slightly in front of the other.","Bend both knees, keeping your back heel on the floor. Switch sides."],"en":"Standing Soleus And Achilles Stretch","f":"static","m":"i"},"fdb-Standing_Toe_Touches":{"nombre":"Tocar las puntas de pie","grupos":["isquios"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Stand with some space in front and behind you.","Bend at the waist, keeping your legs straight, until you can relax and let your upper body hang down in front of you. Let your arms and hands hang down naturally. Hold for 10 to 20 seconds."],"en":"Standing Toe Touches","f":"static","sec":["gemelos"]},"fdb-Standing_Towel_Triceps_Extension":{"nombre":"Extensión de tríceps de pie con toalla","grupos":["triceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["De pie, con los brazos estirados sobre la cabeza sosteniendo un extremo de una toalla con ambas manos, codos adentro, brazos perpendiculares al suelo, palmas enfrentadas y pies al ancho de hombros. Esta es la posición inicial.","Tu compañero toma el otro extremo para hacer resistencia. Con los brazos cerca de la cabeza y perpendiculares al suelo, baja en semicírculo detrás de la cabeza hasta que los antebrazos toquen los bíceps, inspirando. Solo se mueven los antebrazos.","Vuelve con los tríceps, botando el aire.","Repite las repeticiones indicadas."],"en":"Standing Towel Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Standing_Two-Arm_Overhead_Throw":{"nombre":"Lanzamiento de pie sobre la cabeza a dos manos","grupos":["hombros"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["Stand with your feet shoulder width apart holding a medicine ball in both hands. To begin, reach the medicine ball deep behind your head as you bend the knees slightly and lean back.","Violently throw the ball forward, flexing at the hip and using your whole body to complete the movement.","The medicine ball can be thrown to a partner or to a wall, receiving it as it bounces back."],"en":"Standing Two-Arm Overhead Throw","f":"pull","m":"c","sec":["dorsales","pectoral"]},"fdb-Star_Jump":{"nombre":"Salto estrella","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Pliometría","inst":["Begin in a relaxed stance with your feet shoulder width apart and hold your arms close to the body.","To initiate the move, squat down halfway and explode back up as high as possible. Fully extend your entire body, spreading your legs and arms away from the body.","As you land, bring your limbs back in and absorb your impact through the legs."],"en":"Star Jump","f":"push","m":"c","sec":["gemelos","gluteos","hombros","isquios"]},"fdb-Step-up_with_Knee_Raise":{"nombre":"Subida al cajón con elevación de rodilla","grupos":["gluteos"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["De pie frente a un cajón o banco de altura adecuada, pies juntos. Esta es la posición inicial.","Apoya el pie izquierdo en el cajón y sube extendiendo cadera y rodilla. Al quedar de pie sobre la pierna izquierda, sube la rodilla derecha lo más alto que puedas.","Baja por el mismo camino y repite con la otra pierna."],"en":"Step-up with Knee Raise","ines":1,"f":"push","m":"c","sec":["cuadriceps","isquios"]},"fdb-Step_Mill":{"nombre":"Escaladora (step mill)","grupos":["cuadriceps"],"eq":"Máquina","niv":"Intermedio","cat":"Cardio","inst":["To begin, step onto the stepmill and select the desired option from the menu. You can choose a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Use caution so that you don't trip as you climb the stairs. It is recommended that you maintain your grip on the handles so that you don't fall.","Stepmills offer convenience, cardiovascular benefits, and usually have less impact than running outside while offering a similar rate of calories burned. They are typically much harder than other cardio equipment. A 150 lb person will typically burn over 300 calories in 30 minutes, compared to about 175 calories walking."],"en":"Step Mill","sec":["gemelos","gluteos","isquios"]},"fdb-Stiff-Legged_Barbell_Deadlift":{"nombre":"Peso muerto piernas rígidas con barra","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Toma una barra en prono. Con cargas altas puedes usar straps.","De pie, torso recto, pies al ancho de hombros o más juntos y rodillas levemente flectadas. Esta es la posición inicial.","Con las rodillas fijas, baja la barra hacia los pies inclinándote desde la cadera con la espalda recta, hasta sentir estiramiento en los isquiotibiales, inspirando.","Sube extendiendo la cadera hasta la posición inicial, botando el aire.","Repite las repeticiones indicadas."],"en":"Stiff-Legged Barbell Deadlift","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gluteos"]},"fdb-Stiff-Legged_Dumbbell_Deadlift":{"nombre":"Peso muerto piernas rígidas con mancuernas","grupos":["isquios"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Toma una mancuerna en cada mano a los costados, brazos estirados.","De pie, torso recto, pies al ancho de hombros o más juntos y rodillas levemente flectadas. Esta es la posición inicial.","Con las rodillas fijas, baja las mancuernas hacia los pies inclinándote desde la cadera con la espalda recta, hasta sentir estiramiento en los isquiotibiales.","Sube extendiendo la cadera hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Stiff-Legged Dumbbell Deadlift","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gluteos"]},"fdb-Stiff_Leg_Barbell_Good_Morning":{"nombre":"Good morning piernas rígidas con barra","grupos":["espalda_baja"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack. Pon la barra a la altura adecuada, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con ambas manos y sácala empujando con las piernas mientras enderezas el torso.","Aléjate del rack, pies al ancho de hombros. Mira al frente y mantén la espalda recta. Esta es la posición inicial.","Con las piernas fijas, inclina el torso desde la cadera inspirando, hasta que quede paralelo al suelo.","Sube el torso a la posición inicial botando el aire.","Repite las repeticiones indicadas."],"en":"Stiff Leg Barbell Good Morning","ines":1,"f":"push","m":"c","sec":["gluteos","isquios"]},"fdb-Stomach_Vacuum":{"nombre":"Vacío abdominal","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["To begin, stand straight with your feet shoulder width apart from each other. Place your hands on your hips. This is the starting position.","Now slowly inhale as much air as possible and then start to exhale as much as possible while bringing your stomach in as much as possible and hold this position. Try to visualize your navel touching your backbone.","One isometric contraction is around 20 seconds. During the 20 second hold, try to breathe normally. Then inhale and bring your stomach back to the starting position.","Once you have practiced this exercise, try to perform this exercise for longer than 20 seconds. Tip: You can work your way up to 40-60 seconds.","Repeat for the recommended amount of sets."],"en":"Stomach Vacuum","f":"static","m":"i"},"fdb-Straight-Arm_Dumbbell_Pullover":{"nombre":"Pullover con mancuerna y brazos rectos","grupos":["pectoral"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Pon una mancuerna de pie sobre un banco plano.","Asegurando que no se caiga, acuéstate cruzado sobre el banco con solo los hombros apoyados, cadera bajo el banco, rodillas flectadas, pies firmes y cabeza fuera del banco.","Toma la mancuerna con ambas manos y sostenla sobre el pecho con los brazos estirados, palmas contra la cara interna de un disco. Esta es la posición inicial. Usa una mancuerna con discos bien fijos.","Con los brazos rectos, baja lento la mancuerna en arco por detrás de la cabeza hasta sentir estiramiento en el pecho, inspirando.","Vuelve por el mismo arco a la posición inicial botando el aire.","Sostén un segundo arriba y repite las repeticiones indicadas."],"en":"Straight-Arm Dumbbell Pullover","ines":1,"f":"pull","m":"c","sec":["dorsales","hombros","triceps"]},"fdb-Straight-Arm_Pulldown":{"nombre":"Jalón con brazos rectos","grupos":["dorsales"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Toma la barra ancha de la polea alta en prono, más ancho que los hombros, y retrocede unos 60 cm.","Inclina el torso unos 30° con los brazos estirados al frente y los codos levemente flectados; retrocede más si no quedan estirados. Activa los dorsales.","Con los brazos rectos, baja la barra contrayendo los dorsales hasta que las manos lleguen a los costados de los muslos, botando el aire.","Con los brazos rectos, vuelve a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Straight-Arm Pulldown","ines":1,"f":"pull","m":"i"},"fdb-Straight_Bar_Bench_Mid_Rows":{"nombre":"Remo medio con barra sobre banco","grupos":["dorsales"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra cargada en el extremo de un banco. Parado sobre el banco detrás de la barra, tómala en prono con agarre medio. Cadera atrás, pecho arriba y columna neutra. Esta es la posición inicial.","Rema la barra hacia el torso juntando las escápulas y flectando los codos, controlado y sin tirones.","Tras una breve pausa, baja lento hasta abajo del todo."],"en":"Straight Bar Bench Mid Rows","ines":1,"f":"pull","m
