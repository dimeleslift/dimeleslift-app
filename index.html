Delt Raise","ines":1,"f":"pull","m":"i"},"fdb-Lying_Supine_Dumbbell_Curl":{"nombre":"Curl supino acostado con mancuernas","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate boca arriba en un banco plano con una mancuerna en cada mano sobre los muslos.","Lleva las mancuernas a los costados con los brazos estirados y las palmas hacia los muslos.","Con los brazos cerca del torso y los codos adentro, baja lento los brazos, casi estirados, lo más que puedas hacia el suelo. Ahí fija los brazos: esta es la posición inicial.","Botando el aire, sube lento las mancuernas girando las muñecas para que las palmas miren hacia arriba, hasta contraer el bíceps por completo. Aprieta fuerte un segundo. Solo se mueven los antebrazos.","Vuelve muy lento a la posición inicial."],"en":"Lying Supine Dumbbell Curl","ines":1,"f":"pull","m":"i"},"fdb-Lying_T-Bar_Row":{"nombre":"Remo T acostado","grupos":["dorsales"],"eq":"Máquina","niv":"Intermedio","cat":"Fuerza","inst":["Carga la máquina de remo T y ajusta la altura de las piernas para que el pecho alto quede en el borde superior del cojín (en algunas máquinas se elige el escalón adecuado).","Acuéstate boca abajo en el cojín y toma los agarres en prono, supino o neutro según la parte de la espalda que quieras enfatizar.","Saca la barra del soporte y estira los brazos. Esta es la posición inicial.","Botando el aire, tira la carga lento hacia arriba y aprieta la espalda. Brazos lo más pegados posible al torso, sin despegar el cuerpo del cojín ni tirar con bíceps.","Tras un segundo arriba, baja lento inspirando.","Repite las repeticiones indicadas."],"en":"Lying T-Bar Row","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Lying_Triceps_Press":{"nombre":"Press de tríceps acostado","grupos":["triceps"],"eq":"Barra Z","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate en un banco plano con una barra Z o recta en el suelo detrás de la cabeza y los pies en el suelo.","Toma la barra con agarre prono medio y súbela sobre ti con los brazos estirados, perpendiculares al torso y al suelo, y codos recogidos. Esta es la posición inicial.","Inspirando, baja lento hasta que la barra roce la frente, sin mover brazos ni codos.","Desde ahí, sube con los tríceps a la posición inicial botando el aire.","Repite las repeticiones indicadas."],"en":"Lying Triceps Press","ines":1,"f":"push","m":"i"},"fdb-Machine_Bench_Press":{"nombre":"Press banca en máquina","grupos":["pectoral"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina de press de pecho y elige la carga.","Pisa la palanca de la máquina para adelantar los agarres, tomarlos y estirar los brazos.","Toma los agarres en prono y sube los codos para que los brazos queden paralelos al suelo, a los costados del torso. Con los brazos estirados estás en la posición inicial.","Trae los agarres hacia ti inspirando.","Empújalos apretando el pecho, botando el aire. Sostén un segundo antes de volver.","Repite las repeticiones indicadas.","Al terminar, pisa de nuevo la palanca y devuelve lento los agarres a su lugar."],"en":"Machine Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Machine_Bicep_Curl":{"nombre":"Curl de bíceps en máquina","grupos":["biceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Ajusta el asiento y elige la carga. Apoya los brazos en el cojín y toma los agarres. Esta es la posición inicial.","Flecta los codos llevando los antebrazos hacia los brazos.","Pausa arriba y vuelve lento a la posición inicial.","No apoyes la carga en los topes hasta terminar la serie, para mantener la tensión."],"en":"Machine Bicep Curl","ines":1,"f":"pull","m":"i"},"fdb-Machine_Preacher_Curls":{"nombre":"Curl Scott en máquina","grupos":["biceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina de curl Scott y elige la carga.","Apoya la parte de atrás de los brazos en el cojín, con los codos adentro, y toma los agarres en supino. Esta es la posición inicial.","Sube los agarres contrayendo el bíceps, botando el aire. Sostén un segundo arriba. Solo se mueven los antebrazos; los brazos siempre en el cojín.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Machine Preacher Curls","ines":1,"f":"pull","m":"i"},"fdb-Machine_Shoulder_Military_Press":{"nombre":"Press militar en máquina","grupos":["hombros"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina de press de hombros y elige la carga.","Toma los agarres a los costados con los codos flectados y en línea con el torso. Esta es la posición inicial.","Empuja hacia arriba hasta estirar los brazos, botando el aire. Sostén un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Machine Shoulder (Military) Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Machine_Triceps_Extension":{"nombre":"Extensión de tríceps en máquina","grupos":["triceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Ajusta el asiento y elige la carga. Apoya los brazos en el cojín y toma los agarres. Esta es la posición inicial.","Extiende los codos alejando los antebrazos de los brazos.","Pausa al final y vuelve lento a la posición inicial.","No apoyes la carga en los topes hasta terminar la serie, para mantener la tensión."],"en":"Machine Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Medicine_Ball_Chest_Pass":{"nombre":"Pase de pecho con balón medicinal","grupos":["pectoral"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["You will need a partner for this exercise. Lacking one, this movement can be performed against a wall.","Begin facing your partner holding the medicine ball at your torso with both hands.","Pull the ball to your chest, and reverse the motion by extending through the elbows. For sports applications, you can take a step as you throw.","Your partner should catch the ball, and throw it back to you.","Receive the throw with both hands at chest height."],"en":"Medicine Ball Chest Pass","f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Medicine_Ball_Full_Twist":{"nombre":"Giro completo con balón medicinal","grupos":["core"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["For this exercise you will need a medicine ball and a partner. Stand back to back with your partner, spaced 2-3 feet apart. This will be your starting position.","Hold the ball in front of the trunk. Open the hips and turn the shoulders at the same time as your partner.","For full rotation, you and your partner should twist in the same direction, i.e. counter-clockwise.","Pass the ball to your partner, and both of you can now twist in the opposite direction to repeat the procedure."],"en":"Medicine Ball Full Twist","f":"pull","m":"c","sec":["hombros"]},"fdb-Medicine_Ball_Scoop_Throw":{"nombre":"Lanzamiento con pala de balón medicinal","grupos":["hombros"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["Assume a semisquat stance with a medicine ball in your hands. Your arms should hang so the ball is near your feet.","Begin by thrusting the hips forward as you extend through the legs, jumping up.","As you do, swing your arms up and over your head, keeping them extended, releasing the ball at the peak of your movement. The goal is to throw the ball the greatest distance behind you."],"en":"Medicine Ball Scoop Throw","f":"push","m":"c","sec":["core","cuadriceps","isquios"]},"fdb-Middle_Back_Shrug":{"nombre":"Encogimiento de espalda media","grupos":["dorsales"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate boca abajo en un banco inclinado con una mancuerna en cada mano, brazos colgando estirados hacia el suelo y palmas enfrentadas. Esta es la posición inicial.","Botando el aire, junta las escápulas y sostén un segundo completo. Es como el reverso de un abrazo, o un vuelo posterior sin brazos.","Vuelve a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Middle Back Shrug","ines":1,"f":"pull","m":"i"},"fdb-Middle_Back_Stretch":{"nombre":"Estiramiento de espalda media","grupos":["dorsales"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Stand so your feet are shoulder width apart and your hands are on your hips.","Twist at your waist until you feel a stretch. Hold for 10 to 15 seconds, then twist to the other side."],"en":"Middle Back Stretch","f":"static","m":"i","sec":["core","espalda_baja"]},"fdb-Mixed_Grip_Chin":{"nombre":"Dominada agarre mixto","grupos":["dorsales"],"eq":"Otro","niv":"Avanzado","cat":"Fuerza","inst":["Toma la barra con las manos unos 2-3 cm más separadas que los hombros, una mano en prono y la otra en supino. Esta es la posición inicial.","Sube botando el aire. Con el brazo en supino, piensa en la espalda y mantén el codo cerca del torso; con el brazo en prono, el codo va más abierto pero en línea con el torso, pensando en el dorsal.","Tras un segundo arriba, baja lento inspirando.","Repite las repeticiones indicadas.","En la serie siguiente, invierte los agarres."],"en":"Mixed Grip Chin","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Monster_Walk":{"nombre":"Caminata monstruo","grupos":["abductores"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Pon una banda alrededor de ambos tobillos y otra alrededor de ambas rodillas, con tensión cuando los pies están al ancho de hombros.","Da pasos cortos hacia adelante alternando pies.","Después de varios pasos, camina hacia atrás hasta volver al punto de partida."],"en":"Monster Walk","ines":1,"f":"pull","m":"c"},"fdb-Mountain_Climbers":{"nombre":"Escaladores","grupos":["cuadriceps"],"eq":"","niv":"Principiante","cat":"Pliometría","inst":["Begin in a pushup position, with your weight supported by your hands and toes. Flexing the knee and hip, bring one leg until the knee is approximately under the hip. This will be your starting position.","Explosively reverse the positions of your legs, extending the bent leg until the leg is straight and supported by the toe, and bringing the other foot up with the hip and knee flexed. Repeat in an alternating fashion for 20-30 seconds."],"en":"Mountain Climbers","f":"pull","m":"c","sec":["hombros","isquios","pectoral"]},"fdb-Moving_Claw_Series":{"nombre":"Serie de garra en movimiento","grupos":["isquios"],"eq":"","niv":"Principiante","cat":"Pliometría","inst":["This move helps prepare your running form to help you excel at sprinting. As you run, be sure to flex the knee, aiming to kick your glutes as the hip extends.","Reload the quad as the leg moves back forward, attacking the ground on the next step.","Ensure that as you run, you block with the arms, punching through in a rapid 1-2 motion."],"en":"Moving Claw Series","m":"c","sec":["cuadriceps","gemelos"]},"fdb-Muscle_Snatch":{"nombre":"Muscle snatch","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Sostén una barra cargada a mitad de muslo con agarre ancho. Pies bajo la cadera con las puntas afuera según necesites. Baja la cadera con el pecho arriba y la mirada al frente, hombros un poco delante de la barra. Esta es la posición inicial.","Inicia empujando con la parte delantera de los talones. Pasa al segundo tirón extendiendo cadera, rodillas y tobillos para subir la barra lo más rápido posible, pegada al cuerpo.","Sigue subiendo la barra hasta sobre la cabeza sin volver a flectar las rodillas."],"en":"Muscle Snatch","ines":1,"f":"pull","m":"c","sec":["cuadriceps","espalda_baja","gluteos","hombros","triceps"]},"fdb-Muscle_Up":{"nombre":"Muscle up","grupos":["dorsales"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Toma las argollas con agarre falso, con la base de las palmas sobre ellas. Inicia una dominada llevando los codos hacia los costados.","Arriba, lleva las argollas a las axilas mientras rotas los hombros hacia adelante y los codos van atrás; eso te deja en posición para el fondo.","Con control y estabilidad, extiende los codos para completar el movimiento.","Baja al suelo con cuidado."],"en":"Muscle Up","ines":1,"f":"pull","m":"c","sec":["antebrazos","biceps","core","hombros","trapecio","triceps"]},"fdb-Narrow_Stance_Hack_Squats":{"nombre":"Sentadilla hack con pies juntos","grupos":["cuadriceps"],"eq":"Máquina","niv":"Intermedio","cat":"Fuerza","inst":["Apoya la espalda en el respaldo de la hack y ubica los hombros bajo los cojines.","Pies juntos en la plataforma (separados unos 8 cm o menos), puntas levemente afuera. Cabeza arriba y espalda siempre apoyada.","Toma los agarres laterales y quita los seguros.","Estira las piernas sin bloquear las rodillas. Esta es la posición inicial.","Baja lento flectando las rodillas, con la espalda en el respaldo, hasta quedar bajo el paralelo, inspirando.","Sube botando el aire, empujando con todo el pie hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Narrow Stance Hack Squats","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Narrow_Stance_Leg_Press":{"nombre":"Prensa con pies juntos","grupos":["cuadriceps"],"eq":"Máquina","niv":"Intermedio","cat":"Fuerza","inst":["Siéntate en la prensa y apoya los pies juntos (unos 8 cm o menos) en la plataforma, puntas levemente afuera. Cabeza arriba y espalda apoyada.","Quita los seguros y empuja la plataforma hasta estirar las piernas sin bloquear las rodillas. Esta es la posición inicial.","Inspirando, baja lento la plataforma hasta que las rodillas formen unos 90°.","Empuja con todo el pie para volver, botando el aire.","Repite las repeticiones indicadas y, al terminar, pon bien los seguros."],"en":"Narrow Stance Leg Press","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Narrow_Stance_Squats":{"nombre":"Sentadilla con pies juntos","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack. Pon la barra a la altura adecuada, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con ambas manos y sácala del rack empujando con las piernas mientras enderezas el torso.","Aléjate del rack con los pies juntos (separados 8-15 cm), puntas levemente afuera. Mira al frente y mantén la espalda neutra. Esta es la posición inicial.","Baja lento flectando las rodillas con el torso firme, hasta quedar bajo el paralelo, inspirando. Las rodillas siguen la dirección de las puntas de los pies.","Sube botando el aire, empujando el suelo con todo el pie hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Narrow Stance Squats","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios"]},"fdb-Natural_Glute_Ham_Raise":{"nombre":"Curl nórdico natural","grupos":["isquios"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Usa el cojín de piernas de una máquina de jalón o un banco Scott: tobillos bajo los cojines, rodillas en el asiento y de espaldas a la máquina, erguido y con buena postura.","Esta es la posición inicial. Baja controlado hasta que las rodillas queden casi estiradas.","Con control, sube de vuelta a la posición inicial.","Si no puedes completar una repetición, ayúdate con una banda, un compañero o empujándote de un cajón."],"en":"Natural Glute Ham Raise","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gemelos","gluteos"]},"fdb-Neck-SMR":{"nombre":"Cuello con foam roller","grupos":["cuello"],"eq":"Otro","niv":"Intermedio","cat":"Elongación","inst":["Using a muscle roller or a rolling pin, place the roller behind your head and against your neck. Make sure that you do not place the roller directly against the spine, but turned slightly so that the roller is pressed against the muscles to either side of the spine. This will be your starting position.","Starting at the top of your neck, slowly roll down the muscles of your neck, pausing at points of tension for 10-30 seconds."],"en":"Neck-SMR","f":"static"},"fdb-Neck_Press":{"nombre":"Press al cuello","grupos":["pectoral"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate en un banco plano. Con agarre medio, saca la barra del rack y sostenla sobre el cuello con los brazos estirados. Esta es la posición inicial.","Inspirando, baja lento hasta sentir la barra cerca del cuello.","Tras una pausa, empuja de vuelta con el pecho botando el aire. Bloquea, aprieta un segundo y vuelve a bajar lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas.","Al terminar, deja la barra en el rack."],"en":"Neck Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Oblique_Crunches":{"nombre":"Crunch oblicuo","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con la zona lumbar pegada al suelo. Una mano junto a la cabeza y la otra apoyada en el suelo al lado.","Pies elevados apoyados sobre una superficie plana.","Despega el hombro del lado de la mano que está junto a la cabeza.","Sube el tronco hasta tocar la rodilla contraria con el codo (codo derecho a rodilla izquierda, o al revés).","Tras tocar, baja a la posición inicial.","Inspira al bajar y bota el aire al subir.","Alterna así hasta completar las repeticiones de cada lado."],"en":"Oblique Crunches","ines":1,"f":"pull","m":"i"},"fdb-Oblique_Crunches_-_On_The_Floor":{"nombre":"Crunch oblicuo en el suelo","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate sobre tu lado derecho con las piernas una sobre otra y las rodillas levemente flectadas.","Pon la mano izquierda detrás de la cabeza.","Sube el codo izquierdo como en un crunch normal, pero enfocado en los oblicuos.","Sube lo más que puedas, sostén un segundo y baja lento a la posición inicial.","Inspira al bajar y bota el aire al subir."],"en":"Oblique Crunches - On The Floor","ines":1,"f":"pull","m":"i"},"fdb-Olympic_Squat":{"nombre":"Sentadilla olímpica","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Apoya la barra sobre los trapecios (barra alta), pecho arriba y mirada al frente. Pies al ancho de cadera con las puntas afuera según necesites.","Baja flectando las rodillas, llevando la cadera atrás lo menos posible; las rodillas avanzan y siguen la línea de los pies. El torso queda lo más erguido posible. Baja hasta el fondo con el peso en la parte delantera del talón.","Cuando los muslos toquen las pantorrillas, invierte y sube."],"en":"Olympic Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-On-Your-Back_Quad_Stretch":{"nombre":"Estiramiento de cuádriceps de espaldas","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Elongación","inst":["Lie on a flat bench or step, and hang one leg and arm over the side.","Bend the knee and hold the top of the foot. As you do this, be careful not to arch your lower back.","Pull the belly button to the spine to stay in neutral. Press your foot down and into your hand. To add the hip stretch, lift the hip of the leg you're holding up toward the ceiling.","Switch sides."],"en":"On-Your-Back Quad Stretch","f":"static","m":"i"},"fdb-On_Your_Side_Quad_Stretch":{"nombre":"Estiramiento de cuádriceps de lado","grupos":["cuadriceps"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Start off by lying on your right side, with your right knee bent at a 90-degree angle resting on the floor in front of you (this stabilizes the torso).","Bend your left knee behind you and hold your left foot with your left hand. To stretch your hip flexor, press your left hip forward as you push your left foot back into your hand. Switch sides."],"en":"On Your Side Quad Stretch","f":"static","m":"i"},"fdb-One-Arm_Dumbbell_Row":{"nombre":"Remo a una mano con mancuerna","grupos":["dorsales"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Usa un banco plano con una mancuerna a cada lado.","Apoya la rodilla derecha en un extremo del banco, inclina el torso hasta dejarlo paralelo al suelo y apoya la mano derecha en el otro extremo.","Toma la mancuerna con la mano izquierda, con la zona lumbar recta y la palma hacia el torso. Esta es la posición inicial.","Tira la mancuerna hacia el costado del pecho con el brazo pegado al cuerpo y el torso quieto, botando el aire. Aprieta la espalda arriba; la fuerza la hace la espalda, no el brazo, y el antebrazo solo sostiene.","Baja la mancuerna a la posición inicial inspirando.","Repite las repeticiones indicadas.","Cambia de lado y repite con el otro brazo."],"en":"One-Arm Dumbbell Row","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-One-Arm_Flat_Bench_Dumbbell_Flye":{"nombre":"Apertura a una mano con mancuerna en banco plano","grupos":["pectoral"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco plano con una mancuerna en una mano sobre el muslo, en agarre neutro.","Ayudándote con el muslo, súbela hasta sostenerla sobre ti con el brazo estirado, en agarre neutro. La otra mano se afirma del banco. Esta es la posición inicial.","Con el codo levemente flectado, baja el brazo en un arco amplio hasta sentir estiramiento en el pecho, inspirando. Solo se mueve el hombro.","Vuelve por el mismo arco apretando el pecho, botando el aire.","Sostén un segundo arriba y repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"One-Arm Flat Bench Dumbbell Flye","ines":1,"f":"push","m":"i"},"fdb-One-Arm_High-Pulley_Cable_Side_Bends":{"nombre":"Inclinación lateral a una mano en polea alta","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un agarre simple en la polea más alta.","Párate de lado al cable y toma el agarre con una mano en supino.","Baja el cable hasta que el codo toque el costado y el agarre quede junto al hombro.","Pies al ancho de cadera y la mano libre en la cintura como referencia.","Con el brazo fijo, contrae el oblicuo para bajar la carga en un crunch lateral.","En la contracción máxima, vuelve lento a la posición inicial sin apoyar la carga, para mantener tensión constante.","Repite hasta el fallo.","Luego cambia de lado y repite."],"en":"One-Arm High-Pulley Cable Side Bends","ines":1,"f":"pull","m":"i"},"fdb-One-Arm_Incline_Lateral_Raise":{"nombre":"Elevación lateral a una mano en banco inclinado","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de lado en un banco inclinado con una mancuerna, con el hombro contra el banco.","Sostén la mancuerna con el brazo de arriba, estirado frente a ti y paralelo al suelo. Esta es la posición inicial.","Manteniendo la mancuerna paralela al suelo, haz una elevación lateral hasta que el brazo apunte al techo, botando el aire. Sostén un segundo.","Inspirando, baja cruzando por delante del cuerpo hasta la posición inicial.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"One-Arm Incline Lateral Raise","ines":1,"f":"push","m":"i"},"fdb-One-Arm_Kettlebell_Clean":{"nombre":"Clean a una mano con kettlebell","grupos":["isquios"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon una kettlebell entre los pies. Al inclinarte a tomarla, lleva la cadera atrás y mira al frente.","Haz clean al hombro extendiendo piernas y cadera, girando la muñeca al recibirla.","Vuelve a la posición inicial."],"en":"One-Arm Kettlebell Clean","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gluteos","hombros","trapecio"]},"fdb-One-Arm_Kettlebell_Clean_and_Jerk":{"nombre":"Clean y envión a una mano con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Toma una kettlebell por el mango.","Haz clean al hombro extendiendo piernas y cadera, girando la muñeca para que la palma mire al frente.","Baja un poco flectando las rodillas, con el torso erguido.","Invierte de inmediato empujando con los talones, como un salto, y con ese impulso empuja la kettlebell hasta bloquear el brazo arriba.","Recíbela arriba bajando a sentadilla bajo la carga.","Con la kettlebell arriba, ponte de pie. Bájala al suelo para la siguiente repetición."],"en":"One-Arm Kettlebell Clean and Jerk","ines":1,"f":"push","m":"c"},"fdb-One-Arm_Kettlebell_Floor_Press":{"nombre":"Press en suelo a una mano con kettlebell","grupos":["pectoral"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate en el suelo con una kettlebell en una mano, el brazo apoyado en el suelo y la palma hacia adentro.","Empuja la kettlebell hacia el techo girando la muñeca.","Bájala a la posición inicial y repite."],"en":"One-Arm Kettlebell Floor Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-One-Arm_Kettlebell_Jerk":{"nombre":"Envión a una mano con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Toma una kettlebell por el mango y haz clean al hombro extendiendo piernas y cadera, girando la muñeca para que la palma mire al frente. Esta es la posición inicial.","Baja un poco flectando las rodillas, con el torso erguido.","Invierte de inmediato empujando con los talones, como un salto, y con ese impulso empuja la kettlebell hasta bloquear arriba. Recíbela bajando a sentadilla bajo la carga y luego ponte de pie con la kettlebell arriba.","Bájala para la siguiente repetición."],"en":"One-Arm Kettlebell Jerk","ines":1,"f":"push","m":"c","sec":["cuadriceps","gemelos","triceps"]},"fdb-One-Arm_Kettlebell_Military_Press_To_The_Side":{"nombre":"Press militar lateral a una mano con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Haz clean de una kettlebell al hombro extendiendo piernas y cadera, con la palma hacia adentro. Esta es la posición inicial.","Mirando la kettlebell, empújala arriba y afuera hasta bloquearla sobre la cabeza.","Bájala controlada al hombro y repite. Contrae con fuerza dorsal, glúteos y abdomen para más estabilidad."],"en":"One-Arm Kettlebell Military Press To The Side","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-One-Arm_Kettlebell_Para_Press":{"nombre":"Para press a una mano con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Haz clean de una kettlebell al hombro extendiendo piernas y cadera, girando la muñeca para que la palma mire al frente. Esta es la posición inicial.","Con el codo abierto hacia el lado, empújala arriba y afuera hasta bloquearla sobre la cabeza.","Bájala controlada al hombro y repite. Contrae con fuerza dorsal, glúteos y abdomen para más estabilidad."],"en":"One-Arm Kettlebell Para Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-One-Arm_Kettlebell_Push_Press":{"nombre":"Push press a una mano con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Toma una kettlebell y haz clean al hombro extendiendo piernas y cadera, girando la muñeca para que la palma mire al frente. Esta es la posición inicial.","Baja un poco flectando las rodillas, con el torso erguido.","Invierte de inmediato empujando con los talones y, con ese impulso, empuja la kettlebell hasta bloquear el brazo arriba. Bájala para la siguiente repetición."],"en":"One-Arm Kettlebell Push Press","ines":1,"f":"push","m":"c","sec":["cuadriceps","gemelos","triceps"]},"fdb-One-Arm_Kettlebell_Row":{"nombre":"Remo a una mano con kettlebell","grupos":["dorsales"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon una kettlebell frente a los pies. Flecta levemente las rodillas y lleva la cadera atrás lo más posible al inclinarte. Toma la kettlebell y tírala hacia el abdomen juntando la escápula y flectando el codo, con la espalda recta. Baja y repite."],"en":"One-Arm Kettlebell Row","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-One-Arm_Kettlebell_Snatch":{"nombre":"Arranque a una mano con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Avanzado","cat":"Fuerza","inst":["Pon una kettlebell entre los pies. Flecta las rodillas y lleva la cadera atrás.","Mirando al frente, balancea la kettlebell hacia atrás entre las piernas.","Invierte de inmediato empujando con cadera y rodillas para acelerarla hacia arriba. Cuando llegue a la altura del hombro, gira la mano y golpea hacia arriba, recibiéndola bloqueada sobre la cabeza."],"en":"One-Arm Kettlebell Snatch","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios","trapecio","triceps"]},"fdb-One-Arm_Kettlebell_Split_Jerk":{"nombre":"Envión en tijera a una mano con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Toma una kettlebell y haz clean al hombro extendiendo piernas y cadera, girando la muñeca para que la palma mire al frente. Esta es la posición inicial.","Baja un poco flectando las rodillas, con el torso erguido.","Invierte de inmediato empujando con los talones y, con ese impulso, empuja la kettlebell hasta bloquear arriba.","Recíbela cayendo en tijera, una pierna adelante y otra atrás.","Con la kettlebell arriba, junta los pies y quédate de pie. Bájala para la siguiente repetición."],"en":"One-Arm Kettlebell Split Jerk","ines":1,"f":"push","m":"c","sec":["cuadriceps","gluteos","isquios","triceps"]},"fdb-One-Arm_Kettlebell_Split_Snatch":{"nombre":"Arranque en tijera a una mano con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Avanzado","cat":"Fuerza","inst":["Toma una kettlebell por el mango con una mano.","Baja en sentadilla y luego extiende cadera, rodillas y tobillos para llevar la kettlebell sobre la cabeza.","Tras la extensión completa, cae en zancada (una pierna adelante y otra atrás) recibiendo la kettlebell bloqueada arriba, en un solo movimiento continuo.","Ponte de pie con la carga arriba y junta los pies. Bájala para volver a la posición inicial."],"en":"One-Arm Kettlebell Split Snatch","ines":1,"f":"pull","m":"c","sec":["cuadriceps","isquios"]},"fdb-One-Arm_Kettlebell_Swings":{"nombre":"Swing a una mano con kettlebell","grupos":["isquios"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":[],"en":"One-Arm Kettlebell Swings","f":"pull","m":"c","sec":["espalda_baja","gemelos","gluteos","hombros"]},"fdb-One-Arm_Long_Bar_Row":{"nombre":"Remo a una mano con barra larga","grupos":["dorsales"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra en un landmine o en una esquina para que no se mueva, y carga tu extremo.","Párate junto a la barra y tómala con una mano cerca del collarín. Usando cadera y piernas, ponte de pie.","Flecta las rodillas, cadera atrás y pecho arriba, con el brazo estirado. Esta es la posición inicial.","Tira la carga hacia el costado juntando la escápula y flectando el codo, sin tirones ni trampa.","Tras una breve pausa, vuelve a la posición inicial."],"en":"One-Arm Long Bar Row","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-One-Arm_Medicine_Ball_Slam":{"nombre":"Slam a una mano con balón medicinal","grupos":["core"],"eq":"Balón medicinal","niv":"Principiante","cat":"Fuerza","inst":["De pie en postura atlética con los pies escalonados. Sostén un balón medicinal con la mano del lado de la pierna de atrás. Esta es la posición inicial.","Lleva el brazo atrás y sube el balón sobre la cabeza, extendiendo cadera, rodillas y tobillos para cargar el lanzamiento.","En la máxima extensión, flecta hombros, columna y cadera para lanzar el balón con fuerza contra el suelo justo frente a ti.","Atrápalo en el rebote y continúa las repeticiones indicadas."],"en":"One-Arm Medicine Ball Slam","ines":1,"f":"pull","m":"c","sec":["dorsales","hombros"]},"fdb-One-Arm_Open_Palm_Kettlebell_Clean":{"nombre":"Clean a una mano con palma abierta y kettlebell","grupos":["isquios"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon una kettlebell entre los pies.","Tómala por el mango con una mano, súbela rápido y deja que gire para que la bola caiga en la palma.","Lánzala hacia adelante y atrápala por el mango con una mano.","Llévala al suelo y repite. Trabaja ambos brazos."],"en":"One-Arm Open Palm Kettlebell Clean","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","espalda_baja","gluteos","hombros"]},"fdb-One-Arm_Overhead_Kettlebell_Squats":{"nombre":"Sentadilla overhead a una mano con kettlebell","grupos":["cuadriceps"],"eq":"Kettlebell","niv":"Avanzado","cat":"Fuerza","inst":["Haz clean y press de una kettlebell con un brazo: llévala al hombro extendiendo piernas y cadera, girando la muñeca, y empújala arriba extendiendo el codo. Esta es la posición inicial.","Mirando al frente y con la kettlebell bloqueada arriba, flecta rodillas y cadera bajando entre las piernas, con cabeza y pecho arriba.","Pausa un segundo abajo y sube empujando con los talones."],"en":"One-Arm Overhead Kettlebell Squats","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","hombros","isquios"]},"fdb-One-Arm_Side_Deadlift":{"nombre":"Peso muerto lateral a una mano","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Fuerza","inst":["Párate al lado de una barra, junto a su centro. Flecta las rodillas y baja hasta alcanzarla.","Toma la barra como si fuera un maletín. Con mucha carga, puedes usar straps. Esta es la posición inicial.","Sube con las piernas botando el aire, con el brazo estirado, hasta quedar de pie.","Baja lento inspirando, flectando las rodillas.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"One-Arm Side Deadlift","ines":1,"f":"pull","m":"c","sec":["core","espalda_baja","gemelos","gluteos","isquios","trapecio"]},"fdb-One-Arm_Side_Laterals":{"nombre":"Elevación lateral a una mano","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Toma una mancuerna con una mano y afírmate con la otra de algo firme, como un banco. Inclínate un poco hacia el lado de la mancuerna para equilibrarte.","Torso recto, mancuerna al costado con el brazo estirado y la palma hacia ti. Esta es la posición inicial.","Sin balancear, sube la mancuerna hacia el lado con el codo levemente flectado y la mano algo inclinada, como sirviendo agua, hasta que el brazo quede paralelo al suelo. Bota el aire y pausa un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"One-Arm Side Laterals","ines":1,"f":"push","m":"i"},"fdb-One-Legged_Cable_Kickback":{"nombre":"Patada de glúteo a una pierna en polea","grupos":["gluteos"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Engancha una tobillera a una polea baja y póntela en un tobillo.","Párate de frente a la máquina a unos 60 cm, afirmándote de la estructura.","Con rodillas y cadera levemente flectadas y el abdomen firme, contrae el glúteo para llevar la pierna hacia atrás en arco, tan alto como sea cómodo, botando el aire. Aprieta un segundo arriba.","Trae la pierna lento hacia adelante, resistiendo el cable, hasta la posición inicial.","Repite las repeticiones indicadas.","Cambia de pierna y repite."],"en":"One-Legged Cable Kickback","ines":1,"f":"push","m":"i","sec":["isquios"]},"fdb-One_Arm_Against_Wall":{"nombre":"Estiramiento de un brazo contra la pared","grupos":["dorsales"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["From a standing position, place a bent arm against a wall or doorway.","Slowly lean toward your arm until you feel a stretch in your lats."],"en":"One Arm Against Wall","f":"static","m":"i"},"fdb-One_Arm_Chin-Up":{"nombre":"Dominada a una mano","grupos":["dorsales"],"eq":"Otro","niv":"Avanzado","cat":"Fuerza","inst":["Pasa una toalla por la barra de dominadas.","Toma la barra con una mano, palma hacia ti, y la toalla con la otra.","Inclina el torso unos 30° atrás, saca pecho y deja una leve curva lumbar. Esta es la posición inicial.","Sube hasta que la barra toque la parte alta del pecho, llevando hombros y brazos abajo y atrás, botando el aire. Aprieta la espalda arriba; solo se mueven los brazos y los antebrazos solo sostienen.","Tras un segundo, inspira y baja lento hasta estirar los brazos y los dorsales.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"One Arm Chin-Up","ines":1,"f":"pull","m":"c","sec":["antebrazos","biceps"]},"fdb-One_Arm_Dumbbell_Bench_Press":{"nombre":"Press banca a una mano con mancuerna","grupos":["pectoral"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco plano con una mancuerna en una mano sobre el muslo.","Ayudándote con el muslo, súbela hasta sostenerla sobre ti al ancho de hombros. Usa la otra mano para ubicarla bien.","Gira la muñeca para que la palma mire hacia tus pies. Esta es la posición inicial.","Baja lento hacia el costado inspirando, con control total. Usa la mano libre solo si necesitas equilibrar; si no, déjala al lado.","Botando el aire, empuja con el pecho. Bloquea, aprieta un segundo y baja lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas en tu programa.","Cambia de brazo y repite."],"en":"One Arm Dumbbell Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-One_Arm_Dumbbell_Preacher_Curl":{"nombre":"Curl Scott a una mano con mancuerna","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Toma una mancuerna con la mano derecha y apoya el brazo sobre un banco Scott o inclinado, con la mancuerna a la altura del hombro. Esta es la posición inicial.","Inspirando, baja lento hasta estirar el brazo y el bíceps por completo.","Botando el aire, sube con el bíceps hasta la altura del hombro. Arriba, el meñique queda más alto que el pulgar para una contracción completa.","Aprieta fuerte un segundo y repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"One Arm Dumbbell Preacher Curl","ines":1,"f":"pull","m":"i"},"fdb-One_Arm_Floor_Press":{"nombre":"Press en suelo a una mano","grupos":["triceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate de espaldas en el suelo o una colchoneta con las rodillas flectadas.","Pide que te pasen la barra en una mano. Empieza con el brazo casi estirado, como en una banca, pero en agarre neutro (palma hacia el torso).","La otra mano va al costado.","Baja la barra hasta que el codo toque el suelo, inspirando.","Súbela de vuelta a la posición inicial botando el aire.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"One Arm Floor Press","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-One_Arm_Lat_Pulldown":{"nombre":"Jalón a una mano","grupos":["dorsales"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Elige la carga y ajusta el cojín de las rodillas para no levantarte. Toma el agarre en prono. Esta es la posición inicial.","Tira el agarre hacia abajo llevando el codo al costado.","Pausa abajo y vuelve lento a la posición inicial.","Entre repeticiones, no apoyes la carga para mantener la tensión."],"en":"One Arm Lat Pulldown","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-One_Arm_Pronated_Dumbbell_Triceps_Extension":{"nombre":"Extensión de tríceps a una mano agarre prono","grupos":["triceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco plano con una mancuerna sobre ti, brazo estirado y perpendicular al cuerpo, palma hacia los pies (agarre prono).","Apoya la otra mano en el bíceps del brazo que trabaja.","Baja lento la mancuerna inspirando.","Súbela contrayendo el tríceps, botando el aire.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"One Arm Pronated Dumbbell Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-One_Arm_Supinated_Dumbbell_Triceps_Extension":{"nombre":"Extensión de tríceps a una mano agarre supino","grupos":["triceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco plano con una mancuerna sobre ti, brazo estirado y perpendicular al cuerpo, palma hacia tu cara (agarre supino).","Apoya la otra mano en el bíceps del brazo que trabaja.","Baja lento la mancuerna inspirando.","Súbela contrayendo el tríceps, botando el aire.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"One Arm Supinated Dumbbell Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-One_Half_Locust":{"nombre":"Media langosta","grupos":["cuadriceps"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Lie facedown on the floor.","Put your left hand under your left hipbone to pad your hip and pubic bone.","Bend your right knee so you can hold the foot in your right hand.","Lift the foot in the air and simultaneously lift your shoulders off the floor. This also stretches the right hip flexor and the chest and shoulders. Switch sides. If it doesn't bother your back, you can try it with both arms and legs at the same time."],"en":"One Half Locust","f":"static","sec":["biceps","core","pectoral"]},"fdb-One_Handed_Hang":{"nombre":"Colgado a una mano","grupos":["dorsales"],"eq":"Otro","niv":"Principiante","cat":"Elongación","inst":["Grab onto a chinup bar with one hand, using a pronated grip. Keep your feet on the floor or a step. Allow the majority of your weight to hang from that hand, while keeping your feet on the ground. Hold for 10-20 seconds and switch sides."],"en":"One Handed Hang","f":"static","sec":["biceps"]},"fdb-One_Knee_To_Chest":{"nombre":"Rodilla al pecho","grupos":["gluteos"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Start off by lying on the floor.","Extend one leg straight and pull the other knee to your chest. Hold under the knee joint to protect the kneecap.","Gently tug that knee toward your nose.","Switch sides. This stretches the buttocks and lower back of the bent leg and the hip flexor of the straight leg."],"en":"One Knee To Chest","f":"static","m":"c","sec":["espalda_baja","isquios"]},"fdb-One_Leg_Barbell_Squat":{"nombre":"Sentadilla a una pierna con barra","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Fuerza","inst":["Párate a unos 60-90 cm delante de un banco plano, de espaldas a él, con una barra en el suelo frente a ti y los pies al ancho de hombros.","Flecta las rodillas y toma la barra en prono, más ancho que los hombros, y súbela hasta el pecho.","Pásala sobre la cabeza y apóyala en la parte alta de la espalda. Lleva un pie atrás con el empeine sobre el banco; el otro queda fijo adelante. Cabeza arriba, espalda recta y pecho afuera.","Inspirando, baja lento hasta que el muslo de adelante quede paralelo al suelo, con el pecho sobre la mitad del muslo.","Guiando con pecho y cadera y contrayendo el cuádriceps, sube a la posición inicial botando el aire.","Repite las repeticiones indicadas.","Cambia de pierna y repite."],"en":"One Leg Barbell Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Open_Palm_Kettlebell_Clean":{"nombre":"Clean con palma abierta y kettlebell","grupos":["isquios"],"eq":"Kettlebell","niv":"Avanzado","cat":"Fuerza","inst":["Pon una kettlebell entre los pies. Haz clean extendiendo piernas y cadera mientras la subes hacia los hombros.","Suéltala al subir y deja que gire para que la bola caiga en las palmas.","Suéltala al frente y atrapa el mango con ambas manos. Bájala a la posición inicial y repite."],"en":"Open Palm Kettlebell Clean","ines":1,"f":"pull","m":"c","sec":["cuadriceps","espalda_baja","gluteos","hombros"]},"fdb-Otis-Up":{"nombre":"Otis-up","grupos":["core"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Fija los pies y acuéstate de espaldas con las rodillas flectadas, sosteniendo una carga al pecho con ambas manos. Esta es la posición inicial.","Flecta cadera y columna para despegar el torso del suelo.","Mientras subes, empuja la carga hasta dejarla sobre la cabeza al final.","Vuelve la carga al pecho mientras bajas, sin llegar a apoyarte del todo en el suelo."],"en":"Otis-Up","ines":1,"f":"pull","m":"c","sec":["hombros","pectoral","triceps"]},"fdb-Overhead_Cable_Curl":{"nombre":"Curl en polea sobre la cabeza","grupos":["biceps"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Elige la misma carga en ambas poleas.","Ajusta ambas poleas a una altura sobre los hombros.","Párate al centro y toma cada agarre en supino, con los brazos estirados y paralelos al suelo y los pies al ancho de hombros. Esta es la posición inicial.","Botando el aire, flecta los codos apretando ambos bíceps hasta que antebrazo y bíceps se toquen.","Inspirando, vuelve a la posición inicial. Solo se mueven los antebrazos.","Repite las repeticiones indicadas en tu programa."],"en":"Overhead Cable Curl","ines":1,"f":"pull","m":"i"},"fdb-Overhead_Lat":{"nombre":"Estiramiento de dorsal sobre la cabeza","grupos":["dorsales"],"eq":"Otro","niv":"Avanzado","cat":"Elongación","inst":["Sit upright on the floor with your partner behind you. Raise one arm straight up, and flex the elbow, attempting to touch your hand to your back. Your parner should hold your tricep and wrist. This will be your starting position.","Attempt to pull your upper arm to your side as your partner prevents you from doing actually doing so.","After 10-20 seconds, relax the arm and allow your partner to further stretch the lat by applying gentle pressure to the tricep. Hold for 10-20 seconds, and then switch sides."],"en":"Overhead Lat","f":"static","sec":["triceps"]},"fdb-Overhead_Slam":{"nombre":"Slam sobre la cabeza","grupos":["dorsales"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["Hold a medine ball with both hands and stand with your feet at shoulder width. This will be your starting position.","Initiate the countermovement by raising the ball above your head and fully extending your body.","Reverse the motion, slamming the ball into the ground directly in front of you as hard as you can.","Receive the ball with both hands on the bounce and repeat the movement."],"en":"Overhead Slam","f":"pull","m":"c"},"fdb-Overhead_Squat":{"nombre":"Sentadilla overhead","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Halterofilia","inst":["Empieza con una barra en el suelo frente a ti y los pies más separados que los hombros.","Flecta las rodillas y toma la barra en prono, con las manos más separadas que los hombros. Súbela hasta el pecho.","Llévala sobre la cabeza y levemente atrás, con los brazos totalmente estirados. Cabeza arriba, espalda recta y escápulas retraídas. Esta es la posición inicial.","Baja lento flectando las rodillas hasta que los muslos queden paralelos al suelo, inspirando. Espalda recta y brazos siempre estirados sobre la cabeza.","Sube empujando con piernas y pies hasta la posición inicial, botando el aire.","Repite las repeticiones indicadas."],"en":"Overhead Squat","ines":1,"f":"push","m":"c","sec":["core","espalda_baja","gemelos","gluteos","hombros","isquios","triceps"]},"fdb-Overhead_Stretch":{"nombre":"Estiramiento sobre la cabeza","grupos":["core"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Standing straight up, lace your fingers together and open your palms to the ceiling. Keep your shoulders down as you extend your arms up.","To create a full torso stretch, pull your tailbone down and stabilize your torso as you do this. Stretch the muscles on both the front and the back of the torso."],"en":"Overhead Stretch","f":"static","m":"c","sec":["antebrazos","dorsales","pectoral","triceps"]},"fdb-Overhead_Triceps":{"nombre":"Estiramiento de tríceps sobre la cabeza","grupos":["triceps"],"eq":"Peso corporal","niv":"Avanzado","cat":"Elongación","inst":["Sit upright on the floor with your partner behind you. Raise one arm straight up, and flex the elbow, attempting to touch your hand to your back. Your parner should hold your elbow and wrist. This will be your starting position.","Attempt to extend the arm straight into the air as your partner prevents you from doing actually doing so.","After 10-20 seconds, relax the arm and allow your partner to further stretch the tricep by applying gentle pressure to the wrist. Hold for 10-20 seconds, and then switch sides."],"en":"Overhead Triceps","f":"static","sec":["dorsales"]},"fdb-Pallof_Press":{"nombre":"Press Pallof","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un agarre simple en la polea, idealmente a la altura de los hombros (si no, abajo).","De lado al cable, toma el agarre con ambas manos y aléjate a un brazo de distancia, con tensión en el cable.","Pies al ancho de cadera y rodillas levemente flectadas, sostén el agarre al centro del pecho. Esta es la posición inicial.","Empuja el agarre al frente hasta estirar ambos brazos, con el core firme y activo.","Sostén varios segundos y vuelve a la posición inicial.","Al terminar la serie, repite mirando hacia el otro lado."],"en":"Pallof Press","ines":1,"f":"pull","m":"i","sec":["hombros","pectoral","triceps"]},"fdb-Pallof_Press_With_Rotation":{"nombre":"Press Pallof con rotación","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un agarre simple en la polea a la altura de los hombros.","De lado al cable, toma el agarre con una mano y aléjate a un brazo de distancia, con el brazo alineado con el cable y tensión en él.","Pies al ancho de cadera, lleva el agarre al pecho y tómalo también con la otra mano.","Mirando al frente, empuja el agarre al frente con el core firme.","Con la cadera fija, gira el torso alejándote de la polea un cuarto de vuelta.","Con la postura rígida y los brazos estirados, vuelve lento y controlado al centro.","Con la tensión lateral aún activa, lleva las manos al pecho y empuja de inmediato hasta estirar. Eso es una repetición.","Repite hasta el fallo.","Luego cambia de lado y repite."],"en":"Pallof Press With Rotation","ines":1,"f":"pull","m":"c","sec":["hombros","pectoral","triceps"]},"fdb-Palms-Down_Dumbbell_Wrist_Curl_Over_A_Bench":{"nombre":"Curl de muñeca prono con mancuernas sobre banco","grupos":["antebrazos"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Pon dos mancuernas a un lado de un banco plano.","Arrodíllate de frente al banco.","Toma las mancuernas en prono (palmas abajo) y apoya los antebrazos sobre el banco con las muñecas fuera del borde.","Extiende las muñecas hacia arriba botando el aire.","Baja lento a la posición inicial inspirando.","Los antebrazos no se mueven; solo trabaja la muñeca.","Repite las repeticiones indicadas."],"en":"Palms-Down Dumbbell Wrist Curl Over A Bench","ines":1,"f":"pull","m":"i"},"fdb-Palms-Down_Wrist_Curl_Over_A_Bench":{"nombre":"Curl de muñeca prono sobre banco","grupos":["antebrazos"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra a un lado de un banco plano.","Arrodíllate de frente al banco.","Toma la barra en prono (palmas abajo) y apoya los antebrazos sobre el banco con las muñecas fuera del borde.","Extiende las muñecas hacia arriba botando el aire.","Baja lento a la posición inicial inspirando.","Los antebrazos no se mueven; solo trabaja la muñeca.","Repite las repeticiones indicadas."],"en":"Palms-Down Wrist Curl Over A Bench","ines":1,"f":"pull","m":"i"},"fdb-Palms-Up_Barbell_Wrist_Curl_Over_A_Bench":{"nombre":"Curl de muñeca supino con barra sobre banco","grupos":["antebrazos"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra a un lado de un banco plano.","Arrodíllate de frente al banco.","Toma la barra en supino (palmas arriba) y apoya los antebrazos sobre el banco con las muñecas fuera del borde.","Flecta las muñecas hacia arriba botando el aire.","Baja lento a la posición inicial inspirando.","Los antebrazos no se mueven; solo trabaja la muñeca.","Repite las repeticiones indicadas."],"en":"Palms-Up Barbell Wrist Curl Over A Bench","ines":1,"f":"pull","m":"i"},"fdb-Palms-Up_Dumbbell_Wrist_Curl_Over_A_Bench":{"nombre":"Curl de muñeca supino con mancuernas sobre banco","grupos":["antebrazos"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Pon dos mancuernas a un lado de un banco plano.","Arrodíllate de frente al banco.","Toma las mancuernas en supino (palmas arriba) y apoya los antebrazos sobre el banco con las muñecas fuera del borde.","Flecta las muñecas hacia arriba botando el aire.","Baja lento a la posición inicial inspirando.","Los antebrazos no se mueven; solo trabaja la muñeca.","Repite las repeticiones indicadas."],"en":"Palms-Up Dumbbell Wrist Curl Over A Bench","ines":1,"f":"pull","m":"i"},"fdb-Parallel_Bar_Dip":{"nombre":"Fondos en paralelas","grupos":["triceps"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Párate entre unas paralelas, apoya una mano en cada barra y da un pequeño salto para quedar arriba con los brazos bloqueados.","Flecta los codos bajando hasta pasar los 90°, sin balancearte y con buena postura.","Extiende los codos para volver a la posición inicial.","Repite las repeticiones indicadas."],"en":"Parallel Bar Dip","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Pelvic_Tilt_Into_Bridge":{"nombre":"Retroversión pélvica a puente","grupos":["espalda_baja"],"eq":"","niv":"Intermedio","cat":"Elongación","inst":["Lie down with your feet on the floor, heels directly under your knees.","Lift only your tailbone to the ceiling to stretch your lower back. (Don't lift the entire spine yet.) Pull in your stomach.","To go into a bridge, lift the entire spine except the neck."],"en":"Pelvic Tilt Into Bridge","f":"static","m":"c"},"fdb-Peroneals-SMR":{"nombre":"Peroneos con foam roller","grupos":["gemelos"],"eq":"Foam roller","niv":"Intermedio","cat":"Elongación","inst":["Lay on your side, supporting your weight on your forearm and on a foam roller placed on the outside of your lower leg. Your upper leg can either be on top of your lower leg, or you can cross it in front of you. This will be your starting position.","Raise your hips off of the ground and begin to roll from below the knee to above the ankle on the side of your leg, pausing at points of tension for 10-30 seconds. Repeat on the other leg."],"en":"Peroneals-SMR","f":"static"},"fdb-Peroneals_Stretch":{"nombre":"Estiramiento de peroneos","grupos":["gemelos"],"eq":"Otro","niv":"Intermedio","cat":"Elongación","inst":["In a seated position, loop a belt, rope, or band around one foot. This will be your starting position.","With the leg extended and the heel off of the ground, pull on the belt so that the foot is inverted, with the inside of the foot being pulled towards you. Hold for 10-20 seconds, and then switch sides."],"en":"Peroneals Stretch","f":"static"},"fdb-Physioball_Hip_Bridge":{"nombre":"Puente de cadera en fitball","grupos":["gluteos"],"eq":"Fitball","niv":"Principiante","cat":"Fuerza","inst":["Apoya la parte alta de la espalda sobre un fitball, con la cadera sin apoyo y los pies en el suelo al ancho de cadera o más. Esta es la posición inicial.","Extiende la cadera con glúteos e isquiotibiales, subiéndola en un puente.","Pausa arriba y vuelve a la posición inicial."],"en":"Physioball Hip Bridge","ines":1,"f":"push","m":"c","sec":["isquios"]},"fdb-Pin_Presses":{"nombre":"Press desde pines","grupos":["triceps"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["La banca desde pines elimina la fase excéntrica y desarrolla fuerza de arranque. También te deja entrenar un rango específico.","Pon el banco dentro de un rack y los pines a la altura deseada, desde casi el bloqueo hasta unos 2-3 cm del pecho. Deja la barra sobre los pines.","Acuéstate con la barra justo sobre tu punto de contacto habitual. Pies atrás y espalda arqueada. Despega, junta y retrae los hombros; usa los pies para empujar los trapecios contra el banco y mantén la tensión.","Usa tu agarre de banca o al ancho de hombros para enfatizar tríceps. Barra, muñeca y codo alineados; aprieta la barra como si quisieras abrirla.","Empuja con toda la fuerza posible, codos recogidos hasta bloquear.","Devuelve la barra a los pines y pausa antes de la siguiente repetición."],"en":"Pin Presses","ines":1,"f":"push","m":"c","sec":["antebrazos","dorsales","hombros","pectoral"]},"fdb-Piriformis-SMR":{"nombre":"Piriforme con foam roller","grupos":["gluteos"],"eq":"Foam roller","niv":"Intermedio","cat":"Elongación","inst":["Sit with your buttocks on top of a foam roll. Bend your knees, and then cross one leg so that the ankle is over the knee. This will be your starting position.","Shift your weight to the side of the crossed leg, rolling over the buttocks until you feel tension in your upper glute. You may assist the stretch by using one hand to pull the bent knee towards your chest. Hold this position for 10-30 seconds, and then switch sides."],"en":"Piriformis-SMR","f":"static","m":"i"},"fdb-Plank":{"nombre":"Plancha","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Ponte boca abajo apoyado en puntas de pie y antebrazos, codos justo bajo los hombros.","Mantén el cuerpo recto todo el tiempo y sostén lo más que puedas. Para hacerlo más difícil, levanta un brazo o una pierna."],"en":"Plank","ines":1,"f":"static","m":"i"},"fdb-Plate_Pinch":{"nombre":"Pinza de discos","grupos":["antebrazos"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Toma dos discos de borde ancho y júntalos con las caras lisas hacia afuera.","Sujétalos con los dedos por un lado y el pulgar por el otro. Esta es la posición inicial.","Aprieta con dedos y pulgar y sostén lo más que puedas.","Repite las series indicadas en tu programa.","Cambia de mano y repite."],"en":"Plate Pinch","ines":1,"f":"static","m":"i"},"fdb-Plate_Twist":{"nombre":"Giro con disco","grupos":["core"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Siéntate en el suelo con las piernas estiradas y el tronco erguido. Toma un disco por los lados con ambas manos frente al abdomen, brazos levemente flectados.","Cruza las piernas a la altura de los tobillos y despégalas del suelo con las rodillas levemente flectadas. Inclina un poco el tronco atrás para equilibrarte. Esta es la posición inicial.","Lleva el disco hacia la izquierda y toca el suelo, botando el aire.","Vuelve al centro inspirando y repite hacia la derecha. Siempre lento y controlado; los tirones pueden lesionar la espalda.","Repite las repeticiones indicadas."],"en":"Plate Twist","ines":1,"f":"pull","m":"c"},"fdb-Platform_Hamstring_Slides":{"nombre":"Deslizamiento de isquiotibiales","grupos":["isquios"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Necesitas un piso liso, como madera. Acuéstate de espaldas con las piernas estiradas y una toalla o un disco liviano bajo un talón. Esta es la posición inicial.","Flecta esa rodilla manteniendo la otra pierna estirada.","Sigue acercando el talón, deslizándolo por el suelo.","Con la rodilla completamente flectada, vuelve a la posición inicial."],"en":"Platform Hamstring Slides","ines":1,"f":"pull","m":"i","sec":["gluteos"]},"fdb-Plie_Dumbbell_Squat":{"nombre":"Sentadilla plié con mancuerna","grupos":["cuadriceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, toma una mancuerna por un extremo con ambas manos. Separa los pies más que los hombros, con las rodillas levemente flectadas.","Puntas de los pies hacia afuera. Los brazos no se mueven. Esta es la posición inicial.","Flecta lento las rodillas y baja hasta que los muslos queden paralelos al suelo, inspirando.","Sube empujando con todo el pie, botando el aire.","Repite las repeticiones indicadas."],"en":"Plie Dumbbell Squat","ines":1,"f":"push","m":"c","sec":["core","gemelos","gluteos","isquios"]},"fdb-Plyo_Kettlebell_Pushups":{"nombre":"Flexiones pliométricas con kettlebell","grupos":["pectoral"],"eq":"Kettlebell","niv":"Avanzado","cat":"Fuerza","inst":["Pon una kettlebell en el suelo. Ponte en posición de flexión de brazos con una mano en el suelo y la otra sobre la kettlebell, codos estirados. Esta es la posición inicial.","Baja lo más que puedas con la espalda recta.","Empuja rápido y con fuerza para pasar al otro lado de la kettlebell, cambiando de mano. Sigue bajando y repitiendo de lado a lado."],"en":"Plyo Kettlebell Pushups","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Plyo_Push-up":{"nombre":"Flexión pliométrica","grupos":["pectoral"],"eq":"Peso corporal","niv":"Principiante","cat":"Pliometría","inst":["Move into a prone position on the floor, supporting your weight on your hands and toes.","Your arms should be fully extended with the hands around shoulder width. Keep your body straight throughout the movement. This will be your starting position.","Descend by flexing at the elbow, lowering your chest towards the ground.","At the bottom, reverse the motion by pushing yourself up through elbow extension as quickly as possible. Attempt to push your upper body up until your hands leave the ground.","Return to the starting position and repeat the exercise.","For added difficulty, add claps into the movement while you are air borne."],"en":"Plyo Push-up","f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Posterior_Tibialis_Stretch":{"nombre":"Estiramiento de tibial posterior","grupos":["gemelos"],"eq":"Otro","niv":"Intermedio","cat":"Elongación","inst":["In a seated position, loop a belt, rope, or band around one foot. This will be your starting position.","With the leg extended and the heel off of the ground, pull on the belt so that the foot is everted, with the outside of the foot being pulled towards you. Hold for 10-20 seconds, and then switch sides."],"en":"Posterior Tibialis Stretch","f":"static"},"fdb-Power_Clean":{"nombre":"Cargada de potencia (power clean)","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Párate con los pies algo más separados que los hombros y las puntas levemente afuera.","Baja y toma la barra con agarre prono cerrado, algo más ancho que los hombros, por fuera de las rodillas y con los codos estirados.","La barra queda a unos 2-3 cm de las canillas, sobre la parte delantera de los pies.","Espalda plana o levemente arqueada, pecho arriba y afuera, escápulas retraídas.","Cabeza neutra, mirando al frente. Inspira.","Despega la barra extendiendo con fuerza cadera y rodillas, botando el aire. El torso mantiene el ángulo; la cadera no sube antes que los hombros.","Codos estirados, cabeza neutra y hombros sobre la barra.","Mientras sube, mantén la barra lo más cerca posible de las canillas.","Al pasar la rodilla, lleva la cadera adelante y flecta levemente las rodillas; los muslos quedan contra la barra.","Espalda plana, codos estirados y cabeza neutra. Aguanta el aire hasta la siguiente fase.","Inspira y extiende con fuerza y rapidez cadera y rodillas, subiendo en puntas de pie.","Barra pegada al cuerpo, espalda plana, codos apuntando a los lados, hombros sobre la barra y brazos estirados el mayor tiempo posible.","Con las piernas completamente extendidas, encoge los hombros rápido sin flectar aún los codos, botando el aire.","Cuando los hombros lleguen arriba, flecta los codos para empezar a meterte bajo la barra.","Sigue tirando con los brazos lo más alto posible. Por lo explosivo, el torso queda erguido o arqueado, la cabeza algo atrás y los pies pueden despegarse.","Con la barra cerca de su altura máxima, métete bajo ella y gira los brazos alrededor y por debajo.","Al mismo tiempo, flecta cadera y rodillas a un cuarto de sentadilla.","Con los brazos bajo la barra, inspira y sube los codos hasta dejar los brazos paralelos al suelo, recibiendo la barra sobre clavículas y deltoides anteriores.","Recibe con el torso erguido y firme, cabeza neutra y pies planos, botando el aire.","Ponte de pie extendiendo cadera y rodillas.","Baja la barra a los muslos soltando de a poco la tensión de los brazos, inspirando.","Flecta a la vez cadera y rodillas para amortiguar la barra en los muslos.","Baja en sentadilla con los codos estirados hasta que la barra toque el suelo.","Vuelve a empezar y repite las repeticiones indicadas."],"en":"Power Clean","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","dorsales","espalda_baja","gemelos","gluteos","hombros","trapecio","triceps"]},"fdb-Power_Clean_from_Blocks":{"nombre":"Cargada de potencia desde bloques","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Con la barra sobre cajones a la altura deseada, tómala justo por fuera de las piernas. Baja la cadera con el peso en los talones, espalda recta, mirada al frente, pecho arriba y hombros un poco delante de la barra. Esta es la posición inicial.","Primer tirón: empuja con los talones extendiendo las rodillas, sin cambiar el ángulo de la espalda y con los brazos estirados. Cuando la barra se acerca a mitad de muslo, empieza a extender la cadera.","Como en un salto, extiende cadera, rodillas y tobillos para acelerar la barra, sin tirar con los brazos. Al final quedas totalmente extendido, levemente inclinado atrás y con los brazos estirados.","Tercer tirón: encoge los hombros y flecta los brazos con los codos arriba y afuera. En la máxima extensión, métete bajo la barra lo justo para recibirla sobre los hombros, girando los codos por debajo. La barra se apoya en los hombros, rozando la garganta, con las manos relajadas.","Recupera de inmediato empujando con los talones, torso erguido y codos arriba, hasta quedar de pie. Devuelve la barra a los cajones."],"en":"Power Clean from Blocks","ines":1,"f":"pull","m":"c","sec":["cuadriceps"]},"fdb-Power_Jerk":{"nombre":"Envión de potencia","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Halterofilia","inst":["Con la barra sobre la parte delantera de los hombros, haz el dip: pies bajo la cadera, flecta las rodillas sin llevar la cadera atrás. Baja poco y cambia de dirección con toda la potencia posible.","Empuja con los talones generando la mayor velocidad y fuerza, y saca la cabeza del camino cuando la barra deje los hombros.","Al despegar, lleva los pies rápido a la posición de recepción, un poco más abiertos y con las rodillas semiflectadas; el empuje de la barra te lleva hacia abajo.","Recibe la barra con los brazos bloqueados sobre la cabeza.","Vuelve a quedar de pie."],"en":"Power Jerk","ines":1,"f":"push","m":"c","sec":["core","gemelos","gluteos","hombros","isquios","triceps"]},"fdb-Power_Partials":{"nombre":"Parciales de potencia","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, erguido, con una mancuerna en cada mano a los costados y codos cerca del torso.","Palmas hacia el torso y pies al ancho de hombros. Esta es la posición inicial.","Con los brazos estirados y el torso quieto, sube las mancuernas hacia los lados hasta la altura de los hombros, botando el aire.","Sostén un segundo y baja a la posición inicial inspirando. Palmas hacia abajo con el meñique un poco más alto para concentrar el trabajo en los hombros.","Repite las repeticiones indicadas."],"en":"Power Partials","ines":1,"f":"push","m":"i"},"fdb-Power_Snatch":{"nombre":"Arranque de potencia (power snatch)","grupos":["isquios"],"eq":"Barra","niv":"Avanzado","cat":"Halterofilia","inst":["Empieza con la barra cargada en el suelo, cerca o tocando las canillas, con agarre ancho. Pies bajo la cadera con las puntas afuera según necesites. Baja la cadera con el pecho arriba y la mirada al frente, hombros un poco delante de la barra. Esta es la posición inicial.","Primer tirón: empuja con la parte delantera de los talones despegando la barra. El ángulo de la espalda no cambia hasta pasar las rodillas.","Segundo tirón: extiende cadera, rodillas y tobillos subiendo la barra lo más rápido posible, pegada al cuerpo. En la máxima extensión, encoge los hombros y deja que los codos se flecten hacia los lados.","Mientras llevas los pies a la recepción, algo más abiertos, métete bajo la barra subiéndola sobre la cabeza. Recíbela en sentadilla parcial con los brazos bloqueados arriba.","Ponte de pie con la barra sobre la cabeza."],"en":"Power Snatch","ines":1,"f":"pull","m":"c","sec":["cuadriceps","espalda_baja","gemelos","gluteos","hombros","trapecio","triceps"]},"fdb-Power_Snatch_from_Blocks":{"nombre":"Arranque de potencia desde bloques","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Empieza con la barra cargada sobre cajones a la altura deseada, con agarre ancho. Pies bajo la cadera con las puntas afuera. Baja la cadera con el pecho arriba y la mirada al frente, hombros un poco delante de la barra y codos afuera. Esta es la posición inicial.","Primer tirón: empuja con la parte delantera de los talones despegando la barra de los cajones.","Segundo tirón: extiende cadera, rodillas y tobillos subiendo la barra lo más rápido posible, pegada al cuerpo. En la máxima extensión, encoge los hombros y deja que los codos se flecten hacia los lados.","Mientras llevas los pies a la recepción, justo por fuera de la cadera, métete con fuerza bajo la barra subiéndola sobre la cabeza. Recíbela sobre una sentadilla completa con los brazos totalmente estirados.","Con la barra sobre la parte delantera de los talones, cabeza y pecho arriba, empuja con los talones hasta quedar de pie. Devuelve la barra a los cajones con cuidado."],"en":"Power Snatch from Blocks","ines":1,"f":"pull","m":"c","sec":["antebrazos","espalda_baja","gemelos","gluteos","hombros","isquios","trapecio","triceps"]},"fdb-Power_Stairs":{"nombre":"Escaleras de potencia","grupos":["isquios"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["En las power stairs se suben implementos por una escalera. Para entrenar, puedes usar un neumático o un cajón.","Toma el implemento con ambas manos, pies bien separados, cabeza y pecho arriba. Empuja el suelo con los talones extendiendo rodillas y cadera para despegarlo.","Al inclinarte atrás, balancea la carga hasta subirla al escalón (normalmente de 40-45 cm). Puedes ayudarte empujando con las piernas.","Haz 3-5 repeticiones y sigue con una carga mayor, lo más rápido posible."],"en":"Power Stairs","ines":1,"f":"pull","m":"c","sec":["aductores","cuadriceps","espalda_baja","gemelos","gluteos","hombros","trapecio"]},"fdb-Preacher_Curl":{"nombre":"Curl Scott","grupos":["biceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Necesitas un banco Scott y una barra Z. Toma la barra por los agarres internos (mejor que te la pasen o tómala del soporte del banco), palmas al frente levemente giradas hacia adentro.","Con los brazos y el pecho apoyados en el cojín, sostén la barra a la altura de los hombros. Esta es la posición inicial.","Inspirando, baja lento hasta estirar el brazo y el bíceps por completo.","Botando el aire, sube con el bíceps hasta la altura de los hombros. Aprieta fuerte un segundo.","Repite las repeticiones indicadas."],"en":"Preacher Curl","ines":1,"f":"pull","m":"i"},"fdb-Preacher_Hammer_Dumbbell_Curl":{"nombre":"Curl martillo Scott con mancuernas","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Apoya ambos brazos sobre un banco Scott con una mancuerna en cada mano, palmas enfrentadas (agarre neutro).","Inspirando, baja lento hasta estirar el brazo y el bíceps por completo.","Botando el aire, sube con el bíceps hasta la altura de los hombros.","Aprieta fuerte un segundo y repite las repeticiones indicadas."],"en":"Preacher Hammer Dumbbell Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Press_Sit-Up":{"nombre":"Abdominal con press","grupos":["core"],"eq":"Barra","niv":"Avanzado","cat":"Fuerza","inst":["Acuéstate en un banco de abdominales con una barra sobre el pecho y las piernas fijas. Esta es la posición inicial.","Inspira y aprieta abdomen y glúteos. Sube el torso como en un abdominal mientras empujas la barra sobre la cabeza, botando el aire, sin dejar de pensar en el abdomen.","Baja el tronco a la posición inicial mientras traes la barra de vuelta al pecho, inspirando.","Repite las repeticiones indicadas."],"en":"Press Sit-Up","ines":1,"f":"push","m":"c","sec":["hombros","pectoral","triceps"]},"fdb-Prone_Manual_Hamstring":{"nombre":"Curl femoral manual boca abajo","grupos":["isquios"],"eq":"","niv":"Principiante","cat":"Fuerza","inst":["Necesitas un compañero. Acuéstate boca abajo con las piernas estiradas; tu compañero pone la mano en tu talón.","Flecta la rodilla subiendo la pierna. Tu compañero opone resistencia, partiendo suave y aumentando hacia el final. Coordinen la intensidad.","Pausa arriba y vuelve mientras tu compañero resiste en sentido contrario."],"en":"Prone Manual Hamstring","ines":1,"f":"static","m":"i"},"fdb-Prowler_Sprint":{"nombre":"Sprint con prowler","grupos":["isquios"],"eq":"Otro","niv":"Principiante","cat":"Cardio","inst":["Place your sled on an appropriate surface, loaded to a suitable weight. The sled should provide enough resistance to require effort, but not so heavy that you are significantly slowed down.","You may use the upright or the low handles for this exercise. Place your hands on the handles with your arms extended, leaning into the implement.","With good posture, drive through the ground with alternating, short steps. Move as fast as you can for a short distance."],"en":"Prowler Sprint","f":"push","m":"c","sec":["cuadriceps","gemelos","gluteos","hombros","pectoral"]},"fdb-Pull_Through":{"nombre":"Pull through","grupos":["gluteos"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Párate a un par de pasos de una polea baja con cuerda o agarre, de espaldas a la máquina, con el cable entre las piernas y los pies bien separados.","Lleva las manos entre las piernas lo más atrás posible flectando la cadera, con las rodillas levemente flectadas. Con los brazos estirados, extiende la cadera hasta quedar de pie. No tires con los hombros; todo el movimiento nace de la cadera."],"en":"Pull Through","ines":1,"f":"pull","m":"c","sec":["espalda_baja","isquios"]},"fdb-Pullups":{"nombre":"Dominadas","grupos":["dorsales"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Toma la barra con las palmas al frente y el agarre indicado: ancho (más que los hombros), medio (al ancho de hombros) o cerrado (más estrecho).","Con los brazos estirados, inclina el torso unos 30° atrás, saca pecho y deja una leve curva lumbar. Esta es la posición inicial.","Sube hasta que la barra toque la parte alta del pecho, llevando hombros y brazos abajo y atrás, botando el aire. Aprieta la espalda arriba; solo se mueven los brazos y los antebrazos solo sostienen.","Tras un segundo, inspira y baja lento hasta estirar los brazos y los dorsales.","Repite las repeticiones indicadas."],"en":"Pullups","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Push-Up_Wide":{"nombre":"Flexión abierta","grupos":["pectoral"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Con las manos bien separadas, apóyate en manos y puntas de pie en plancha alta, codos estirados y cuerpo recto, sin que la cadera se hunda. Esta es la posición inicial.","Flecta los codos bajando el pecho al suelo, inspirando.","Empuja con el pecho extendiendo los codos hasta la posición inicial, botando el aire.","Pausa arriba y repite las repeticiones indicadas."],"en":"Push-Up Wide","ines":1,"m":"c","sec":["core","hombros","triceps"]},"fdb-Push-Ups_-_Close_Triceps_Position":{"nombre":"Flexiones cerradas para tríceps","grupos":["triceps"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Boca abajo, apoya las manos más juntas que los hombros, con los brazos estirados sosteniendo el torso.","Baja hasta que el pecho casi toque el suelo, inspirando.","Empuja con los tríceps y algo de pecho hasta la posición inicial, apretando el pecho, botando el aire.","Tras un segundo arriba, repite las repeticiones indicadas."],"en":"Push-Ups - Close Triceps Position","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Push-Ups_With_Feet_Elevated":{"nombre":"Flexiones con pies elevados","grupos":["pectoral"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Boca abajo, con las manos separadas unos 90 cm y los brazos estirados sosteniendo el torso.","Apoya las puntas de los pies sobre un banco plano. Mientras más alto, más difícil.","Baja hasta que el pecho casi toque el suelo, inspirando.","Empuja con el pecho hasta la posición inicial, apretando, botando el aire.","Tras un segundo arriba, repite las repeticiones indicadas."],"en":"Push-Ups With Feet Elevated","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Push-Ups_With_Feet_On_An_Exercise_Ball":{"nombre":"Flexiones con pies sobre fitball","grupos":["pectoral"],"eq":"Fitball","niv":"Intermedio","cat":"Fuerza","inst":["Boca abajo, con las manos separadas unos 90 cm y los brazos estirados sosteniendo el torso.","Apoya las puntas de los pies sobre un fitball.","Baja hasta que el pecho casi toque el suelo, inspirando.","Empuja con el pecho hasta la posición inicial, apretando, botando el aire.","Tras un segundo arriba, repite las repeticiones indicadas."],"en":"Push-Ups With Feet On An Exercise Ball","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Push_Press":{"nombre":"Push press","grupos":["hombros"],"eq":"Barra","niv":"Avanzado","cat":"Halterofilia","inst":[],"en":"Push Press","f":"push","m":"c","sec":["cuadriceps","triceps"]},"fdb-Push_Press_-_Behind_the_Neck":{"nombre":"Push press tras nuca","grupos":["hombros"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Con la barra en la parte alta de la espalda, haz el dip: pies bajo la cadera, flecta las rodillas sin llevar la cadera atrás. Baja poco e invierte con toda la potencia posible, empujando con los talones y llevando la barra en línea vertical.","Con ese impulso, termina de empujar la barra sobre la cabeza extendiendo los brazos.","Vuelve a la posición inicial absorbiendo el impacto con las piernas."],"en":"Push Press - Behind the Neck","ines":1,"f":"push","m":"c","sec":["cuadriceps","gemelos","triceps"]},"fdb-Push_Up_to_Side_Plank":{"nombre":"Flexión a plancha lateral","grupos":["pectoral"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Ponte en posición de flexión de brazos con las manos un poco más separadas que los hombros.","Haz una flexión manteniendo el cuerpo recto.","Al subir, pasa el peso al lado izquierdo y gira llevando el brazo derecho hacia el techo en plancha lateral.","Baja el brazo para otra flexión y gira hacia el otro lado.","Alterna así por 10 o más repeticiones."],"en":"Push Up to Side Plank","ines":1,"f":"push","m":"c","sec":["core","hombros","triceps"]},"fdb-Pushups":{"nombre":"Flexiones de brazos","grupos":["pectoral"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Boca abajo, con las manos separadas unos 90 cm y los brazos estirados sosteniendo el torso.","Baja hasta que el pecho casi toque el suelo, inspirando.","Bota el aire y empuja de vuelta apretando el pecho.","Tras una breve pausa arriba, repite las veces que necesites."],"en":"Pushups","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Pushups_Close_and_Wide_Hand_Positions":{"nombre":"Flexiones (cerradas y abiertas)","grupos":["pectoral"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Boca abajo, cuerpo recto y puntas de pie en el suelo. Manos más separadas que los hombros para la versión ancha, o más juntas para la cerrada, con los brazos estirados.","Baja hasta que el pecho casi toque el suelo, inspirando.","Empuja con el pecho hasta la posición inicial, apretando, botando el aire.","Tras un segundo arriba, repite las repeticiones indicadas."],"en":"Pushups (Close and Wide Hand Positions)","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Pyramid":{"nombre":"Pirámide","grupos":["espalda_baja"],"eq":"Fitball","niv":"Principiante","cat":"Elongación","inst":["Start off by rolling your torso forward onto the ball so your hips rest on top of the ball and become the highest point of your body.","Rest your hands and feet on the floor. Your arms and legs can be slightly bent or straight, depending on the size of the ball, your flexibility, and the length of your limbs. This also helps develop stabilizing strength in your torso and shoulders."],"en":"Pyramid","f":"static","sec":["hombros"]},"fdb-Quad_Stretch":{"nombre":"Estiramiento de cuádriceps","grupos":["cuadriceps"],"eq":"Otro","niv":"Intermedio","cat":"Elongación","inst":["L
