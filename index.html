odillas","en":"knee push-ups","grupos":["hombros","pectoral"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Arrodíllate con las rodillas juntas y las manos en el suelo, algo más separadas que los hombros y bajo ellos.","Forma una línea recta de cabeza a rodillas.","Baja el torso flectando los codos con el tronco estable y las rodillas apoyadas.","Empuja de vuelta. Haz las repeticiones con control y buena técnica."],"ines":1,"src":"wger","autor":"PaukOne","lic":"CC-BY-SA 4.0"},"wg-1234":{"nombre":"Hip thrust a una pierna con mancuerna","en":"Dumbbell Single-leg Hip Thrust","grupos":["gluteos"],"eq":"Barra","niv":"","cat":"Fuerza","inst":["Apoya la parte alta de la espalda en un banco, con una mancuerna sobre la cadera.","Sube una pierna y extiende la cadera con la otra hasta quedar en línea recta, apretando el glúteo.","Baja controlado. Completa las repeticiones y cambia de pierna."],"ines":1,"src":"wger","autor":"carlos3c","lic":"CC-BY-SA 4.0"},"wg-1245":{"nombre":"Front lever","en":"Front Lever","grupos":["dorsales","core"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Colgado de la barra con los brazos estirados, lleva el cuerpo completo a horizontal, paralelo al suelo, y sostén.","Escápulas deprimidas, core y glúteos firmes."],"ines":1,"src":"wger","autor":"clafal","lic":"CC-BY-SA 4.0"},"wg-1284":{"nombre":"Flexión pseudo planche","en":"Pseudo Planche Push-up","grupos":["hombros"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["En posición de flexión, adelanta los hombros por delante de las muñecas.","Haz la flexión manteniendo los hombros en esa posición adelantada."],"ines":1,"src":"wger","autor":"vdrb","lic":"CC-BY-SA 4.0"},"wg-1303":{"nombre":"Remo Helms","en":"Helms Row","grupos":["dorsales"],"eq":"Mancuernas","niv":"","cat":"Fuerza","inst":["Apoya el pecho en el extremo de un banco (a la altura de los pezones), con una toalla para protegerlo y la espalda casi paralela al suelo.","Tira los codos hacia atrás hasta sentir el máximo apretón en los dorsales.","Para trabajar trapecios, relaja las escápulas abajo y retráelas al iniciar cada repetición."],"ines":1,"src":"wger","autor":"carlos3c","lic":"CC-BY-SA 4.0"},"wg-1304":{"nombre":"Remo Meadows","en":"Meadows Row","grupos":["dorsales","trapecio"],"eq":"Barra","niv":"","cat":"Fuerza","inst":["Remo unilateral con barra en landmine, agarre prono y pies escalonados.","Inclina el torso, toma el extremo de la barra y apoya el otro antebrazo sobre la pierna de adelante.","Lleva el codo hacia atrás juntando la escápula, con el hombro abajo, hasta que el codo quede a la altura del torso."],"ines":1,"src":"wger","autor":"carlos3c","lic":"CC-BY-SA 4.0"},"wg-1353":{"nombre":"Press hex con mancuernas","en":"Dumbbell Hex Press","grupos":["pectoral"],"eq":"Mancuernas","niv":"","cat":"Fuerza","inst":["Acuéstate en un banco con dos mancuernas juntas sobre el pecho, apretándolas entre sí.","Pies firmes y separados, cuerpo tenso.","Baja lento y controlado hacia la parte baja del pecho sin dejar de apretar las mancuernas, y empuja de vuelta."],"ines":1,"src":"wger","autor":"Anastasious","lic":"CC-BY-SA 4.0"},"wg-1370":{"nombre":"Peso muerto con mancuernas","en":"Dumbbell Deadlift","grupos":["cuadriceps"],"eq":"Mancuernas","niv":"","cat":"Fuerza","inst":["De pie con una mancuerna a cada lado.","Lleva la cadera atrás bajando las mancuernas con la espalda recta y vuelve a quedar de pie.","Lento y controlado, sin impulso."],"ines":1,"src":"wger","autor":"Anastasious","lic":"CC-BY-SA 4.0"},"wg-1384":{"nombre":"Pullover en máquina","en":"Pullover Machine","grupos":["dorsales"],"eq":"","niv":"","cat":"Fuerza","inst":["Siéntate en la máquina de pullover con los codos apoyados en los cojines.","Lleva los brazos desde arriba hacia abajo en arco, contrayendo los dorsales, y vuelve controlado."],"ines":1,"src":"wger","autor":"Paul@Chemistry","lic":"CC-BY-SA 4.0"},"wg-1407":{"nombre":"Sentadilla cosaca","en":"Cossack squat","grupos":["gluteos","cuadriceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Pies muy separados. Baja hacia un lado flectando esa rodilla mientras la otra pierna queda estirada con la punta hacia arriba.","Sube y pasa al otro lado. Mejora fuerza, movilidad y estabilidad de piernas y cadera."],"ines":1,"src":"wger","autor":"clafal","lic":"CC-BY-SA 4.0"},"wg-1409":{"nombre":"Dragon flag","en":"Dragon-flag","grupos":["core"],"eq":"","niv":"","cat":"Fuerza","inst":["Acostado en un banco, tómate firme por detrás de la cabeza.","Sube el cuerpo recto apoyado solo en la parte alta de la espalda y baja lento sin quebrar la cadera ni hundir la zona lumbar.","Empieza con versiones más simples, como con rodillas flectadas."],"ines":1,"src":"wger","autor":"clafal","lic":"CC-BY-SA 4.0"},"wg-1410":{"nombre":"Plancha con elevación de pierna","en":"Plank with Alternating Leg Lift","grupos":["gluteos"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["En posición de plancha, levanta una pierna alternadamente."],"ines":1,"src":"wger","autor":"hpmbala@gmail.com","lic":"CC-BY-SA 4.0"},"wg-1437":{"nombre":"Sentadilla desde pines","en":"Pin Squat","grupos":["isquios","gluteos","cuadriceps"],"eq":"Barra","niv":"","cat":"Fuerza","inst":["Pon los pines de seguridad a la altura de tu punto de estancamiento.","Baja la barra hasta los pines y descansa 2 segundos sin perder la tensión.","Sube con la máxima fuerza posible."],"ines":1,"src":"wger","autor":"M9","lic":"CC-BY-SA 4.0"},"wg-1439":{"nombre":"Press militar desde pines","en":"Pin OHP","grupos":["hombros","triceps"],"eq":"Barra","niv":"","cat":"Fuerza","inst":["Pon los pines de seguridad a la altura del mentón.","Con la barra sobre los pines y sin perder tensión, empújala sobre la cabeza.","Bájala de vuelta a los pines y repite."],"ines":1,"src":"wger","autor":"M9","lic":"CC-BY-SA 4.0"},"wg-1450":{"nombre":"Estiramiento de cobra","en":"Cobra Stretch","grupos":["core"],"eq":"Peso corporal","niv":"","cat":"Elongación","inst":["El estiramiento de Cobra es un ejercicio de extensión de espalda que ayuda a mejorar la flexibilidad de la columna y aliviar la tensión en la zona lumbar.","Para realizarlo, acuéstate boca abajo con las manos apoyadas debajo de los hombros.","Presiona las palmas contra el suelo y levanta el pecho mientras mantienes las caderas en el suelo.","Mantén los codos ligeramente flexionados y los hombros relajados.","Sostén la posición por unos segundos y luego baja lentamente.","Este ejercicio es ideal para mejorar la postura y reducir la rigidez en la parte baja de la espalda."],"ines":1,"src":"wger","autor":"hpmbala@gmail.com","lic":"CC-BY-SA 4.0"},"wg-1458":{"nombre":"Elevación en Y cruzada en polea","en":"Cross-Body Cable Y-Raise","grupos":["hombros","dorsales","trapecio"],"eq":"","niv":"","cat":"Fuerza","inst":["Engancha un agarre en D a la polea baja.","Llévalo cruzando el cuerpo hacia arriba y afuera en diagonal, como si desenvainaras una espada, hasta formar una Y."],"ines":1,"src":"wger","autor":"Expenses7000","lic":"CC-BY-SA 4.0"},"wg-1470":{"nombre":"Jalón a una mano semiarrodillado","en":"1-Arm Half-Kneeling Lat Pulldown","grupos":["dorsales"],"eq":"","niv":"","cat":"Fuerza","inst":["Engancha un agarre en D a la polea alta y arrodíllate con una pierna adelante.","Tira con el dorsal a una mano, llevando el codo hacia la cadera."],"ines":1,"src":"wger","autor":"Expenses7000","lic":"CC-BY-SA 4.0"},"wg-1471":{"nombre":"Remo Kroc","en":"Kroc Row","grupos":["dorsales","trapecio"],"eq":"","niv":"","cat":"Fuerza","inst":["Remo a una mano con mancuerna pesada, con técnica más suelta y muchas repeticiones."],"ines":1,"src":"wger","autor":"Expenses7000","lic":"CC-BY-SA 4.0"},"wg-1493":{"nombre":"Curl bayesiano en polea","en":"Bayesian Curl","grupos":["biceps"],"eq":"","niv":"","cat":"Fuerza","inst":["De espaldas a una polea baja, da un paso adelante con el brazo estirado hacia atrás (hombro estirado).","Haz el curl sin adelantar el codo y vuelve hasta estirar bien el bíceps."],"ines":1,"src":"wger","autor":"aahuja","lic":"CC-BY-SA 4.0"},"wg-1509":{"nombre":"Patada de tríceps en polea","en":"Cable Tricep Kickback","grupos":["triceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Toma el agarre de la polea y lleva el codo arriba y atrás, levemente sobre el torso.","Mantén el brazo paralelo al suelo y extiende el codo hacia atrás. Vuelve controlado."],"ines":1,"src":"wger","autor":"Expenses7000","lic":"CC-BY-SA 4.0"},"wg-1516":{"nombre":"Pino (handstand)","en":"Handstand","grupos":["hombros"],"eq":"","niv":"","cat":"Fuerza","inst":["Haz el pino sin apoyo, empujando el suelo con los brazos y contrayendo core y glúteos.","Sostén el tiempo indicado."],"ines":1,"src":"wger","autor":"Fittness69","lic":"CC-BY-SA 4.0"},"wg-1521":{"nombre":"Hack pendular","en":"Pendular hack","grupos":["cuadriceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Ubica los hombros bajo los cojines de la hack pendular y los pies al centro de la plataforma.","Baja controlado en sentadilla y sube empujando con todo el pie."],"ines":1,"src":"wger","autor":"admin","lic":"CC-BY-SA 4.0"},"wg-1527":{"nombre":"Sentadilla péndulo","en":"Pendulum Squat","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Pies al centro de la plataforma, al ancho de hombros.","Tensa el torso, relaja el cuello y baja en sentadilla siguiendo el arco de la máquina. Sube empujando con todo el pie."],"ines":1,"src":"wger","autor":"schweezer","lic":"CC-BY-SA 4.0"},"wg-1528":{"nombre":"Glute drive (máquina de hip thrust)","en":"Glute Drive","grupos":["gluteos"],"eq":"","niv":"","cat":"Fuerza","inst":["Acuéstate con la espalda en el respaldo y ajusta el cinturón sobre la cadera.","Pies al ancho de hombros y puntas levemente afuera.","Extiende la cadera empujando con los pies hasta quedar en línea recta, aprieta los glúteos y baja controlado."],"ines":1,"src":"wger","autor":"schweezer","lic":"CC-BY-SA 4.0"},"wg-1529":{"nombre":"Pies a la barra (toes to bar)","en":"Toes to bar","grupos":["core"],"eq":"Barra de dominadas","niv":"","cat":"Fuerza","inst":["Cuelga de la barra de dominadas.","Sube las piernas hasta tocar la barra con las puntas de los pies, contrayendo el abdomen.","Baja controlado sin balancearte."],"ines":1,"src":"wger","autor":"florian.bussmann","lic":"CC-BY-SA 4.0"},"wg-1537":{"nombre":"Isométrico de dominada arriba","en":"Pull-up Isometric Hold","grupos":["biceps","dorsales","trapecio"],"eq":"Barra de dominadas","niv":"","cat":"Fuerza","inst":["Sostén la dominada en la posición indicada (arriba, al medio o abajo) el mayor tiempo posible."],"ines":1,"src":"wger","autor":"DiscoCop","lic":"CC-BY-SA 4.0"},"wg-1545":{"nombre":"Dominada arquero","en":"Archer Pull Up","grupos":["dorsales"],"eq":"","niv":"","cat":"Fuerza","inst":["Toma la barra en prono, más ancho que los hombros, y cuelga con el core activo y las escápulas abajo.","Sube hacia una mano mientras estiras el otro brazo hacia el lado lo más recto posible, llevando el mentón hacia la mano que tira.","Sostén arriba y baja lento con control.","Alterna lados. Es una progresión hacia la dominada a una mano."],"ines":1,"src":"wger","autor":"Antsy6277","lic":"CC-BY-SA 4.0"},"wg-1546":{"nombre":"Press Larsen","en":"Larsen Press","grupos":["pectoral"],"eq":"Barra","niv":"","cat":"Fuerza","inst":["Haz el press banca con las piernas estiradas apoyadas en otro banco o en el aire, sin impulso de piernas.","Exige más estabilidad del tronco y control de la barra."],"ines":1,"src":"wger","autor":"Expenses7000","lic":"CC-BY-SA 4.0"},"wg-1556":{"nombre":"Devil's press","en":"Devil’s Press","grupos":["hombros","gluteos","pectoral"],"eq":"Mancuernas","niv":"","cat":"Fuerza","inst":["Con una mancuerna en cada mano, haz un burpee apoyando el pecho en el suelo sobre las mancuernas.","Salta con los pies hacia adelante y balancea las mancuernas entre las piernas.","Llévalas sobre la cabeza en un solo movimiento continuo hasta bloquear los brazos.","Baja controlado y repite."],"ines":1,"src":"wger","autor":"Settebello","lic":"CC-BY-SA 4.0"},"wg-1572":{"nombre":"Bird dog","en":"Bird Dog","grupos":["core"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["En cuatro apoyos, manos bajo los hombros y rodillas bajo la cadera, columna neutra.","Estira a la vez el brazo derecho al frente y la pierna izquierda atrás, con la cadera nivelada.","Pausa activando core y glúteos, vuelve y repite con el otro lado."],"ines":1,"src":"wger","autor":"Settebello","lic":"CC-BY-SA 4.0"},"wg-1578":{"nombre":"Bisagra de cadera con bastón","en":"Hip hinge","grupos":["isquios","gluteos"],"eq":"Barra","niv":"","cat":"Fuerza","inst":["De pie, pies al ancho de cadera y rodillas levemente flectadas. Puedes apoyar un bastón en la espalda tocando nuca, espalda alta y sacro.","Lleva la cadera atrás con la espalda recta y el pecho arriba, hasta casi quedar paralelo o sentir estiramiento en los isquiotibiales.","Vuelve empujando con los talones y llevando la cadera adelante. Es la base del peso muerto, el swing y el good morning."],"ines":1,"src":"wger","autor":"mountain.potato","lic":"CC-BY-SA 4.0"},"wg-1605":{"nombre":"Aducción Copenhague","en":"Copenhagen Adduction Exercise","grupos":["gluteos","cuadriceps"],"eq":"Banco","niv":"","cat":"Fuerza","inst":["Acuéstate de lado con el codo bajo el hombro, como en plancha lateral.","Apoya la pierna de arriba en un banco (cara interna del pie o tobillo).","Sube la cadera y sostén el cuerpo en línea recta con la pierna de abajo sin tocar el suelo. Trabaja fuerte los aductores, además del core y los estabilizadores de cadera."],"ines":1,"src":"wger","autor":"RiccaBaro","lic":"CC-BY-SA 4.0"},"wg-1670":{"nombre":"Balanceo de piernas adelante-atrás","en":"Leg Swings (Front–Back)","grupos":["isquios"],"eq":"Peso corporal","niv":"","cat":"Elongación","inst":["De pie junto a una pared o apoyo, con el torso erguido y el core activo.","Balancea una pierna adelante y atrás de forma controlada.","Completa las repeticiones y cambia de pierna."],"ines":1,"src":"wger","autor":"Jhonatan","lic":"CC-BY-SA 4.0"},"wg-1679":{"nombre":"Ángeles en la pared","en":"Wall Angels","grupos":["trapecio"],"eq":"","niv":"","cat":"Elongación","inst":["De espaldas a la pared con glúteos, espalda y nuca apoyados, brazos en “W” contra la pared.","Desliza los brazos hacia arriba sin despegarlos ni arquear la espalda, y vuelve. Mejora postura, movilidad de hombros y control escapular."],"ines":1,"src":"wger","autor":"bbayuwega","lic":"CC-BY-SA 4.0"},"wg-1684":{"nombre":"Thruster con mancuernas","en":"Dumbbell Thruster","grupos":["isquios","gluteos","cuadriceps"],"eq":"Mancuernas","niv":"","cat":"Fuerza","inst":["Con las mancuernas sobre los hombros, baja en sentadilla.","Al subir, empuja las mancuernas sobre la cabeza.","Vuelve a llevarlas a los hombros y repite."],"ines":1,"src":"wger","autor":"meldun","lic":"CC-BY-SA 4.0"},"wg-1688":{"nombre":"Peso muerto rumano kickstand","en":"Kickstand RDL","grupos":["isquios"],"eq":"Barra","niv":"","cat":"Fuerza","inst":["Apoya la punta del pie de la pierna que no trabaja un poco atrás, solo para equilibrarte.","Haz un peso muerto rumano cargando casi todo el peso en la pierna de adelante."],"ines":1,"src":"wger","autor":"eriktrinkle","lic":"CC-BY-SA 4.0"},"wg-1696":{"nombre":"Dominadas agarre neutro","en":"Pull-Ups (Neutral Grip)","grupos":["dorsales"],"eq":"","niv":"","cat":"Fuerza","inst":["Toma agarres paralelos con las palmas enfrentadas.","Tira los codos abajo y atrás llevando el pecho hacia las manos, con los hombros abajo y atrás (sin encogerlos).","Arriba, el mentón llega a la altura de las manos. Pausa apretando los dorsales y baja controlado."],"ines":1,"src":"wger","autor":"daiben","lic":"CC-BY-SA 4.0"},"wg-1710":{"nombre":"Estiramiento bloque de carnicero","en":"Butchers Block Stretch","grupos":["dorsales"],"eq":"Banco","niv":"","cat":"Elongación","inst":["Arrodíllate frente a un banco con las manos juntas.","Apoya los codos en el banco y baja el pecho hacia el suelo.","Mantén los codos flectados y buena postura, y sostén."],"ines":1,"src":"wger","autor":"Croak6728","lic":"CC-BY-SA 4.0"},"wg-1711":{"nombre":"Estiramiento del durmiente","en":"Sleeper Stretch","grupos":["hombros"],"eq":"Peso corporal","niv":"","cat":"Elongación","inst":["Acuéstate de lado sobre el hombro que vas a estirar, con algo de peso sobre la escápula para fijarla.","Brazo al frente a 90° y codo flectado, con los dedos hacia el techo.","Sin mover el codo, baja suave la palma hacia el suelo con ayuda de la otra mano."],"ines":1,"src":"wger","autor":"Croak6728","lic":"CC-BY-SA 4.0"},"wg-1713":{"nombre":"Estiramiento de pectoral en marco de puerta","en":"Doorway Pectoral Stretch","grupos":["pectoral"],"eq":"Peso corporal","niv":"","cat":"Elongación","inst":["Apoya el antebrazo vertical en el marco de una puerta a la altura de la cabeza.","Da un paso adelante sin mover el brazo hasta sentir el estiramiento en el pecho, y sostén."],"ines":1,"src":"wger","autor":"Croak6728","lic":"CC-BY-SA 4.0"},"wg-1739":{"nombre":"Sentadilla camarón","en":"Shrimp Squad","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Sentadilla a una pierna con la otra flectada detrás, tomándote el pie.","Baja hasta tocar suave el suelo con la rodilla de atrás y sube."],"ines":1,"src":"wger","autor":"Happy","lic":"CC-BY-SA 4.0"},"wg-1742":{"nombre":"Back lever","en":"Back Lever","grupos":["dorsales"],"eq":"Barra de dominadas, Peso corporal","niv":"","cat":"Fuerza","inst":["Colgado de la barra, gira el cuerpo hasta quedar boca abajo y horizontal con los brazos estirados detrás.","Sostén con el cuerpo recto. Empieza con versiones recogidas."],"ines":1,"src":"wger","autor":"Happy","lic":"CC-BY-SA 4.0"},"wg-1743":{"nombre":"Limpiaparabrisas colgado","en":"Windshield Wipers","grupos":["core"],"eq":"Barra de dominadas, Peso corporal","niv":"","cat":"Fuerza","inst":["Cuelga de la barra y sube las piernas hacia el techo.","Con las piernas estiradas, llévalas de izquierda a derecha como un limpiaparabrisas."],"ines":1,"src":"wger","autor":"Happy","lic":"CC-BY-SA 4.0"},"wg-1776":{"nombre":"Paseo de maleta (suitcase carry)","en":"Suitcase Carry","grupos":["core"],"eq":"Mancuernas","niv":"","cat":"Fuerza","inst":["Camina sosteniendo una mancuerna pesada en una sola mano, sin inclinarte para compensar.","Recorre la distancia indicada y cambia de mano."],"ines":1,"src":"wger","autor":"aboksz","lic":"CC-BY-SA 4.0"},"wg-1777":{"nombre":"Flexiones con déficit","en":"Deficit Push ups","grupos":["pectoral"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Haz flexiones con las manos sobre bloques o agarres, para bajar el pecho más allá de las manos."],"ines":1,"src":"wger","autor":"Rottekongen","lic":"CC-BY-SA 4.0"},"wg-1803":{"nombre":"Sentadilla con barra hexagonal","en":"Trap Bar Squat","grupos":["cuadriceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Sentadilla con barra hexagonal (trap bar): mezcla de sentadilla y peso muerto.","Centra mejor la carga y reduce la exigencia sobre la zona lumbar."],"ines":1,"src":"wger","autor":"kmcalderwood","lic":"CC-BY-SA 4.0"},"wg-1804":{"nombre":"Movilidad de dorsiflexión de tobillo","en":"ankle dorsiflexion rocks","grupos":["gemelos"],"eq":"Peso corporal","niv":"","cat":"Elongación","inst":["Apoya un pie adelante con la rodilla flectada.","Lleva la rodilla hacia adelante sobre los dedos sin despegar el talón, y vuelve.","Repite varias veces y cambia de lado."],"ines":1,"src":"wger","autor":"Davidgj32","lic":"CC-BY-SA 4.0"},"wg-1822":{"nombre":"Libro abierto (rotación torácica)","en":"Open Book","grupos":["dorsales"],"eq":"Peso corporal","niv":"","cat":"Elongación","inst":["Arrodíllate con el lado derecho hacia una pared, rodilla derecha abajo y pie izquierdo adelante, cadera estable.","Brazos al frente del pecho con las palmas enfrentadas.","Inspirando, abre el brazo izquierdo hacia atrás girando desde la espalda alta, sin mover la pelvis; la mirada sigue la mano.","Vuelve lento al frente. Repite y cambia de lado."],"ines":1,"src":"wger","autor":"teus_ergaster","lic":"CC-BY-SA 4.0"},"wg-1823":{"nombre":"Almeja (clamshell)","en":"Clamshell","grupos":["gluteos","core"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Acuéstate de lado apoyado en el antebrazo, con las piernas levemente flectadas.","Separa la rodilla de arriba manteniendo los pies juntos, como una almeja que se abre, y vuelve lento.","Core estable y cadera alineada."],"ines":1,"src":"wger","autor":"teus_ergaster","lic":"CC-BY-SA 4.0"},"wg-1829":{"nombre":"Sentadilla con press landmine","en":"Landmine Squat to Press","grupos":["hombros","gluteos","cuadriceps"],"eq":"Barra","niv":"","cat":"Fuerza","inst":["Ancla un extremo de la barra en un landmine o esquina firme.","Párate frente a la barra con los pies algo más separados que los hombros y las puntas levemente afuera.","Toma el extremo con ambas manos a la altura del pecho.","Baja en sentadilla con el pecho arriba hasta al menos el paralelo.","Sube con fuerza y aprovecha el impulso para empujar la barra arriba y adelante hasta estirar los brazos. Baja y repite."],"ines":1,"src":"wger","autor":"beagle","lic":"CC-BY-SA 4.0"},"wg-1832":{"nombre":"Sostén en argollas","en":"Ring Support Hold","grupos":["pectoral"],"eq":"","niv":"","cat":"Fuerza","inst":["Sostente sobre las argollas con los brazos estirados a los costados.","Gira levemente las argollas hacia afuera y mantén el cuerpo en posición hueca. Isométrico para pecho, hombros y tríceps."],"ines":1,"src":"wger","autor":"wger.de","lic":"CC-BY-SA 4.0"},"wg-1834":{"nombre":"Elevación Trap-3","en":"Trap-3 Raise","grupos":["trapecio"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Inclínate con las rodillas levemente flectadas y apoya una mano en la rodilla.","Baja y retrae el hombro que trabaja.","Sube la mano unos 15° por sobre la cabeza, en diagonal, sin perder la posición del hombro."],"ines":1,"src":"wger","autor":"Croak6728","lic":"CC-BY-SA 4.0"},"wg-1843":{"nombre":"Estiramiento mariposa","en":"Butterfly Stretch","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"","cat":"Elongación","inst":["Siéntate con las plantas de los pies juntas.","Acércalas lento hacia la ingle con las manos y sostén el tiempo indicado."],"ines":1,"src":"wger","autor":"Croak6728","lic":"CC-BY-SA 4.0"},"wg-1844":{"nombre":"Estiramiento de rana","en":"Frog Stretch","grupos":["gluteos"],"eq":"Peso corporal","niv":"","cat":"Elongación","inst":["En cuatro apoyos, separa las rodillas hacia afuera y baja a los codos.","Sin mover codos ni rodillas, mece el cuerpo atrás y adelante intentando acercar los glúteos a los pies."],"ines":1,"src":"wger","autor":"Croak6728","lic":"CC-BY-SA 4.0"},"wg-1852":{"nombre":"L-sit","en":"L-sit","grupos":["dorsales","pectoral","core"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Siéntate con las piernas juntas y las manos al lado de la cadera.","Empuja el suelo para despegar el cuerpo, con las piernas estiradas sin tocar el suelo, y sostén."],"ines":1,"src":"wger","autor":"Croak6728","lic":"CC-BY-SA 4.0"},"wg-1869":{"nombre":"Estiramiento figura cuatro acostado","en":"Lying Figure Four Stretch","grupos":["cuadriceps"],"eq":"","niv":"","cat":"Elongación","inst":["Acuéstate de espaldas y cruza un tobillo sobre la rodilla contraria, formando un 4.","Toma la pierna de abajo y acércala al pecho hasta sentir el estiramiento en el glúteo. Sostén y cambia de lado."],"ines":1,"src":"wger","autor":"Davidgj32","lic":"CC-BY-SA 4.0"},"wg-1872":{"nombre":"Estiramiento de paloma","en":"Pigeon Stretch","grupos":["cuadriceps"],"eq":"","niv":"","cat":"Elongación","inst":["Desde cuatro apoyos, lleva una rodilla adelante hacia la mano del mismo lado, con la canilla cruzada, y estira la otra pierna atrás.","Baja el tronco sobre la pierna de adelante hasta sentir el estiramiento en el glúteo. Sostén y cambia de lado."],"ines":1,"src":"wger","autor":"Davidgj32","lic":"CC-BY-SA 4.0"},"wg-1902":{"nombre":"Flexiones lastradas","en":"Weighted push-ups","grupos":["pectoral"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Ponte en plancha alta con un disco bien apoyado en la parte alta de la espalda.","Mantén una línea recta de cabeza a talones con el core activo.","Baja hasta que el pecho casi toque el suelo, con los codos a unos 45°.","Empuja con las palmas hasta estirar los brazos."],"ines":1,"src":"wger","autor":"nishant0712","lic":"CC-BY-SA 4.0"},"wg-1916":{"nombre":"Planche recogida","en":"Tuck planche","grupos":["hombros","core"],"eq":"Peso corporal","niv":"","cat":"Fuerza","inst":["Apóyate en las manos con los brazos estirados, inclina los hombros adelante y despega los pies con las rodillas recogidas al pecho.","Sostén. Es una progresión básica de calistenia hacia la planche completa."],"ines":1,"src":"wger","autor":"ISSACS","lic":"CC-BY-SA 4.0"},"wg-1935":{"nombre":"Sentadilla con cinturón (belt squat)","en":"Belt Squat","grupos":["gluteos","cuadriceps"],"eq":"","niv":"","cat":"Fuerza","inst":["Sentadilla con un cinturón enganchado a una máquina o plataforma, de modo que la carga cuelga de la cadera y no de la columna.","Trabaja sobre todo cuádriceps y glúteos con mucha menos fatiga lumbar que la sentadilla con barra.","Usa rango completo, torso erguido y empuja con el medio del pie."],"ines":1,"src":"wger","autor":"wger.de","lic":"CC-BY-SA 4.0"}}</script>

function pctOf(reps, rpe){
  const r = (+reps||0) + (10 - (rpe == null || rpe === "" ? 10 : +rpe));
  let sl = false; try{ sl = nv(viewUid()); }catch(e){}
  if(sl){ const R = clamp(r,1,30), i = Math.floor(R), f = R - i; const a = PCT_SL[i], b = PCT_SL[Math.min(30,i+1)]; return a + (b-a)*f; }
  const R = clamp(r,1,15), i = Math.floor(R), f = R - i;
  const a = PCT[i], b = PCT[Math.min(15,i+1)];
  return a + (b-a)*f;
}
function e1rm(peso, reps, rpe){ if(!peso || !reps) return 0; return peso / (pctOf(reps,rpe)/100); }
// Intensidad: número (7) o rango ("6-7"). Para calcular se usa el punto medio; para mostrar, el rango tal cual lo puso la coach.
function rngOf(v){ const m = String(v ?? "").trim().replace(/,/g, ".").match(/^(\d+(?:\.\d+)?)\s*(?:-|–|—|a)\s*(\d+(?:\.\d+)?)$/); return m ? [+m[1], +m[2]] : null; }
function vNum(v){ const r = rngOf(v); return r ? (r[0] + r[1]) / 2 : numOrNull(v); }
function vTxt(v){ const r = rngOf(v); return r ? `${fmtNum(r[0])}–${fmtNum(r[1])}` : (v == null || v === "" ? "" : fmtNum(v)); }
function parseIntens(t){ const r = rngOf(t); if(r) return r[0] === r[1] ? r[0] : `${Math.min(r[0],r[1])}-${Math.max(r[0],r[1])}`; return numOrNull(t); }
const rpeOf = g => g.t === "RPE" ? vNum(g.v) : g.t === "RIR" ? (vNum(g.v) == null ? null : 10 - vNum(g.v)) : null;
const grpText = g => `${g.n||"?"} × ${g.reps||"?"}${g.u === "s" ? " s" : g.u === "min" ? " min" : ""} @ ${g.t === "%" ? (vTxt(g.v)||"?")+"%" : g.t+" "+(vTxt(g.v) || "?")}${g.ty ? " · "+g.ty : ""}`;

// RPE planificado por serie de una fila (para estimar el e1RM cuando no se anotó el RPE real)
function planRpes(uid, e, rid){
  const b = (S.prog[uid]?.bloques||[]).find(x => x.id === e.b);
  const row = b?.semanas?.[e.w]?.dias?.[e.d]?.ejercicios?.find(r => r.id === rid);
  const out = []; (row?.series||[]).forEach(g => { const r = rpeOf(g); for(let i=0;i<Math.max(1,+g.n||1);i++) out.push(r); });
  return out;
}
function entries(uid){
  const ent = S.reg[uid]?.entradas || {};
  return Object.entries(ent).map(([k,e]) => {
    const pl = planRpes(uid, e, k.split("|")[3]);
    let best = 0, top = null;
    (e.sets||[]).forEach((s,i) => {
      if(s.hecho === false) return;
      // Sin RPE anotado la serie se toma como al fallo (RPE 10): es el mínimo garantizado, nunca infla el RM.
      // El RPE planificado solo se muestra como referencia en el tooltip.
      const real = numOrNull(s.rpe), plan = pl[i] ?? pl[pl.length-1] ?? null;
      const v = e1rm(s.peso, s.reps, real ?? 10);
      const score = real != null ? v : v*0.999;
      if(v && (!top || score > top.score)) { best = v; top = {peso:+s.peso, reps:+s.reps, rpe:real, plan, src: real != null ? "real" : null, score}; }
    });
    return {k, ...e, best, top};
  }).filter(e => e.ej);
}
function seriesByEj(uid){
  const m = {};
  for(const e of entries(uid)){ if(!e.best) continue; (m[e.ej] ||= {});
    const cur = m[e.ej][e.fecha];
    // Por día: preferimos el punto con RPE (real o planificado) sobre uno sin RPE
    const better = !cur || (!!e.top?.src && !cur.src.top?.src) || (!!e.top?.src === !!cur.src.top?.src && e.best > cur.y);
    if(better) m[e.ej][e.fecha] = {y:e.best, src:e}; }
  const out = {};
  for(const [ej,byDate] of Object.entries(m)) out[ej] = Object.entries(byDate).sort((a,b)=>a[0]<b[0]?-1:1).map(([x,v]) => ({x, y:v.y, src:v.src}));
  return out;
}
function bestE1(uid, ej){ const s = seriesByEj(uid)[ej]; return s ? Math.max(...s.map(p=>p.y)) : 0; }
function lastE1(uid, ej){ const s = seriesByEj(uid)[ej]; return s?.length ? s[s.length-1].y : 0; }
function suggestion(uid, ej, g){
  if(!ej) return null;
  if(g.t === "%"){ const b = bestE1(uid, ej); const pv = vNum(g.v); return b && pv ? round25(b*pv/100) : null; }
  const l = lastE1(uid, ej); const rpe = rpeOf(g);
  if(!l || !g.reps || rpe == null) return null;
  const kg = l * pctOf(g.reps, rpe)/100;
  return nv(uid) && esMancuerna(ej) ? Math.round(kg) : round25(kg);
}
// Marcas reales: lo que de verdad se levantó (no estimado)
function realMarks(uid){
  const p = S.prog[uid]; const out = {S:null,B:null,D:null}, single = {S:null,B:null,D:null}; const comps = {};
  const tipoDia = e => (p?.bloques||[]).find(x => x.id === e.b)?.semanas?.[e.w]?.dias?.[e.d] || null;
  for(const e of Object.values(S.reg[uid]?.entradas || {})){
    const L = S.ejercicios[e.ej]?.lift; if(!L || !out.hasOwnProperty(L)) continue;
    const dia = tipoDia(e); const esComp = /compet/i.test(dia?.tipo || "") || /competencia/i.test(dia?.nombre || "");
    (e.sets||[]).forEach((s,i) => {
      const kg = +s.peso||0, r = +s.reps||0; if(!kg || !r) return;
      if(esComp){ const c = comps[e.fecha] ||= {fecha:e.fecha, nombre: dia?.nombre || "Competencia", S:[], B:[], D:[]}; c[L].push({kg, ok: s.hecho !== false}); }
      if(s.hecho === false) return;
      const x = {kg, reps:r, rpe:numOrNull(s.rpe), fecha:e.fecha, comp:esComp};
      if(!out[L] || kg > out[L].kg || (kg === out[L].kg && r > out[L].reps)) out[L] = x;
      if(r === 1 && (!single[L] || kg > single[L].kg)) single[L] = x;
    });
  }
  const compList = Object.values(comps).sort((a,b) => a.fecha < b.fecha ? 1 : -1).map(c => {
    const best = L => Math.max(0, ...c[L].filter(a => a.ok).map(a => a.kg));
    const tot = ["S","B","D"].every(L => best(L)) ? best("S")+best("B")+best("D") : null;
    return {...c, best, tot};
  });
  return {out, single, comps: compList};
}
function liftBests(uid){
  const r = {S:0,B:0,D:0};
  for(const [ej,pts] of Object.entries(seriesByEj(uid))){ const L = S.ejercicios[ej]?.lift; if(L && r[L] != null) r[L] = Math.max(r[L], ...pts.map(p=>p.y)); }
  return r;
}
function strengthMap(uid){
  const p = S.prog[uid]; const order = {};
  (p?.bloques||[]).forEach((b,i) => order[b.id] = i);
  const byEj = {};
  for(const e of entries(uid)){ if(!e.best) continue; (byEj[e.ej] ||= []).push(e); }
  const perEj = {};
  for(const [ej,list] of Object.entries(byEj)){
    const gk = e => (order[e.b] ?? 99)*100 + (e.w||0);
    const groups = {};
    list.forEach(e => { const k = gk(e); groups[k] = Math.max(groups[k]||0, e.best); });
    const keys = Object.keys(groups).map(Number).sort((a,b)=>a-b);
    if(keys.length < 2) continue;
    perEj[ej] = groups[keys[keys.length-1]]/groups[keys[0]] - 1;
  }
  const g = {};
  for(const [ej,pct] of Object.entries(perEj)) for(const gr of (S.ejercicios[ej]?.grupos||[])) (g[gr] ||= []).push(pct);
  const res = {};
  for(const k of Object.keys(GRUPOS)) res[k] = g[k] ? g[k].reduce((a,b)=>a+b,0)/g[k].length : null;
  return {res, n:Object.keys(perEj).length};
}

function tipCarousel(lista, u, cat, favs){

// Tras cada render: posición del carrusel, flechas, bloqueo de scroll y foco
function tipArrows(){
  const tr = document.getElementById("tp-track"), car = document.getElementById("tp-car"); if(!tr || !car) return;
  const max = tr.scrollWidth - tr.clientWidth;
  car.classList.toggle("fits", max <= 4);
  const [pv, nx] = car.querySelectorAll(".tp-arr"); if(!pv || !nx) return;
  const a = document.activeElement;
  pv.disabled = tr.scrollLeft <= 4; nx.disabled = tr.scrollLeft >= max - 4;
  if(a === pv && pv.disabled) nx.focus(); else if(a === nx && nx.disabled) pv.focus();
}
function tipStep(dir, edge){
  const tr = document.getElementById("tp-track"); const sl = tr && tr.querySelector(".tp-slide"); if(!sl) return;
  const step = sl.offsetWidth + (parseFloat(getComputedStyle(tr).columnGap) || 0);
  const left = edge ? (dir < 0 ? 0 : tr.scrollWidth) : (Math.round(tr.scrollLeft / step) + dir) * step;
  tr.scrollTo({left, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
function tipAfter(){
  const panel = document.getElementById("tp-panel"), tr = document.getElementById("tp-track");
  document.documentElement.classList.toggle("tp-lock", !!panel);
  if(tr){
    tr.style.scrollBehavior = "auto"; tr.scrollLeft = S.tipX || 0; tr.style.scrollBehavior = "";
    tr.addEventListener("scroll", () => { S.tipX = tr.scrollLeft; tipArrows(); }, {passive: true});
    tipArrows();
  }
  const sel = S.tipFocus; S.tipFocus = null;
  const el = (sel && document.querySelector(sel)) || (sel && (panel || tr || document.querySelector('.tp-f[aria-pressed="true"]'))) || null;
  if(el) el.focus({preventScroll: true});
  else if(panel && !panel.contains(document.activeElement)) panel.focus({preventScroll: true});
}
window.addEventListener("resize", () => tipArrows());
document.addEventListener("keydown", e => {
  const panel = document.getElementById("tp-panel");
  if(panel){
    if(e.key === "Escape"){ e.preventDefault(); ACT.tipClose(); return; }
    if(e.key === "Tab"){
      const f = [...panel.querySelectorAll("button, summary, a[href]")].filter(x => !x.disabled);
      if(!f.length) return; const first = f[0], last = f[f.length - 1], a = document.activeElement;
      if(e.shiftKey && (a === first || a === panel || !panel.contains(a))){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && (a === last || !panel.contains(a))){ e.preventDefault(); first.focus(); }
    }
    return;
  }
  if(e.target && e.target.id === "tp-track"){
    const m = {ArrowRight: [1], ArrowLeft: [-1], Home: [-1, 1], End: [1, 1]}[e.key];
    if(m){ e.preventDefault(); tipStep(m[0], m[1]); }
  }
});

  if(S.state === "loading") return `<div class="card"><h2>Cargando…</h2><p class="muted">Conectando con tus datos.</p></div>`;

/* ----- Agrupaciones musculares y patrones de movimiento (Milo, 2021 y 2023) ----- */
const PATRONES = {rodilla:"Dominante de rodilla", cadera:"Dominante de cadera", empuje_h:"Empuje horizontal", empuje_v:"Empuje vertical", traccion_h:"Tracción horizontal", traccion_v:"Tracción vertical", core:"Core / antirrotación", transporte:"Transportes", aislado:"Monoarticular", plio:"Pliometría", cardio:"Cardio", movilidad:"Movilidad"};

const PATCACHE = new Map();
function patronDe(e){
  if(!e) return "";
  if(e.pat) return e.pat;
  const key = (e.nombre||"")+"|"+(e.en||""); if(PATCACHE.has(key)) return PATCACHE.get(key);
  const n = ((e.nombre||"")+" "+(e.en||"")).toLowerCase(); const g = e.grupos || []; const cat = (e.cat||"").toLowerCase();
  let r;
  if(/estiramiento|stretch|movilidad|smr|foam|rodillo de espuma|c[ií]rculos|rotaci[oó]n tor[aá]cica|postura del ni[nñ]o|child'?s pose|cat ?cow|gato.?camello/.test(n) || cat.startsWith("estir")) r = "movilidad";
  else if(/farmer|granjero|carry|yoke|sled|trineo|suitcase|maleta|rickshaw/.test(n) && !/extensi|curl|remo|\brow|vuelo|fly|raise|elevaci|press/.test(n)) r = "transporte";
  else if(cat.startsWith("cardio")) r = "cardio";
  else if(/plank|plancha|pallof|rollout|ab wheel|rueda abdominal|dead ?bug|bicho muerto|bird ?dog|antirrota|anti-rot|hollow|turkish|levantada turca/.test(n)) r = "core";
  else if(/upright row|remo al ment[oó]n|remo al cuello|remo vertical/.test(n)) r = "aislado";
  else if(/pullover|rope climb|trepar la cuerda/.test(n)) r = "traccion_v";
  else if(/\brows?\b|remo/.test(n)) r = "traccion_h";
  else if(/pull-?ups?\b|chin-?ups?\b|pulldown|pull down|dominada|jal[oó]n/.test(n)) r = "traccion_v";
  else if(/squat|sentadilla|lunge|zancada|estocada|leg press|prensa|step-?up|subida al caj[oó]n|split|pistol|hack/.test(n)) r = "rodilla";
  else if(/deadlift|peso muerto|\brdl\b|good ?morning|buenos d[ií]as|hip thrust|empuje de cadera|glute bridge|puente de gl[uú]teo|hyperextension|hiperextensi|swing|pull[- ]?through|back extension|extensi[oó]n de espalda|extensi[oó]n lumbar/.test(n)) r = "cadera";
  else if(/overhead press|military|militar|shoulder press|press de hombro|push press|\bjerk\b|arnold|handstand|press por encima|press vertical|landmine press|press sobre la cabeza/.test(n)) r = "empuje_v";
  else if(/bench press|press de banca|press banca|\bbanca\b|push-?ups?\b|flexi[oó]n(es)? de brazos|lagartija|floor press|chest press|press de pecho|press inclinado|press declinado|\bdips?\b|fondos/.test(n) && !/curl|fly|apertura/.test(n)) r = "empuje_h";
  else if(cat.startsWith("pliom")) r = "plio";
  else if(e.m === "i" || /curl|\bfly|flye|apertura|raise|elevaci[oó]n|extension|extensi[oó]n|kickback|patada|shrug|encogimiento/.test(n)) r = g[0] === "core" ? "core" : "aislado";
  else if(/crunch|abdominal|sit-?up|oblicu|twist|giro ruso|woodchop|le[nñ]ador/.test(n) || g[0] === "core") r = "core";
  else { const p = g[0];
    r = p === "cuadriceps" ? "rodilla" : ["isquios","gluteos","espalda_baja"].includes(p) ? "cadera" : p === "pectoral" ? "empuje_h"
      : p === "hombros" ? (e.f === "pull" ? "traccion_h" : "empuje_v") : p === "dorsales" ? "traccion_h" : "aislado"; }
  PATCACHE.set(key, r); return r;
}
// Series de la semana por grupo muscular (principal = 1 serie, secundario = 0,5: criterio práctico) y por patrón
function volSemana(w){
  const grp = {}, pat = {}; let total = 0;
  for(const d of (w?.dias||[])) for(const r of (d.ejercicios||[])){ const e = S.ejercicios[r.ej]; if(!e) continue;
    const n = (r.series||[]).reduce((s,g) => s + (+g.n||0), 0); if(!n) continue; total += n;
    const p = patronDe(e); pat[p] = (pat[p]||0) + n;
    (e.grupos||[]).forEach(g => grp[g] = (grp[g]||0) + n);
    (e.sec||[]).forEach(g => grp[g] = (grp[g]||0) + n/2); }
  return {grp, pat, total};
}
function alertasVol(v, perfil){
  const a = []; const P = k => v.pat[k] || 0; if(!v.total) return a;
  const emp = P("empuje_h") + P("empuje_v"), trac = P("traccion_h") + P("traccion_v");
  if(emp >= 6 && trac < emp*0.75) a.push(`Hay más empuje (${emp}) que tracción (${trac}). Equilibrar cuida el complejo del hombro y el ritmo escápulo-humeral (Milo, 2023).`);
  if(trac >= 6 && emp < trac*0.5 && perfil === "salud") a.push(`Hay mucha más tracción (${trac}) que empuje (${emp}).`);
  const rod = P("rodilla"), cad = P("cadera");
  if(rod >= 4 && cad === 0) a.push("Hay trabajo dominante de rodilla pero nada dominante de cadera.");
  else if(cad >= 4 && rod === 0) a.push("Hay trabajo dominante de cadera pero nada dominante de rodilla.");
  else if(rod && cad && (rod > cad*2.5 || cad > rod*2.5)) a.push(`Rodilla (${rod}) y cadera (${cad}) están muy descompensadas.`);
  if(!P("core")) a.push("No hay trabajo de core o antirrotación: el core transmite la fuerza y sostiene el bracing en S/B/D (Milo, 2023).");
  if(perfil === "salud"){ const falt = ["cuadriceps","gluteos","isquios","pectoral","dorsales","hombros"].filter(g => !v.grp[g]); if(falt.length) a.push("Sin series para: "+falt.map(g => GRUPOS[g]).join(", ")+"."); }
  return a;
}
function barras(obj, labels, color, destacar = []){
  const ent = Object.entries(obj).filter(([,x]) => x > 0).sort((a,b) => b[1]-a[1]); if(!ent.length) return `<div class="small muted">Sin ejercicios con series esta semana.</div>`;

function prioAlertas(w, v, pr){
  const a = []; if(!pr.length || !v.total) return a;
  const P = k => v.pat[k] || 0;
  pr.filter(k => !P(k)).forEach(k => a.push(`Patrón prioritario sin series esta semana: ${PATRONES[k]}.`));
  const minPr = Math.min(...pr.filter(k => P(k)).map(P));
  const sec = Object.entries(v.pat).filter(([k,x]) => !pr.includes(k) && !["aislado","movilidad","cardio"].includes(k) && x > minPr).map(([k]) => PATRONES[k]);
  if(isFinite(minPr) && sec.length) a.push(`Un patrón prioritario tiene menos series que ${sec.join(", ")}. Si es la prioridad del bloque, súbele el volumen o baja el de los secundarios.`);
  const dias = (w?.dias||[]).filter(d => d.ejercicios.some(r => S.ejercicios[r.ej]));
  if(dias.length >= 3) pr.forEach(k => { const n = dias.filter(d => d.ejercicios.some(r => S.ejercicios[r.ej] && patronDe(S.ejercicios[r.ej]) === k)).length; if(n && n < Math.ceil(dias.length/2)) a.push(`${PATRONES[k]} aparece solo en ${n} de ${dias.length} días: para priorizarlo, súmalo en más días.`); });

  return a;
}

function genMacro(){
  const p = S.draft; const c = p.comp;
  const start = (new Date(TODAY+"T12:00").getDay() === 1) ? TODAY : nextMonday();
  const compMon = mondayOf(c.fecha);
  const N = Math.floor(daysBetween(start, compMon)/7) + 1;
  if(N < 3){ toast("Faltan menos de 3 semanas para la competencia: arma el peak a mano en el bloque actual.", true); return; }
  // Taper según nivel (Bompa y Haff, cap. 7): más largo cuanto más avanzado y mayor la carga previa
  const taperW = {Principiante:1, Intermedio:2, Avanzado:3}[p.nivel || "Intermedio"];
  const compet = Math.min(taperW, N >= 12 ? 3 : N >= 7 ? 2 : 1), rest = N - compet;
  const step = p.escalon === "2:1" ? 3 : 4; // cada cuántas semanas cae la descarga
  let g = 0; const isDl = () => (++g) % step === 0; // el escalón sigue corriendo entre bloques preparatorios
  let precomp = Math.max(1, Math.round(rest*0.15)), espec = Math.max(1, Math.round(rest*0.35)), general = rest - precomp - espec;
  if(general < 1){ general = 1; espec = Math.max(1, rest - precomp - general); precomp = rest - general - espec; }
  const last = p.bloques.length ? p.bloques[p.bloques.length-1] : null;
  const tpl = last ? last.semanas[last.semanas.length-1] : emptyWeek();
  const lerp = (a,b,i,n) => Math.round(n<=1 ? a : a + (b-a)*i/(n-1));
  const mk = (nombre, fase, n, vol, int, microFn, carga, escalona) => ({id:uid36("b"), nombre, objetivo:"", fase:{periodo:fase[0],etapa:fase[1],orientacion:fase[2],mesociclo:fase[3]}, enfoque:[], objetivos:fase.slice(), ...(carga ? {carga} : {}), inicio:"", semanas: Array.from({length:n}, (_,i) => { const dl = escalona ? isDl() : false;
    return {...freshIds(tpl), micro: dl ? "Descarga" : microFn(i,n), volPct: Math.round(lerp(vol[0],vol[1],i,n) * (dl ? .6 : 1)), intPct: Math.round(lerp(int[0],int[1],i,n) * (dl ? .9 : 1))}; })});
  const aa = general >= 6 ? Math.round(general*0.4) : 0, hip = general - aa;
  const blocks = [
    ...(aa ? [mk("Adaptación anatómica", ["Preparatorio","General","Adaptación anatómica","Base general"], aa, [85,95], [60,68], (i,n) => i===0 ? "Adaptación inicial" : i%2 ? "Carga" : "Acumulación", "Escalonada", true)] : []),
    mk(aa ? "Hipertrofia" : "Preparación general", ["Preparatorio","General","Hipertrofia", aa ? "Carga progresiva" : "Base general"], hip, [90,100], [68,75], (i,n) => !aa && i===0 ? "Adaptación inicial" : i%2 ? "Carga" : "Acumulación", "Escalonada", true),
    mk("Fuerza máxima", ["Preparatorio","Específica","Fuerza máxima","Carga alta"], espec, [85,75], [75,85], (i,n) => ["Carga","Carga alta","Carga alta"][i%3], p.nivel === "Avanzado" ? "Ondulante" : "Escalonada", true),
    mk("Conversión a fuerza específica", ["Competitivo","Precompetitiva","Conversión a fuerza específica","Test / evaluación"], precomp, [70,60], [85,92], (i,n) => i===n-1 ? "Test" : "Intensificación", "Escalonada"),
    mk("Pico y competencia", ["Competitivo","Competitiva","Peak de rendimiento","Rendimiento"], compet, [50,35], [92,100], (i,n) => i===n-1 ? "Competencia" : i===n-2 ? "Peak de forma" : "Ajustes finales"),
    mk("Transitorio", ["Transitorio","Transitoria","Recuperación activa","Recuperación"], 1, [30,30], [50,50], () => "Regeneración")
  ];
  let d = start; blocks.forEach(b => { b.inicio = d; d = addDays(d, b.semanas.length*7); });
  const kept = p.bloques.filter(b => b.inicio && b.inicio < start).map(b => { const n = Math.floor(daysBetween(b.inicio, start)/7); if(b.semanas.length > n) b.semanas = b.semanas.slice(0, Math.max(1,n)); return b; });
  p.bloques = kept.concat(blocks);
  S.ed = {b: p.bloques.length - blocks.length, w: 0}; markDirty(); render();
  toast(`Macrociclo de ${N} semanas generado (escalón ${p.escalon||"3:1"}, taper de ${compet} semana${compet>1?"s":""}${p.nivel ? " · "+p.nivel.toLowerCase() : ""}). Revisa y guarda el programa.`);
}

/* ----- Progreso (coach y alumno): conversa con el programa ----- */
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const DESCARGA_MICROS = ["Descarga","Regeneración"];
// Ejercicios principales: S/B/D para competidor; los más registrados para salud
function mainEjs(uid){
  const ser = seriesByEj(uid); const salud = S.prog[uid]?.perfil === "salud";
  if(!salud){ const out = []; for(const L of ["S","B","D"]){ const ej = Object.keys(ser).filter(id => S.ejercicios[id]?.lift === L).sort((x,y) => ser[y].length - ser[x].length)[0]; if(ej) out.push({ej, name:LIFTS[L], color:LIFT_COLOR[L]}); } return out; }
  const cols = ["#DA45A4","#A3E850","#F4F1EC"];
  return Object.keys(ser).sort((x,y) => ser[y].length - ser[x].length).slice(0,3).map((ej,i) => ({ej, name:ejName(ej), color:cols[i]}));
}
// Seguimiento del plan: RPE planificado vs real por semana y adherencia por bloque
function planTrack(uid){
  const p = S.prog[uid]; const ents = entries(uid); const bl = p?.bloques || [];
  const pos = {}; bl.forEach((b,i) => pos[b.id] = i);
  const wk = {};
  for(const e of ents){
    const bi = pos[e.b]; if(bi == null) continue; const b = bl[bi];
    const W = wk[bi+"|"+e.w] ||= {bi, w:e.w, plan:[], real:[], ses:new Set(), fecha: b.inicio ? addDays(b.inicio, e.w*7) : e.fecha, micro: b.semanas?.[e.w]?.micro || ""};
    W.ses.add(e.d);
    const rid = e.k.split("|")[3];
    const row = b.semanas?.[e.w]?.dias?.[e.d]?.ejercicios?.find(r => r.id === rid);
    if(!row) continue;
    const pl = []; row.series.forEach(g => { const r = rpeOf(g); if(r != null) for(let i=0;i<Math.max(1,+g.n||1);i++) pl.push(r); });
    const re = (e.sets||[]).map(s => numOrNull(s.rpe)).filter(x => x != null);
    if(pl.length && re.length){ W.plan.push(avg(pl)); W.real.push(avg(re)); }
  }
  const semanas = Object.values(wk).filter(W => W.plan.length).sort((a,b) => a.bi-b.bi || a.w-b.w).map(W => ({...W, p:avg(W.plan), r:avg(W.real), dlt: avg(W.real)-avg(W.plan)}));
  const bloques = bl.map((b,bi) => {
    if(!b.inicio || b.inicio > TODAY) return null;
    let plan = 0, hecho = 0;
    b.semanas.forEach((w,wi) => { if(addDays(b.inicio, wi*7) > TODAY) return; plan += (w.dias||[]).length; hecho += wk[bi+"|"+wi]?.ses.size || 0; });
    return plan ? {bi, nombre: b.nombre || "Bloque "+(bi+1), plan, hecho: Math.min(hecho, plan), pct: Math.min(hecho, plan)/plan} : null;
  }).filter(Boolean);
  const tp = bloques.reduce((s,x)=>s+x.plan,0), th = bloques.reduce((s,x)=>s+x.hecho,0);
  const last2 = semanas.slice(-2); let alerta = null;
  if(last2.length === 2 && last2.every(x => x.dlt >= 1)) alerta = {t:"bad", m:"El RPE real va al menos 1 punto sobre lo planificado hace dos semanas: posible fatiga acumulada. Revisa carga, volumen o adelanta la descarga."};
  else if(last2.length === 2 && last2.every(x => x.dlt <= -1)) alerta = {t:"ok", m:"El RPE real va al menos 1 punto bajo lo planificado hace dos semanas: hay margen para subir la carga."};
  return {semanas, bloques, adh: tp ? th/tp : null, alerta};
}
// Franjas de bloque, descargas y competencia para el gráfico
function chartBands(uid){
  const p = S.prog[uid]; const salud = p?.perfil === "salud"; const bands = [], marks = [];
  (p?.bloques||[]).forEach((b,i) => { if(!b.inicio) return;
    const per = getFase(b).periodo || b.objetivos?.[0];
    bands.push({from:b.inicio, to:addDays(b.inicio, b.semanas.length*7), color: (!salud && PCOL[per]) || (i%2 ? "rgba(218,69,164,.10)" : "rgba(163,232,80,.09)"), label: b.nombre || "Bloque "+(i+1)});
    b.semanas.forEach((w,wi) => { if(DESCARGA_MICROS.includes(w.micro)) marks.push({from:addDays(b.inicio, wi*7), to:addDays(b.inicio, wi*7+7)}); });
  });
  return {bands, marks, comp: p?.comp?.fecha ? {fecha:p.comp.fecha, label:p.comp.nombre || "Competencia"} : null};
}
function vProgreso(uid){

      return `<tr><td><b>${LIFTS[L]}</b></td><td class="num">${x ? `${fmtKg(x.kg)} × ${x.reps}${x.rpe!=null?" @"+fmtNum(x.rpe):""}<div class="small muted">${fY(x.fecha)}${x.comp?" · competencia":""}</div>` : "—"}</td><td class="num">${s1 ? `${fmtKg(s1.kg)}<div class="small muted">${fY(s1.fecha)}</div>` : "—"}</td><td class="num">${e ? fmtKg(e) : "—"}</td></tr>`; };
    const att = (L) => c[L].length ? c[L].map(a => a.ok ? fmtKg(a.kg) : `<s style="color:var(--bad)">${fmtKg(a.kg)}</s>`).join(" / ") : "—";
    return `<div class="card"><h3>${STAR} Marcas reales vs. RM esperado</h3>
      <p class="small muted">Marca real = lo que de verdad levantaste. RM esperado = e1RM estimado con la tabla RPE (las series sin RPE anotado cuentan como al fallo).</p>
      <div class="tablewrap"><table><thead><tr><th></th><th>Mejor serie real</th><th>Mejor single</th><th>RM esperado</th></tr></thead><tbody>
      ${["S","B","D"].map(fila).join("")}
      ${sTot ? `<tr><td><b>Total</b></td><td></td><td class="num"><b>${fmtKg(sTot)}</b>${glS ? `<div class="small muted">${fmt1(glS)} GL</div>` : ""}</td><td class="num"><b>${fmtKg(tot)}</b>${gl ? `<div class="small muted">${fmt1(gl)} GL</div>` : ""}</td></tr>` : ""}

    </div>`; })();
  // Seguimiento del plan

function lineChart(series, o = {}){
  const W = 680, H = 250, L = 46, R = 70, T = o.bands?.length ? 26 : 14, B = 30;
  const all = series.flatMap(s => s.pts);
  const xs = [...new Set(all.map(p => p.x))].sort();
  const x0 = xs[0]; let x1 = xs[xs.length-1];
  if(o.comp && o.comp.fecha > x1 && daysBetween(x1, o.comp.fecha) <= 120) x1 = o.comp.fecha;
  const span = Math.max(1, daysBetween(x0,x1));
  let ymin = Math.min(...all.map(p=>p.y)), ymax = Math.max(...all.map(p=>p.y));
  const step = niceStep((ymax-ymin)/4 || 10); ymin = Math.floor(ymin*0.97/step)*step; ymax = Math.ceil(ymax*1.02/step)*step;
  const X = d => L + (W-L-R) * daysBetween(x0,d)/span;
  const Y = v => T + (H-T-B) * (1 - (v-ymin)/((ymax-ymin)||1));
  let g = "";
  const cx = d => X(d < x0 ? x0 : d > x1 ? x1 : d);
  (o.bands||[]).forEach(bd => { if(bd.to <= x0 || bd.from > x1) return; const a = cx(bd.from), b = cx(bd.to); if(b - a < 1) return;
    g += `<rect x="${a}" y="${T}" width="${b-a}" height="${H-T-B}" fill="${bd.color}"/><line x1="${a}" x2="${a}" y1="${T-12}" y2="${H-B}" stroke="#3A3A3A" stroke-dasharray="2 3"/>`;
    if(b - a > 34) g += `<text x="${a+4}" y="${T-4}" fill="#B8B3AB" font-size="10">${esc(bd.label.length > Math.floor((b-a)/6) ? bd.label.slice(0, Math.max(3, Math.floor((b-a)/6)-1))+"…" : bd.label)}</text>`; });
  (o.marks||[]).forEach(m => { if(m.to <= x0 || m.from > x1) return; const a = cx(m.from), b = cx(m.to); if(b - a < 1) return; g += `<rect x="${a}" y="${T}" width="${b-a}" height="${H-T-B}" fill="url(#hatch)"/>`; });
  if(o.comp && o.comp.fecha >= x0 && o.comp.fecha <= x1) g += `<line x1="${X(o.comp.fecha)}" x2="${X(o.comp.fecha)}" y1="${T}" y2="${H-B}" stroke="#DA45A4" stroke-width="2" stroke-dasharray="5 3"/><text x="${X(o.comp.fecha)-4}" y="${T+12}" text-anchor="end" fill="#DA45A4" font-size="11" font-weight="700">${esc(o.comp.label)}</text>`;
  for(let v = ymin; v <= ymax + 1e-9; v += step) g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2A2A2A"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" fill="#B8B3AB" font-size="11">${step < 1 ? fmt1(v) : Math.round(v)}</text>`;
  const ticks = [x0, xs[Math.floor(xs.length/2)], x1].filter((v,i,a) => a.indexOf(v)===i);
  ticks.forEach(d => g += `<text x="${X(d)}" y="${H-8}" text-anchor="middle" fill="#B8B3AB" font-size="11">${fmtDate(d)}</text>`);
  series.forEach(s => {
    const pts = s.pts.map(p => `${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
    const last = s.pts[s.pts.length-1];
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    g += s.pts.map(p => { const hollow = p.src && !p.src.top?.src; const tip = o.tip ? o.tip(p) : `${fmtDate(p.x)} · ${o.unit === "kg" ? fmt1(p.y) : fmtKg(p.y)} kg`;
      return `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${hollow ? 3 : 2.5}" fill="${hollow ? "#000" : s.color}" stroke="${s.color}" stroke-width="${hollow ? 1.5 : 0}"/><circle class="tipdot" cx="${X(p.x)}" cy="${Y(p.y)}" r="9" fill="transparent" data-tip="${esc(s.name + "\n" + tip)}"/>`; }).join("");
    g += `<circle cx="${X(last.x)}" cy="${Y(last.y)}" r="5" fill="${s.color}" stroke="#000" stroke-width="2"/><text x="${X(last.x)+9}" y="${Y(last.y)+4}" fill="${s.color}" font-size="12" font-weight="700">${o.unit === "kg" ? fmt1(last.y) : Math.round(last.y)} kg</text>`;
  });
  const legend = series.map(s => `<span class="chip"><span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block"></span>${esc(s.name)}</span>`).join("");
  return `<div class="chips">${legend}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.unit === "kg" ? "Peso corporal" : "e1RM estimado"} en el tiempo"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(244,241,236,.18)" stroke-width="2"/></pattern></defs>${g}</svg>`;
}

function tipE1(uid, p){

  const b = (S.prog[uid]?.bloques||[]).find(x => x.id === e.b); const dia = b?.semanas?.[e.w]?.dias?.[e.d];

  const rpeTxt = t.src === "real" ? `@${fmtNum(t.rpe)}` : `sin RPE anotado${t.plan != null ? " (planificado @"+fmtNum(t.plan)+")" : ""}`;
  const fecha = new Date(p.x+"T12:00").toLocaleDateString("es-CL",{day:"numeric",month:"short",year:"numeric"});
  return `${fecha}${b ? " · "+(b.nombre||"Bloque") : ""} · S${(e.w||0)+1}${dia?.nombre ? " · "+dia.nombre : ""}\n${ejName(e.ej)}: ${fmtKg(t.peso)} kg × ${t.reps} ${rpeTxt}\n${t.src === "real" ? "e1RM "+fmtKg(p.y)+" kg" : "e1RM mínimo "+fmtKg(p.y)+" kg (calculado como si fuera al fallo)"}`;

// Tooltip flotante (cursor en PC, toque en celular)
(function(){
  let tipEl = null;
  const show = (el, cx, cy) => { if(!tipEl){ tipEl = document.createElement("div"); tipEl.className = "charttip"; document.body.appendChild(tipEl); }
    tipEl.textContent = el.getAttribute("data-tip"); tipEl.style.display = "block";
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight; let x = cx + 14, y = cy - h - 12;
    if(x + w > innerWidth - 8) x = cx - w - 14; if(y < 8) y = cy + 16; tipEl.style.left = x + "px"; tipEl.style.top = y + "px"; };
  const hide = () => { if(tipEl) tipEl.style.display = "none"; };
  document.addEventListener("mouseover", e => { const t = e.target.closest?.("[data-tip]"); if(t) show(t, e.clientX, e.clientY); else hide(); });
  document.addEventListener("mousemove", e => { const t = e.target.closest?.("[data-tip]"); if(t && tipEl?.style.display === "block") show(t, e.clientX, e.clientY); });
  document.addEventListener("click", e => { const t = e.target.closest?.("[data-tip]"); if(t) show(t, e.clientX, e.clientY); else hide(); });
  addEventListener("scroll", hide, {passive:true});
})();

document.addEventListener("change", async e => {

  if(d.ej === "lift"){ S.ejForm.lift = t.value; return; }

  if(d.rowvid){ await uploadRowVid(d.rowvid, t.files?.[0]); t.value = ""; return; }

    case "fGrp": S.fGrp = t.value; render(); break;

    case "contacto": { const a = S.alumnos[d.id] || {}; const v = t.value.trim(); if(v === (a[d.k]||"")) break;
      if(d.k === "correo" && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ toast("Ese correo no parece válido.", true); break; }
      if(await write("alumnos/"+d.id, {...a, [d.k]: v}, "Contacto guardado.")){ S.alumnos[d.id] = {...a, [d.k]: v}; render(); } break; }
    case "rv": S.rv[d.k] = +t.value; if(d.k==="b") S.rv.w = 0; S.rv.d = 0; render(); break;

/* ----- Videos demostrativos de ejercicios ----- */
function checkVid(file){
  if(!file) return false;
  if(!/^video\//.test(file.type)){ toast("Elige un archivo de video.", true); return false; }
  if(file.size > 20*1024*1024){ toast(`El video pesa ${(file.size/1048576).toFixed(0)} MB y el máximo es 20 MB. Recórtalo o expórtalo en 720p.`, true); return false; }
  if(!S.assets){ toast("La subida de videos no está disponible en esta vista.", true); return false; }
  return true;
}
async function setEjDoc(id, patch, msg){
  const doc = {...(S.ejDb[id] || {}), ...patch}; Object.keys(doc).forEach(k => doc[k] === undefined && delete doc[k]);
  if(await write("ejercicios/"+id, doc, msg)){ S.ejDb = {...S.ejDb, [id]: doc}; mergeEj(); render(); return true; } return false;
}
async function uploadDemo(id, file){
  if(!checkVid(file)) return;
  S.uploading["demo:"+id] = true; render();
  try{ const a = await S.assets.upload(file); const old = S.ejDb[id]?.demo;
    if(await setEjDoc(id, {demo:{id:a.id, url:a.url, fecha:TODAY}}, "Video demostrativo guardado. Ya lo ven tus alumnos.") && old?.id){ try{ await S.assets.delete(old.id); }catch(e){} } }
  catch(err){ toast(err?.code === "quota_exceeded" ? "Se llenó el espacio para videos de la app." : "No se pudo subir el video.", true); }
  finally{ delete S.uploading["demo:"+id]; render(); }
}
async function uploadRowVid(path, file){
  if(!checkVid(file) || !S.draft) return;
  S.uploading["row:"+path] = true; render();
  try{ const a = await S.assets.upload(file); setPath(S.draft, path, {id:a.id, url:a.url, fecha:TODAY}); markDirty(); toast("Video agregado. Guarda el programa para que tu alumno lo vea."); }
  catch(err){ toast("No se pudo subir el video.", true); }
  finally{ delete S.uploading["row:"+path]; render(); }
}

/* ----- Resumen de una sesión (se calcula con lo registrado ese día) ----- */
function resumenDatos(u, dk){
  const reg = S.reg[u] || {}; const ent = reg.entradas || {}; const [bid,w] = dk.split("|");
  const porEj = []; let ton = 0, series = 0, rpeS = 0, rpeN = 0, mejor = null, record = null, mejora = null;
  for(const [k,e] of Object.entries(ent)){
    if(!k.startsWith(dk+"|")) continue;
    const {r: fila, i: orden} = filaDe(u, k);
    const plan = fila ? planDe(fila) : [];
    const sets = (e.sets || []).flatMap((s, i) => {
      if(s.hecho === false || !numOrNull(s.reps)) return [];
      const grupo = plan[i] || plan[plan.length - 1];
      const unidad = uLbl(s.unidad || unidadDe(fila || {ej:e.ej}, grupo));
      return [{...s, p: unidad === "reps" ? (+s.peso || 0) : 0, r: +s.reps, u: unidad}];
    });
    if(!sets.length) continue;
    const f = esMancuerna(e.ej) ? 2 : 1; let kg = 0, top = 0, best = null;
    sets.forEach(s => { const p = s.p; kg += p*s.r*f; series++; if(s.rpe != null && s.rpe !== ""){ rpeS += +s.rpe; rpeN++; } top = Math.max(top, p);
      const e1 = e1rm(p, s.reps, s.rpe); if(p && (!best || e1 > best.e1)) best = {p, r:+s.reps, e1}; });
    ton += kg; porEj.push({ej:e.ej, kg, top, f, sets, orden: orden < 0 ? 99 : orden, sinSeries: !!fila && !plan.length});
    if(best && (!mejor || best.e1 > mejor.e1)) mejor = {...best, ej:e.ej};
    // Semana pasada: misma fila del bloque en la semana anterior, o la última vez que hizo el ejercicio
    const antes = Object.entries(ent).filter(([k2,e2]) => k2 !== k && e2.ej === e.ej && (e2.fecha||"") < (e.fecha||TODAY)).sort((a,b) => (a[1].fecha||"") < (b[1].fecha||"") ? 1 : -1);
    const misma = antes.find(([k2,e2]) => e2.b === bid && e2.w === +w-1) || antes[0];
    if(misma && top){ const t2 = Math.max(0, ...(misma[1].sets||[]).map(s => +s.peso||0)); if(t2 && top - t2 > 0 && (!mejora || top - t2 > mejora.d)) mejora = {ej:e.ej, d: top - t2}; }
    if(best){ const prevBest = Math.max(0, ...antes.flatMap(([,e2]) => (e2.sets||[]).map(s => e1rm(s.peso, s.reps, s.rpe)))); if(prevBest && best.e1 > prevBest*1.001 && (!record || best.e1 - prevBest > record.d)) record = {ej:e.ej, p:best.p, r:best.r, d: best.e1 - prevBest}; }
  }
  const ses = reg.sesiones?.[dk];
  return {ton: Math.round(ton * 10) / 10, series, rpe: rpeN ? rpeS/rpeN : null, porEj: porEj.sort((a,b) => b.kg - a.kg), mejor, mejora, record, min: ses?.min ?? null, fecha: ses?.fin?.slice(0,10) || (reg.hechos||{})[dk] || TODAY, dolor: ses?.dolor};
}
// "3 series × 5 reps × 50 kg = 750 kg" o, si cambian, "50×5 · 52,5×5 · 55×4 = 742,5 kg"
function calcTxt(x){
  const con = x.sets.filter(s => s.p);
  if(x.sets.every(s => s.u !== "reps")) return "Series por tiempo (no suman kilos)";
  if(!con.length) return `${x.sets.length} ${x.sets.length === 1 ? "serie" : "series"} sin peso (no suman kilos)`;
  const mismo = con.every(s => s.p === con[0].p && s.r === con[0].r) && con.length === x.sets.length;
  const extra = x.f === 2 ? " × 2 mancuernas" : "";

}

  y += s1 + 58;
  x.font = `700 44px ${SP}`; x.fillStyle = CREMA; x.textBaseline = "alphabetic"; x.fillText("Hoy moviste un total de", M, y + 32); y += 52;
  const big = R.ton.toLocaleString("es-CL"); const sb = fit(big, `800 #px ${SP}`, 210, W - 2*M);
  x.font = `800 ${sb}px ${SP}`; x.fillStyle = CREMA; x.fillText(big, M - 6, y + sb*0.78); y += sb*0.78 + 22;
  x.font = `800 60px ${SP}`; const wk = x.measureText("KILOS").width + 44; rr(M, y, wk, 84, 6, MAG); x.fillStyle = "#fff"; x.textBaseline = "middle"; x.fillText("KILOS", M+22, y+46);
  const cmp = comparacion(R.ton); if(cmp){ const sc = fit(cmp, `700 #px ${SP}`, 40, W - 2*M - wk - 30); x.font = `700 ${sc}px ${SP}`; x.fillStyle = CREMA; x.fillText(cmp, M + wk + 26, y + 44); }
  y += 116;
  // Indicadores
  const cards = [[R.min != null ? fmtMin(R.min) : "—","DURACIÓN"],[String(R.series),"SERIES"],[R.rpe != null ? fmtNum(Math.round(R.rpe*10)/10) : "—","RPE SERIES"]];
  if(R.rpeG != null) cards.push([String(R.rpeG), "RPE SESIÓN"]);
  const gap = 18, cw = (W - 2*M - gap*(cards.length-1))/cards.length;
  cards.forEach(([v,l],i) => { const X = M + i*(cw+gap); rr(X, y, cw, 130, 20, CARB); x.fillStyle = CREMA; const sv = fit(v, `800 #px ${SP}`, 50, cw - 36); x.font = `800 ${sv}px ${SP}`; x.textBaseline = "alphabetic"; x.fillText(v, X+20, y+68); x.font = `800 22px ${SP}`; x.fillStyle = "rgba(244,241,236,.6)"; x.fillText(l, X+20, y+108); });
  y += 156;
  // Detalle por ejercicio (cabe hasta la zona del logo)
  const yLogo = 1600; const recH = R.record ? 104 : 0; const limite = yLogo - 30 - recH;
  const agrupar = sets => { const out = []; sets.forEach((s,i) => { const l = out[out.length-1]; if(l && l.p === s.p && l.r === s.r && l.u === s.u){ l.b = i+1; } else out.push({...s, a:i+1, b:i+1}); }); return out; };
  // Primero cada serie en su fila (achicando filas); si no cabe, se agrupan series iguales seguidas ("Series 1–3")
  let bloques = R.det.map(d => ({...d, filas: d.sets.map((s,i) => ({...s, a:i+1, b:i+1}))}));
  let rh = 44, hh = 54, gp = 16;
  const alto = bl => bl.reduce((s,d) => s + hh + d.filas.length*rh + gp, 0);
  const achicar = () => { while(alto(bloques) > limite - y && rh > 30){ rh -= 2; hh = Math.max(38, hh - 2); gp = Math.max(6, gp - 1); } };
  achicar();
  if(alto(bloques) > limite - y){ bloques = bloques.map(d => ({...d, filas: agrupar(d.sets)})); rh = 44; hh = 54; gp = 16; achicar(); }
  let extra = 0; while(bloques.length > 1 && alto(bloques) + (extra ? 40 : 0) > limite - y){ bloques.pop(); extra++; }
  const cC = W*0.56, cR = W - M;
  bloques.forEach((d, bi) => {
    const fs = Math.round(hh*0.6); x.font = `800 ${fs}px ${SP}`; x.fillStyle = bi % 2 ? LIMA : MAG; x.textBaseline = "alphabetic";
    let nm = ejName(d.ej).toUpperCase(); while(x.measureText(nm).width > W*0.52 && nm.length > 4) nm = nm.slice(0,-2); if(nm !== ejName(d.ej).toUpperCase()) nm = nm.trim()+"…";
    x.fillText(nm, M, y + hh*0.72);
    if(d.vol){ x.font = `700 ${Math.round(fs*0.78)}px ${SP}`; x.fillStyle = "rgba(244,241,236,.75)"; const vt = `Volumen ${fmtKg(d.vol)} kg`; x.fillText(vt, cR - x.measureText(vt).width, y + hh*0.72); }
    y += hh;
    d.filas.forEach((f, i) => {
      if(i % 2 === 0) rr(M - 12, y + 2, W - 2*M + 24, rh - 4, 10, "rgba(244,241,236,.06)");
      const fz = Math.round(rh*0.58); x.font = `700 ${fz}px ${SP}`; x.fillStyle = "rgba(244,241,236,.7)"; x.textBaseline = "middle";
      x.fillText(f.a === f.b ? `Serie ${f.a}` : `Series ${f.a}–${f.b}`, M, y + rh/2 + 2);
      x.font = `800 ${fz}px ${SP}`; x.fillStyle = CREMA;
      x.fillText(f.p ? `${fmtKg(f.p)} kg${d.manc ? " c/u" : ""}` : "—", cC, y + rh/2 + 2);
      const rt = `${fmtNum(f.r)} ${f.u === "reps" ? "reps" : f.u}`; x.fillText(rt, cR - x.measureText(rt).width, y + rh/2 + 2);
      y += rh; });
    y += gp;
  });
  if(extra){ x.font = `700 28px ${SP}`; x.fillStyle = "rgba(244,241,236,.7)"; x.textBaseline = "alphabetic"; x.fillText(`+ ${extra} ejercicio${extra===1?"":"s"} más (incluido${extra===1?"":"s"} en el total)`, M, y + 26); y += 40; }
  if(R.record){ const yr = Math.min(y + 6, yLogo - 30 - 96); rr(M, yr, W - 2*M, 96, 20, LIMA); star(M + 46, yr + 48, 24, "#000000"); x.fillStyle = "#000000"; x.font = `800 28px ${SP}`; x.textBaseline = "alphabetic"; x.fillText("NUEVO RÉCORD", M + 88, yr + 40);
    const tr = `${ejName(R.record.ej)} · ${fmtKg(R.record.p)} kg × ${R.record.r}`; const st = fit(tr, `700 #px ${SP}`, 32, W - 2*M - 120); x.font = `700 ${st}px ${SP}`; x.fillText(tr, M + 88, yr + 78); }
  // Logo, Instagram y web
  const yb = yLogo;
  x.textBaseline = "alphabetic"; x.font = `400 64px ${NU}`; x.fillStyle = "#fff"; x.fillText("dime", M, yb + 50); let lx = M + x.measureText("dime").width;
  x.font = `800 64px ${NU}`; x.fillStyle = MAG; x.fillText("LES", lx, yb + 50); lx += x.measureText("LES").width; x.font = `400 64px ${NU}`; x.fillStyle = "#fff"; x.fillText("lift", lx, yb + 50); lx += x.measureText("lift").width;
  star(lx + 30, yb + 14, 14, MAG); star(lx + 56, yb + 36, 10, LIMA);
  x.font = `700 28px ${SP}`; x.fillStyle = "rgba(244,241,236,.8)"; const h1 = "@dimeleslift", h2 = "dimeleslift.com";
  x.fillText(h1, W - M - x.measureText(h1).width, yb + 18); x.fillText(h2, W - M - x.measureText(h2).width, yb + 56);
  return await new Promise(res => cv.toBlob(res, "image/png"));
}

/* ----- 4. Mi progreso: marcas reales y potencial ----- */
function progresoNv(uid){
  const a = S.alumnos[uid] || {}; const bw = bwOf(uid); const pt = planTrack(uid);
  const fY = d => d ? new Date(d+"T12:00").toLocaleDateString("es-CL",{day:"numeric",month:"short",year:"numeric"}) : "";
  const mk = {}; ["S","B","D"].forEach(L => mk[L] = mejorLift(uid, L));
  const tot = ["S","B","D"].every(L => mk[L]) ? mk.S.e1 + mk.B.e1 + mk.D.e1 : null;
  const gl = tot && bw ? glPoints(tot, bw, a.sexo || "F") : null;
  const faltan = ["S","B","D"].filter(L => !mk[L]).map(L => LIFTS[L].toLowerCase());
  const pctTxt = v => v == null ? "—" : Math.round(v*100)+"%";
  return `${msgHtml(msgDe("vida", uid, "progreso", "mp"))}
  <div class="card nv-real"><h3>${star5("#DA45A4")} Estas son tus mejores marcas</h3>
    <p class="small muted" style="margin:0">Lo que ya levantaste de verdad. Si tienes series con distintas repeticiones, aparece tu mejor desempeño: la serie que, contando kilos, repeticiones y RPE, muestra más fuerza.</p>
    <div class="nv-lifts">${["S","B","D"].map(L => { const m = mk[L]; return `<div><span>${LIFTS[L]}</span>${m ? `<b>${fmtKg(m.peso)} kg × ${m.reps}</b><small>${fY(m.fecha)}${m.rpe != null ? " · RPE "+fmtNum(m.rpe) : ""}</small>` : `<b class="muted">Sin registro todavía</b>`}</div>`; }).join("")}</div></div>
  <div class="card nv-est"><h3>${star5("#A3E850")} Esto es lo que podrías lograr</h3>
    <p class="small" style="margin:0">Según tus entrenamientos, este es el peso que podrías llegar a levantar en una sola repetición.</p>
    <div class="nv-lifts">${["S","B","D"].map(L => { const m = mk[L]; return `<div><span>${LIFTS[L]}</span>${m ? `<b>${fmtKg(m.e1)} kg</b><small>RM estimado</small>` : `<b class="muted">Sin datos suficientes</b>`}</div>`; }).join("")}</div>
    <p class="small muted" style="margin:0">Es una estimación, no una marca: se calcula con tus series y el RPE que anotas, y se actualiza con cada registro.</p></div>
  <div class="tiles">
    <div class="tile"><span>Total estimado</span><b>${tot ? fmtKg(tot) : "—"}</b><span>${tot ? "kg (suma de RM estimados)" : "Falta registrar "+esc(faltan.join(" y "))}</span></div>
    <div class="tile" style="background:var(--magenta)"><span style="color:#fff">IPF GL estimado</span><b>${gl ? fmt1(gl) : "—"}</b><span style="color:#fff">${gl ? fmt1(bw)+" kg corporal" : tot ? "Anota tu peso corporal" : "Necesita los tres levantamientos"}</span></div>
    <div class="tile"><span>Adherencia</span><b>${pctTxt(pt.adh)}</b><span>sesiones registradas</span></div>
  </div>`;
}

/* ----- Planilla: check-in al inicio del día y RPE global al marcarlo hecho ----- */
function ckCardPl(u, dk){
  if(!nv(u)) return "";
  if(ckHoy(u, dk)){ const st = S.ckP?.[dk]; if(st && ckSeq(st)[st.i] === "res" && !st.cerrado) return `<div class="card gd">${ckHtml(st, "pl", u, dk)}</div>`; return ""; }
  if((S.reg[u]?.hechos||{})[dk]) return "";
  S.ckP ||= {}; const st = S.ckP[dk] ||= {i:0, zonas:{}};
  return `<div class="card gd">${ckHtml(st, "pl", u, dk)}</div>`;
}
function rpegCardPl(u, dk){
  if(!nv(u) || !(S.reg[u]?.hechos||{})[dk]) return "";
  const ses = S.reg[u]?.sesiones?.[dk] || {}; S.plRpeg ||= {};
  if(ses.rpeG != null) return `<div class="card"><h3>RPE de la sesión</h3><div class="small">Registraste <b>${ses.rpeG}</b>${ses.min != null ? ` en ${fmtMin(ses.min)}` : ""}.</div></div>`;
  const v = S.plRpeg[dk];
  return `<div class="card gd">${rpegHtml(v, u, dk, "pl")}
    ${ses.min == null ? `<label class="f">¿Cuántos minutos duró la sesión?<input type="number" inputmode="numeric" id="pl-min" placeholder="Ej: 60"></label>` : ""}
    <button class="gd-cta" data-act="rpegPlOk" data-k="${esc(dk)}" ${v == null ? "disabled" : ""}>Guardar</button></div>`;
}

Object.assign(ACT, {
  ckResp: d => { const st = ckSt(d.ctx); if(!st) return; st[d.k] = +d.v;
    if(d.k === "cue" && +d.v > 2) st.zonas = {}; if(d.k === "ani" && +d.v > 2) delete st.emo; ckAvanzar(st, d.ctx); },
  ckZona: d => { const ctx = d.ctx; const st = ckSt(ctx); if(!st) return; st.zonas ||= {};
    if(st.zonas[d.z] !== undefined) delete st.zonas[d.z]; else st.zonas[d.z] = null; if(ctx === "gd") gdSave(); render(); },
  ckTipo: d => { const st = ckSt(d.ctx); if(!st) return; st.zonas[d.z] = d.v; if(d.ctx === "gd") gdSave(); render(); },
  ckSig: d => { const st = ckSt(d.ctx); if(!st) return; if(Object.values(st.zonas||{}).some(v => !v)) return; ckAvanzar(st, d.ctx); },
  ckEmo: d => { const st = ckSt(d.ctx); if(!st) return; st.emo = d.v; ckAvanzar(st, d.ctx); },
  ckAtras: d => { const st = ckSt(d.ctx); if(!st) return; st.i = Math.max(0, st.i - 1); st.saved = false; if(d.ctx === "gd") gdSave(); render(); window.scrollTo(0,0); },
  ckEmpezar: async () => { const g = S.gd; const c = gdCtx(); if(!g || !c) return; if(!g.ck?.saved && !(await ckGuardar(g.ck, c.u, c.dk))) return;
    g.fase = c.act.length ? "act" : (c.main.length ? "serie" : "cierre"); g.ini = Date.now(); gdSave(); render(); window.scrollTo(0,0); },
  ckListoPl: () => { const c = gdCtxPl(); if(!c) return; const st = S.ckP?.[c.dk]; if(st) st.cerrado = true; render(); },
  rpegSel: d => { if(d.ctx === "gd"){ if(!S.gd) return; S.gd.rpeG = +d.v; gdSave(); } else { const c = gdCtxPl(); if(!c) return; (S.plRpeg ||= {})[c.dk] = +d.v; } render(); },
  rpegOk: async () => { const g = S.gd; const c = gdCtx(); if(!g || !c || g.rpeG == null) return;
    if(await guardarRpeg(c.u, c.dk, g.rpeG)){ g.fase = "resumen"; gdSave(); render(); window.scrollTo(0,0); } },
  rpegPlOk: async d => { const u = viewUid(); const v = S.plRpeg?.[d.k]; if(v == null) return; const mi = numOrNull(document.getElementById("pl-min")?.value);
    if(await guardarRpeg(u, d.k, v, mi)) render(); },
  nvToggle: async d => { const a = S.alumnos[d.id]; if(!a) return; const na = {...a, beta: !a.beta}; if(await write("alumnos/"+d.id, na, na.beta ? "Novedades activadas para este alumno." : "Novedades desactivadas.")){ S.alumnos[d.id] = na; render(); } }
});

/* ---------- Conexión ---------- */
function listen(col, onDocs){
  const timer = setTimeout(() => { S.stale = true; if(S.state === "loading"){ S.state = "ok"; } scheduleRender(); }, 10000);
  S.db.collection(col).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if(d.exists) m[d.id] = d.data(); });
    onDocs(m);
    if(!snap.metadata.fromCache){ clearTimeout(timer); S.loaded[col] = true; }
    checkReady(); scheduleRender(); if(S.isOwner) setTimeout(ensurePrueba, 0);
  }, () => { clearTimeout(timer); S.loaded[col] = true; checkReady(); scheduleRender(); });
}
function checkReady(){
  const need = ["alumnos","programas","registros","feedback","ejercicios"].concat(S.isOwner ? ["coach"] : []);
  if(S.state === "loading" && need.every(c => S.loaded[c])){ S.state = "ok"; S.stale = false;
    if(S.isOwner) setTimeout(linkPending, 0);
    if(S.isOwner && !S.cur) S.cur = Object.entries(S.alumnos).sort((a,b) => (a[1].nombre||"").localeCompare(b[1].nombre||""))[0]?.[0] || null;
    if(!S.isOwner) S.tab = "inicio"; }
  if(need.every(c => S.loaded[c])) S.stale = false;
  if(S.isOwner && S.cur && !S.alumnos[S.cur] && S.state === "ok") S.cur = Object.keys(S.alumnos)[0] || null;
  if(S.isOwner && !S.cur && S.state === "ok") S.cur = Object.keys(S.alumnos)[0] || null;
}
(async () => {
  render();
  const c = window.claude;
  const [db, user] = c ? await Promise.all([c.use("db"), c.use("user")]) : [null, null];
  if(!db){ S.state = "nodb"; render(); return; }
  S.db = db; S.user = user;
  try{ S.assets = await c.use("assets"); }catch(e){ S.assets = null; }
  S.uid = user ? await user.id() : null;
  S.isOwner = user ? !!(await user.isOwner()) : false;
  if(!S.isOwner && !S.uid){ S.state = "nodb"; render(); return; }
  S.role = S.isOwner ? "coach" : "alumno"; S.tab = S.isOwner ? "equipo" : "inicio";
  listen("ejercicios", m => { S.ejDb = m; mergeEj(); });
  listen("alumnos", m => { S.alumnos = m; if(S.isOwner){ loadEmails(); setTimeout(linkPending, 0); } });
  listen("programas", m => S.prog = m);
  listen("registros", m => S.reg = m);
  listen("feedback", m => S.fb = m);
  if(S.isOwner) listen("coach", m => S.meta = m.meta || {pagos:{}});
  if(user?.me) user.me().then(pr => { S.meEmail = pr?.email || ""; S.meName = pr?.name || ""; render(); }).catch(() => {});
  if(S.isOwner) c.use("mcp").then(m => { S.mcp = m; render(); }).catch(() => { S.mcp = null; });
})();
</script>
