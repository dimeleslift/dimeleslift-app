ay on your side. Loop a belt, rope, or band around your top foot. Flex the knee and extend your hip, attempting to touch your glutes with your foot, and holding the belt with your hands. This will be your starting position.","With the belt being held over the shoulder or overhead, gently pull to increase the stretch in the quadriceps. Hold for 10-20 seconds, and then switch sides."],"en":"Quad Stretch","f":"static"},"fdb-Quadriceps-SMR":{"nombre":"Cuádriceps con foam roller","grupos":["cuadriceps"],"eq":"Foam roller","niv":"Intermedio","cat":"Elongación","inst":["Lay facedown on the floor with your weight supported by your hands or forearms. Place a foam roll underneath one leg on the quadriceps, and keep the foot off of the ground. Make sure to relax the leg as much as possible. This will be your starting position.","Shifting as much weight onto the leg to be stretched as is tolerable, roll over the foam from above the knee to below the hip, holding points of tension for 10-30 seconds. Switch sides."],"en":"Quadriceps-SMR","f":"static","m":"i"},"fdb-Quick_Leap":{"nombre":"Salto rápido","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["You will need a box for this exerise.","Begin facing the box standing 1-2 feet from its edge.","By utilizing your hips, hop onto the box, landing on both legs. Ensure that you land with your legs bent and your feet flat.","Immediately upon landing, fully extend through the entire body and swing your arms overhead to explode off of the box. Use your legs to absorb the impact of landing."],"en":"Quick Leap","f":"push","m":"c","sec":["gemelos","isquios"]},"fdb-Rack_Delivery":{"nombre":"Recepción en rack","grupos":["hombros"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Este ejercicio enseña a llevar la barra a la posición de apoyo en los hombros. Sostén la barra en posición de espantapájaros: brazos paralelos al suelo y antebrazos colgando. Usa agarre de gancho, con los dedos sobre los pulgares.","Gira los codos alrededor de la barra llevándola a los hombros, relajando el agarre al adelantar los codos. Los hombros van adelante para formar un apoyo y la barra roza la garganta.","La barra debe ir siempre pegada al cuerpo; con más carga, cualquier distancia termina en un golpe. A medida que el movimiento se vuelva fluido, aumenta velocidad y carga antes de avanzar."],"en":"Rack Delivery","ines":1,"f":"pull","m":"c","sec":["antebrazos","trapecio"]},"fdb-Rack_Pull_with_Bands":{"nombre":"Rack pull con bandas","grupos":["espalda_baja"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["En un rack, deja la barra sobre los pines a la altura deseada: bajo la rodilla, sobre ella o a mitad de muslo. Fija bandas a la base del rack (o a mancuernas) y a la barra; estrangúlalas si necesitas tensión.","Ubícate en posición de peso muerto: pies bajo la cadera, agarre al ancho de hombros, espalda firme y cadera atrás para cargar los isquiotibiales. Con cargas altas puedes usar agarre mixto, gancho o straps.","Mirando al frente, extiende cadera y rodillas tirando la barra arriba y atrás hasta bloquear, con los hombros atrás al final. Devuelve la barra a los pines y repite."],"en":"Rack Pull with Bands","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","gluteos","isquios","trapecio"]},"fdb-Rack_Pulls":{"nombre":"Rack pull","grupos":["espalda_baja"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["En un rack, deja la barra sobre los pines a la altura deseada: bajo la rodilla, sobre ella o a mitad de muslo. Ubícate en posición de peso muerto: pies bajo la cadera, agarre al ancho de hombros, espalda firme y cadera atrás. Con cargas altas puedes usar agarre mixto, gancho o straps.","Mirando al frente, extiende cadera y rodillas tirando la barra arriba y atrás hasta bloquear, con los hombros atrás al final.","Devuelve la barra a los pines y repite."],"en":"Rack Pulls","ines":1,"f":"pull","m":"c","sec":["antebrazos","gluteos","isquios","trapecio"]},"fdb-Rear_Leg_Raises":{"nombre":"Elevación de pierna atrás","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["Place yourself on your hands knees on an exercise mat. Your head should be looking forward and the bend of the knees should create a 90-degree angle between the hamstrings and the calves. This will be your starting position.","Extend one leg up and behind you. The knee and hip should both extend. Repeat for 5-10 repetitions, and then switch sides."],"en":"Rear Leg Raises","f":"push"},"fdb-Recumbent_Bike":{"nombre":"Bicicleta reclinada","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Cardio","inst":["To begin, seat yourself on the bike and adjust the seat to your height.","Select the desired option from the menu. You may have to start pedaling to turn it on. You can use the manual setting, or you can select a program to use. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. The level of resistance can be changed throughout the workout. The handles can be used to monitor your heart rate to help you stay at an appropriate intensity.","Recumbent bikes offer convenience, cardiovascular benefits, and have less impact than other activities. A 150 lb person will burn about 230 calories cycling at a moderate rate for 30 minutes, compared to 450 calories or more running."],"en":"Recumbent Bike","sec":["gemelos","gluteos","isquios"]},"fdb-Return_Push_from_Stance":{"nombre":"Empuje de regreso desde postura","grupos":["hombros"],"eq":"Balón medicinal","niv":"Principiante","cat":"Pliometría","inst":["You will need a partner for this drill.","Begin in an athletic 2 or 3 point stance.","At the signal, move into a position to receive the pass from your partner.","Catch the medicine ball with both hands and immediately throw it back to your partner.","You can modify this drill by running different routes."],"en":"Return Push from Stance","f":"push","m":"c","sec":["pectoral","triceps"]},"fdb-Reverse_Band_Bench_Press":{"nombre":"Press banca con bandas invertidas","grupos":["triceps"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Pon el banco dentro de un rack con la barra a la altura correcta. Ancla las bandas a los ganchos o a la parte superior del rack, de modo que queden sobre ti, y el otro extremo a la barra.","Acuéstate, pies atrás y espalda arqueada. Despega, junta y retrae los hombros; usa los pies para empujar los trapecios contra el banco y mantén la tensión. Cubre las marcas de la barra con el agarre.","Saca la barra sin separar las escápulas, apretándola como si quisieras abrirla. Bájala a la parte baja del pecho o alta del abdomen, con barra, muñeca y codo alineados.","Pausa al tocar el torso y empuja con toda la fuerza posible, codos recogidos hasta bloquear."],"en":"Reverse Band Bench Press","ines":1,"f":"push","m":"c","sec":["antebrazos","dorsales","hombros","pectoral"]},"fdb-Reverse_Band_Box_Squat":{"nombre":"Sentadilla al cajón con bandas invertidas","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Ponte en un rack con un cajón detrás a la altura adecuada. Ancla las bandas a los ganchos o a la parte superior del rack, justo sobre la barra, y el otro extremo a la barra.","Métete bajo la barra y apóyala en la parte alta de la espalda. Junta las escápulas y lleva los codos adelante. Sácala con la zona lumbar firme y ubícate. Pies más anchos enfatizan cadena posterior; más juntos, cuádriceps. Mira al frente.","Con espalda, hombros y core firmes, empuja rodillas y cadera hacia afuera y baja hasta sentarte en el cajón, idealmente con las canillas verticales. Pausa y relaja los flexores de cadera. Nunca rebotes.","Con el peso en los talones y empujando pies y rodillas hacia afuera, sube guiando con la cabeza y con tensión de pies a cabeza. Devuelve la barra al rack con cuidado."],"en":"Reverse Band Box Squat","ines":1,"f":"push","m":"c","sec":["abductores","aductores","antebrazos","espalda_baja","gemelos","gluteos","isquios"]},"fdb-Reverse_Band_Deadlift":{"nombre":"Peso muerto con bandas invertidas","grupos":["espalda_baja"],"eq":"Barra","niv":"Avanzado","cat":"Powerlifting","inst":["Pon la barra en un rack. Ancla las bandas a la parte superior del rack y el otro extremo a la barra.","Acércate hasta que la barra quede sobre el centro de los pies, separados al ancho de cadera. Flecta la cadera para tomarla al ancho de hombros, dejando que las escápulas se separen. Agarre prono o mixto en series pesadas.","Con pies y agarre listos, toma aire, baja la cadera y flecta las rodillas hasta que las canillas toquen la barra. Mira al frente, pecho arriba y espalda firme, y empuja con los talones.","Pasada la rodilla, tira la barra hacia atrás juntando las escápulas mientras llevas la cadera hacia la barra.","Baja la barra flectando la cadera y guiándola al suelo."],"en":"Reverse Band Deadlift","ines":1,"f":"pull","m":"c","sec":["abductores","aductores","cuadriceps","gemelos","gluteos","isquios"]},"fdb-Reverse_Band_Power_Squat":{"nombre":"Sentadilla de powerlifting con bandas invertidas","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Powerlifting","inst":["Ponte en un rack con pines y barra a la altura adecuada. Carga la barra y ancla las bandas a la parte superior del rack y a la barra.","Métete bajo la barra y apóyala en la parte alta de la espalda. Junta las escápulas y lleva los codos adelante. Sácala con la zona lumbar firme y ubícate con los pies anchos para enfatizar espalda, glúteos, aductores e isquiotibiales.","Mira al frente. Con espalda, hombros y core firmes, empuja rodillas y cadera hacia afuera y baja llevando la cadera atrás lo más posible, idealmente con las canillas verticales. Con barra baja, el torso se inclina más para mantener la barra sobre el medio del pie. Baja hasta romper el paralelo (pliegue de cadera bajo la parte superior de la rodilla).","Con el peso en los talones y empujando pies y rodillas hacia afuera, sube guiando con la cabeza y con tensión de pies a cabeza."],"en":"Reverse Band Power Squat","ines":1,"f":"push","m":"c","sec":["aductores","espalda_baja","gemelos","gluteos","isquios"]},"fdb-Reverse_Band_Sumo_Deadlift":{"nombre":"Peso muerto sumo con bandas invertidas","grupos":["isquios"],"eq":"Barra","niv":"Avanzado","cat":"Powerlifting","inst":["Pon una barra cargada en el suelo dentro de un rack. Ancla las bandas a la parte superior del rack y a la barra.","Acércate hasta que la barra cruce el medio de los pies, con los pies muy separados, cerca de los collarines. Flecta la cadera para tomar la barra con los brazos justo bajo los hombros, por dentro de las piernas; agarre prono, mixto o gancho. Relaja los hombros para “alargar” los brazos.","Toma aire, baja la cadera mirando al frente con el pecho arriba. Empuja el suelo separando los pies, con el peso en la mitad trasera del pie, extendiendo cadera y rodillas.","Al pasar la rodilla, échate atrás y lleva la cadera hacia la barra juntando las escápulas.","Baja la barra al suelo flectando la cadera, controlando la bajada."],"en":"Reverse Band Sumo Deadlift","ines":1,"f":"pull","m":"c","sec":["abductores","aductores","antebrazos","cuadriceps","espalda_baja","gemelos","gluteos","trapecio"]},"fdb-Reverse_Barbell_Curl":{"nombre":"Curl invertido con barra","grupos":["biceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["De pie, erguido, toma una barra al ancho de hombros en prono (palmas abajo), codos cerca del torso. Esta es la posición inicial.","Sin mover los brazos, flecta los codos subiendo la barra botando el aire, hasta la altura de los hombros. Solo se mueven los antebrazos. Aprieta un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Reverse Barbell Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Reverse_Barbell_Preacher_Curls":{"nombre":"Curl Scott invertido con barra","grupos":["biceps"],"eq":"Barra Z","niv":"Intermedio","cat":"Fuerza","inst":["Toma una barra Z en prono, al ancho de hombros.","Apoya ambos brazos sobre un banco Scott con los brazos estirados. Esta es la posición inicial.","Botando el aire, sube la barra hasta la altura de los hombros. Aprieta fuerte un segundo.","Inspirando, baja lento hasta estirar los brazos por completo.","Repite las repeticiones indicadas."],"en":"Reverse Barbell Preacher Curls","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Reverse_Cable_Curl":{"nombre":"Curl invertido en polea","grupos":["biceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["De pie, erguido, toma la barra de una polea baja en prono (palmas abajo) al ancho de hombros, con los codos cerca del torso. Esta es la posición inicial.","Sin mover los brazos, flecta los codos subiendo la barra botando el aire, hasta la altura de los hombros. Solo se mueven los antebrazos. Aprieta un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Reverse Cable Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Reverse_Crunch":{"nombre":"Crunch invertido","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con las piernas estiradas y los brazos a los lados, palmas en el suelo; los brazos no se mueven.","Sube las piernas hasta que los muslos queden perpendiculares al suelo, pies juntos y canillas paralelas al suelo. Esta es la posición inicial.","Lleva las piernas hacia el torso rodando la pelvis y despegando la cadera del suelo, hasta que las rodillas toquen el pecho.","Sostén un segundo y vuelve a la posición inicial.","Repite las repeticiones indicadas."],"en":"Reverse Crunch","ines":1,"f":"pull","m":"i"},"fdb-Reverse_Flyes":{"nombre":"Vuelos posteriores","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate boca abajo en un banco inclinado con pecho y abdomen apoyados, una mancuerna en cada mano y palmas enfrentadas.","Brazos estirados hacia el suelo, perpendiculares al banco. Piernas quietas, apoyadas en las puntas de los pies. Esta es la posición inicial.","Con los codos levemente flectados, abre los brazos hacia los lados en arco, botando el aire, juntando las escápulas.","Sube hasta que los brazos queden paralelos al suelo.","Siente la contracción y baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Reverse Flyes","ines":1,"f":"pull","m":"i"},"fdb-Reverse_Flyes_With_External_Rotation":{"nombre":"Vuelos posteriores con rotación externa","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate boca abajo en un banco inclinado a 30° con pecho y abdomen apoyados.","Una mancuerna en cada mano con las palmas hacia el suelo, brazos perpendiculares al banco y codos levemente flectados. Piernas quietas sobre las puntas de los pies (talones sin tocar el suelo). Esta es la posición inicial.","Con los codos levemente flectados, abre los brazos en arco, botando el aire.","Mientras subes, rota las muñecas 90° hacia afuera, pasando de palmas abajo a palmas enfrentadas, juntando las escápulas.","Sube hasta que los brazos queden a la altura de la cabeza.","Siente la contracción y baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Reverse Flyes With External Rotation","ines":1,"f":"pull","m":"i"},"fdb-Reverse_Grip_Bent-Over_Rows":{"nombre":"Remo inclinado agarre supino","grupos":["dorsales"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["De pie, toma una barra en supino (palmas arriba).","Flecta levemente las rodillas e inclina el torso desde la cadera, con la espalda recta, hasta casi quedar paralelo al suelo. Cabeza neutra y brazos colgando. Esta es la posición inicial.","Sin mover el torso, tira la barra hacia ti botando el aire, con los codos cerca del cuerpo; los antebrazos solo sostienen. Arriba, aprieta la espalda un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Reverse Grip Bent-Over Rows","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Reverse_Grip_Triceps_Pushdown":{"nombre":"Pushdown de tríceps agarre supino","grupos":["triceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra recta o Z en una polea alta.","De frente a ella, tómala en supino al ancho de hombros y bájala hasta estirar los brazos a los costados, con los codos pegados y los pies al ancho de hombros. Esta es la posición inicial.","Deja subir la barra lento inspirando hasta la altura del pecho. Solo se mueven los antebrazos; codos y brazos fijos al costado.","Baja la barra a la posición inicial botando el aire y contrayendo fuerte el tríceps.","Repite las repeticiones indicadas."],"en":"Reverse Grip Triceps Pushdown","ines":1,"f":"push","m":"i"},"fdb-Reverse_Hyperextension":{"nombre":"Hiperextensión invertida","grupos":["isquios"],"eq":"Máquina","niv":"Intermedio","cat":"Fuerza","inst":["Carga la máquina, pon los pies entre los cojines y acuéstate boca abajo sobre el cojín superior con la cadera colgando atrás, afirmándote de los agarres.","Flecta la cadera llevando las piernas hacia adelante.","Extiende la cadera llevando las piernas atrás. No sobreextiendas: detente antes del final de tu rango.","Vuelve flectando la cadera, llevando el soporte adelante lo más que puedas.","Repite las repeticiones indicadas."],"en":"Reverse Hyperextension","ines":1,"f":"pull","sec":["gemelos","gluteos"]},"fdb-Reverse_Machine_Flyes":{"nombre":"Vuelos posteriores en máquina","grupos":["hombros"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Lleva los agarres completamente atrás, elige la carga y ajusta el asiento para que los agarres queden a la altura de los hombros. Tómalos con las palmas hacia adentro. Esta es la posición inicial.","En semicírculo, lleva las manos hacia los lados y atrás contrayendo los deltoides posteriores.","Brazos levemente flectados todo el movimiento; solo se mueve el hombro.","Pausa atrás y vuelve lento a la posición inicial."],"en":"Reverse Machine Flyes","ines":1,"f":"pull","m":"i"},"fdb-Reverse_Plate_Curls":{"nombre":"Curl invertido con disco","grupos":["biceps"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["De pie, sostén un disco con ambas manos y los brazos estirados, en prono, con los dedos en la cara rugosa y el pulgar en la lisa. Tómalo en posición de 11 y 1 del reloj.","Pies al ancho de hombros y el disco frente a la ingle. Esta es la posición inicial.","Sube lento el disco con los codos adentro y los brazos fijos hasta que bíceps y antebrazo se toquen, botando el aire.","Sostén un segundo y baja a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Reverse Plate Curls","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Reverse_Triceps_Bench_Press":{"nombre":"Press banca de tríceps agarre supino","grupos":["triceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate en un banco plano. Con agarre supino cerrado (al ancho de hombros), saca la barra del rack y sostenla sobre ti con los brazos estirados y perpendiculares al suelo. Esta es la posición inicial.","Inspirando, baja lento hasta sentir la barra en la mitad del pecho, con los codos pegados al torso para dar más trabajo al tríceps.","Tras una pausa, empuja con los tríceps botando el aire. Bloquea, sostén un segundo y vuelve a bajar lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas.","Al terminar, deja la barra en el rack."],"en":"Reverse Triceps Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Rhomboids-SMR":{"nombre":"Romboides con foam roller","grupos":["dorsales"],"eq":"Foam roller","niv":"Intermedio","cat":"Elongación","inst":["Lay down with your back on the floor. Place a foam roll underneath your upper back, and cross your arms in front of you, protracting your shoulders. This will be your starting position.","Raise your hips off of the ground, placing your weight onto the foam roll. Shift your weight to one side at a time, rolling over your middle and upper back. Pause at points of tension for 10-30 seconds."],"en":"Rhomboids-SMR","f":"static","sec":["trapecio"]},"fdb-Rickshaw_Carry":{"nombre":"Paseo con rickshaw","grupos":["antebrazos"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["Pon el marco (rickshaw) en el punto de partida y cárgalo. Párate al centro, toma los agarres y empuja con los talones para levantarlo, con pecho y cabeza arriba y espalda recta.","Camina de inmediato a paso rápido con pasos cortos y controlados, pecho arriba, mirada al frente y respirando. Baja el marco al llegar al final."],"en":"Rickshaw Carry","ines":1,"m":"c","sec":["core","cuadriceps","espalda_baja","gemelos","gluteos","isquios","trapecio"]},"fdb-Rickshaw_Deadlift":{"nombre":"Peso muerto con rickshaw","grupos":["cuadriceps"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["Carga el marco y ubícate al centro de los agarres, pies al ancho de cadera. Flecta la cadera para tomar los agarres, dejando que las escápulas se separen.","Con pies y agarre listos, toma aire, baja la cadera y flecta las rodillas. Mira al frente, pecho arriba y espalda firme, y empuja con los talones. Al subir, junta las escápulas mientras llevas la cadera adelante.","Baja flectando la cadera y guiando la carga al suelo."],"en":"Rickshaw Deadlift","ines":1,"f":"pull","m":"c","sec":["antebrazos","espalda_baja","gluteos","isquios","trapecio"]},"fdb-Ring_Dips":{"nombre":"Fondos en argollas","grupos":["triceps"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Toma una argolla con cada mano y da un pequeño salto para quedar arriba con los brazos bloqueados.","Flecta los codos bajando hasta pasar los 90°, sin balancearte y con buena postura.","Extiende los codos para volver a la posición inicial.","Repite las repeticiones indicadas."],"en":"Ring Dips","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Rocket_Jump":{"nombre":"Salto cohete","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Pliometría","inst":["Begin in a relaxed stance with your feet shoulder width apart and hold your arms close to the body.","To initiate the move, squat down halfway and explode back up as high as possible.","Fully extend your entire body, reaching overhead as far as possible. As you land, absorb your impact through the legs."],"en":"Rocket Jump","f":"push","m":"c","sec":["gemelos","isquios"]},"fdb-Rocking_Standing_Calf_Raise":{"nombre":"Gemelos de pie con balanceo","grupos":["gemelos"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack. Pon la barra a la altura adecuada, métete debajo y apóyala en la parte alta de la espalda.","Toma la barra con ambas manos y sácala del rack empujando con las piernas mientras enderezas el torso.","Aléjate del rack, pies al ancho de hombros y puntas levemente afuera. Mira al frente, espalda recta y rodillas levemente flectadas, nunca bloqueadas. Esta es la posición inicial.","Sube los talones lo más alto posible botando el aire. Las rodillas no cambian su leve flexión. Sostén un segundo.","Baja lento hasta estirar las pantorrillas, inspirando.","Ahora sube las puntas de los pies contrayendo el tibial anterior, botando el aire.","Sostén un segundo y bájalas inspirando.","Repite las repeticiones indicadas."],"en":"Rocking Standing Calf Raise","ines":1,"f":"push","m":"i"},"fdb-Rocky_Pull-Ups_Pulldowns":{"nombre":"Dominadas/jalones Rocky","grupos":["dorsales"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Toma la barra con las palmas al frente y agarre ancho.","Con los brazos estirados, inclina el torso unos 30° atrás, saca pecho y deja una leve curva lumbar. Esta es la posición inicial.","Sube hasta que la barra toque la parte alta del pecho, llevando hombros y brazos abajo y atrás, botando el aire. Aprieta la espalda arriba; solo se mueven los brazos.","Tras un segundo, inspira y baja lento hasta estirar los brazos y los dorsales.","Repite, pero esta vez con el torso recto, llevando la barra detrás del cuello. Inclinar un poco la cabeza adelante ayuda.","Al volver abajo, repite el ciclo las repeticiones indicadas en tu programa."],"en":"Rocky Pull-Ups/Pulldowns","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Romanian_Deadlift":{"nombre":"Peso muerto rumano","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Toma una barra del suelo en prono, algo más ancho que los hombros. Según la carga, puedes usar straps y una plataforma para más rango.","Flecta levemente las rodillas con las canillas verticales, cadera atrás y espalda recta. Esta es la posición inicial.","Con espalda y brazos siempre rectos, sube la barra con la cadera botando el aire, de forma controlada.","De pie, baja la barra llevando la cadera atrás y flectando apenas las rodillas, a diferencia de una sentadilla. Toma aire al inicio, pecho arriba, aguanta al bajar y bota al terminar.","Repite las repeticiones indicadas."],"en":"Romanian Deadlift","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gemelos","gluteos"]},"fdb-Romanian_Deadlift_from_Deficit":{"nombre":"Peso muerto rumano con déficit","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["De pie, sostén una barra frente a ti con los brazos estirados. Puedes pararte sobre una plataforma para aumentar el rango.","Flecta levemente las rodillas y luego la cadera, llevándola lo más atrás posible y bajando el torso hasta donde tu flexibilidad permita. La espalda se mantiene siempre extendida y la barra en contacto con las piernas. Bien hecho, sentirás mucha tensión en los isquiotibiales.","Vuelve a la posición inicial."],"en":"Romanian Deadlift from Deficit","ines":1,"f":"pull","m":"c","sec":["antebrazos","espalda_baja","gluteos","trapecio"]},"fdb-Rope_Climb":{"nombre":"Trepar la cuerda","grupos":["dorsales"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Toma la cuerda con ambas manos sobre la cabeza y tira de ella mientras das un pequeño salto.","Enrolla la cuerda en una pierna y pellízcala con los pies. Estira los brazos lo más alto posible y agarra firme.","Suelta los pies y sube con los brazos llevando las rodillas al pecho.","Vuelve a fijar la cuerda con los pies, ponte de pie y agarra más arriba. Sigue hasta llegar arriba.","Para bajar, afloja los pies y deslízate bajando mano tras mano."],"en":"Rope Climb","ines":1,"f":"pull","m":"c","sec":["antebrazos","biceps","hombros"]},"fdb-Rope_Crunch":{"nombre":"Crunch con cuerda","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Arrodíllate a 30-60 cm de una polea con cuerda.","Elige la carga y toma la cuerda con ambas manos por sobre la cabeza, con el torso erguido.","Flecta la columna intentando llevar las costillas hacia las piernas mientras tiras la cuerda hacia abajo.","Pausa abajo y vuelve lento a la posición inicial.","Puedes agregar giros o hacerlo hacia un lado para trabajar oblicuos."],"en":"Rope Crunch","ines":1,"f":"pull","m":"i"},"fdb-Rope_Jumping":{"nombre":"Saltar la cuerda","grupos":["cuadriceps"],"eq":"Otro","niv":"Intermedio","cat":"Cardio","inst":["Hold an end of the rope in each hand. Position the rope behind you on the ground. Raise your arms up and turn the rope over your head bringing it down in front of you. When it reaches the ground, jump over it. Find a good turning pace that can be maintained. Different speeds and techniques can be used to introduce variation.","Rope jumping is exciting, challenges your coordination, and requires a lot of energy. A 150 lb person will burn about 350 calories jumping rope for 30 minutes, compared to over 450 calories running."],"en":"Rope Jumping","sec":["gemelos","isquios"]},"fdb-Rope_Straight-Arm_Pulldown":{"nombre":"Jalón con brazos rectos con cuerda","grupos":["dorsales"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon una cuerda en una polea alta y elige la carga. Párate a un par de pasos con los pies escalonados y toma la cuerda con ambas manos. Inclínate desde la cadera con la espalda recta y los brazos estirados hacia arriba al frente. Esta es la posición inicial.","Con los brazos estirados, extiende el hombro bajando la cuerda hasta los muslos.","Pausa abajo apretando los dorsales.","Vuelve sin dejar que la carga se apoye por completo."],"en":"Rope Straight-Arm Pulldown","ines":1,"f":"pull","m":"i"},"fdb-Round_The_World_Shoulder_Stretch":{"nombre":"Estiramiento de hombros vuelta al mundo","grupos":["hombros"],"eq":"Otro","niv":"Principiante","cat":"Elongación","inst":["Stand up straight with your legs together, holding a bodybar or broomstick.","Hold the pole behind your hips with a wider than shoulder width grip. Your palms should be down and your thumbs facing out.","Slowly lift your arms up behind your head. Don't force it if it gets hard to lift further."],"en":"Round The World Shoulder Stretch","f":"static","sec":["biceps","pectoral"]},"fdb-Rowing_Stationary":{"nombre":"Remo estático","grupos":["cuadriceps"],"eq":"Máquina","niv":"Intermedio","cat":"Cardio","inst":["To begin, seat yourself on the rower. Make sure that your heels are resting comfortably against the base of the foot pedals and that the straps are secured. Select the program that you wish to use, if applicable. Sit up straight and bend forward at the hips.","There are three phases of movement when using a rower. The first phase is when you come forward on the rower. Your knees are bent and against your chest. Your upper body is leaning slightly forward while still maintaining good posture. Next, push against the foot pedals and extend your legs while bringing your hands to your upper abdominal area, squeezing your shoulders back as you do so. To avoid straining your back, use primarily your leg and hip muscles.","The recovery phase simply involves straightening your arms, bending the knees, and bringing your body forward again as you transition back into the first phase."],"en":"Rowing, Stationary","sec":["biceps","dorsales","espalda_baja","gemelos","gluteos","isquios"]},"fdb-Runners_Stretch":{"nombre":"Estiramiento del corredor","grupos":["isquios"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["It's easiest to get into this stretch if you start standing up, put one leg behind you, and slowly lower your torso down to the floor.","Keep the front heel on the floor (if it lifts up, scoot your other leg further back).","Place your hands on either side of your front leg. To get more out of this stretch, push your butt up toward the ceiling, and then gradually lower it back toward the floor. You'll Stretch the hip flexor of the back leg and the hamstring and buttocks of the front."],"en":"Runner's Stretch","f":"static","sec":["gemelos"]},"fdb-Running_Treadmill":{"nombre":"Correr en trotadora","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Cardio","inst":["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than running outside. A 150 lb person will burn over 450 calories running 8 miles per hour for 30 minutes. Maintain proper posture as you run, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."],"en":"Running, Treadmill","sec":["gemelos","gluteos","isquios"]},"fdb-Russian_Twist":{"nombre":"Giro ruso","grupos":["core"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate con los pies fijos bajo algo firme o sujetos por un compañero, rodillas flectadas.","Sube el tronco hasta formar una V con los muslos. Brazos estirados al frente, perpendiculares al torso, manos juntas. Esta es la posición inicial.","Gira el torso a la derecha hasta que los brazos queden paralelos al suelo, botando el aire.","Sostén un segundo y vuelve al centro. Luego gira hacia la izquierda de la misma forma.","Repite las repeticiones indicadas."],"en":"Russian Twist","ines":1,"f":"pull","m":"c","sec":["espalda_baja"]},"fdb-Sandbag_Load":{"nombre":"Carga de sacos de arena","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Strongman","inst":["Pon los sacos u objetos a cierta distancia de la plataforma, típicamente unos 15 m.","Levanta el saco. Son muy incómodos y la forma de tomarlos depende de cada saco. Rodéalo lo más que puedas y extiende cadera y rodillas para subirlo alto. Normalmente no se permite llevarlo al hombro.","Muévete lo más rápido posible hasta la plataforma y cárgalo extendiendo cadera, rodillas y tobillos, dejándolo bien puesto para que no se caiga.","Vuelve por el siguiente saco y repite hasta terminar."],"en":"Sandbag Load","ines":1,"f":"pull","m":"c","sec":["antebrazos","biceps","core","dorsales","espalda_baja","gemelos","gluteos","hombros","isquios","trapecio"]},"fdb-Scapular_Pull-Up":{"nombre":"Dominada escapular","grupos":["trapecio"],"eq":"","niv":"Principiante","cat":"Fuerza","inst":["Toma la barra de dominadas en prono.","Colgando, sube unos centímetros sin flectar los brazos, bajando los hombros (como un encogimiento al revés).","Pausa al final y vuelve lento a la posición inicial antes de repetir."],"en":"Scapular Pull-Up","ines":1,"f":"pull","m":"i","sec":["dorsales"]},"fdb-Scissor_Kick":{"nombre":"Patada de tijera","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["To begin, lie down with your back pressed against the floor or on an exercise mat (optional). Your arms should be fully extended to the sides with your palms facing down. Note: The arms should be stationary the entire time.","With a slight bend at the knees, lift your legs up so that your heels are about 6 inches off the ground. This is the starting position.","Now lift your left leg up to about a 45 degree angle while your right leg is lowered until the heel is about 2-3 inches from the ground.","Switch movements by raising your right leg up and lowering your left leg. Remember to breathe while performing this exercise.","Repeat for the recommended amount of repetitions."],"en":"Scissor Kick","f":"pull","m":"i"},"fdb-Scissors_Jump":{"nombre":"Salto de tijera","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Pliometría","inst":["Assume a lunge stance position with one foot forward with the knee bent, and the rear knee nearly touching the ground.","Ensure that the front knee is over the midline of the foot. Extending through both legs, jump as high as possible, swinging your arms to gain lift.","As you jump as high as you can, switch the position of your legs, moving your front leg to the back and the rear leg to the front.","As you land, absorb the impact through the legs by adopting the lunge position, and repeat."],"en":"Scissors Jump","f":"push","m":"c","sec":["gluteos","isquios"]},"fdb-Seated_Band_Hamstring_Curl":{"nombre":"Curl femoral sentado con banda","grupos":["isquios"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Fija una banda cerca del suelo y pon un banco a un par de pasos.","Siéntate en el banco con la banda detrás de los tobillos y las piernas estiradas. Esta es la posición inicial.","Flecta las rodillas llevando los pies hacia el banco. Puede que debas inclinarte un poco atrás para no golpear el suelo con los pies.","Pausa al final y vuelve lento a la posición inicial."],"en":"Seated Band Hamstring Curl","ines":1,"f":"pull","m":"i"},"fdb-Seated_Barbell_Military_Press":{"nombre":"Press militar sentado con barra","grupos":["hombros"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Siéntate en un banco de press militar con la barra detrás de la cabeza. Que alguien te la pase (mejor para el manguito rotador) o tómala con cuidado en prono, más ancho que los hombros (antebrazo y brazo a 90° abajo).","Sube la barra sobre la cabeza bloqueando los brazos, un poco delante de la cabeza. Esta es la posición inicial.","Baja lento la barra hasta las clavículas inspirando.","Súbela de vuelta botando el aire.","Repite las repeticiones indicadas."],"en":"Seated Barbell Military Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Seated_Barbell_Twist":{"nombre":"Giro sentado con barra","grupos":["core"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en el extremo de un banco plano con una barra sobre los muslos y los pies al ancho de hombros.","Toma la barra en prono, más ancho que los hombros, y súbela sobre la cabeza hasta estirar los brazos.","Bájala detrás de la cabeza hasta apoyarla en la parte alta de la espalda. Esta es la posición inicial.","Con pies y cabeza quietos, gira la cintura de lado a lado sintiendo los oblicuos, solo hasta donde tu cintura lo permita, lento y controlado.","Bota el aire al girar e inspira al volver al centro.","Repite las repeticiones indicadas."],"en":"Seated Barbell Twist","ines":1,"f":"pull","m":"i"},"fdb-Seated_Bent-Over_One-Arm_Dumbbell_Triceps_Extension":{"nombre":"Extensión de tríceps sentado inclinado a una mano","grupos":["triceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en el extremo de un banco plano con una mancuerna en una mano, agarre neutro.","Flecta levemente las rodillas e inclina el torso con la espalda recta hasta casi quedar paralelo al suelo, cabeza neutra.","El brazo con la mancuerna va pegado al torso y paralelo al suelo, con el antebrazo colgando a 90°. Esta es la posición inicial.","Sin mover el brazo, extiende el codo con el tríceps hasta que todo el brazo quede estirado, botando el aire. Solo se mueve el antebrazo.","Tras un segundo arriba, baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas.","Cambia de brazo y repite."],"en":"Seated Bent-Over One-Arm Dumbbell Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Seated_Bent-Over_Rear_Delt_Raise":{"nombre":"Elevación posterior sentado inclinado","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Pon dos mancuernas en el suelo delante de un banco plano.","Siéntate en el extremo con las piernas juntas y las mancuernas detrás de las pantorrillas.","Inclínate desde la cadera con la espalda recta para tomarlas, palmas enfrentadas. Esta es la posición inicial.","Con el torso inclinado y quieto, y los codos levemente flectados, sube las mancuernas hacia los lados hasta que los brazos queden paralelos al suelo, botando el aire. No balancees ni lleves los brazos hacia atrás.","Tras un segundo arriba, baja lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"Seated Bent-Over Rear Delt Raise","ines":1,"f":"pull","m":"i"},"fdb-Seated_Bent-Over_Two-Arm_Dumbbell_Triceps_Extension":{"nombre":"Extensión de tríceps sentado inclinado con dos mancuernas","grupos":["triceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Siéntate en el extremo de un banco plano con una mancuerna en cada mano, agarre neutro.","Flecta levemente las rodillas e inclina el torso con la espalda recta hasta casi quedar paralelo al suelo, cabeza neutra.","Brazos pegados al torso y paralelos al suelo, con los antebrazos colgando a 90°. Esta es la posición inicial.","Sin mover los brazos, extiende los codos con los tríceps hasta estirar los brazos, botando el aire. Solo se mueven los antebrazos.","Tras un segundo arriba, baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Seated Bent-Over Two-Arm Dumbbell Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Seated_Biceps":{"nombre":"Estiramiento de bíceps sentado","grupos":["biceps"],"eq":"Peso corporal","niv":"Avanzado","cat":"Elongación","inst":["Sit on the floor with your knees bent and your partner standing behind you. Extend your arms straight behind you with your palms facing each other. Your partner will hold your wrists for you. This will be the starting position.","Attempt to flex your elbows, while your partner prevents any actual movement.","After 10-20 seconds, relax your arms while your partner gently pulls your wrists up to stretch your biceps. Be sure to let your partner know when the stretch is appropriate to prevent injury or overstretching."],"en":"Seated Biceps","f":"static","m":"i","sec":["hombros","pectoral"]},"fdb-Seated_Cable_Rows":{"nombre":"Remo en polea sentado","grupos":["dorsales"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Necesitas una máquina de remo bajo con agarre en V (agarre neutro). Siéntate y apoya los pies en la plataforma con las rodillas levemente flectadas.","Inclínate manteniendo la alineación natural de la espalda y toma el agarre.","Con los brazos estirados, tira hasta que el torso quede a 90° de las piernas, espalda levemente arqueada y pecho afuera, sintiendo estiramiento en los dorsales. Esta es la posición inicial.","Sin mover el torso, tira el agarre hacia el abdomen con los brazos pegados al cuerpo, botando el aire. Aprieta fuerte la espalda un segundo y vuelve lento inspirando.","Repite las repeticiones indicadas."],"en":"Seated Cable Rows","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Seated_Cable_Shoulder_Press":{"nombre":"Press de hombros sentado en polea","grupos":["hombros"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Ajusta la carga y siéntate tomando los agarres. Brazos a unos 90° del cuerpo, cabeza y pecho arriba y codos a unos 90°. Esta es la posición inicial.","Extiende los codos empujando los agarres sobre la cabeza hasta juntarlos.","Pausa arriba y vuelve a la posición inicial manteniendo la tensión en los cables.","También puedes hacerlo sin respaldo o alternando brazos."],"en":"Seated Cable Shoulder Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Seated_Calf_Raise":{"nombre":"Elevación de gemelos sentado","grupos":["gemelos"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina y apoya las puntas de los pies en el borde inferior de la plataforma, con los talones afuera. Orienta las puntas como prefieras (al frente, adentro o afuera).","Ubica la parte baja de los muslos bajo el cojín, ajustándolo a tu altura. Pon las manos sobre el cojín para que no se deslice.","Sube un poco la palanca empujando con los talones y quita el seguro. Esta es la posición inicial.","Baja lento los talones hasta estirar bien las pantorrillas, inspirando.","Sube los talones lo más alto posible contrayendo las pantorrillas, botando el aire. Sostén un segundo arriba.","Repite las repeticiones indicadas."],"en":"Seated Calf Raise","ines":1,"f":"push","m":"i"},"fdb-Seated_Calf_Stretch":{"nombre":"Estiramiento de gemelos sentado","grupos":["gemelos"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Sit up straight on an exercise mat.","Bend one knee and put that foot on the floor to stabilize the torso.","Straighten your other leg and flex your ankle.","Using a band, towel, or your hand if you can reach, pull the toes toward you. Hold for 10 to 20 seconds, then switch sides."],"en":"Seated Calf Stretch","f":"static","sec":["espalda_baja","isquios"]},"fdb-Seated_Close-Grip_Concentration_Barbell_Curl":{"nombre":"Curl concentrado sentado con barra cerrada","grupos":["biceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Siéntate en un banco plano con una barra o barra Z entre los pies, piernas separadas, rodillas flectadas y pies en el suelo.","Toma la barra con agarre supino más estrecho que los hombros y apoya la parte de atrás de los brazos en la cara interna de los muslos, unos 9 cm antes de la rodilla. Brazos estirados y barra sin tocar el suelo. Esta es la posición inicial.","Sin mover los brazos, sube la barra contrayendo el bíceps, botando el aire, hasta la altura de los hombros. Solo se mueven los antebrazos. Aprieta un segundo.","Baja lento a la posición inicial inspirando, sin balancear.","Repite las repeticiones indicadas."],"en":"Seated Close-Grip Concentration Barbell Curl","ines":1,"f":"pull","m":"i"},"fdb-Seated_Dumbbell_Curl":{"nombre":"Curl sentado con mancuernas","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en un banco plano con una mancuerna en cada mano y los brazos colgando, codos cerca del torso.","Palmas hacia el torso. Esta es la posición inicial.","Sin mover los brazos, sube las mancuernas y, al pasar los muslos, gira las muñecas para que las palmas terminen mirando al frente. Bota el aire; solo se mueven los antebrazos. Sube hasta los hombros y aprieta un segundo.","Baja lento inspirando, girando las muñecas de vuelta a neutro.","Repite las repeticiones indicadas."],"en":"Seated Dumbbell Curl","ines":1,"f":"pull","m":"i"},"fdb-Seated_Dumbbell_Inner_Biceps_Curl":{"nombre":"Curl interno sentado con mancuernas","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en el extremo de un banco plano con una mancuerna en cada mano y los brazos colgando, codos cerca del torso.","Palmas hacia adentro, en neutro. Esta es la posición inicial.","Sin mover los brazos, sube las mancuernas hacia afuera y arriba, girando las palmas hacia afuera, con los antebrazos en línea con los deltoides laterales.","Solo se mueven los antebrazos. Sube hasta la altura de los hombros y aprieta un segundo.","Baja lento inspirando, girando de vuelta a neutro.","Repite las repeticiones indicadas."],"en":"Seated Dumbbell Inner Biceps Curl","ines":1,"f":"pull","m":"i"},"fdb-Seated_Dumbbell_Palms-Down_Wrist_Curl":{"nombre":"Curl de muñeca prono sentado con mancuernas","grupos":["antebrazos"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Pon dos mancuernas en el suelo delante de un banco plano.","Siéntate en el borde del banco con las piernas al ancho de hombros y los pies en el suelo.","Toma las mancuernas y apoya los antebrazos sobre los muslos con las palmas hacia abajo y las muñecas fuera de las rodillas.","Extiende las muñecas hacia arriba botando el aire.","Baja lento inspirando. Los antebrazos no se mueven; solo trabaja la muñeca.","Repite las repeticiones indicadas.","Al terminar, deja las mancuernas en el suelo."],"en":"Seated Dumbbell Palms-Down Wrist Curl","ines":1,"f":"pull","m":"i"},"fdb-Seated_Dumbbell_Palms-Up_Wrist_Curl":{"nombre":"Curl de muñeca supino sentado con mancuernas","grupos":["antebrazos"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Pon dos mancuernas en el suelo delante de un banco plano.","Siéntate en el borde del banco con las piernas al ancho de hombros y los pies en el suelo.","Toma las mancuernas y apoya los antebrazos sobre los muslos con las palmas hacia arriba y las muñecas fuera de las rodillas.","Flecta las muñecas hacia arriba botando el aire.","Baja lento inspirando. Los antebrazos no se mueven; solo trabaja la muñeca.","Repite las repeticiones indicadas.","Al terminar, deja las mancuernas en el suelo."],"en":"Seated Dumbbell Palms-Up Wrist Curl","ines":1,"f":"pull","m":"i"},"fdb-Seated_Dumbbell_Press":{"nombre":"Press sentado con mancuernas","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Toma dos mancuernas y siéntate en un banco con respaldo, apoyándolas paradas sobre los muslos.","Súbelas una a una a la altura de los hombros ayudándote con los muslos.","Gira las muñecas para que las palmas miren al frente. Esta es la posición inicial.","Botando el aire, empuja las mancuernas hacia arriba hasta que se toquen.","Tras una pausa, baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Seated Dumbbell Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Seated_Flat_Bench_Leg_Pull-In":{"nombre":"Recogida de piernas sentado en banco plano","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en un banco con las piernas estiradas al frente, algo bajo la horizontal, afirmándote de los lados del banco. Torso inclinado unos 45° atrás. Esta es la posición inicial.","Lleva las rodillas hacia ti mientras acercas el torso a ellas, botando el aire.","Tras una pausa, vuelve a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Seated Flat Bench Leg Pull-In","ines":1,"f":"pull","m":"c"},"fdb-Seated_Floor_Hamstring_Stretch":{"nombre":"Estiramiento de isquiotibiales sentado en el suelo","grupos":["isquios"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Sit on a mat with your right leg extended in front of you and your left leg bent with your foot against your right inner thigh.","Lean forward from your hips and reach for your ankle until you feel a stretch in your hamstring. Hold for 15 seconds, then repeat for your other side."],"en":"Seated Floor Hamstring Stretch","f":"static","sec":["gemelos"]},"fdb-Seated_Front_Deltoid":{"nombre":"Estiramiento de deltoides anterior sentado","grupos":["hombros"],"eq":"Peso corporal","niv":"Avanzado","cat":"Elongación","inst":["Sit upright on the floor with your legs bent, your partner standing behind you. Stick your arms straight out to your sides, with your palms facing the ground. Attempt to move them as far behind you as possible, as your assistant holds your wrists. This will be your starting position.","Keeping your elbows straight, attempt to move your arms to the front, with your partner gently restraining you to prevent any actual movement for 10-20 seconds.","Now, relax your muscles and allow your partner to gently increase the stretch on the shoulders and chest. Hold for 10 to 20 seconds."],"en":"Seated Front Deltoid","f":"static","sec":["pectoral"]},"fdb-Seated_Glute":{"nombre":"Estiramiento de glúteo sentado","grupos":["gluteos"],"eq":"Peso corporal","niv":"Avanzado","cat":"Elongación","inst":["In a seated position with your knees bent, cross one ankle over the opposite knee. Your partner will stand behind you. Now, lean forward as your partner braces your shoulders with their hands. This will be your starting position.","Attempt to push your torso back for 10-20 seconds, as your partner prevents any actual movement of your torso.","Now relax your muscles as your partner increases the stretch by gently pushing your torso forward for 10-20 seconds."],"en":"Seated Glute","f":"static","sec":["aductores"]},"fdb-Seated_Good_Mornings":{"nombre":"Good morning sentado","grupos":["espalda_baja"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Pon un cajón dentro de un rack con los pines a la altura adecuada. Métete bajo la barra y apóyala en la parte posterior de los hombros, no sobre los trapecios. Junta las escápulas y lleva los codos adelante.","Saca la barra con la zona lumbar firme y la mirada al frente. Con espalda, hombros y core firmes, empuja rodillas y cadera hacia afuera y siéntate en el cajón. Esta es la posición inicial.","Con la barra firme, inclínate desde la cadera lo más posible. Si pones los pines a la altura del paralelo, tienes seguridad y sabes dónde parar.","Pausa justo sobre los pines y vuelve hasta erguir el torso."],"en":"Seated Good Mornings","ines":1,"f":"pull","m":"c","sec":["gluteos"]},"fdb-Seated_Hamstring":{"nombre":"Estiramiento de isquiotibiales sentado","grupos":["isquios"],"eq":"","niv":"Avanzado","cat":"Elongación","inst":["In a seated position with your legs extended, have your partner stand behind you. Now, lean forward as your partner braces your shoulders with their hands. This will be your starting position.","Attempt to push your torso back for 10-20 seconds, as your partner prevents any actual movement of your torso.","Now relax your muscles as your partner increases the stretch by gently pushing your torso forward for 10-20 seconds."],"en":"Seated Hamstring","f":"static","sec":["gemelos"]},"fdb-Seated_Hamstring_and_Calf_Stretch":{"nombre":"Estiramiento de isquiotibiales y gemelos sentado","grupos":["isquios"],"eq":"Otro","niv":"Intermedio","cat":"Elongación","inst":["Loop a belt, rope, or band around one foot. Sit down with both legs extended . This will be your starting position.","Leaning forward slightly, pull on the belt to draw the toes of your foot back. Hold this position for 10-20 seconds and then repeat with the other leg."],"en":"Seated Hamstring and Calf Stretch","f":"static","sec":["gemelos"]},"fdb-Seated_Head_Harness_Neck_Resistance":{"nombre":"Resistencia de cuello sentado con arnés","grupos":["cuello"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Pon un arnés de cuello en el suelo junto al extremo de un banco plano. Con la carga lista, siéntate en el extremo con los pies más separados que los hombros y las puntas afuera.","Inclina el torso hasta casi quedar paralelo al suelo y ajusta bien el arnés en la cabeza con ambas manos, con las pesas aún en el suelo. Luego toma la carga con ambas manos y sube el torso hasta casi vertical, con cabeza y torso levemente inclinados adelante.","Apoya ambas manos sobre las rodillas. Esta es la posición inicial.","Baja lento la cabeza hasta que el mentón toque la parte alta del pecho, inspirando.","Botando el aire, vuelve a la posición inicial.","Repite las repeticiones indicadas."],"en":"Seated Head Harness Neck Resistance","ines":1,"f":"pull","m":"i"},"fdb-Seated_Leg_Curl":{"nombre":"Curl femoral sentado","grupos":["isquios"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Ajusta la palanca a tu altura y siéntate con la espalda apoyada en el respaldo.","Apoya la parte de atrás de la pierna sobre el cojín, unos centímetros bajo las pantorrillas, y fija el cojín de muslos justo sobre las rodillas. Toma los agarres laterales con las piernas completamente estiradas. Esta es la posición inicial.","Botando el aire, flecta las rodillas llevando la palanca lo más atrás posible, con el torso quieto. Sostén un segundo.","Vuelve lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Seated Leg Curl","ines":1,"f":"pull","m":"i"},"fdb-Seated_Leg_Tucks":{"nombre":"Recogida de piernas sentado","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en un banco con las piernas estiradas al frente, algo bajo la horizontal, afirmándote de los lados del banco. Torso inclinado unos 45° atrás. Esta es la posición inicial.","Lleva las rodillas hacia ti mientras acercas el torso a ellas, botando el aire.","Tras una pausa, vuelve a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Seated Leg Tucks","ines":1,"f":"pull","m":"i"},"fdb-Seated_One-Arm_Dumbbell_Palms-Down_Wrist_Curl":{"nombre":"Curl de muñeca prono sentado a una mano","grupos":["antebrazos"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Siéntate en un banco plano con una mancuerna en la mano derecha.","Pies en el suelo, algo más separados que los hombros.","Inclínate y apoya el antebrazo derecho sobre el muslo derecho con la palma hacia abajo y el dorso de la muñeca sobre la rodilla. Esta es la posición inicial.","Baja la mancuerna lo más posible sin soltar el agarre, inspirando.","Extiende la muñeca subiendo la mancuerna lo más alto posible, botando el aire. Sostén un segundo. Solo se mueve la muñeca.","Repite las repeticiones indicadas, cambia de brazo y repite."],"en":"Seated One-Arm Dumbbell Palms-Down Wrist Curl","ines":1,"f":"pull","m":"i"},"fdb-Seated_One-Arm_Dumbbell_Palms-Up_Wrist_Curl":{"nombre":"Curl de muñeca supino sentado a una mano","grupos":["antebrazos"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en un banco plano con una mancuerna en la mano derecha.","Pies en el suelo, algo más separados que los hombros.","Inclínate y apoya el antebrazo derecho sobre el muslo derecho con la palma hacia arriba y la muñeca sobre la rodilla. Esta es la posición inicial.","Baja la mancuerna lo más posible sin soltar el agarre, inspirando.","Flecta la muñeca subiendo la mancuerna lo más alto posible, botando el aire. Sostén un segundo. Solo se mueve la muñeca.","Repite las repeticiones indicadas, cambia de brazo y repite."],"en":"Seated One-Arm Dumbbell Palms-Up Wrist Curl","ines":1,"f":"pull","m":"i"},"fdb-Seated_One-arm_Cable_Pulley_Rows":{"nombre":"Remo sentado a una mano en polea","grupos":["dorsales"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Siéntate en la máquina de remo bajo y apoya los pies en la plataforma con las rodillas levemente flectadas.","Inclínate manteniendo la alineación natural de la espalda y toma el agarre simple con la mano izquierda en prono.","Con el brazo estirado, tira hasta que el torso quede a 90° de las piernas, espalda levemente arqueada y pecho afuera, sintiendo estiramiento en el dorsal. El brazo derecho va a la cintura. Esta es la posición inicial.","Sin mover el torso, tira el agarre hacia el torso con el brazo pegado, girando la muñeca para terminar en neutro junto al abdomen, botando el aire. Aprieta fuerte la espalda.","Sostén un segundo y vuelve lento inspirando, girando la muñeca de vuelta a prono.","Repite las repeticiones indicadas y cambia a la mano derecha."],"en":"Seated One-arm Cable Pulley Rows","ines":1,"f":"pull","m":"c","sec":["biceps","trapecio"]},"fdb-Seated_Overhead_Stretch":{"nombre":"Estiramiento sentado sobre la cabeza","grupos":["core"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Sit up straight on an exercise mat.","Touch the soles of your feet together with your feet six to eight inches in front of your hips.","Place one hand on the floor beside you and your other hand behind your head.","Lift your elbow to the ceiling as you incline your torso to the other side. Hold for 10 to 20 seconds, then switch sides."],"en":"Seated Overhead Stretch","f":"static","m":"i"},"fdb-Seated_Palm-Up_Barbell_Wrist_Curl":{"nombre":"Curl de muñeca supino sentado con barra","grupos":["antebrazos"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Toma una barra con ambas manos, palmas arriba y al ancho de hombros.","Pies en el suelo, algo más separados que los hombros.","Inclínate y apoya los antebrazos sobre los muslos con las palmas hacia arriba y las muñecas sobre las rodillas. Esta es la posición inicial.","Baja la barra lo más posible sin soltar el agarre, inspirando.","Flecta las muñecas subiendo la barra lo más alto posible, botando el aire. Sostén un segundo. Solo se mueve la muñeca."],"en":"Seated Palm-Up Barbell Wrist Curl","ines":1,"f":"pull","m":"i"},"fdb-Seated_Palms-Down_Barbell_Wrist_Curl":{"nombre":"Curl de muñeca prono sentado con barra","grupos":["antebrazos"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Toma una barra con ambas manos, palmas abajo y al ancho de hombros.","Pies en el suelo, algo más separados que los hombros.","Inclínate y apoya los antebrazos sobre los muslos con las palmas hacia abajo y el dorso de las muñecas sobre las rodillas. Esta es la posición inicial.","Baja la barra lo más posible sin soltar el agarre, inspirando.","Extiende las muñecas subiendo la barra lo más alto posible, botando el aire. Sostén un segundo. Solo se mueve la muñeca."],"en":"Seated Palms-Down Barbell Wrist Curl","ines":1,"f":"pull","m":"i"},"fdb-Seated_Side_Lateral_Raise":{"nombre":"Elevación lateral sentado","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en el extremo de un banco plano con los pies firmes y una mancuerna en cada mano, palmas hacia adentro y brazos colgando a los costados. Esta es la posición inicial.","Sin balancear el torso, sube las mancuernas hacia los lados con los codos levemente flectados y las manos algo inclinadas, como sirviendo agua, hasta que los brazos queden paralelos al suelo. Bota el aire y pausa un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Seated Side Lateral Raise","ines":1,"f":"push","m":"i"},"fdb-Seated_Triceps_Press":{"nombre":"Press de tríceps sentado","grupos":["triceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en un banco con respaldo y sostén una mancuerna con ambas manos sobre la cabeza, brazos estirados (mejor si te la pasan, sobre todo si es pesada). La mancuerna descansa en las palmas, con los pulgares alrededor. Esta es la posición inicial.","Con los brazos cerca de la cabeza (codos adentro) y perpendiculares al suelo, baja la mancuerna en semicírculo detrás de la cabeza hasta que los antebrazos toquen los bíceps, inspirando. Solo se mueven los antebrazos.","Vuelve a la posición inicial con los tríceps, botando el aire.","Repite las repeticiones indicadas."],"en":"Seated Triceps Press","ines":1,"f":"push","m":"i"},"fdb-Seated_Two-Arm_Palms-Up_Low-Pulley_Wrist_Curl":{"nombre":"Curl de muñeca supino sentado en polea baja","grupos":["antebrazos"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco frente a una polea baja con barra recta o Z.","Aleja el banco lo suficiente para que, con la barra sobre los muslos, el cable quede con tensión.","Toma la barra con ambas manos en supino, al ancho de hombros.","Retrocede y siéntate con los pies al ancho de hombros, firmes en el suelo.","Inclínate y apoya los antebrazos sobre los muslos con las muñecas fuera de las rodillas. Esta es la posición inicial.","Baja la barra lo más posible sin soltar el agarre, inspirando.","Flecta las muñecas subiendo la barra lo más alto posible. Solo se mueve la muñeca.","Tras un segundo arriba, vuelve a la posición inicial.","Repite las repeticiones indicadas."],"en":"Seated Two-Arm Palms-Up Low-Pulley Wrist Curl","ines":1,"f":"pull","m":"i"},"fdb-See-Saw_Press_Alternating_Side_Press":{"nombre":"Press balancín lateral alternado","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["De pie, con una mancuerna en cada mano.","Llévalas a la altura de los hombros y gira las muñecas para que las palmas miren hacia ti, como para un press Arnold. Esta es la posición inicial.","Estira el brazo izquierdo sobre la cabeza girando la muñeca para que la palma mire al frente, con el codo abriéndose. A la vez, inclínate desde la cadera hacia el lado contrario, como si quisieras alcanzar algo arriba a tu derecha con la mano izquierda. Bota el aire.","Arriba, inspira. Luego, con la carga arriba e inclinado a la derecha, inicia el movimiento hacia el lado izquierdo.","Repite las repeticiones indicadas."],"en":"See-Saw Press (Alternating Side Press)","ines":1,"f":"push","m":"c","sec":["core","triceps"]},"fdb-Shotgun_Row":{"nombre":"Remo shotgun","grupos":["dorsales"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un agarre simple en una polea baja.","Elige la carga y párate a un par de pasos con los pies en tijera amplia, brazo estirado y hombro adelantado. Esta es la posición inicial.","Junta la escápula y flecta el codo, girando la muñeca para que la palma termine mirando hacia arriba.","Tras una breve pausa, vuelve a la posición inicial."],"en":"Shotgun Row","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Shoulder_Circles":{"nombre":"Círculos de hombros","grupos":["hombros"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["With shoulders relaxed and arms resting loosely at your sides (or in your lap if you're seated), gently roll your shoulders forward, up, back, and down.","Reverse direction. You can do this exercise alternating shoulders or both at the same time."],"en":"Shoulder Circles","f":"pull","sec":["trapecio"]},"fdb-Shoulder_Press_-_With_Bands":{"nombre":"Press de hombros con bandas","grupos":["hombros"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Párate sobre una banda de modo que tenga tensión con los brazos estirados. Toma los agarres y súbelos a la altura de los hombros.","Gira las muñecas para que las palmas miren al frente, codos flectados y brazos en línea con el torso. Esta es la posición inicial.","Botando el aire, empuja los agarres hasta estirar los brazos sobre la cabeza."],"en":"Shoulder Press - With Bands","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Shoulder_Raise":{"nombre":"Elevación de hombros","grupos":["hombros"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Relax your arms to your sides and raise your shoulders up toward your ears, then back down."],"en":"Shoulder Raise","f":"pull","sec":["dorsales"]},"fdb-Shoulder_Stretch":{"nombre":"Estiramiento de hombro","grupos":["hombros"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Reach your left arm across your body and hold it straight."],"en":"Shoulder Stretch","f":"pull"},"fdb-Side-Lying_Floor_Stretch":{"nombre":"Estiramiento de lado en el suelo","grupos":["dorsales"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["First lie on your left side, bending your left knee in front of you to stabilize your torso (use your abdominal muscles as well to hold you upright).","Straighten your right leg and rest the right foot on the floor behind your left. Straighten your right arm over your head and gently pull on your right wrist to stretch the entire right side of the body. Switch sides."],"en":"Side-Lying Floor Stretch","f":"static"},"fdb-Side_Bridge":{"nombre":"Plancha lateral","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":[],"en":"Side Bridge","f":"static","sec":["hombros"]},"fdb-Side_Hop-Sprint":{"nombre":"Salto lateral a sprint","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Stand to the side of a cone or hurdle.","Begin this drill by hopping sideways over the obstacle, rebounding out of your landing to hop back to where you started.","Hop for a prescribed number or repetitions as quickly as possible, and finish this drill by sprinting a short distance upon landing the last hop."],"en":"Side Hop-Sprint","f":"push","m":"c","sec":["abductores","aductores","gemelos","isquios"]},"fdb-Side_Jackknife":{"nombre":"Navaja lateral","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":[],"en":"Side Jackknife","f":"pull","m":"c"},"fdb-Side_Lateral_Raise":{"nombre":"Elevación lateral","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, torso recto, con una mancuerna a cada lado y las palmas hacia ti. Esta es la posición inicial.","Sin balancear el torso, sube las mancuernas hacia los lados con los codos levemente flectados y las manos algo inclinadas, como sirviendo agua, hasta que los brazos queden paralelos al suelo. Bota el aire y pausa un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Side Lateral Raise","ines":1,"f":"push","m":"i"},"fdb-Side_Laterals_to_Front_Raise":{"nombre":"Elevación lateral a frontal","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, con una mancuerna a cada lado. Esta es la posición inicial.","Con los codos levemente flectados, sube las mancuernas al frente hasta la altura de los hombros, sin balancearte.","Arriba, ábrelas hacia los lados con los brazos estirados.","Bájalas controladas.","En la siguiente repetición, súbelas por los lados hasta los hombros y luego llévalas al frente.","Baja a la posición inicial."],"en":"Side Laterals to Front Raise","ines":1,"f":"push","m":"i","sec":["trapecio"]},"fdb-Side_Leg_Raises":{"nombre":"Elevación de pierna lateral","grupos":["aductores"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["Stand next to a chair, which you may hold onto as a support. Stand on one leg. This will be your starting position.","Keeping your leg straight, raise it as far out to the side as possible, and swing it back down, allowing it to cross the opposite leg.","Repeat this swinging motion 5-10 times, increasing the range of motion as you do so."],"en":"Side Leg Raises","f":"pull"},"fdb-Side_Lying_Groin_Stretch":{"nombre":"Estiramiento de ingle de lado","grupos":["aductores"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Start off by lying on your right side and bend your right knee in front of you to stabilize the torso.","Rest your head on your right hand or shoulder. Lift your left leg upward and hold it by the back of the knee (easier) or the foot (harder).","Pull your left knee in toward your left shoulder and simultaneously press your foot or knee down to the floor. To intensify this stretch, straighten your left leg. Switch sides."],"en":"Side Lying Groin Stretch","f":"static","m":"i","sec":["isquios"]},"fdb-Side_Neck_Stretch":{"nombre":"Estiramiento lateral de cuello","grupos":["cuello"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Start with your shoulders relaxed, gently tilt your head towards your shoulder.","Assist stretch with a gentle pull on the side of the head."],"en":"Side Neck Stretch","f":"static","m":"i"},"fdb-Side_Standing_Long_Jump":{"nombre":"Salto largo lateral","grupos":["cuadriceps"],"eq":"","niv":"Principiante","cat":"Pliometría","inst":["Begin standing with your feet hip width apart in an athletic stance. Your head and chest should be up, knees and hips slightly bent. This will be your starting position.","Leaning to your right, extend through your hips, knees, and ankles to jump into the air. Block with the arms to lead the movement, jumping as far to your right as you can.","Land facing the same direction with your feet hip width apart, absorbing the impact through your lower body."],"en":"Side Standing Long Jump","f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Side_To_Side_Chins":{"nombre":"Dominadas de lado a lado","grupos":["dorsales"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Toma la barra con las palmas al frente y agarre ancho.","Con los brazos estirados, inclina el torso unos 30° atrás, saca pecho y deja una leve curva lumbar. Esta es la posición inicial.","Sube inclinándote hacia la izquierda hasta que la barra casi toque la parte alta del pecho, llevando hombros y brazos abajo y atrás, botando el aire. Sin balanceo; los antebrazos solo sostienen.","Tras un segundo, vuelve inspirando a la posición inicial.","Ahora sube inclinándote hacia la derecha de la misma forma, botando el aire.","Tras un segundo, vuelve inspirando.","Repite los pasos 3 a 6 hasta completar las repeticiones de cada lado."],"en":"Side To Side Chins","ines":1,"f":"pull","m":"c","sec":["antebrazos","biceps","hombros"]},"fdb-Side_Wrist_Pull":{"nombre":"Tracción lateral de muñeca","grupos":["hombros"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["This stretch works best standing. Cross your left arm over the midline of your body and hold the left wrist in your right hand down at the level of your hips. Start the stretch with a bent left arm.","Slowly straighten, pull, and lift it up to shoulder height, as pictured. Feel this stretch originate in your back, not your shoulders, and don't pull too hard on the shoulders joint. Switch sides."],"en":"Side Wrist Pull","f":"static","m":"i","sec":["antebrazos","dorsales"]},"fdb-Side_to_Side_Box_Shuffle":{"nombre":"Desplazamiento lateral sobre cajón","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Stand to one side of the box with your left foot resting on the middle of it.","To begin, jump up and over to the other side of the box, landing with your right foot on top of the box and your left foot on the floor. Swing your arms to aid your movement.","Continue shuffling back and forth across the box."],"en":"Side to Side Box Shuffle","f":"push","m":"c","sec":["abductores","aductores","gemelos","isquios"]},"fdb-Single-Arm_Cable_Crossover":{"nombre":"Cruce de polea a un brazo","grupos":["pectoral"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon las poleas arriba, elige la carga y toma un agarre en cada mano.","Da un paso al frente de ambas poleas con los brazos estirados al frente y las manos juntas, cabeza y pecho arriba, inclinado adelante y con los pies escalonados. Esta es la posición inicial.","Con el brazo izquierdo fijo, deja que el derecho se abra hacia el lado con el codo levemente flectado, hasta quedar perpendicular al cuerpo a la altura del hombro.","Vuelve llevando la mano a la línea media del cuerpo.","Sostén un segundo y repite con el otro lado. Alterna hasta completar las repeticiones."],"en":"Single-Arm Cable Crossover","ines":1,"f":"push","m":"i"},"fdb-Single-Arm_Linear_Jammer":{"nombre":"Landmine jammer a un brazo","grupos":["hombros"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Pon una barra en un landmine o fíjala bien en una esquina, cargada adecuadamente.","Levanta el extremo hasta el hombro con una o ambas manos, con los pies bien separados. Esta es la posición inicial.","Extiende el codo empujando la barra hacia arriba de forma explosiva, extendiendo por completo cadera y rodillas para generar la máxima fuerza.","Vuelve a la posición inicial."],"en":"Single-Arm Linear Jammer","ines":1,"f":"push","m":"c","sec":["pectoral","triceps"]},"fdb-Single-Arm_Push-Up":{"nombre":"Flexión a un brazo","grupos":["pectoral"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate boca abajo y ponte apoyado en las puntas de pie y un brazo, justo bajo el hombro y estirado. Piernas estiradas y más separadas que en una flexión normal para tener más base.","Con buena postura, lleva la mano libre a la espalda. Esta es la posición inicial.","Baja flectando el codo hasta tocar el suelo.","Baja lento y vuelve extendiendo el brazo hasta la posición inicial."],"en":"Single-Arm Push-Up","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Single-Cone_Sprint_Drill":{"nombre":"Sprint con un cono","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["This drill teaches quick foot action. You need a single cone. Begin standing next to the cone with one arm back and one arm forward.","Chop the feet as quickly as possible, blocking with the arms. Circle the cone, keep your knees up, with violent foot action.","Rest after three trips around the cone."],"en":"Single-Cone Sprint Drill","f":"push","sec":["gemelos","gluteos","isquios"]},"fdb-Single-Leg_High_Box_Squat":{"nombre":"Sentadilla a una pierna en cajón alto","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Pon un cajón dentro de un rack y fija una banda o cuerda arriba del cajón.","De frente al cajón, súbete con una pierna hasta quedar de pie, dejando la otra sin apoyo. Afírmate de la banda para equilibrarte.","Sigue subiendo y bajando con la misma pierna antes de cambiar de lado."],"en":"Single-Leg High Box Squat","ines":1,"f":"push","m":"c","sec":["gluteos","isquios"]},"fdb-Single-Leg_Hop_Progression":{"nombre":"Progresión de saltos a una pierna","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Arrange a line of cones in front of you. Assume a relaxed standing position, balanced on one leg. Raise the knee of your opposite leg. This will be your starting position.","Hop forward, jumping and landing with the same leg over the cone.","Use a countermovement jump to hop from cone to cone.","At the end, turn around and go back on the other leg."],"en":"Single-Leg Hop Progression","f":"push","m":"c","sec":["abductores","aductores","gemelos","isquios"]},"fdb-Single-Leg_Lateral_Hop":{"nombre":"Salto lateral a una pierna","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Stand to the side of a cone or hurdle. To get into the start position, stand on one leg with your knee slightly bent.","To begin, execute a counterjump to hop sideways over the cone.","Land on your jumping leg, and immediately rebound out of it by jumping back to the start position.","Continue hopping back and forth."],"en":"Single-Leg Lateral Hop","f":"push","m":"c","sec":["abductores","aductores","gemelos","isquios"]},"fdb-Single-Leg_Leg_Extension":{"nombre":"Extensión de pierna unilateral","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina y ajústala: el cojín apoya en la parte baja de la canilla sin tocar el tobillo, y el eje de giro queda alineado con la rodilla. Elige una carga adecuada.","Con buena postura, extiende una pierna por completo y pausa arriba.","Vuelve sin apoyar la carga, manteniendo la tensión.","Repite las repeticiones indicadas."],"en":"Single-Leg Leg Extension","ines":1,"f":"push","m":"i"},"fdb-Single-Leg_Stride_Jump":{"nombre":"Salto de zancada a una pierna","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Stand to the side of a box with your inside foot on top of it, close to the edge.","Begin by swinging the arms upward as you push through the top leg, jumping upward as high as possible. Attempt to drive the opposite knee upward.","Land in the same position that you started, using your inside leg to decelerate the impact."],"en":"Single-Leg Stride Jump","f":"push","m":"c","sec":["abductores","aductores","gemelos","isquios"]},"fdb-Single_Dumbbell_Raise":{"nombre":"Elevación con una mancuerna","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Con los pies bien separados, sostén una mancuerna con ambas manos tomándola por el disco, con los brazos estirados colgando frente a la cintura. Esta es la posición inicial.","Sube la mancuerna hasta sobre la altura de los hombros con los brazos estirados, sin mover torso ni cadera.","Vuelve a la posición inicial y repite las repeticiones indicadas."],"en":"Single Dumbbell Raise","ines":1,"m":"i","sec":["antebrazos","trapecio"]},"fdb-Single_Leg_Butt_Kick":{"nombre":"Patada al glúteo a una pierna","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Pliometría","inst":["Begin by standing on one leg, with the bent knee raised. This will be your start position.","Using a countermovement jump, take off upward by extending the hip, knee, and ankle of the grounded leg.","Immediately flex the knee and attempt to touch your butt with the heel of your jumping leg.","Return the leg to a partially bent position underneath the hips and land. Your opposite leg should stay in relatively the same position throughout the drill."],"en":"Single Leg Butt Kick","f":"push","m":"c","sec":["gemelos","isquios"]},"fdb-Single_Leg_Glute_Bridge":{"nombre":"Puente de glúteo a una pierna","grupos":["gluteos"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con las rodillas flectadas y los pies apoyados.","Despega una pierna del suelo llevando la rodilla al pecho. Esta es la posición inicial.","Empuja con el talón de la pierna apoyada extendiendo la cadera y despegando los glúteos del suelo.","Extiende lo más que puedas, pausa y vuelve a la posición inicial."],"en":"Single Leg Glute Bridge","ines":1,"f":"push","m":"i","sec":["isquios"]},"fdb-Single_Leg_Push-off":{"nombre":"Impulso a una pierna","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Stand on the ground with one foot resting on the box, heel close to the edge.","Push off with your foot on top of the box, trying to gain as much height as possible by extending through the hip and knee.","Land with the same foot on top of the box, returning your other foot back to the start position."],"en":"Single Leg Push-off","f":"push","m":"c","sec":["gemelos","isquios"]},"fdb-Sit-Up":{"nombre":"Abdominal completo (sit-up)","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate con los pies fijos bajo algo firme o sujetos por un compañero, rodillas flectadas.","Pon las manos detrás de la cabeza con los dedos entrelazados. Esta es la posición inicial.","Sube el tronco hasta formar una V con los muslos, botando el aire.","Sostén un segundo y baja a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Sit-Up","ines":1,"f":"pull","m":"i"},"fdb-Sit_Squats":{"nombre":"Sentadillas sentado","grupos":["cuadricep
