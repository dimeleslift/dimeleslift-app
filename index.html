 partially bent, using your legs to absorb the impact."],"en":"Double Leg Butt Kick","f":"push","m":"c","sec":["abductores","aductores","gemelos","gluteos","isquios"]},"fdb-Downward_Facing_Balance":{"nombre":"Equilibrio boca abajo en fitball","grupos":["gluteos"],"eq":"Fitball","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate boca abajo sobre un fitball.","Apoyado en el abdomen, avanza con las manos por el suelo y levanta las piernas, extendiendo codos y rodillas."],"en":"Downward Facing Balance","ines":1,"f":"static","m":"i","sec":["core","isquios"]},"fdb-Drag_Curl":{"nombre":"Curl arrastrado","grupos":["biceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Toma una barra con agarre supino (palmas al frente), con los codos cerca del torso y atrás. Esta es la posición inicial.","Botando el aire, sube la barra arrastrándola pegada al torso mientras los codos van hacia atrás. Los codos no quedan fijos a los costados, sino que retroceden; no subas los hombros.","Baja lento con la barra siempre en contacto con el torso.","Repite las repeticiones indicadas."],"en":"Drag Curl","ines":1,"f":"pull","m":"c","sec":["antebrazos"]},"fdb-Drop_Push":{"nombre":"Drop push","grupos":["pectoral"],"eq":"Otro","niv":"Intermedio","cat":"Pliometría","inst":["Position low boxes or other platforms 2-3 feet apart.","Move to a pushup position between them, supporting yourself by placing your hands on the boxes.","With good posture, drop from the platforms by pressing up and moving your hands to shoulder width, cushioning your landing by absorbing the impact through the arm."],"en":"Drop Push","f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Dumbbell_Alternate_Bicep_Curl":{"nombre":"Curl con mancuernas alternado","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, erguido, con una mancuerna en cada mano y brazos estirados. Codos cerca del torso y palmas hacia los muslos.","Sin mover el brazo, sube la mancuerna derecha girando la palma hasta que mire al frente, botando el aire, hasta la altura del hombro. Aprieta un segundo. Solo se mueve el antebrazo.","Baja lento inspirando, girando la palma de vuelta hacia el muslo.","Repite con la mano izquierda. Eso es una repetición.","Alterna así hasta completar las repeticiones."],"en":"Dumbbell Alternate Bicep Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Dumbbell_Bench_Press":{"nombre":"Press banca con mancuernas","grupos":["pectoral"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco plano con una mancuerna en cada mano sobre los muslos, palmas enfrentadas.","Ayudándote con los muslos, sube las mancuernas una a una hasta sostenerlas frente a ti al ancho de hombros.","Gira las muñecas para que las palmas miren hacia tus pies. Las mancuernas quedan a los lados del pecho, con 90° entre brazo y antebrazo, siempre con control. Esta es la posición inicial.","Botando el aire, empuja con el pecho. Bloquea arriba, aprieta un segundo y baja lento. Idealmente, bajar dura el doble que subir.","Repite las repeticiones indicadas en tu programa."],"en":"Dumbbell Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Dumbbell_Bench_Press_with_Neutral_Grip":{"nombre":"Press banca con mancuernas agarre neutro","grupos":["pectoral"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Toma una mancuerna en cada mano y acuéstate en un banco plano, pies firmes y escápulas retraídas.","Con agarre neutro (palmas enfrentadas), empieza con los brazos estirados sobre ti, perpendiculares al suelo. Esta es la posición inicial.","Flecta los codos bajando los brazos hacia los costados hasta que las mancuernas lleguen al torso.","Pausa y extiende los codos hasta la posición inicial."],"en":"Dumbbell Bench Press with Neutral Grip","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Dumbbell_Bicep_Curl":{"nombre":"Curl con mancuernas","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, con una mancuerna en cada mano y brazos estirados. Codos cerca del torso y palmas al frente. Esta es la posición inicial.","Sin mover los brazos, bota el aire y sube las mancuernas contrayendo el bíceps hasta la altura de los hombros. Pausa apretando.","Inspira y baja lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"Dumbbell Bicep Curl","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Dumbbell_Clean":{"nombre":"Cargada con mancuernas","grupos":["isquios"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["De pie, con una mancuerna en cada mano y pies al ancho de hombros.","Baja las mancuernas al suelo flectando cadera y rodillas, llevando la cadera atrás. Esta es la posición inicial.","Salta con fuerza extendiendo cadera, rodillas y tobillos para acelerar las mancuernas hacia arriba, con agarre neutro y brazos estirados hasta la extensión completa.","Tras extender, vuelve a flectar cadera y rodillas para recibir en sentadilla, flectando los brazos y llevando las mancuernas a los hombros.","Al recibir, extiende cadera y rodillas hasta quedar de pie con las mancuernas en los hombros."],"en":"Dumbbell Clean","ines":1,"f":"pull","m":"c","sec":["antebrazos","cuadriceps","espalda_baja","gemelos","gluteos","hombros","trapecio"]},"fdb-Dumbbell_Floor_Press":{"nombre":"Press en suelo con mancuernas","grupos":["triceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Powerlifting","inst":["Acuéstate en el suelo con una mancuerna en cada mano; puedes flectar las rodillas. Empieza con los brazos estirados sobre ti.","Baja hasta que el brazo toque el suelo. Codos recogidos enfatizan tríceps; más abiertos, pecho.","Pausa abajo y sube extendiendo los codos hasta juntar las mancuernas arriba."],"en":"Dumbbell Floor Press","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Dumbbell_Flyes":{"nombre":"Aperturas con mancuernas","grupos":["pectoral"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco plano con una mancuerna en cada mano sobre los muslos, palmas enfrentadas.","Ayudándote con los muslos, súbelas una a una frente a ti al ancho de hombros, palmas enfrentadas. Llévalas arriba como en un press, deteniéndote justo antes de bloquear. Esta es la posición inicial.","Con los codos levemente flectados, abre los brazos en un arco amplio hasta sentir estiramiento en el pecho, inspirando. Solo se mueve el hombro.","Vuelve por el mismo arco apretando el pecho, botando el aire.","Sostén un segundo arriba y repite las repeticiones indicadas."],"en":"Dumbbell Flyes","ines":1,"f":"push","m":"i"},"fdb-Dumbbell_Incline_Row":{"nombre":"Remo con mancuernas en banco inclinado","grupos":["dorsales"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Apóyate boca abajo en un banco inclinado.","Toma una mancuerna en cada mano con agarre neutro y brazos estirados. Esta es la posición inicial.","Junta las escápulas y flecta los codos remando las mancuernas hacia los costados.","Pausa arriba y vuelve a la posición inicial."],"en":"Dumbbell Incline Row","ines":1,"f":"pull","m":"c","sec":["antebrazos","biceps","hombros"]},"fdb-Dumbbell_Incline_Shoulder_Raise":{"nombre":"Elevación de hombros con mancuernas en banco inclinado","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en un banco inclinado con una mancuerna en cada mano sobre los muslos.","Usa las piernas para impulsar las mancuernas a los hombros y recuéstate. Ubícalas sobre los hombros con los brazos estirados y perpendiculares al suelo, palmas al frente. Esta es la posición inicial.","Con los brazos rectos y bloqueados, sube las mancuernas separando los hombros del banco, botando el aire.","Vuelve a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Dumbbell Incline Shoulder Raise","ines":1,"f":"push","m":"i","sec":["triceps"]},"fdb-Dumbbell_Lunges":{"nombre":"Zancadas con mancuernas","grupos":["cuadriceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, erguido, con una mancuerna en cada mano a los costados. Esta es la posición inicial.","Da un paso al frente de unos 60 cm con la pierna derecha y baja el cuerpo con el torso erguido y en equilibrio, inspirando.","Empuja con el pie de adelante para volver a la posición inicial, botando el aire.","Repite las repeticiones indicadas y cambia a la pierna izquierda."],"en":"Dumbbell Lunges","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Dumbbell_Lying_One-Arm_Rear_Lateral_Raise":{"nombre":"Elevación posterior a una mano acostado","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Con una mancuerna en una mano, acuéstate boca abajo en un banco levemente inclinado (unos 15°). Con la otra mano puedes afirmarte del banco.","Palma neutra (hacia el torso), brazo estirado con el codo levemente flectado. Esta es la posición inicial.","Sube el brazo hacia el lado hasta que el codo llegue a la altura del hombro y el brazo quede casi paralelo al suelo, botando el aire. Brazo perpendicular al torso; sostén un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Dumbbell Lying One-Arm Rear Lateral Raise","ines":1,"f":"pull","m":"i","sec":["dorsales"]},"fdb-Dumbbell_Lying_Pronation":{"nombre":"Pronación acostado con mancuerna","grupos":["antebrazos"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate boca abajo en un banco plano con una mancuerna en una mano y el otro brazo doblado sobre el banco para apoyar la cabeza.","Flecta el codo del brazo con la mancuerna a 90°.","Sube el brazo hasta que quede paralelo al suelo y a 90° del torso, con el antebrazo colgando perpendicular al suelo. Esta es la posición inicial.","Botando el aire, rota el antebrazo hacia adelante manteniendo los 90° del codo, hasta que el antebrazo quede paralelo al suelo. Sostén un segundo.","Vuelve lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Dumbbell Lying Pronation","ines":1,"f":"pull","m":"i"},"fdb-Dumbbell_Lying_Rear_Lateral_Raise":{"nombre":"Elevación posterior acostado con mancuernas","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Con una mancuerna en cada mano, acuéstate boca abajo en un banco levemente inclinado (unos 15°).","Palmas neutras (hacia el torso), brazos estirados con los codos levemente flectados. Esta es la posición inicial.","Sube los brazos hacia los lados hasta que los codos lleguen a la altura de los hombros y los brazos queden casi paralelos al suelo, botando el aire. Brazos perpendiculares al torso; sostén un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Dumbbell Lying Rear Lateral Raise","ines":1,"f":"pull","m":"i"},"fdb-Dumbbell_Lying_Supination":{"nombre":"Supinación acostado con mancuerna","grupos":["antebrazos"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate de lado en un banco plano con una mancuerna en la mano de arriba y el otro brazo doblado para apoyar la cabeza.","Flecta el codo del brazo con la mancuerna a 90°.","Brazo pegado al torso y paralelo al suelo; antebrazo paralelo al suelo y frente a ti. Esta es la posición inicial.","Botando el aire, rota el antebrazo hacia afuera en semicírculo manteniendo los 90°, hasta que apunte al techo. Sostén un segundo.","Vuelve lento a la posición inicial inspirando.","Repite las repeticiones indicadas y cambia de brazo."],"en":"Dumbbell Lying Supination","ines":1,"f":"pull","m":"i"},"fdb-Dumbbell_One-Arm_Shoulder_Press":{"nombre":"Press de hombros a una mano con mancuerna","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Toma una mancuerna y siéntate en un banco con respaldo, o quédate de pie.","Lleva la mancuerna a la altura del hombro. La otra mano puede ir a la cintura o afirmarse de algo fijo.","Gira la muñeca para que la palma mire al frente. Esta es la posición inicial.","Botando el aire, empuja la mancuerna hasta estirar el brazo.","Tras una pausa, baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas y cambia de brazo."],"en":"Dumbbell One-Arm Shoulder Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Dumbbell_One-Arm_Triceps_Extension":{"nombre":"Extensión de tríceps a una mano con mancuerna","grupos":["triceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Toma una mancuerna y siéntate en un banco con respaldo, o quédate de pie.","Lleva la mancuerna al hombro y estira el brazo sobre la cabeza, perpendicular al suelo y junto a la cabeza. La otra mano puede ir a la cintura, sostener el brazo que trabaja o afirmarse de algo fijo.","Gira la muñeca para que la palma mire al frente y el meñique al techo. Esta es la posición inicial.","Baja lento la mancuerna detrás de la cabeza sin mover el brazo, inspirando, y pausa con el tríceps bien estirado.","Vuelve contrayendo el tríceps, botando el aire. Solo se mueve el antebrazo.","Repite las repeticiones indicadas y cambia de brazo."],"en":"Dumbbell One-Arm Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Dumbbell_One-Arm_Upright_Row":{"nombre":"Remo al mentón a una mano con mancuerna","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["De pie, con la espalda recta y una mancuerna frente al muslo, brazo estirado con el codo levemente flectado y palma hacia el muslo.","La otra mano puede ir a la cintura o afirmarse de algo fijo. Esta es la posición inicial.","Sube la mancuerna con el deltoides lateral, pegada al cuerpo, hasta casi la altura del mentón, botando el aire. El codo guía y siempre va más alto que el antebrazo. Torso quieto; pausa un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas y cambia de brazo."],"en":"Dumbbell One-Arm Upright Row","ines":1,"f":"pull","m":"c","sec":["biceps","trapecio"]},"fdb-Dumbbell_Prone_Incline_Curl":{"nombre":"Curl prono inclinado con mancuernas","grupos":["biceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Con una mancuerna en cada mano, acuéstate boca abajo en un banco inclinado, con los hombros cerca del borde superior. Apoya las rodillas en el asiento o abre las piernas a los lados.","Deja los brazos colgando estirados, perpendiculares al suelo.","Codos fijos y palmas al frente. Esta es la posición inicial.","Sube las mancuernas contrayendo el bíceps hasta flectar completamente, botando el aire. Solo se mueven los antebrazos.","Baja hasta estirar los brazos por completo.","Repite las repeticiones indicadas."],"en":"Dumbbell Prone Incline Curl","ines":1,"f":"pull","m":"i"},"fdb-Dumbbell_Raise":{"nombre":"Elevación con mancuernas","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, con la espalda recta y una mancuerna junto a cada muslo, brazos estirados con los codos levemente flectados y palmas hacia atrás. Esta es la posición inicial.","Sube las mancuernas por los costados con el deltoides lateral hasta casi la altura del mentón, botando el aire. Los codos guían y siempre van más altos que los antebrazos. Torso quieto; pausa un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Dumbbell Raise","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Dumbbell_Rear_Lunge":{"nombre":"Zancada atrás con mancuernas","grupos":["cuadriceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["De pie, erguido, con una mancuerna en cada mano a los costados. Esta es la posición inicial.","Da un paso atrás de unos 60 cm con la pierna derecha y baja el cuerpo con el torso erguido y en equilibrio, inspirando. Una zancada larga enfatiza glúteo mayor; una corta, cuádriceps.","Empuja para volver a la posición inicial, botando el aire. Empujar con la parte delantera del pie acentúa cuádriceps; con el talón, glúteos.","Repite con la otra pierna."],"en":"Dumbbell Rear Lunge","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Dumbbell_Scaption":{"nombre":"Scaption con mancuernas","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Este ejercicio correctivo fortalece los estabilizadores de la escápula. Sostén una carga liviana en cada mano a los costados, con los pulgares hacia arriba.","Sube los brazos al frente, unos 30° hacia afuera del centro, siempre estirados.","Sube hasta que queden paralelos al suelo y vuelve a la posición inicial."],"en":"Dumbbell Scaption","ines":1,"f":"push","m":"i","sec":["trapecio"]},"fdb-Dumbbell_Seated_Box_Jump":{"nombre":"Salto al cajón desde sentado con mancuernas","grupos":["cuadriceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Pliometría","inst":["Position a box a couple feet to the side of a bench. Hold a dumbbell to your chest with both hands and seat yourself on the bench facing the box. This will be your starting position.","Plant your feet firmly on the ground as you lean forward, extending through the hips and knees to jump up and forward.","Land on the box with both feet, absorbing the impact by allowing the hips and knees to bend.","Step down and return to the starting position."],"en":"Dumbbell Seated Box Jump","f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Dumbbell_Seated_One-Leg_Calf_Raise":{"nombre":"Gemelos sentado a una pierna con mancuerna","grupos":["gemelos"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Pon un bloque en el suelo a unos 30 cm de un banco plano.","Siéntate en el banco y apoya una mancuerna sobre el muslo izquierdo, unos 8 cm sobre la rodilla.","Apoya la parte delantera del pie izquierdo en el bloque. Esta es la posición inicial.","Sube el talón lo más alto posible botando el aire y contrayendo la pantorrilla. Sostén un segundo.","Baja lento estirando lo más posible.","Repite las repeticiones indicadas y cambia a la pierna derecha."],"en":"Dumbbell Seated One-Leg Calf Raise","ines":1,"f":"push","m":"i"},"fdb-Dumbbell_Shoulder_Press":{"nombre":"Press de hombros con mancuernas","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Con una mancuerna en cada mano, siéntate en un banco con respaldo y apóyalas paradas sobre los muslos.","Súbelas una a una a la altura de los hombros ayudándote con los muslos.","Gira las muñecas para que las palmas miren al frente. Esta es la posición inicial.","Bota el aire y empuja las mancuernas hacia arriba hasta que se toquen.","Tras una breve pausa, baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Dumbbell Shoulder Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Dumbbell_Shrug":{"nombre":"Encogimiento de hombros con mancuernas","grupos":["trapecio"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, erguido, con una mancuerna en cada mano a los costados, palmas hacia el torso.","Sube los hombros lo más alto posible botando el aire y sostén un segundo. Brazos siempre estirados; solo se mueven los hombros.","Baja a la posición inicial.","Repite las repeticiones indicadas."],"en":"Dumbbell Shrug","ines":1,"f":"pull","m":"i"},"fdb-Dumbbell_Side_Bend":{"nombre":"Inclinación lateral con mancuerna","grupos":["core"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, con una mancuerna en la mano izquierda (palma hacia el torso) y la mano derecha en la cintura, pies al ancho de hombros. Esta es la posición inicial.","Con la espalda recta y la cabeza arriba, inclínate solo desde la cintura hacia la derecha lo más posible, inspirando. Sostén un segundo y vuelve botando el aire. El resto del cuerpo no se mueve.","Repite hacia la izquierda, sostén un segundo y vuelve.","Repite las repeticiones indicadas y cambia de mano."],"en":"Dumbbell Side Bend","ines":1,"f":"pull","m":"i"},"fdb-Dumbbell_Squat":{"nombre":"Sentadilla con mancuernas","grupos":["cuadriceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, con una mancuerna en cada mano y palmas hacia los costados de las piernas.","Pies al ancho de hombros con las puntas levemente afuera. Mira al frente (mirar abajo te desequilibra) y mantén la espalda neutra. Esta es la posición inicial.","Baja lento flectando las rodillas con la postura firme, hasta que los muslos queden paralelos al suelo. Las rodillas siguen la dirección de las puntas de los pies.","Sube botando el aire, empujando el suelo con todo el pie hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Dumbbell Squat","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios"]},"fdb-Dumbbell_Squat_To_A_Bench":{"nombre":"Sentadilla con mancuernas a banco","grupos":["cuadriceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["De pie, con un banco plano detrás y una mancuerna en cada mano, palmas hacia los costados de las piernas.","Pies al ancho de hombros con las puntas levemente afuera. Mira al frente y mantén la espalda neutra. Esta es la posición inicial.","Baja lento flectando las rodillas con la postura firme, hasta rozar el banco, inspirando. Las rodillas siguen la dirección de las puntas de los pies.","Sube botando el aire, empujando el suelo con todo el pie hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Dumbbell Squat To A Bench","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios"]},"fdb-Dumbbell_Step_Ups":{"nombre":"Subida al cajón con mancuernas","grupos":["cuadriceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["De pie, con una mancuerna en cada mano y palmas hacia los costados de las piernas.","Apoya el pie derecho en la plataforma y sube extendiendo cadera y rodilla derecha, empujando sobre todo con el talón. Luego sube el pie izquierdo. Bota el aire al subir.","Baja con la pierna izquierda flectando cadera y rodilla derecha, inspirando. Luego baja el pie derecho junto al izquierdo.","Repite las repeticiones indicadas con la pierna derecha y luego con la izquierda."],"en":"Dumbbell Step Ups","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Dumbbell_Tricep_Extension_-Pronated_Grip":{"nombre":"Extensión de tríceps con mancuernas agarre prono","grupos":["triceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco plano con dos mancuernas sobre los hombros, brazos estirados a 90° del torso.","Palmas al frente y codos recogidos. Esta es la posición inicial.","Inspira y baja lento las mancuernas hasta cerca de las orejas, sin mover los brazos y con los codos recogidos.","Bota el aire y vuelve con los tríceps a la posición inicial."],"en":"Dumbbell Tricep Extension -Pronated Grip","ines":1,"f":"push","m":"i"},"fdb-Dynamic_Back_Stretch":{"nombre":"Estiramiento dinámico de espalda","grupos":["dorsales"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Stand with your feet shoulder width apart. This will be your starting position.","Keeping your arms straight, swing them straight up in front of you 5-10 times, increasing the range of motion each time until your arms are above your head."],"en":"Dynamic Back Stretch","f":"pull"},"fdb-Dynamic_Chest_Stretch":{"nombre":"Estiramiento dinámico de pecho","grupos":["pectoral"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Stand with your hands together, arms extended directly in front of you. This will be your starting position.","Keeping your arms straight, quickly move your arms back as far as possible and back in again, similar to an exaggerated clapping motion. Repeat 5-10 times, increasing speed as you do so."],"en":"Dynamic Chest Stretch","f":"pull","sec":["dorsales"]},"fdb-EZ-Bar_Curl":{"nombre":"Curl con barra Z","grupos":["biceps"],"eq":"Barra Z","niv":"Principiante","cat":"Fuerza","inst":["De pie, toma una barra Z por los agarres externos, palmas al frente levemente giradas hacia adentro y codos cerca del torso. Esta es la posición inicial.","Sin mover los brazos, bota el aire y sube la barra contrayendo el bíceps. Solo se mueven los antebrazos.","Sube hasta que la barra llegue a los hombros y aprieta un momento.","Inspira y baja lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"EZ-Bar Curl","ines":1,"f":"pull","m":"i"},"fdb-EZ-Bar_Skullcrusher":{"nombre":"Rompecráneos con barra Z","grupos":["triceps"],"eq":"Barra Z","niv":"Principiante","cat":"Fuerza","inst":["Con agarre estrecho, toma la barra Z y sostenla con los codos recogidos al acostarte en el banco. Brazos perpendiculares al suelo. Esta es la posición inicial.","Sin mover los brazos, baja la barra flectando los codos, inspirando. Pausa cuando quede justo sobre la frente.","Súbela extendiendo los codos, botando el aire.","Repite."],"en":"EZ-Bar Skullcrusher","ines":1,"f":"push","m":"i","sec":["antebrazos"]},"fdb-Elbow_Circles":{"nombre":"Círculos de codos","grupos":["hombros"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Sit or stand with your feet slightly apart.","Place your hands on your shoulders with your elbows at shoulder level and pointing out.","Slowly make a circle with your elbows. Breathe out as you start the circle and breathe in as you complete the circle."],"en":"Elbow Circles","f":"pull","m":"i","sec":["trapecio"]},"fdb-Elbow_to_Knee":{"nombre":"Codo a rodilla","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas y cruza la pierna derecha sobre la rodilla izquierda flectada. Manos detrás de la cabeza y escápulas en el suelo. Esta es la posición inicial.","Flecta la columna y gira el torso para llevar el codo izquierdo a la rodilla derecha.","Vuelve a la posición inicial, completa las repeticiones y cambia de lado."],"en":"Elbow to Knee","ines":1,"f":"pull","m":"c"},"fdb-Elbows_Back":{"nombre":"Codos atrás","grupos":["pectoral"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Stand up straight.","Place both hands on your lower back, fingers pointing downward and elbows out.","Then gently pull your elbows back aiming to touch them together."],"en":"Elbows Back","f":"static","m":"i","sec":["hombros"]},"fdb-Elevated_Back_Lunge":{"nombre":"Zancada atrás elevada","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Pon una barra cargada en el rack a la altura de los hombros y una plataforma baja detrás de ti.","Apoya la barra en la parte alta de la espalda, con la espalda firme. Súbete a la plataforma con ambos pies. Esta es la posición inicial.","Da un paso atrás con una pierna y baja flectando cadera y rodillas hasta que la rodilla toque el suelo.","Pausa y sube extendiendo cadera y rodillas hasta volver a la plataforma; luego alterna."],"en":"Elevated Back Lunge","ines":1,"f":"push","m":"c","sec":["gluteos","isquios"]},"fdb-Elevated_Cable_Rows":{"nombre":"Remo en polea sentado elevado","grupos":["dorsales"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Busca una plataforma de 10-15 cm de alto (un step, por ejemplo).","Ponla sobre el asiento de la máquina de remo bajo.","Siéntate y apoya los pies en la plataforma delantera, con las rodillas levemente flectadas.","Inclínate manteniendo la alineación natural de la espalda y toma el agarre en V.","Con los brazos estirados, tira hasta que el torso quede a 90° de las piernas, espalda levemente arqueada y pecho afuera, sintiendo estiramiento en los dorsales. Esta es la posición inicial.","Sin mover el torso, tira el agarre hacia el abdomen con los brazos pegados al cuerpo, botando el aire. Aprieta fuerte la espalda un segundo y vuelve lento inspirando.","Repite las repeticiones indicadas."],"en":"Elevated Cable Rows","ines":1,"f":"pull","m":"c","sec":["trapecio"]},"fdb-Elliptical_Trainer":{"nombre":"Elíptica","grupos":["cuadriceps"],"eq":"Máquina","niv":"Intermedio","cat":"Cardio","inst":["To begin, step onto the elliptical and select the desired option from the menu. Most ellipticals have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","The handles can be used to monitor your heart rate to help you stay at an appropriate intensity."],"en":"Elliptical Trainer","sec":["gemelos","gluteos","isquios"]},"fdb-Exercise_Ball_Crunch":{"nombre":"Crunch en fitball","grupos":["core"],"eq":"Fitball","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate sobre un fitball con la zona lumbar apoyada en él, rodillas flectadas y pies firmes en el suelo. La parte alta del torso cuelga por sobre el balón. Brazos a los lados o cruzados sobre el pecho, para no tensionar el cuello.","Baja el torso a una posición de estiramiento con el cuello quieto. Esta es la posición inicial.","Con la cadera quieta, contrae el abdomen y enrolla hombros y tronco hacia arriba hasta sentir buena contracción. La zona lumbar siempre en contacto con el balón. Bota el aire y sostén un segundo.","Vuelve inspirando a la posición inicial.","Repite las repeticiones indicadas."],"en":"Exercise Ball Crunch","ines":1,"f":"pull","m":"i"},"fdb-Exercise_Ball_Pull-In":{"nombre":"Recogida de rodillas en fitball","grupos":["core"],"eq":"Fitball","niv":"Principiante","cat":"Fuerza","inst":["Pon un fitball cerca y ponte en posición de flexión de brazos frente a él, manos al ancho de hombros.","Apoya las canillas sobre el balón, piernas estiradas y brazos estirados sosteniendo el tronco. Esta es la posición inicial.","Con la espalda recta y el tronco quieto, lleva las rodillas hacia el pecho botando el aire, dejando que el balón ruede bajo los tobillos. Aprieta el abdomen un segundo.","Estira lento las piernas y vuelve a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Exercise Ball Pull-In","ines":1,"f":"pull","m":"c"},"fdb-Extended_Range_One-Arm_Kettlebell_Floor_Press":{"nombre":"Press en suelo a una mano con kettlebell rango extendido","grupos":["pectoral"],"eq":"Kettlebell","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en el suelo con una kettlebell tomada por el mango para empujarla con un brazo. La pierna del mismo lado va flectada, con la rodilla cruzando la línea media del cuerpo.","Empuja la kettlebell extendiendo el codo y llevando el brazo hacia el centro, sobre el cuerpo. Vuelve a la posición inicial."],"en":"Extended Range One-Arm Kettlebell Floor Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-External_Rotation":{"nombre":"Rotación externa","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de lado en un banco plano con una mancuerna en la mano de arriba y el otro brazo doblado para apoyar la cabeza.","Flecta el codo del brazo con la mancuerna a 90°, con el brazo paralelo al torso.","Brazo pegado al torso y paralelo al suelo; antebrazo paralelo al suelo y frente a ti. Esta es la posición inicial.","Botando el aire, rota el antebrazo hacia afuera en semicírculo manteniendo los 90°, hasta que apunte al techo. Sostén un segundo.","Vuelve lento a la posición inicial inspirando.","Repite las repeticiones indicadas y cambia de brazo."],"en":"External Rotation","ines":1,"f":"pull","m":"i"},"fdb-External_Rotation_with_Band":{"nombre":"Rotación externa con banda","grupos":["hombros"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Amarra la banda a un poste a la altura del codo. Párate con el lado izquierdo hacia la banda, a unos 60 cm.","Toma el extremo con la mano derecha y mantén el codo pegado al costado; ayuda sujetar una toalla o foam roller con el codo.","Con el codo flectado a 90°, la mano cruza por delante del torso. Esta es la posición inicial.","Rota el brazo hacia afuera, como un revés, sin mover el codo.","Llega lo más lejos que puedas, pausa y vuelve a la posición inicial."],"en":"External Rotation with Band","ines":1,"f":"pull","m":"c"},"fdb-External_Rotation_with_Cable":{"nombre":"Rotación externa en polea","grupos":["hombros"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Ajusta la polea a la altura del codo. Párate con el lado izquierdo hacia ella, a unos 60 cm.","Toma el agarre con la mano derecha y mantén el codo pegado al costado; ayuda sujetar una toalla o foam roller con el codo.","Con el codo flectado a 90°, la mano cruza por delante del torso. Esta es la posición inicial.","Rota el brazo hacia afuera, como un revés, sin mover el codo."],"en":"External Rotation with Cable","ines":1,"f":"pull","m":"i"},"fdb-Face_Pull":{"nombre":"Face pull","grupos":["hombros"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["De frente a una polea alta con cuerda o doble agarre, tira directo hacia tu cara separando las manos al hacerlo. Mantén los brazos paralelos al suelo."],"en":"Face Pull","ines":1,"f":"pull","m":"c","sec":["dorsales"]},"fdb-Farmers_Walk":{"nombre":"Paseo del granjero","grupos":["antebrazos"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["Puedes usar implementos de farmer o, si no tienes, mancuernas pesadas o barras cortas. Párate entre los implementos.","Toma los agarres y súbelos empujando con los talones, con la espalda recta y la cabeza arriba.","Camina con pasos cortos y rápidos, sin olvidar respirar. Recorre la distancia indicada, típicamente 15-30 m, lo más rápido posible."],"en":"Farmer's Walk","ines":1,"m":"c","sec":["core","cuadriceps","espalda_baja","gluteos","isquios","trapecio"]},"fdb-Fast_Skipping":{"nombre":"Skipping rápido","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Pliometría","inst":["Start in a relaxed position with one leg slightly forward. This will be your starting position.","Skip by executing a step-hop pattern of right-right-step to left-left-step, and so on, alternating back and forth.","Perform fast skips by maintaining close contact with the ground and reduce air time, moving as quickly as possible."],"en":"Fast Skipping","f":"push","m":"c","sec":["abductores","aductores","gemelos","gluteos","isquios"]},"fdb-Finger_Curls":{"nombre":"Curl de dedos","grupos":["antebrazos"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Toma una barra con ambas manos, palmas arriba y al ancho de hombros.","Pies apoyados, algo más separados que los hombros. Esta es la posición inicial.","Baja la barra lo más posible abriendo los dedos, dejándola rodar hasta sostenerla con las últimas falanges.","Cierra las manos subiendo la barra lo más alto posible, botando el aire. Sostén arriba."],"en":"Finger Curls","ines":1,"f":"pull","m":"i"},"fdb-Flat_Bench_Cable_Flyes":{"nombre":"Aperturas en polea en banco plano","grupos":["pectoral"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Pon un banco plano entre dos poleas bajas, de modo que acostado el pecho quede alineado con ellas.","Acuéstate con los pies en el suelo.","Pide que te pasen los agarres; tómalos con las palmas hacia arriba.","Estira los brazos a los lados, paralelos al suelo, con los codos levemente flectados (mantén esa flexión todo el movimiento). Esta es la posición inicial.","Sube los brazos en semicírculo hasta juntar las manos sobre el pecho, apretando el pecho y botando el aire. Sostén un segundo arriba, con los brazos perpendiculares al torso.","Vuelve lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"Flat Bench Cable Flyes","ines":1,"f":"push","m":"i"},"fdb-Flat_Bench_Leg_Pull-In":{"nombre":"Recogida de piernas en banco plano","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en una colchoneta o banco plano con las piernas fuera del extremo.","Manos bajo los glúteos con las palmas abajo, o a los lados afirmándote del banco. Piernas estiradas. Esta es la posición inicial.","Flecta las rodillas y lleva los muslos hacia el abdomen botando el aire, hasta que las rodillas lleguen cerca del pecho. Sostén un segundo.","Vuelve lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Flat Bench Leg Pull-In","ines":1,"f":"pull","m":"c"},"fdb-Flat_Bench_Lying_Leg_Raise":{"nombre":"Elevación de piernas acostado en banco plano","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas en un banco con las piernas estiradas fuera del extremo.","Manos bajo los glúteos con las palmas abajo, o a los lados afirmándote del banco. Esta es la posición inicial.","Con las piernas lo más rectas posible y las rodillas levemente flectadas, súbelas hasta formar 90° con el suelo, botando el aire. Sostén un segundo arriba.","Bájalas lento a la posición inicial inspirando."],"en":"Flat Bench Lying Leg Raise","ines":1,"f":"pull","m":"i"},"fdb-Flexor_Incline_Dumbbell_Curls":{"nombre":"Curl inclinado con mancuernas de flexores","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Toma la mancuerna cargando la mano hacia el lado más cercano al cuerpo, con las muñecas lo más atrás posible para quitarles tensión.","Siéntate en un banco inclinado a 45° con una mancuerna en cada mano.","Brazos colgando a los lados, codos adentro y palmas al frente con los pulgares hacia afuera. Mantén esa posición de manos todo el movimiento, sin girarlas. Esta es la posición inicial.","Sube ambas mancuernas a la vez hasta contraer el bíceps por completo, botando el aire. Sin balanceo ni impulso; sostén un segundo arriba.","Vuelve lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Flexor Incline Dumbbell Curls","ines":1,"f":"pull","m":"i"},"fdb-Floor_Glute-Ham_Raise":{"nombre":"Curl nórdico en suelo","grupos":["isquios"],"eq":"","niv":"Intermedio","cat":"Fuerza","inst":["Puedes hacerlo con un compañero o fijando los pies bajo algo estable.","Arrodíllate con muslos y torso verticales. Si tienes compañero, que te sujete firme los pies. Esta es la posición inicial.","Baja extendiendo las rodillas, sin flectar la cadera al avanzar.","Pon las manos al frente al llegar al suelo. Es un ejercicio muy exigente; usa los brazos para empujarte suave del suelo y volver a la posición inicial."],"en":"Floor Glute-Ham Raise","ines":1,"f":"pull","m":"i","sec":["gemelos","gluteos"]},"fdb-Floor_Press":{"nombre":"Press en suelo","grupos":["triceps"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Ajusta los ganchos del rack a la altura adecuada. Acuéstate en el suelo con la cabeza cerca del extremo del rack. Con las escápulas juntas, saca la barra de los ganchos.","Baja la barra hacia la parte baja del pecho o alta del abdomen, apretándola como si quisieras abrirla y con los codos recogidos. Baja hasta que el brazo toque el suelo y pausa, sin golpear ni rebotar.","Empuja la barra lo más rápido que puedas, con barra, muñecas y codos alineados."],"en":"Floor Press","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Floor_Press_with_Chains":{"nombre":"Press en suelo con cadenas","grupos":["triceps"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Ajusta los ganchos del rack a la altura adecuada. Cuelga las cadenas sobre los extremos de la barra, lejos de los discos.","Acuéstate en el suelo con la cabeza cerca del extremo del rack. Con las escápulas juntas, saca la barra de los ganchos.","Baja la barra hacia la parte baja del pecho o alta del abdomen, apretándola como si quisieras abrirla y con los codos recogidos. Baja hasta que el brazo toque el suelo y pausa, sin golpear ni rebotar.","Empuja la barra lo más rápido que puedas, con barra, muñecas y codos alineados."],"en":"Floor Press with Chains","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Flutter_Kicks":{"nombre":"Patadas de tijera","grupos":["gluteos"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate boca abajo en un banco plano con la cadera en el borde, piernas estiradas y pies despegados del suelo, afirmándote del borde delantero con las manos.","Aprieta glúteos e isquiotibiales y sube las piernas hasta la altura de la cadera. Esta es la posición inicial.","Sube la pierna izquierda más que la derecha.","Baja la izquierda mientras subes la derecha.","Alterna así, como pataleando en el agua, hasta completar las repeticiones de cada pierna, siempre controlado y respirando normal."],"en":"Flutter Kicks","ines":1,"f":"pull","m":"c","sec":["isquios"]},"fdb-Foot-SMR":{"nombre":"Pie con pelota (liberación miofascial)","grupos":["gemelos"],"eq":"Otro","niv":"Intermedio","cat":"Elongación","inst":["This exercise stretches the fascia of the muscles in the feet. Start off seated with your shoes removed. Using a foot roller or a similar object, such as a small section of pvc pipe, place your foot against the roller across the arch of your foot. This will be your starting position.","Press down firmly, rolling across the arch of your foot. Hold for 10-30 seconds, and then switch feet."],"en":"Foot-SMR","f":"static"},"fdb-Forward_Drag_with_Press":{"nombre":"Arrastre hacia adelante con press","grupos":["pectoral"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["Engancha al trineo una cadena o cuerda con doble agarre. De espaldas al trineo, toma un agarre en cada mano.","Avanza un paso inclinado adelante, extendiendo piernas y cadera. En cada paso, pausa y extiende los codos empujando las manos al frente. Avanza hasta volver a la posición lista para empujar."],"en":"Forward Drag with Press","ines":1,"f":"push","m":"c","sec":["cuadriceps","gemelos","gluteos","hombros","isquios","triceps"]},"fdb-Frankenstein_Squat":{"nombre":"Sentadilla Frankenstein","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Este ejercicio enseña la posición correcta de la barra y del cuerpo en el clean y la sentadilla frontal.","Apoya la barra sobre la parte delantera de los hombros, suelta el agarre y estira los brazos al frente. Lleva los hombros adelante para formar un apoyo, con la barra en contacto con la garganta. Mueve solo las escápulas; no redondees la espalda alta.","Baja en sentadilla flectando rodillas y cadera, sentándote entre las piernas. Torso erguido, brazos arriba y hombros adelante para que la barra no se mueva. Baja hasta que los isquiotibiales toquen las pantorrillas.","Vuelve a quedar de pie empujando con la parte delantera del talón y extendiendo rodillas y cadera."],"en":"Frankenstein Squat","ines":1,"f":"push","m":"c","sec":["core","gemelos","gluteos","isquios"]},"fdb-Freehand_Jump_Squat":{"nombre":"Sentadilla con salto sin carga","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Cruza los brazos sobre el pecho.","Con la cabeza arriba y la espalda recta, pies al ancho de hombros.","Con la espalda recta y el pecho arriba, baja en sentadilla inspirando hasta que los muslos queden paralelos al suelo o más abajo.","Empujando sobre todo con la parte delantera de los pies, salta lo más alto posible, usando los muslos como resortes, botando el aire.","Al caer, baja de inmediato en sentadilla y vuelve a saltar.","Repite las repeticiones indicadas."],"en":"Freehand Jump Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Frog_Hops":{"nombre":"Saltos de rana","grupos":["cuadriceps"],"eq":"","niv":"Intermedio","cat":"Elongación","inst":["Stand with your hands behind your head, and squat down keeping your torso upright and your head up. This will be your starting position.","Jump forward several feet, avoiding jumping unnecessarily high. As your feet contact the ground, absorb the impact through your legs, and jump again. Repeat this action 5-10 times."],"en":"Frog Hops","f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Frog_Sit-Ups":{"nombre":"Abdominal de rana","grupos":["core"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate de espaldas con las piernas estiradas.","Flecta las rodillas y deja caer los muslos hacia afuera, juntando las plantas de los pies.","Acerca las plantas lo más posible hacia ti con los muslos casi tocando el suelo; las piernas forman un rombo.","Cruza los brazos tocando los hombros contrarios. Esta es la posición inicial.","Botando el aire, pega la zona lumbar al suelo y enrolla el torso hacia arriba, como el primer cuarto de un abdominal. Sostén un segundo.","Baja lento inspirando.","Repite las repeticiones indicadas."],"en":"Frog Sit-Ups","ines":1,"f":"pull","m":"i"},"fdb-Front_Barbell_Squat":{"nombre":"Sentadilla frontal con barra","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack, con la barra a la altura adecuada. Lleva los brazos bajo la barra con los codos altos y los brazos algo sobre la horizontal. Apoya la barra sobre los deltoides y cruza los brazos sujetándola.","Saca la barra del rack empujando con las piernas mientras enderezas el torso.","Aléjate del rack, pies al ancho de hombros y puntas levemente afuera. Mira al frente y mantén la espalda neutra. Esta es la posición inicial.","Baja lento flectando las rodillas con el torso erguido, hasta quedar bajo el paralelo, inspirando. Las rodillas siguen la dirección de las puntas de los pies.","Sube botando el aire, empujando el suelo con el medio del pie hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Front Barbell Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Front_Barbell_Squat_To_A_Bench":{"nombre":"Sentadilla frontal con barra a banco","grupos":["cuadriceps"],"eq":"Barra","niv":"Avanzado","cat":"Fuerza","inst":["Por seguridad, hazlo dentro de un rack, con un banco plano detrás y la barra a la altura adecuada. Lleva los brazos bajo la barra con los codos altos, apóyala sobre los deltoides y cruza los brazos sujetándola.","Saca la barra del rack empujando con las piernas mientras enderezas el torso.","Aléjate del rack, pies al ancho de hombros y puntas levemente afuera. Mira al frente y mantén la espalda neutra. Esta es la posición inicial.","Baja lento flectando las rodillas con el torso erguido, hasta tocar el banco con los glúteos, inspirando. Las rodillas siguen la dirección de las puntas de los pies.","Sube botando el aire, empujando el suelo con todo el pie hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Front Barbell Squat To A Bench","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Front_Box_Jump":{"nombre":"Salto frontal al cajón","grupos":["isquios"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Begin with a box of an appropriate height 1-2 feet in front of you. Stand with your feet should width apart. This will be your starting position.","Perform a short squat in preparation for jumping, swinging your arms behind you.","Rebound out of this position, extending through the hips, knees, and ankles to jump as high as possible. Swing your arms forward and up.","Land on the box with the knees bent, absorbing the impact through the legs. You can jump from the box back to the ground, or preferably step down one leg at a time."],"en":"Front Box Jump","f":"push","m":"c","sec":["abductores","aductores","cuadriceps","gemelos","gluteos"]},"fdb-Front_Cable_Raise":{"nombre":"Elevación frontal en polea","grupos":["hombros"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Elige la carga en una polea baja y toma el agarre simple con la mano izquierda.","De espaldas a la polea, deja el brazo estirado con el agarre frente al muslo y la palma hacia él. Esta es la posición inicial.","Sin balancear el torso, sube el brazo al frente con el codo levemente flectado y la palma hacia abajo, hasta quedar algo sobre la horizontal. Bota el aire y pausa un segundo arriba.","Baja lento a la posición inicial inspirando.","Completa las repeticiones y cambia al brazo derecho."],"en":"Front Cable Raise","ines":1,"f":"push","m":"i"},"fdb-Front_Cone_Hops_or_hurdle_hops":{"nombre":"Saltos frontales sobre conos o vallas","grupos":["cuadriceps"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Set up a row of cones or other small barriers, placing them a few feet apart.","Stand in front of the first cone with your feet shoulder width apart. This will be your starting position.","Begin by jumping with both feet over the first cone, swinging both arms as you jump.","Absorb the impact of landing by bending the knees, rebounding out of the first leap by jumping over the next cone.","Continue until you have jumped over all of the cones."],"en":"Front Cone Hops (or hurdle hops)","f":"push","m":"c","sec":["abductores","aductores","gemelos","gluteos","isquios"]},"fdb-Front_Dumbbell_Raise":{"nombre":"Elevación frontal con mancuerna","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, torso recto, con una mancuerna frente a cada muslo y palmas hacia ellos. Esta es la posición inicial.","Sin balancear el torso, sube la mancuerna izquierda al frente con el codo levemente flectado y la palma hacia abajo, hasta quedar algo sobre la horizontal. Bota el aire, pausa un segundo e inspira.","Bájala lento mientras subes la derecha.","Alterna así hasta completar las repeticiones de cada brazo."],"en":"Front Dumbbell Raise","ines":1,"f":"push","m":"i"},"fdb-Front_Incline_Dumbbell_Raise":{"nombre":"Elevación frontal en banco inclinado","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en un banco inclinado entre 30 y 60° con una mancuerna en cada mano. Puedes variar el ángulo.","Estira los brazos al frente con las palmas hacia abajo y las mancuernas unos 2-3 cm sobre los muslos. Esta es la posición inicial.","Sube lento las mancuernas hasta quedar algo sobre los hombros, con los codos bloqueados. Aprieta un segundo arriba botando el aire. Cabeza apoyada en el banco y pies en el suelo.","Baja a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Front Incline Dumbbell Raise","ines":1,"f":"push","m":"i"},"fdb-Front_Leg_Raises":{"nombre":"Elevación de pierna al frente","grupos":["isquios"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["Stand next to a chair or other support, holding on with one hand.","Swing your leg forward, keeping the leg straight. Continue with a downward swing, bringing the leg as far back as your flexibility allows. Repeat 5-10 times, and then switch legs."],"en":"Front Leg Raises","f":"pull"},"fdb-Front_Plate_Raise":{"nombre":"Elevación frontal con disco","grupos":["hombros"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["De pie, sostén un disco con ambas manos en posición de 3 y 9 del reloj, palmas enfrentadas, brazos estirados con leve flexión de codo y el disco bajo, frente a la cintura. Los brazos se mantienen así todo el ejercicio. Esta es la posición inicial.","Sube lento el disco botando el aire hasta un poco sobre la altura de los hombros. Sostén un segundo. Sin balancear ni flectar los codos; torso quieto.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Front Plate Raise","ines":1,"f":"push","m":"i"},"fdb-Front_Raise_And_Pullover":{"nombre":"Elevación frontal y pullover","grupos":["pectoral"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco plano con una barra en agarre prono, manos separadas unos 40 cm.","Apoya la barra en los muslos, brazos estirados con leve flexión de codo. Esta es la posición inicial.","Sube la barra en semicírculo con los brazos rectos, inspirando, hasta llevarla por detrás de la cabeza (unos 180°). Ahí los brazos quedan paralelos al suelo con las palmas hacia el techo.","Vuelve por el mismo camino a la posición inicial botando el aire.","Repite las repeticiones indicadas."],"en":"Front Raise And Pullover","ines":1,"f":"pull","m":"c","sec":["dorsales","hombros","triceps"]},"fdb-Front_Squat_Clean_Grip":{"nombre":"Sentadilla frontal agarre de cargada","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Pon la barra en el rack un poco bajo la altura de los hombros. Apóyala sobre los deltoides, contra las clavículas y rozando la garganta. Agarre de clean, tocando la barra solo con los dedos para mantenerla en posición.","Saca la barra empujando con las piernas mientras enderezas el torso. Aléjate del rack, pies al ancho de hombros y puntas levemente afuera. Cabeza y codos siempre arriba. Esta es la posición inicial.","Flecta las rodillas y baja sentándote entre las piernas hasta que los isquiotibiales toquen las pantorrillas. Empuja activamente las rodillas hacia afuera para que sigan la línea de los pies.","Sube botando el aire, empujando el suelo con el talón o el medio del pie hasta la posición inicial."],"en":"Front Squat (Clean Grip)","ines":1,"f":"push","m":"c","sec":["core","gluteos","isquios"]},"fdb-Front_Squats_With_Two_Kettlebells":{"nombre":"Sentadilla frontal con dos kettlebells","grupos":["cuadriceps"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Haz clean de dos kettlebells a los hombros extendiendo piernas y cadera, girando las muñecas al recibirlas.","Mirando siempre al frente, baja en sentadilla lo más profundo que puedas y pausa abajo. Empuja las rodillas hacia afuera y baja entre las piernas, con el torso erguido y pecho arriba.","Sube empujando con los talones y repite."],"en":"Front Squats With Two Kettlebells","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos"]},"fdb-Front_Two-Dumbbell_Raise":{"nombre":"Elevación frontal con dos mancuernas","grupos":["hombros"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, torso recto, con una mancuerna frente a cada muslo y palmas hacia ellos. Esta es la posición inicial.","Sin balancear el torso, sube ambas mancuernas al frente con los codos levemente flectados y palmas hacia abajo, hasta quedar algo sobre la horizontal. Bota el aire y pausa un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Front Two-Dumbbell Raise","ines":1,"f":"push","m":"i"},"fdb-Full_Range-Of-Motion_Lat_Pulldown":{"nombre":"Jalón al pecho rango completo","grupos":["dorsales"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["De pie o sentado en un banco alto, toma dos agarres de las poleas altas cruzando los brazos (mano derecha a la polea izquierda y viceversa), palmas al frente.","Con el pecho arriba y una leve curva lumbar, tira los agarres hacia abajo como en un jalón normal, pero en arco. Durante el movimiento gira las manos para que abajo las palmas queden enfrentadas. Vuelve lento y repite."],"en":"Full Range-Of-Motion Lat Pulldown","ines":1,"f":"pull","m":"c","sec":["biceps","hombros"]},"fdb-Gironda_Sternum_Chins":{"nombre":"Dominada Gironda al esternón","grupos":["dorsales"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Toma la barra con agarre supino al ancho de hombros.","Cuelga con los brazos estirados, saca pecho e inclínate atrás; mantén esa inclinación todo el movimiento. Esta es la posición inicial.","Sube con la columna arqueada y la cabeza lo más atrás posible, botando el aire. Arriba, cadera y piernas quedan a unos 45° del suelo.","Sigue hasta que la clavícula pase la barra y el esternón la toque. Sostén un segundo; la cabeza queda paralela al suelo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Gironda Sternum Chins","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Glute_Ham_Raise":{"nombre":"Glute ham raise","grupos":["isquios"],"eq":"Máquina","niv":"Intermedio","cat":"Powerlifting","inst":["Ajusta la máquina a tu cuerpo. Boca abajo, apoya los pies contra la placa entre los rodillos, con las rodillas justo detrás del cojín.","Parte desde abajo. Con la espalda firme, flecta las rodillas empujando las puntas contra la placa. Mantén el tronco recto y sube hasta quedar vertical.","Vuelve a la posición inicial bajando controlado."],"en":"Glute Ham Raise","ines":1,"f":"pull","m":"c","sec":["gemelos","gluteos"]},"fdb-Glute_Kickback":{"nombre":"Patada de glúteo","grupos":["gluteos"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Arrodíllate en el suelo y apoya las manos al ancho de hombros, como una flexión de rodillas. Mira al frente; rodillas a 90°. Esta es la posición inicial.","Botando el aire, sube la pierna derecha manteniendo los 90° hasta que el muslo quede en línea con la espalda. Contrae el glúteo y sostén un segundo arriba; el muslo queda paralelo al suelo y la pantorrilla perpendicular.","Vuelve inspirando y repite con la pierna izquierda.","Alterna hasta completar las repeticiones."],"en":"Glute Kickback","ines":1,"f":"push","m":"c","sec":["isquios"]},"fdb-Goblet_Squat":{"nombre":"Sentadilla goblet","grupos":["cuadriceps"],"eq":"Kettlebell","niv":"Principiante","cat":"Fuerza","inst":["De pie, sostén una kettlebell liviana por los cuernos, pegada al pecho. Esta es la posición inicial.","Baja en sentadilla entre las piernas hasta que los isquiotibiales toquen las pantorrillas, con pecho y cabeza arriba y espalda recta.","Abajo, pausa y usa los codos para empujar las rodillas hacia afuera. Vuelve a la posición inicial y repite 10-20 veces."],"en":"Goblet Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","hombros","isquios"]},"fdb-Good_Morning":{"nombre":"Good morning","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Pon la barra en el rack a la altura de los hombros y apóyala en la parte posterior de los hombros, como en una sentadilla baja, no sobre los trapecios. Espalda firme, escápulas juntas y rodillas levemente flectadas. Retrocede del rack.","Inclínate desde la cadera llevándola atrás, hasta casi quedar paralelo al suelo, con la espalda firme y el cuello alineado.","Vuelve extendiendo la cadera con glúteos e isquiotibiales hasta la posición inicial."],"en":"Good Morning","ines":1,"f":"push","m":"c","sec":["core","espalda_baja","gluteos"]},"fdb-Good_Morning_off_Pins":{"nombre":"Good morning desde pines","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Pon la barra en los soportes a la altura del abdomen. Inclínate bajo ella y apóyala en la parte posterior de los hombros, como en una sentadilla baja. A la altura correcta, quedas casi paralelo al suelo. Espalda firme, escápulas juntas, rodillas levemente flectadas y cuello alineado.","Extiende la cadera con glúteos e isquiotibiales hasta quedar de pie con la carga. Baja lento hasta dejar la barra en los soportes."],"en":"Good Morning off Pins","ines":1,"f":"push","m":"c","sec":["core","espalda_baja","gluteos"]},"fdb-Gorilla_Chin_Crunch":{"nombre":"Dominada gorila con crunch","grupos":["core"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Cuelga de la barra con agarre supino algo más ancho que los hombros.","Flecta las rodillas a 90°, con los muslos verticales y las pantorrillas paralelas al suelo. Esta es la posición inicial.","Botando el aire, sube mientras llevas las rodillas al pecho. Detente cuando la nariz llegue a la altura de la barra, terminando el crunch al mismo tiempo.","Vuelve lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Gorilla Chin/Crunch","ines":1,"f":"pull","m":"c","sec":["biceps","dorsales"]},"fdb-Groin_and_Back_Stretch":{"nombre":"Estiramiento de ingle y espalda","grupos":["aductores"],"eq":"","niv":"Intermedio","cat":"Elongación","inst":["Sit on the floor with your knees bent and feet together.","Interlock your fingers behind your head. This will be your starting position.","Curl downwards, bringing your elbows to the inside of your thighs. After a brief pause, return to the starting position with your head up and your back straight. Repeat for 10-20 repetitions."],"en":"Groin and Back Stretch","f":"static","m":"c"},"fdb-Groiners":{"nombre":"Groiners","grupos":["aductores"],"eq":"Peso corporal","niv":"Intermedio","cat":"Elongación","inst":["Begin in a pushup position on the floor. This will be your starting position.","Using both legs, jump forward landing with your feet next to your hands. Keep your head up as you do so.","Return to the starting position and immediately repeat the movement, continuing for 10-20 repetitions."],"en":"Groiners","f":"pull","m":"c"},"fdb-Hack_Squat":{"nombre":"Sentadilla hack","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Apoya la espalda en el respaldo de la máquina y ubica los hombros bajo los cojines.","Pies en la plataforma al ancho de hombros, puntas levemente afuera. Cabeza arriba y espalda siempre apoyada.","Toma los agarres laterales y quita los seguros.","Estira las piernas sin bloquear las rodillas. Esta es la posición inicial.","Baja lento flectando las rodillas, con la espalda en el respaldo, hasta quedar bajo el paralelo, inspirando. Las rodillas siguen la dirección de las puntas de los pies.","Sube botando el aire, empujando con todo el pie hasta la posición inicial.","Repite las repeticiones indicadas."],"en":"Hack Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Hammer_Curls":{"nombre":"Curl martillo","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["De pie, erguido, con una mancuerna en cada mano, brazos estirados y codos cerca del torso.","Palmas hacia el torso. Esta es la posición inicial.","Sin mover el brazo, bota el aire y sube la mancuerna contrayendo el bíceps hasta la altura del hombro. Aprieta un momento. Codo fijo; solo se mueve el antebrazo.","Inspira y baja lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"Hammer Curls","ines":1,"f":"pull","m":"i"},"fdb-Hammer_Grip_Incline_DB_Bench_Press":{"nombre":"Press inclinado con mancuernas agarre martillo","grupos":["pectoral"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco inclinado con una mancuerna en cada mano sobre los muslos, palmas enfrentadas.","Ayudándote con los muslos, súbelas una a una hasta sostenerlas al ancho de hombros.","Mantén agarre neutro (palmas enfrentadas), codos abiertos con los brazos en línea con los hombros y 90° entre brazo y antebrazo. Esta es la posición inicial.","Baja las mancuernas lento hacia los costados inspirando, con control total.","Botando el aire, súbelas con el pecho. Bloquea, sostén un segundo y baja lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas.","Al terminar, apoya las mancuernas en los muslos y luego en el suelo; es la forma más segura."],"en":"Hammer Grip Incline DB Bench Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Hamstring-SMR":{"nombre":"Isquiotibiales con foam roller","grupos":["isquios"],"eq":"Foam roller","niv":"Principiante","cat":"Elongación","inst":["In a seated position, extend your legs over a foam roll so that it is position on the back of the upper legs. Place your hands to the side or behind you to help support your weight. This will be your starting position.","Using your hands, lift your hips off of the floor and shift your weight on the foam roll to one leg. Relax the hamstrings of the leg you are stretching.","Roll over the foam from below the hip to above the back of the knee, pausing at points of tension for 10-30 seconds. Repeat for the other leg."],"en":"Hamstring-SMR","f":"static","m":"i"},"fdb-Hamstring_Stretch":{"nombre":"Estiramiento de isquiotibiales","grupos":["isquios"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Lie on your back with one leg extended above you, with the hip at ninety degrees. Keep the other leg flat on the floor.","Loop a belt, band, or rope over the ball of your foot. This will be your starting position.","Pull on the belt to create tension in the calves and hamstrings. Hold this stretch for 10-30 seconds, and repeat with the other leg."],"en":"Hamstring Stretch","f":"static","m":"i"},"fdb-Handstand_Push-Ups":{"nombre":"Flexiones de pino (handstand push-up)","grupos":["hombros"],"eq":"Peso corporal","niv":"Avanzado","cat":"Fuerza","inst":["De espaldas a la pared, inclínate y apoya las manos en el suelo al ancho de hombros.","Impúlsate con las piernas contra la pared con los brazos estirados, quedando cabeza abajo con brazos y piernas extendidos y el cuerpo lo más recto posible. La primera vez, pide ayuda a alguien. Mira hacia la pared, no al suelo.","Baja lento inspirando hasta que la cabeza casi toque el suelo. Es clave bajar lento para no golpearte la cabeza.","Sube lento botando el aire hasta casi bloquear los codos.","Repite las repeticiones indicadas."],"en":"Handstand Push-Ups","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Hang_Clean":{"nombre":"Cargada colgada","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Toma la barra al ancho de hombros con agarre prono o de gancho, colgando a mitad de muslo, espalda recta y levemente inclinada adelante.","Extiende con fuerza cadera, rodillas y tobillos llevando la barra hacia arriba, encogiendo los hombros. Luego métete bajo la barra y recíbela sobre los hombros en sentadilla frontal.","Recupera de inmediato empujando con los talones, torso erguido y codos arriba, hasta quedar de pie."],"en":"Hang Clean","ines":1,"f":"pull","m":"c","sec":["antebrazos","espalda_baja","gemelos","gluteos","hombros","isquios","trapecio"]},"fdb-Hang_Clean_-_Below_the_Knees":{"nombre":"Cargada colgada bajo las rodillas","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Toma la barra al ancho de hombros con agarre prono o de gancho, colgando justo bajo las rodillas, espalda recta y levemente inclinada adelante.","Extiende con fuerza cadera, rodillas y tobillos llevando la barra hacia arriba y encogiendo los hombros. Al lograr la extensión completa, flecta los brazos con los codos arriba y afuera.","En la máxima extensión, métete con fuerza bajo la barra girando los codos y recíbela en sentadilla frontal, apoyada sobre los hombros y rozando la garganta. Baja hasta el fondo.","Recupera de inmediato empujando con los talones, torso erguido y codos arriba, hasta quedar de pie."],"en":"Hang Clean - Below the Knees","ines":1,"f":"pull","m":"c","sec":["antebrazos","espalda_baja","gemelos","gluteos","hombros","isquios","trapecio"]},"fdb-Hang_Snatch":{"nombre":"Arranque colgado","grupos":["isquios"],"eq":"Barra","niv":"Avanzado","cat":"Halterofilia","inst":["Toma la barra con agarre ancho, prono o de gancho. Pies bajo la cadera con las puntas afuera, rodillas levemente flectadas, torso inclinado adelante, columna extendida y mirada al frente. La barra queda a la altura de la cadera. Esta es la posición inicial.","Extiende con fuerza piernas y cadera. En la máxima extensión, encoge los hombros y deja que los codos se flecten hacia los lados.","Mientras llevas los pies a la posición de recepción, métete con fuerza bajo la barra subiéndola sobre la cabeza. Recíbela lo más abajo posible con los brazos totalmente estirados.","Ponte de pie con la barra arriba y luego bájala al suelo controlada."],"en":"Hang Snatch","ines":1,"f":"pull","m":"c","sec":["antebrazos","core","cuadriceps","espalda_baja","gemelos","gluteos","hombros","trapecio"]},"fdb-Hang_Snatch_-_Below_Knees":{"nombre":"Arranque colgado bajo las rodillas","grupos":["isquios"],"eq":"Barra","niv":"Avanzado","cat":"Halterofilia","inst":["Toma la barra con agarre ancho, prono o de gancho. Pies bajo la cadera con las puntas afuera, rodillas levemente flectadas, torso inclinado adelante, columna extendida y mirada al frente. La barra queda justo bajo las rodillas. Esta es la posición inicial.","Extiende con fuerza piernas y cadera. En la máxima extensión, encoge los hombros y deja que los codos se flecten hacia los lados.","Mientras llevas los pies a la posición de recepción, métete con fuerza bajo la barra subiéndola sobre la cabeza. Recíbela lo más abajo posible con los brazos totalmente estirados.","Ponte de pie con la barra arriba y luego bájala al suelo controlada."],"en":"Hang Snatch - Below Knees","ines":1,"f":"pull","m":"c","sec":["antebrazos","core","cuadriceps","espalda_baja","gemelos","gluteos","hombros","trapecio"]},"fdb-Hanging_Bar_Good_Morning":{"nombre":"Good morning con barra colgante","grupos":["isquios"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Cuelga la barra con cadenas o correas a la altura del abdomen.","Inclínate bajo la barra y apóyala en la parte posterior de los hombros, como en una sentadilla baja. A la altura correcta, quedas casi paralelo al suelo. Espalda firme, escápulas juntas, rodillas levemente flectadas y cuello alineado.","Extiende la cadera con glúteos e isquiotibiales hasta quedar de pie con la carga.","Baja lento hasta que las cadenas vuelvan a sostener la barra."],"en":"Hanging Bar Good Morning","ines":1,"f":"push","m":"c","sec":["core","espalda_baja","gluteos"]},"fdb-Hanging_Leg_Raise":{"nombre":"Elevación de piernas colgado","grupos":["core"],"eq":"Peso corporal","niv":"Avanzado","cat":"Fuerza","inst":["Cuelga de la barra con los brazos estirados y agarre medio o ancho. Piernas estiradas hacia abajo y pelvis levemente rotada hacia atrás. Esta es la posición inicial.","Sube las piernas hasta formar 90° con el torso, botando el aire. Sostén un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Hanging Leg Raise","ines":1,"f":"pull","m":"i"},"fdb-Hanging_Pike":{"nombre":"Pike colgado","grupos":["core"],"eq":"Peso corporal","niv":"Avanzado","cat":"Fuerza","inst":["Cuelga de la barra con agarre prono algo más ancho que los hombros, piernas y pies juntos. Puedes usar straps.","Flecta las rodillas a 90° y adelanta los muslos hasta que queden paralelos al suelo, con las pantorrillas verticales. Esta es la posición inicial.","Sube las piernas botando el aire hasta casi tocar la barra con las canillas, estirándolas lo más posible arriba.","Baja lo más lento posible a la posición inicial, sin balanceo ni impulso.","Repite las repeticiones indicadas."],"en":"Hanging Pike","ines":1,"f":"pull","m":"c"},"fdb-Heaving_Snatch_Balance":{"nombre":"Snatch balance con impulso","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Este ejercicio ayuda a aprender el arranque. Sostén una barra liviana en la parte alta de la espalda, con los pies algo más separados que la cadera y las puntas afuera, como para una sentadilla.","Flecta un poco las rodillas y rebota hacia arriba para descargar brevemente la barra. Métete bajo ella subiéndola sobre la cabeza mientras bajas a sentadilla completa.","Vuelve a quedar de pie."],"en":"Heaving Snatch Balance","ines":1,"f":"push","m":"c","sec":["antebrazos","core","gluteos","hombros","isquios","triceps"]},"fdb-Heavy_Bag_Thrust":{"nombre":"Empuje al saco pesado","grupos":["pectoral"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Utilize a heavy bag for this exercise. Assume an upright stance next to the bag, with your feet staggered, fairly wide apart. Place your hand on the bag at about chest height. This will be your starting position.","Begin by twisting at the waist, pushing the bag forward as hard as possible. Perform this move quickly, pushing the bag away from your body.","Receive the bag as it swings back by reversing these steps."],"en":"Heavy Bag Thrust","f":"push","m":"c","sec":["core","hombros","triceps"]},"fdb-High_Cable_Curls":{"nombre":"Curl en polea alta","grupos":["biceps"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Párate entre dos poleas altas y toma un agarre con cada mano. Brazos paralelos al suelo y palmas hacia ti. Esta es la posición inicial.","Flecta los codos llevando los agarres hasta junto a las orejas, botando el aire. Solo se mueven los antebrazos. Aprieta un segundo.","Vuelve lento a la posición inicial.","Repite las repeticiones indicadas."],"en":"High Cable Curls","ines":1,"f":"pull","m":"c"},"fdb-Hip_Circles_prone":{"nombre":"Círculos de cadera boca abajo","grupos":["abductores"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["Position yourself on your hands and knees on the ground. Maintaining good posture, raise one bent knee off of the ground. This will be your starting position.","Keeping the knee in a bent position, rotate the femur in an arc, attempting to make a big circle with your knee.","Perform this slowly for a number of repetitions, and repeat on the other side."],"en":"Hip Circles (prone)","f":"pull","m":"i","sec":["aductores"]},"fdb-Hip_Extension_with_Bands":{"nombre":"Extensión de cadera con banda","grupos":["gluteos"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Fija un extremo de la banda abajo en un poste y el otro a un tobillo.","De frente al punto de anclaje, afírmate de la columna para estabilizarte.","Con cabeza y pecho arriba, lleva la pierna con banda hacia atrás lo más que puedas, con la rodilla estirada.","Vuelve a la posición inicial."],"en":"Hip Extension with Bands","ines":1,"f":"push","m":"c","sec":["isquios"]},"fdb-Hip_Flexion_with_Band":{"nombre":"Flexión de cadera con banda","grupos":["cuadriceps"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Fija un extremo de la banda abajo en un poste y el otro a un tobillo.","Ponte de espaldas al punto de anclaje.","Con cabeza y pecho arriba, sube la rodilla hasta 90° y pausa.","Vuelve a la posición inicial."],"en":"Hip Flexion with Band","ines":1,"f":"pull","m":"c"},"fdb-Hip_Lift_with_Band":{"nombre":"Elevación de cadera con banda","grupos":["gluteos"],"eq":"Bandas","niv":"Principiante","cat":"Powerlifting","inst":["Elige una banda adecuada y fíjala a ambos lados del rack (o a mancuernas pesadas que no se muevan). Acuéstate al centro.","Ubícate con la banda justo sobre la cadera, rodillas flectadas y pies apoyados. Manos en el suelo o sujetando la banda.","Con los hombros en el suelo, empuja con los talones y sube la cadera contra la banda lo más alto posible.","Pausa arriba y vuelve a la posición inicial."],"en":"Hip Lift with Band","ines":1,"f":"push","m":"c","sec":["gemelos","isquios"]},"fdb-Hug_A_Ball":{"nombre":"Abrazar el balón","grupos":["espalda_baja"],"eq":"Fitball","niv":"Principiante","cat":"Elongación","inst":["Seat yourself on the floor.","Straddle an exercise ball between both legs and lower your hips down toward the floor.","Hug your arms around the ball to support your body. Adjust your legs so that your feet are flat on the floor and your knees line up over your ankles. Keep a good grip on the ball so it doesn't roll away from you and send you back onto your buttocks."],"en":"Hug A Ball","f":"static","m":"i","sec":["gemelos","gluteos"]},"fdb-Hug_Knees_To_Chest":{"nombre":"Abrazar rodillas al pecho","grupos":["espalda_baja"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Lie down on your back and pull both knees up to your chest.","Hold your arms under the knees, not over (that would put to much pressure on your knee joints).","Slowly pull the knees toward your shoulders. This also stretches your buttocks muscles."],"en":"Hug Knees To Chest","f":"static","sec":["gluteos"]},"fdb-Hurdle_Hops":{"nombre":"Saltos de vallas","grupos":["isquios"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Set up a row of hurdles or other small barriers, placing them a few feet apart.","Stand in front of the first hurdle with your feet shoulder width apart. This will be your starting position.","Begin by jumping with both feet over the first hurdle, swinging both arms as you jump.","Absorb the impact of landing by bending the knees, rebounding out of the first leap by jumping over the next hurdle. Continue until you have jumped over all of the hurdles."],"en":"Hurdle Hops","f":"push","m":"c","sec":["abductores","aductores","gemelos","gluteos"]},"fdb-Hyperextensions_Back_Extensions":{"nombre":"Hiperextensiones lumbares","grupos":["espalda_baja"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate boca abajo en el banco de hiperextensiones con los tobillos bien fijos bajo los cojines.","Ajusta el cojín para que los muslos apoyen y puedas flectar la cadera sin restricción.","Con el cuerpo recto, cruza los brazos al frente o detrás de la cabeza. Esta es la posición inicial. Puedes sostener un disco al pecho para más carga.","Inclínate lento desde la cadera lo más que puedas con la espalda plana, inspirando, hasta sentir estiramiento en los isquiotibiales o hasta que no puedas seguir sin redondear. Nunca redondees la espalda.","Sube lento a la posición inicial. No arquees más allá de la línea recta ni balancees el torso.","Repite las repeticiones indicadas."],"en":"Hyperextensions (Back Extensions)","ines":1,"f":"pull","m":"i","sec":["gluteos","isquios"]},"fdb-Hyperextensions_With_No_Hyperextension_Bench":{"nombre":"Hiperextensiones sin banco","grupos":["espalda_baja"],"eq":"Peso corporal","niv":"Intermedio","cat":"Fuerza","inst":["Con alguien sujetando tus piernas, deslízate hasta el borde de un banco plano hasta que la cadera quede fuera. El tronco cuelga hacia el suelo; el rango es menor que en un banco de hiperextensiones.","Con el cuerpo recto, cruza los brazos al frente o detrás de la cabeza. Esta es la posición inicial. Puedes sostener un disco al pecho para más carga.","Inclínate lento desde la cadera con la espalda plana, inspirando, hasta casi tocar el suelo o sentir buen estiramiento en los isquiotibiales. Nunca redondees la espalda.","Sube lento a la posición inicial botando el aire. No arquees más allá de la línea recta ni balancees el torso.","Repite las repeticiones indicadas."],"en":"Hyperextensions With No Hyperextension Bench","ines":1,"f":"pull","m":"c","sec":["gluteos","isquios"]},"fdb-IT_Band_and_Glute_Stretch":{"nombre":"Estiramiento de cintilla iliotibial y glúteo","grupos":["abductores"],"eq":"Otro","niv":"Intermedio","cat":"Elongación","inst":["Loop a belt, rope, or band around one of your feet, and swing that leg across your body to the opposite side, keeping the leg extended as you lay on the ground. This will be your starting position.","Keeping your foot off of the floor, pull on the belt, using the tension to pull the toes up. Hold for 10-20 seconds, and repeat on the other side."],"en":"IT Band and Glute Stretch","f":"static"},"fdb-Iliotibial_Tract-SMR":{"nombre":"Cintilla iliotibial con foam roller","grupos":["abductores"],"eq":"Foam roller","niv":"Intermedio","cat":"Elongación","inst":["Lay on your side, with the bottom leg placed onto a foam roller between the hip and the knee. The other leg can be crossed in front of you.","Place as much of your weight as is tolerable onto your bottom leg; there is no need to keep your bottom leg in contact with the ground. Be sure to relax the muscles of the leg you are stretching.","Roll your leg over the foam from you hip to your knee, pausing for 10-30 seconds at points of tension. Repeat with the opposite leg."],"en":"Iliotibial Tract-SMR","f":"static","m":"i"},"fdb-Inchworm":{"nombre":"Gusano (inchworm)","grupos":["isquios"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["Stand with your feet close together. Keeping your legs straight, stretch down and put your hands on the floor directly in front of you. This will be your starting position.","Begin by walking your hands forward slowly, alternating your left and your right. As you do so, bend only at the hip, keeping your legs straight.","Keep going until your body is parallel to the ground in a pushup position.","Now, keep your hands in place and slowly take short steps with your feet, moving only a few inches at a time.","Continue walking until your feet are by hour hands, keeping your legs straight as you do so."],"en":"Inchworm","m":"c"},"fdb-Incline_Barbell_Triceps_Extension":{"nombre":"Extensión de tríceps con barra en banco inclinado","grupos":["triceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Toma una barra con agarre prono algo más estrecho que los hombros.","Acuéstate en un banco inclinado entre 45
