 y 75°.","Lleva la barra sobre la cabeza con los brazos estirados, codos adentro y brazos en línea con el torso. Esta es la posición inicial.","Baja la barra en semicírculo detrás de la cabeza hasta que los antebrazos toquen los bíceps, inspirando. Brazos fijos y cerca de la cabeza; solo se mueven los antebrazos.","Vuelve contrayendo el tríceps, botando el aire. Sostén un segundo.","Repite las repeticiones indicadas."],"en":"Incline Barbell Triceps Extension","ines":1,"f":"push","m":"i","sec":["antebrazos"]},"fdb-Incline_Bench_Pull":{"nombre":"Remo inclinado boca abajo con mancuernas","grupos":["dorsales"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Con una mancuerna en cada mano, acuéstate boca abajo en un banco inclinado a unos 30°.","Deja los brazos colgando estirados hacia el suelo.","Gira las muñecas a agarre prono (palmas hacia atrás).","Abre los codos hacia afuera. Esta es la posición inicial.","Botando el aire, tira las mancuernas hacia arriba como un press banca al revés, flectando los codos y subiendo los brazos con los antebrazos colgando, hasta que los brazos lleguen a la altura de la espalda. Arriba, brazos y torso forman una “T”. Sostén un segundo.","Baja lento inspirando.","Repite las repeticiones indicadas."],"en":"Incline Bench Pull","ines":1,"f":"pull","m":"i","sec":["hombros"]},"fdb-Incline_Cable_Chest_Press":{"nombre":"Press inclinado en polea","grupos":["pectoral"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Ajusta la carga y siéntate tomando los agarres. Brazos a unos 45° del cuerpo, cabeza y pecho arriba y codos a unos 90°. Esta es la posición inicial.","Extiende los codos empujando los agarres al frente hasta juntarlos, con las escápulas retraídas.","Tras una pausa con los brazos estirados, vuelve manteniendo la tensión en los cables."],"en":"Incline Cable Chest Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Incline_Cable_Flye":{"nombre":"Aperturas inclinadas en polea","grupos":["pectoral"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Pon las poleas en la posición más baja.","Ubica un banco inclinado a 45° entre ellas, elige la carga y toma un agarre en cada mano.","Acuéstate en el banco y junta las manos frente a la cara con los brazos estirados. Esta es la posición inicial.","Con los codos levemente flectados, abre los brazos en un arco amplio hasta sentir estiramiento en el pecho, inspirando. Solo se mueve el hombro.","Vuelve por el mismo arco apretando el pecho, botando el aire. Sostén un segundo.","Repite las repeticiones indicadas."],"en":"Incline Cable Flye","ines":1,"f":"push","m":"i","sec":["hombros"]},"fdb-Incline_Dumbbell_Bench_With_Palms_Facing_In":{"nombre":"Press inclinado con mancuernas agarre neutro","grupos":["pectoral"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco inclinado con una mancuerna en cada mano sobre los muslos, palmas enfrentadas.","Ayudándote con los muslos, súbelas una a una hasta sostenerlas al ancho de hombros.","Mantén agarre neutro, codos abiertos con los brazos en línea con los hombros y 90° entre brazo y antebrazo. Esta es la posición inicial.","Baja lento hacia los costados inspirando, con control total.","Botando el aire, sube con el pecho. Bloquea, sostén un segundo y baja lento. Bajar debe durar al menos el doble que subir.","Repite las repeticiones indicadas.","Al terminar, apoya las mancuernas en los muslos y luego en el suelo."],"en":"Incline Dumbbell Bench With Palms Facing In","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Incline_Dumbbell_Curl":{"nombre":"Curl inclinado con mancuernas","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en un banco inclinado con una mancuerna en cada mano y los brazos colgando. Codos cerca del torso y palmas al frente. Esta es la posición inicial.","Sin mover los brazos, sube las mancuernas contrayendo el bíceps, botando el aire, hasta la altura de los hombros. Solo se mueven los antebrazos. Sostén un segundo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Incline Dumbbell Curl","ines":1,"f":"pull","m":"i"},"fdb-Incline_Dumbbell_Flyes":{"nombre":"Aperturas inclinadas con mancuernas","grupos":["pectoral"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Con una mancuerna en cada mano, acuéstate en un banco inclinado a no más de 30°.","Estira los brazos sobre ti con los codos levemente flectados.","Gira las muñecas para que las palmas miren hacia ti, con los meñiques juntos. Esta es la posición inicial.","Inspirando, baja lento los brazos hacia los lados mientras giras las muñecas; al final los brazos quedan a los costados con las palmas hacia el techo.","Botando el aire, vuelve por el mismo camino girando las manos hasta juntar de nuevo los meñiques. Solo se mueven hombros y muñecas; el codo no cambia.","Repite las repeticiones indicadas."],"en":"Incline Dumbbell Flyes","ines":1,"f":"push","m":"c","sec":["hombros"]},"fdb-Incline_Dumbbell_Flyes_-_With_A_Twist":{"nombre":"Aperturas inclinadas con mancuernas y giro","grupos":["pectoral"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Con una mancuerna en cada mano, acuéstate en un banco inclinado a no más de 30°.","Estira los brazos sobre ti con los codos levemente flectados.","Gira las muñecas para que las palmas miren hacia ti, con los meñiques juntos. Esta es la posición inicial.","Inspirando, baja lento los brazos hacia los lados mientras giras las muñecas; al final los brazos quedan a los costados con las palmas hacia el techo.","Botando el aire, vuelve por el mismo camino girando las manos hasta juntar de nuevo los meñiques. Solo se mueven hombros y muñecas; el codo no cambia.","Repite las repeticiones indicadas."],"en":"Incline Dumbbell Flyes - With A Twist","ines":1,"f":"push","m":"c","sec":["hombros"]},"fdb-Incline_Dumbbell_Press":{"nombre":"Press inclinado con mancuernas","grupos":["pectoral"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en un banco inclinado con una mancuerna en cada mano sobre los muslos, palmas enfrentadas.","Ayudándote con los muslos, súbelas una a una hasta sostenerlas al ancho de hombros.","Gira las muñecas para que las palmas miren hacia tus pies. Esta es la posición inicial.","Con control total, bota el aire y empuja con el pecho.","Bloquea arriba, sostén un segundo y baja lento. Idealmente, bajar dura el doble que subir.","Repite las repeticiones indicadas.","Al terminar, apoya las mancuernas en los muslos y luego en el suelo."],"en":"Incline Dumbbell Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Incline_Hammer_Curls":{"nombre":"Curl martillo inclinado","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en un banco inclinado con una mancuerna en cada mano, espalda bien apoyada y pies juntos. Deja las mancuernas colgando a los costados con agarre neutro. Esta es la posición inicial.","Flecta los codos sin mover los brazos.","Sube hasta arriba, pausa y baja lento a la posición inicial."],"en":"Incline Hammer Curls","ines":1,"f":"pull","m":"i"},"fdb-Incline_Inner_Biceps_Curl":{"nombre":"Curl interno inclinado","grupos":["biceps"],"eq":"Mancuernas","niv":"Principiante","cat":"Fuerza","inst":["Con una mancuerna en cada mano, acuéstate en un banco inclinado.","Brazos colgando a los costados con las palmas hacia afuera. Esta es la posición inicial.","Botando el aire, sube las mancuernas hacia afuera y arriba, con los antebrazos en línea con los deltoides laterales, hasta la altura de los hombros y a sus costados, como una pose de doble bíceps.","Tras un segundo arriba, inspira y baja lento por el mismo camino.","Repite las repeticiones indicadas."],"en":"Incline Inner Biceps Curl","ines":1,"m":"i"},"fdb-Incline_Push-Up":{"nombre":"Flexión inclinada","grupos":["pectoral"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["De frente a un banco o plataforma firme, apoya las manos en el borde, algo más separadas que los hombros.","Lleva los pies atrás con brazos y cuerpo rectos; brazos perpendiculares al cuerpo. Con el cuerpo recto, baja el pecho al borde flectando los brazos.","Empuja hasta estirar los brazos. Repite."],"en":"Incline Push-Up","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Incline_Push-Up_Close-Grip":{"nombre":"Flexión inclinada cerrada","grupos":["triceps"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["De frente a una barra Smith o plataforma firme a la altura adecuada.","Apoya las manos juntas en la barra.","Lleva los pies atrás con brazos y cuerpo rectos. Esta es la posición inicial.","Con el cuerpo recto, baja el pecho a la barra flectando los brazos.","Vuelve extendiendo los codos."],"en":"Incline Push-Up Close-Grip","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Incline_Push-Up_Depth_Jump":{"nombre":"Salto en profundidad con flexión inclinada","grupos":["pectoral"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["For this drill you will need a box about 12 inches high, and two thick mats or aerobics steps.","Place the steps just outside of your shoulders, and place your feet on top of the box so that you are in an incline pushup position, your hands just inside the steps. This will be your starting position.","Begin by bending at the elbows to lower your body, quickly reversing position to push your body off of the ground. As you leave the ground, move your hands onto the steps, bending your elbows to absorb the impact.","Repeat the motion to return to the starting position."],"en":"Incline Push-Up Depth Jump","f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Incline_Push-Up_Medium":{"nombre":"Flexión inclinada agarre medio","grupos":["pectoral"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["De frente a una barra Smith o plataforma firme a la altura adecuada.","Apoya las manos en la barra al ancho de hombros.","Lleva los pies atrás con brazos y cuerpo rectos. Esta es la posición inicial.","Con el cuerpo recto, baja el pecho a la barra flectando los brazos.","Vuelve extendiendo los codos."],"en":"Incline Push-Up Medium","ines":1,"f":"push","m":"c","sec":["core","hombros","triceps"]},"fdb-Incline_Push-Up_Reverse_Grip":{"nombre":"Flexión inclinada agarre supino","grupos":["pectoral"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["De frente a una barra Smith o plataforma firme a la altura adecuada.","Apoya las manos en la barra con las palmas hacia arriba, al ancho de hombros.","Lleva los pies atrás con brazos y cuerpo rectos. Esta es la posición inicial.","Con el cuerpo recto, baja el pecho a la barra flectando los brazos.","Vuelve extendiendo los codos."],"en":"Incline Push-Up Reverse Grip","ines":1,"f":"push","m":"c","sec":["core","hombros","triceps"]},"fdb-Incline_Push-Up_Wide":{"nombre":"Flexión inclinada abierta","grupos":["pectoral"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["De frente a una barra Smith o plataforma firme a la altura adecuada.","Apoya las manos en la barra, más separadas que los hombros.","Lleva los pies atrás con brazos y cuerpo rectos; brazos perpendiculares al cuerpo. Esta es la posición inicial.","Con el cuerpo recto, baja el pecho a la barra flectando los brazos.","Vuelve extendiendo los codos."],"en":"Incline Push-Up Wide","ines":1,"f":"push","m":"c","sec":["core","hombros","triceps"]},"fdb-Intermediate_Groin_Stretch":{"nombre":"Estiramiento de ingle intermedio","grupos":["isquios"],"eq":"Otro","niv":"Intermedio","cat":"Elongación","inst":["Lie on your back with your legs extended. Loop a belt, rope, or band around one of your feet, and swing that leg as far to the side as you can. This will be your starting position.","Pull gently on the belt to create tension in your groin and hamstring muscles. Hold for 10-20 seconds, and repeat on the other side."],"en":"Intermediate Groin Stretch","f":"static","m":"i"},"fdb-Intermediate_Hip_Flexor_and_Quad_Stretch":{"nombre":"Estiramiento de flexor de cadera y cuádriceps intermedio","grupos":["cuadriceps"],"eq":"Otro","niv":"Intermedio","cat":"Elongación","inst":["Lie face down on the floor, with a rope, belt, or band looped around one foot.","Flex the knee and extend the hip of the leg to be stretched, using both hands to pull on the belt. Your knee and your hip should come off of the floor, creating tension in the hip flexors and quadriceps. Hold the stretch for 10-20 seconds, and repeat on the other leg."],"en":"Intermediate Hip Flexor and Quad Stretch","f":"static","m":"c"},"fdb-Internal_Rotation_with_Band":{"nombre":"Rotación interna con banda","grupos":["hombros"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Amarra la banda a un poste a la altura del codo. Párate con el lado derecho hacia la banda, a unos 60 cm.","Toma el extremo con la mano derecha y mantén el codo pegado al costado; ayuda sujetar una toalla o foam roller con el codo.","Con el codo flectado a 90°, la mano apunta hacia afuera del torso. Esta es la posición inicial.","Rota el brazo hacia adentro, como un drive de tenis, sin mover el codo.","Llega lo más lejos que puedas, pausa y vuelve a la posición inicial."],"en":"Internal Rotation with Band","ines":1,"m":"i"},"fdb-Inverted_Row":{"nombre":"Remo invertido","grupos":["dorsales"],"eq":"","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra en el rack a la altura de la cintura (o usa una Smith).","Tómala con agarre más ancho que los hombros y cuelga bajo ella, cuerpo recto, talones en el suelo y brazos estirados. Esta es la posición inicial.","Flecta los codos llevando el pecho a la barra y juntando las escápulas.","Pausa arriba y vuelve a la posición inicial.","Repite las repeticiones indicadas."],"en":"Inverted Row","ines":1,"f":"pull","m":"c"},"fdb-Inverted_Row_with_Straps":{"nombre":"Remo invertido con correas","grupos":["dorsales"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Cuelga una cuerda o correas de suspensión de un rack u otro soporte firme. Toma los extremos y cuelga boca arriba, cuerpo recto, talones en el suelo y brazos estirados. Esta es la posición inicial.","Flecta los codos llevando el pecho a las manos y juntando las escápulas.","Pausa arriba y vuelve a la posición inicial.","Repite las repeticiones indicadas."],"en":"Inverted Row with Straps","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Iron_Cross":{"nombre":"Cruz de hierro","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":[],"en":"Iron Cross","f":"push","m":"c","sec":["cuadriceps","espalda_baja","gluteos","isquios","pectoral","trapecio"]},"fdb-Iron_Crosses_stretch":{"nombre":"Cruz de hierro (estiramiento)","grupos":["cuadriceps"],"eq":"","niv":"Intermedio","cat":"Elongación","inst":["Lie face down on the floor, with your arms extended out to your side, palms pressed to the floor. This will be your starting position.","To begin, flex one knee and bring that leg across the back of your body, attempting to touch it to the ground near the opposite hand.","Promptly return the leg to the starting postion, and quickly repeat with the other leg. Continue alternating for 10-20 repetitions."],"en":"Iron Crosses (stretch)","f":"pull","m":"c"},"fdb-Isometric_Chest_Squeezes":{"nombre":"Apretón isométrico de pecho","grupos":["pectoral"],"eq":"Peso corporal","niv":"Principiante","cat":"Pliometría","inst":["While either seating or standing, bend your arms at a 90-degree angle and place the palms of your hands together in front of your chest. Tip: Your hands should be open with the palms together and fingers facing forward (perpendicular to your torso).","Push both hands against each other as you contract your chest. Start with slow tension and increase slowly. Keep breathing normally as you execute this contraction.","Hold for the recommended number of seconds.","Now release the tension slowly.","Rest for the recommended amount of time and repeat."],"en":"Isometric Chest Squeezes","f":"static","m":"c","sec":["hombros","triceps"]},"fdb-Isometric_Neck_Exercise_-_Front_And_Back":{"nombre":"Isométrico de cuello frente y atrás","grupos":["cuello"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Con la cabeza y el cuello en posición neutra, mirando al frente, pon ambas manos en la frente.","Empuja suave hacia adelante contrayendo el cuello pero sin dejar que la cabeza se mueva. Parte con poca tensión y auméntala de a poco, respirando normal.","Sostén los segundos indicados.","Suelta la tensión lentamente.","Descansa y repite con las manos detrás de la cabeza."],"en":"Isometric Neck Exercise - Front And Back","ines":1,"f":"static","m":"i"},"fdb-Isometric_Neck_Exercise_-_Sides":{"nombre":"Isométrico de cuello lateral","grupos":["cuello"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Con la cabeza y el cuello en posición neutra, mirando al frente, pon la mano izquierda en el lado izquierdo de la cabeza.","Empuja suave hacia la izquierda contrayendo el cuello pero sin dejar que la cabeza se mueva. Parte con poca tensión y auméntala de a poco, respirando normal.","Sostén los segundos indicados.","Suelta la tensión lentamente.","Descansa y repite con la mano derecha en el lado derecho."],"en":"Isometric Neck Exercise - Sides","ines":1,"f":"static","m":"i"},"fdb-Isometric_Wipers":{"nombre":"Limpiaparabrisas isométrico","grupos":["pectoral"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Ponte en posición de flexión de brazos, cuerpo recto y manos un poco más separadas que los hombros. Esta es la posición inicial.","Lleva el peso del cuerpo lo más posible hacia un lado, flectando ese codo y bajando.","Vuelve extendiendo ese brazo y baja hacia el otro lado.","Repite las repeticiones indicadas."],"en":"Isometric Wipers","ines":1,"f":"push","m":"c","sec":["core","hombros","triceps"]},"fdb-JM_Press":{"nombre":"Press JM","grupos":["triceps"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Empieza como en una banca cerrada: acostado con la barra sobre ti, brazos estirados y codos adentro, pero con la barra justo sobre la parte alta del pecho. Esta es la posición inicial.","Baja la barra como en una extensión de tríceps acostado, inspirando. A mitad de camino, deja que la barra retroceda unos 2-3 cm llevando los brazos hacia las piernas hasta que queden perpendiculares al torso, sin cambiar el ángulo del codo.","Botando el aire, empuja la barra con los tríceps como en una banca cerrada.","Vuelve a la posición inicial y repite.","Repite las repeticiones indicadas."],"en":"JM Press","ines":1,"f":"push","m":"c","sec":["hombros","pectoral"]},"fdb-Jackknife_Sit-Up":{"nombre":"Abdominal navaja","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate de espaldas con brazos y piernas estirados, los brazos detrás de la cabeza. Esta es la posición inicial.","Botando el aire, flecta la cadera subiendo piernas y brazos a la vez hasta juntarlos en forma de navaja. Las piernas suben estiradas unos 35-45° y los brazos quedan paralelos a ellas, con el tronco despegado del suelo.","Inspirando, baja brazos y piernas a la posición inicial.","Repite las repeticiones indicadas."],"en":"Jackknife Sit-Up","ines":1,"f":"pull","m":"c"},"fdb-Janda_Sit-Up":{"nombre":"Abdominal Janda","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en posición de abdominal: rodillas a 90°, pies apoyados y brazos cruzados sobre el pecho o a los lados. Esta es la posición inicial.","Aprieta fuerte glúteos e isquiotibiales, llena los pulmones y sube lento (3-6 segundos) botando el aire. Apretar glúteos e isquiotibiales inhibe los flexores de cadera por inhibición recíproca.","Inspirando, baja lento y controlado a la posición inicial.","Repite las repeticiones indicadas."],"en":"Janda Sit-Up","ines":1,"f":"pull","m":"i"},"fdb-Jefferson_Squats":{"nombre":"Sentadilla Jefferson","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Pon una barra en el suelo.","Párate a horcajadas sobre el centro de la barra, a lo largo.","Flecta las rodillas con la espalda recta y toma la parte delantera de la barra con la mano derecha, en agarre neutro.","Toma la parte trasera con la mano izquierda, también en agarre neutro. El torso queda al centro de la barra, con ambas manos a la misma distancia de él.","Ponte de pie con la carga, pies al ancho de hombros y puntas levemente afuera.","Baja en sentadilla con la espalda recta hasta que los muslos queden paralelos al suelo, con el torso lo más vertical posible y la cabeza arriba, inspirando.","Sube empujando con los pies. Los brazos solo hacen de ganchos, estirados; el trabajo lo hacen las piernas."],"en":"Jefferson Squats","ines":1,"f":"push","m":"c","sec":["espalda_baja","gemelos","gluteos","isquios","trapecio"]},"fdb-Jerk_Balance":{"nombre":"Equilibrio de envión","grupos":["hombros"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Este ejercicio te enseña a bajar lo suficiente en el envión y corrige a quienes se van hacia atrás. Empieza con la barra en posición de envión, hombros adelante, torso erguido y pies levemente en tijera.","Inicia como un envión normal: flecta las rodillas con el torso vertical y empuja con fuerza, usando el impulso y no los brazos para subir la barra.","Mantén el pie de atrás fijo y úsalo para impulsar el cuerpo adelante hasta una tijera completa mientras subes la barra. Recupera quedando de pie con la barra arriba."],"en":"Jerk Balance","ines":1,"f":"push","m":"c","sec":["cuadriceps","gluteos","isquios","triceps"]},"fdb-Jerk_Dip_Squat":{"nombre":"Sentadilla de dip de envión","grupos":["cuadriceps"],"eq":"Barra","niv":"Intermedio","cat":"Halterofilia","inst":["Este ejercicio fortalece el dip del envión. Empieza con la barra en posición de envión, hombros adelante formando un apoyo y la barra rozando la garganta. Pies bajo la cadera con las puntas como te acomode.","Con el torso vertical, flecta las rodillas dejándolas avanzar sin llevar la cadera atrás, sin bajar demasiado. Vuelve a la posición inicial empujando con fuerza con los pies."],"en":"Jerk Dip Squat","ines":1,"f":"push","m":"c","sec":["core","gemelos"]},"fdb-Jogging_Treadmill":{"nombre":"Trote en trotadora","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Cardio","inst":["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than jogging outside. A 150 lb person will burn almost 250 calories jogging for 30 minutes, compared to more than 450 calories running. Maintain proper posture as you jog, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."],"en":"Jogging, Treadmill","sec":["gluteos","isquios"]},"fdb-Keg_Load":{"nombre":"Carga de barriles","grupos":["espalda_baja"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["Pon los barriles a cierta distancia de la plataforma, típicamente 10-15 m.","Toma el asa cercana del primer barril, inclínalo de lado y toma el borde opuesto de la base. Súbelo al pecho.","Mientras más alto lo lleves, más rápido llegarás. Normalmente no se permite llevarlo al hombro. Sujétalo firme, muévete lo más rápido posible hasta la plataforma y cárgalo extendiendo cadera, rodillas y tobillos.","Vuelve por el siguiente barril y repite hasta terminar."],"en":"Keg Load","ines":1,"f":"pull","m":"c","sec":["antebrazos","biceps","core","cuadriceps","dorsales","gemelos","gluteos","hombros","isquios","trapecio"]},"fdb-Kettlebell_Arnold_Press":{"nombre":"Press Arnold con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Haz clean de una kettlebell al hombro extendiendo piernas y cadera, con la palma hacia adentro.","Mirando al frente, empuja la kettlebell hacia arriba girando la muñeca para que arriba la palma mire al frente.","Vuelve a la posición inicial con la palma hacia adentro."],"en":"Kettlebell Arnold Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Kettlebell_Dead_Clean":{"nombre":"Dead clean con kettlebell","grupos":["isquios"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon la kettlebell entre los pies. Lleva la cadera atrás y mira al frente.","Haz clean al hombro extendiendo piernas y cadera, girando la muñeca al recibirla.","Bájala con la espalda recta y la cadera atrás, manteniendo los isquiotibiales cargados."],"en":"Kettlebell Dead Clean","ines":1,"f":"pull","m":"c","sec":["cuadriceps","espalda_baja","gemelos","gluteos","trapecio"]},"fdb-Kettlebell_Figure_8":{"nombre":"Ocho con kettlebell","grupos":["core"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon una kettlebell entre las piernas, con los pies más separados que los hombros. Inclínate llevando la cadera atrás y con la espalda plana.","Toma la kettlebell y pásala a la otra mano entre las piernas; la mano que recibe entra por detrás de la pierna. Ve y vuelve por varias repeticiones."],"en":"Kettlebell Figure 8","ines":1,"f":"pull","sec":["hombros","isquios"]},"fdb-Kettlebell_Halo":{"nombre":"Halo con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Principiante","cat":"Fuerza","inst":["De pie, pies al ancho de cadera. Sostén una kettlebell invertida por los cuernos, con la bola sobre las manos y cerca del pecho. Activa el abdomen y aprieta los glúteos para mantener las costillas abajo. Esta es la posición inicial.","Con los codos cerca de la cabeza, lleva la kettlebell por un lado de la cabeza, pasando la oreja, hasta detrás de la cabeza.","Sigue el círculo por la otra oreja y vuelve frente al pecho, siempre con la kettlebell cerca del cuerpo.","Completa los círculos indicados hacia un lado y repite la misma cantidad hacia el otro.","Muévete lento con la cabeza, la cadera y la zona lumbar quietas. Si la zona lumbar se arquea o la kettlebell se aleja de la cabeza, usa menos carga."],"en":"Kettlebell Halo","ines":1,"m":"c","sec":["core","dorsales","trapecio","triceps"]},"fdb-Kettlebell_Halo_With_Overhead_Extension":{"nombre":"Halo con kettlebell y extensión sobre la cabeza","grupos":["hombros","triceps"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["De pie, pies al ancho de cadera. Sostén una kettlebell invertida por los cuernos, cerca del pecho. Activa el abdomen y aprieta los glúteos. Esta es la posición inicial.","Con los codos cerca de la cabeza, lleva la kettlebell por un lado hasta detrás de la cabeza. Pausa ahí.","Desde ahí, extiende los codos empujando la kettlebell sobre la cabeza hasta estirar los brazos, con los brazos junto a la cabeza.","Flecta los codos para volver controlado a la posición detrás de la cabeza.","Sigue el círculo por la otra oreja hasta volver frente al pecho. Eso es una repetición.","Alterna el sentido del círculo en cada repetición. Cabeza, cadera y zona lumbar quietas; si te arqueas o no llegas arriba sin inclinarte, usa menos carga o haz el halo y la extensión por separado."],"en":"Kettlebell Halo with Overhead Extension","ines":1,"f":"push","m":"c","sec":["core","dorsales","trapecio"]},"fdb-Kettlebell_Hang_Clean":{"nombre":"Clean colgado con kettlebell","grupos":["isquios"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon la kettlebell entre los pies. Lleva la cadera atrás y mira al frente.","Haz clean al hombro extendiendo piernas y cadera, girando la muñeca al recibirla.","Bájala hasta que cuelgue entre las piernas, con los isquiotibiales cargados y la cabeza siempre arriba."],"en":"Kettlebell Hang Clean","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gemelos","gluteos","hombros","trapecio"]},"fdb-Kettlebell_One-Legged_Deadlift":{"nombre":"Peso muerto a una pierna con kettlebell","grupos":["isquios"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Toma una kettlebell por el mango con una mano y párate sobre la pierna del mismo lado.","Con esa rodilla levemente flectada, haz un peso muerto a piernas rígidas flectando la cadera y estirando la pierna libre atrás para equilibrarte.","Baja hasta quedar paralelo al suelo y vuelve a quedar de pie."],"en":"Kettlebell One-Legged Deadlift","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gluteos"]},"fdb-Kettlebell_Overhead_Triceps_Extension":{"nombre":"Extensión de tríceps sobre la cabeza con kettlebell","grupos":["triceps"],"eq":"Kettlebell","niv":"Principiante","cat":"Fuerza","inst":["De pie, pies al ancho de cadera, toma una kettlebell por los cuernos con ambas manos. Llévala sobre la cabeza hasta estirar los brazos, con la bola colgando detrás de las manos.","Activa el abdomen y mantén los brazos verticales y cerca de la cabeza. Esta es la posición inicial.","Flecta los codos bajando la kettlebell detrás de la cabeza hasta donde tu movilidad lo permita sin abrir los codos.","Extiende los codos para volver a la posición inicial, sin mover los brazos.","Mantén las costillas abajo y no arquees la zona lumbar al extender."],"en":"Kettlebell Overhead Triceps Extension","ines":1,"f":"push","m":"i","sec":["core","hombros"]},"fdb-Kettlebell_Pass_Between_The_Legs":{"nombre":"Pase de kettlebell entre las piernas","grupos":["core"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon una kettlebell entre las piernas con una postura cómoda. Inclínate llevando la cadera atrás y con la espalda plana.","Toma la kettlebell y pásala a la otra mano entre las piernas, dibujando una “W”. Ve y vuelve por varias repeticiones."],"en":"Kettlebell Pass Between The Legs","ines":1,"f":"pull","m":"c","sec":["gluteos","hombros","isquios"]},"fdb-Kettlebell_Pirate_Ships":{"nombre":"Barco pirata con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Principiante","cat":"Fuerza","inst":["Con los pies bien separados, sostén una kettlebell con ambas manos, colgando a la altura de la cintura con los brazos estirados. Esta es la posición inicial.","Gira hacia un lado balanceando la kettlebell hasta la altura de la cabeza. Pausa breve arriba.","Déjala caer mientras rotas al otro lado y súbela de nuevo a la altura de la cabeza.","Repite las repeticiones indicadas."],"en":"Kettlebell Pirate Ships","ines":1,"f":"push","m":"c","sec":["core"]},"fdb-Kettlebell_Pistol_Squat":{"nombre":"Sentadilla pistol con kettlebell","grupos":["cuadriceps"],"eq":"Kettlebell","niv":"Avanzado","cat":"Fuerza","inst":["Toma una kettlebell por los cuernos con ambas manos. Despega una pierna del suelo y haz la sentadilla con la otra.","Baja flectando la rodilla y llevando la cadera atrás, con la kettlebell frente a ti.","Sostén un segundo abajo y sube empujando con el talón, con cabeza y pecho arriba.","Vuelve a bajar y repite."],"en":"Kettlebell Pistol Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","hombros","isquios"]},"fdb-Kettlebell_Seated_Press":{"nombre":"Press sentado con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Siéntate en el suelo con las piernas abiertas cómodamente.","Haz clean de una kettlebell al hombro.","Empújala arriba y afuera hasta bloquearla sobre la cabeza. Vuelve a la posición inicial."],"en":"Kettlebell Seated Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Kettlebell_Seesaw_Press":{"nombre":"Press balancín con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Haz clean de dos kettlebells a los hombros.","Empuja una sobre la cabeza.","Bájala y empuja de inmediato la otra. Haz la misma cantidad de repeticiones por lado."],"en":"Kettlebell Seesaw Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Kettlebell_Sumo_High_Pull":{"nombre":"Remo alto sumo con kettlebell","grupos":["trapecio"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon una kettlebell en el suelo entre los pies, con los pies bien separados, y tómala con ambas manos. Lleva la cadera atrás lo más posible con las rodillas flectadas, pecho y cabeza arriba. Esta es la posición inicial.","Extiende cadera y rodillas mientras tiras la kettlebell hasta los hombros, subiendo los codos. Vuelve a la posición inicial."],"en":"Kettlebell Sumo High Pull","ines":1,"f":"pull","m":"c","sec":["aductores","cuadriceps","gluteos","hombros","isquios"]},"fdb-Kettlebell_Thruster":{"nombre":"Thruster con kettlebell","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Haz clean de dos kettlebells a los hombros extendiendo piernas y cadera, girando las muñecas al recibirlas. Esta es la posición inicial.","Baja en sentadilla flectando cadera y rodillas, con la cadera entre las piernas y la espalda recta y erguida, lo más profundo que puedas.","Abajo, sube extendiendo rodillas y cadera empujando con los talones, y aprovecha el impulso para empujar ambas kettlebells sobre la cabeza.","Al iniciar la siguiente repetición, vuelve las kettlebells a los hombros."],"en":"Kettlebell Thruster","ines":1,"f":"push","m":"c","sec":["cuadriceps","triceps"]},"fdb-Kettlebell_Turkish_Get-Up_Lunge_style":{"nombre":"Turkish get-up con kettlebell (estilo zancada)","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate de espaldas y empuja una kettlebell arriba extendiendo el codo. Flecta la rodilla del mismo lado.","Con la kettlebell siempre bloqueada, gira hacia el lado contrario y apóyate en el brazo libre para impulsarte. Pasa a sentado y luego a una rodilla, en posición de zancada.","Mirando la kettlebell, ponte de pie lentamente. Deshaz el movimiento hasta la posición inicial y repite."],"en":"Kettlebell Turkish Get-Up (Lunge style)","ines":1,"f":"push","m":"c","sec":["core","cuadriceps","isquios","triceps"]},"fdb-Kettlebell_Turkish_Get-Up_Squat_style":{"nombre":"Turkish get-up con kettlebell (estilo sentadilla)","grupos":["hombros"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate de espaldas y empuja una kettlebell arriba extendiendo el codo. Flecta la rodilla del mismo lado.","Con la kettlebell siempre bloqueada, gira hacia el lado contrario y apóyate en el brazo libre para impulsarte.","Con la mano libre, pasa a sentado y luego a cuclillas sobre los pies. Mirando la kettlebell, ponte de pie lentamente. Deshaz el movimiento y repite."],"en":"Kettlebell Turkish Get-Up (Squat style)","ines":1,"f":"push","m":"c","sec":["core","cuadriceps","gemelos","isquios","triceps"]},"fdb-Kettlebell_Windmill":{"nombre":"Molino con kettlebell","grupos":["core"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Pon una kettlebell delante del pie de adelante y haz clean y press con el brazo contrario: extiende piernas y cadera para llevarla al hombro girando la muñeca, y empújala arriba extendiendo el codo.","Con la kettlebell siempre bloqueada, empuja la cadera hacia el lado del brazo que la sostiene y gira los pies unos 45° respecto de ese brazo. Flectando la cadera, inclínate lento hasta tocar el suelo con la mano libre, siempre mirando la kettlebell.","Pausa un segundo abajo y vuelve a la posición inicial."],"en":"Kettlebell Windmill","ines":1,"f":"pull","m":"c","sec":["gluteos","hombros","isquios","triceps"]},"fdb-Kipping_Muscle_Up":{"nombre":"Muscle up con kipping","grupos":["dorsales"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Toma las argollas con agarre falso, con la base de las palmas sobre ellas.","Inicia balanceando levemente las piernas hacia atrás.","Contrarresta llevando las piernas adelante y arriba, tirando mentón y pecho hacia atrás y subiendo con ambos brazos. Arriba, lleva las argollas a las axilas mientras rotas los hombros hacia adelante y los codos van atrás; eso te deja en posición para el fondo.","Con control y estabilidad, extiende los codos para completar el movimiento.","Baja al suelo con cuidado."],"en":"Kipping Muscle Up","ines":1,"f":"pull","m":"c","sec":["antebrazos","biceps","core","hombros","trapecio","triceps"]},"fdb-Knee_Across_The_Body":{"nombre":"Rodilla cruzando el cuerpo","grupos":["gluteos"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Lie down on the floor with your right leg straight. Bend your left leg and lower it across your body, holding the knee down toward the floor with your right hand. (The knee doesn't need to touch the floor if you're tight.)","Place your left arm comfortably beside you and turn your head to the left. Imagine you have a weight tied to your tailbone. let your tailbone fall back toward the floor as your chest reaches in the opposite direction to stretch your lower back. Switch sides."],"en":"Knee Across The Body","f":"static","sec":["abductores","espalda_baja"]},"fdb-Knee_Circles":{"nombre":"Círculos de rodilla","grupos":["gemelos"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["Stand with your legs together and hands by your waist.","Now move your knees in a circular motion as you breathe normally.","Repeat for the recommended amount of repetitions."],"en":"Knee Circles","f":"pull","m":"c","sec":["cuadriceps","isquios"]},"fdb-Knee_Hip_Raise_On_Parallel_Bars":{"nombre":"Elevación de rodillas en paralelas","grupos":["core"],"eq":"Otro","niv":"Principiante","cat":"Fuerza","inst":["Ubícate en la silla de elevación de piernas con los antebrazos en los cojines y las manos en los agarres, codos a 90°.","Torso recto, zona lumbar apoyada en el respaldo y piernas estiradas hacia el suelo. Esta es la posición inicial.","Botando el aire, sube las piernas estiradas hasta que queden más o menos paralelas al suelo. Sostén un segundo, sin impulso ni balanceo.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Knee/Hip Raise On Parallel Bars","ines":1,"f":"pull","m":"i"},"fdb-Knee_Tuck_Jump":{"nombre":"Salto recogiendo rodillas","grupos":["isquios"],"eq":"Peso corporal","niv":"Principiante","cat":"Pliometría","inst":["Begin in a comfortable standing position with your knees slightly bent. Hold your hands in front of you, palms down with your fingertips together at chest height. This will be your starting position.","Rapidly dip down into a quarter squat and immediately explode upward. Drive the knees towards the chest, attempting to touch them to the palms of the hands.","Jump as high as you can, raising your knees up, and then ensure a good land be re-extending your legs, absorbing impact through be allowing the knees to rebend."],"en":"Knee Tuck Jump","f":"push","m":"c","sec":["abductores","aductores","cuadriceps","gemelos","gluteos"]},"fdb-Kneeling_Arm_Drill":{"nombre":"Braceo de rodillas","grupos":["hombros"],"eq":"","niv":"Principiante","cat":"Pliometría","inst":["This drill helps increase arm efficiency during the run. Begin kneeling, left foot in front, right knee down. Apply pressure through the front heel to keep your glutes and hamstrings activated.","Begin by blocking the arms in long, pendulum like swings. Close the arm angle, blocking with the arms as you would when jogging, progressing to a run and finally a sprint.","As soon as your hands pass the hip, accelerate them forward during the sprinting motion to move them as quickly as possible.","Switch knees and repeat."],"en":"Kneeling Arm Drill","f":"pull","sec":["core"]},"fdb-Kneeling_Cable_Crunch_With_Alternating_Oblique_Twists":{"nombre":"Crunch en polea arrodillado con giros oblicuos","grupos":["core"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon una cuerda en una polea alta y una colchoneta frente a ella.","Toma la cuerda con ambas manos y arrodíllate a unos 60 cm de la torre.","Lleva la cuerda detrás de la cabeza con las manos junto a las orejas.","Con las manos fijas, contrae el abdomen y tira hacia abajo en un crunch hasta que los codos lleguen a las rodillas.","Pausa abajo y sube lento y controlado.","Repite, pero a mitad de camino gira llevando un codo a la rodilla contraria.","Pausa abajo y sube lento y controlado.","Repite girando hacia el otro lado.","Sigue esta secuencia hasta el fallo."],"en":"Kneeling Cable Crunch With Alternating Oblique Twists","ines":1,"f":"pull","m":"i"},"fdb-Kneeling_Cable_Triceps_Extension":{"nombre":"Extensión de tríceps en polea arrodillado","grupos":["triceps"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Pon un banco de lado frente a una polea alta.","Toma una barra recta sobre la cabeza con las manos separadas unos 15 cm y palmas hacia abajo.","De espaldas a la máquina, arrodíllate.","Apoya la cabeza y la parte de atrás de los brazos en el banco, codos flectados y antebrazos apuntando a la polea. Esta es la posición inicial.","Con los brazos junto a la cabeza y los codos adentro, empuja la barra en semicírculo hasta bloquear los codos, con los brazos paralelos al suelo. Aprieta fuerte un segundo, botando el aire.","Vuelve lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Kneeling Cable Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Kneeling_Forearm_Stretch":{"nombre":"Estiramiento de antebrazo arrodillado","grupos":["antebrazos"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Start by kneeling on a mat with your palms flat and your fingers pointing back toward your knees.","Slowly lean back keeping your palms flat on the floor until you feel a stretch in your wrists and forearms. Hold for 20-30 seconds."],"en":"Kneeling Forearm Stretch","f":"static","m":"i"},"fdb-Kneeling_High_Pulley_Row":{"nombre":"Remo en polea alta arrodillado","grupos":["dorsales"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Elige la carga en una polea sobre tu cabeza y pon una cuerda. Arrodíllate a unos 60 cm, sosteniendo la cuerda al frente con los brazos estirados. Esta es la posición inicial.","Flecta los codos y junta completamente las escápulas, tirando la cuerda hacia la parte alta del pecho con los codos afuera.","Tras una breve pausa, vuelve lento a la posición inicial."],"en":"Kneeling High Pulley Row","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Kneeling_Hip_Flexor":{"nombre":"Flexor de cadera arrodillado","grupos":["cuadriceps"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Kneel on a mat and bring your right knee up so the bottom of your foot is on the floor and extend your left leg out behind you so the top of your foot is on the floor.","Shift your weight forward until you feel a stretch in your hip. Hold for 15 seconds, then repeat for your other side."],"en":"Kneeling Hip Flexor","f":"static","m":"i"},"fdb-Kneeling_Jump_Squat":{"nombre":"Sentadilla con salto desde rodillas","grupos":["gluteos"],"eq":"Barra","niv":"Avanzado","cat":"Halterofilia","inst":["Arrodíllate en el suelo con una barra en la parte alta de la espalda, o solo con tu peso corporal. Hacerlo dentro de un rack facilita sacar la barra.","Lleva la cadera atrás hasta que los glúteos toquen los pies, con cabeza y pecho arriba.","Explota con la cadera generando suficiente potencia para caer con los pies planos en el suelo.","Sigue con la sentadilla empujando con los talones y extendiendo las rodillas hasta quedar de pie."],"en":"Kneeling Jump Squat","ines":1,"f":"push","m":"c","sec":["cuadriceps","gemelos","isquios"]},"fdb-Kneeling_Single-Arm_High_Pulley_Row":{"nombre":"Remo a una mano en polea alta arrodillado","grupos":["dorsales"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un agarre simple en una polea alta y elige la carga.","Arrodíllate frente a la torre y toma el cable con una mano, brazo estirado. Esta es la posición inicial.","Con la palma al frente, tira hacia el torso flectando el codo y juntando la escápula, girando la muñeca para que al final la palma mire hacia ti.","Tras una breve pausa, vuelve a la posición inicial."],"en":"Kneeling Single-Arm High Pulley Row","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Kneeling_Squat":{"nombre":"Sentadilla de rodillas","grupos":["gluteos"],"eq":"Barra","niv":"Intermedio","cat":"Powerlifting","inst":["Ajusta la barra a la altura adecuada en el rack. Arrodíllate detrás de ella (una colchoneta protege las rodillas) y métete debajo apoyándola en la parte alta de la espalda, con las escápulas juntas y la barra firme. Sácala del rack.","Mirando al frente, lleva la cadera atrás hasta tocar las pantorrillas.","Vuelve a erguir el torso."],"en":"Kneeling Squat","ines":1,"f":"push","m":"c","sec":["core","espalda_baja","isquios"]},"fdb-Landmine_180s":{"nombre":"Landmine 180","grupos":["core"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra en un landmine o fíjala bien en una esquina, cargada adecuadamente.","Levanta el extremo hasta la altura de los hombros con ambas manos y los brazos estirados al frente, pies bien separados. Esta es la posición inicial.","Rota tronco y cadera llevando la barra hasta abajo hacia un lado, siempre con los brazos estirados.","Invierte el movimiento llevándola hasta el otro lado.","Alterna hasta completar la serie."],"en":"Landmine 180's","ines":1,"f":"pull","m":"c","sec":["espalda_baja","gluteos","hombros"]},"fdb-Landmine_Linear_Jammer":{"nombre":"Landmine jammer lineal","grupos":["hombros"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Pon una barra en un landmine (o fíjala bien en una esquina), cárgala y ponle el agarre.","Levanta los agarres hasta los hombros. Esta es la posición inicial.","En postura atlética, baja en sentadilla llevando la cadera atrás, con los brazos flectados.","Extiende con potencia cadera, rodillas y tobillos mientras estiras los brazos, de forma explosiva.","Vuelve a la posición inicial."],"en":"Landmine Linear Jammer","ines":1,"f":"push","m":"c","sec":["core","cuadriceps","gemelos","isquios","pectoral","triceps"]},"fdb-Lateral_Bound":{"nombre":"Salto lateral","grupos":["aductores"],"eq":"Peso corporal","niv":"Principiante","cat":"Pliometría","inst":["Assume a half squat position facing 90 degrees from your direction of travel. This will be your starting position.","Allow your lead leg to do a countermovement inward as you shift your weight to the outside leg.","Immediately push off and extend, attempting to bound to the side as far as possible.","Upon landing, immediately push off in the opposite direction, returning to your original start position.","Continue back and forth for several repetitions."],"en":"Lateral Bound","f":"push","m":"c","sec":["abductores","cuadriceps","gemelos","gluteos","isquios"]},"fdb-Lateral_Box_Jump":{"nombre":"Salto lateral al cajón","grupos":["aductores"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Assume a comfortable standing position, with a short box positioned next to you. This will be your starting position.","Quickly dip into a quarter squat to initiate the stretch reflex, and immediately reverse direction to jump up and to the side.","Bring your knees high enough to ensure your feet have good clearance over the box.","Land on the center of the box, using your legs to absorb the impact.","Carefully jump down to the other side of the box, and continue going back and forth for several repetitions."],"en":"Lateral Box Jump","f":"push","m":"c","sec":["abductores","cuadriceps","gemelos","gluteos","isquios"]},"fdb-Lateral_Cone_Hops":{"nombre":"Saltos laterales sobre conos","grupos":["aductores"],"eq":"Otro","niv":"Principiante","cat":"Pliometría","inst":["Position a number of cones in a row several feet apart.","Stand next to the end of the cones, facing 90 degrees to the direction of travel. This will be your starting position.","Begin the jump by dipping with the knees to initiate a stretch reflex, and immediately reverse direction to push off the ground, jumping up and sideways over the cone.","Use your legs to absorb impact upon landing, and rebound into the next jump, continuing down the row of cones."],"en":"Lateral Cone Hops","f":"push","m":"c","sec":["abductores","cuadriceps","gemelos","gluteos","isquios"]},"fdb-Lateral_Raise_-_With_Bands":{"nombre":"Elevación lateral con bandas","grupos":["hombros"],"eq":"Bandas","niv":"Principiante","cat":"Fuerza","inst":["Párate sobre una banda de modo que tenga tensión con los brazos estirados. Toma los agarres en prono (palmas hacia los muslos), algo más estrecho que los hombros, a los costados de los muslos. Brazos estirados con leve flexión de codo y espalda recta. Esta es la posición inicial.","Sube los agarres hacia los lados con el deltoides lateral, botando el aire, hasta quedar algo sobre la horizontal. Inclina levemente la mano como si sirvieras agua. Torso quieto; pausa un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Lateral Raise - With Bands","ines":1,"f":"push","m":"i"},"fdb-Latissimus_Dorsi-SMR":{"nombre":"Dorsal ancho con foam roller","grupos":["dorsales"],"eq":"Foam roller","niv":"Principiante","cat":"Elongación","inst":["While lying on the floor, place a foam roll under your back and to one side, just behind your arm pit. This will be your starting position.","Keep the arm of the side being stretched behind and to the side of you as you shift your weight onto your lats, keeping your upper body off of the ground. Hold for 10-30 seconds, and switch sides."],"en":"Latissimus Dorsi-SMR","f":"static","m":"i"},"fdb-Leg-Over_Floor_Press":{"nombre":"Press en suelo con pierna cruzada","grupos":["pectoral"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate en el suelo con una kettlebell sobre el pecho, tomada por el mango. Cruza la pierna del lado que trabaja sobre la otra. El brazo libre puede ir estirado al lado para apoyarte.","Empuja la kettlebell hasta bloquear el brazo.","Baja hasta que el codo toque el suelo, con la kettlebell sobre el codo. Repite las repeticiones indicadas."],"en":"Leg-Over Floor Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Leg-Up_Hamstring_Stretch":{"nombre":"Estiramiento de isquiotibiales con pierna arriba","grupos":["isquios"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Lie flat on your back, bend one knee, and put that foot flat on the floor to stabilize your spine.","Extend the other leg in the air. If you're tight, you wont be able to straighten it. That's okay. Extend the knee so that the sole of the lifted foot faces the ceiling (or as close as you can get it).","Slowly straighten the legs as much as possible and then pull the leg toward your nose. Switch sides."],"en":"Leg-Up Hamstring Stretch","f":"push","m":"i"},"fdb-Leg_Extensions":{"nombre":"Extensión de piernas","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["En la máquina de extensión de piernas, elige la carga y siéntate con las piernas bajo el cojín (pies al frente) y las manos en los agarres laterales. Ajusta el cojín para que apoye sobre la parte baja de la canilla, justo sobre los pies. Esta es la posición inicial.","Extiende las piernas al máximo con los cuádriceps, botando el aire, sin mover el resto del cuerpo. Pausa un segundo arriba.","Baja lento a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Leg Extensions","ines":1,"f":"push","m":"i"},"fdb-Leg_Lift":{"nombre":"Curl femoral de pie sin máquina","grupos":["gluteos"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["De pie, con los pies al ancho de hombros, afírmate de algo firme como un rack o el respaldo de una silla.","Con o sin tobillera lastrada, sube un pie hacia atrás como en un curl femoral de pie, con la otra pierna estirada. Bota el aire.","Baja lento la pierna al suelo inspirando.","Repite las repeticiones indicadas.","Cambia de pierna."],"en":"Leg Lift","ines":1,"f":"push","m":"i","sec":["isquios"]},"fdb-Leg_Press":{"nombre":"Prensa","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la prensa y apoya los pies en la plataforma al ancho de hombros.","Quita los seguros y empuja la plataforma hasta estirar las piernas, sin bloquear las rodillas. Esta es la posición inicial.","Inspirando, baja lento la plataforma hasta que las rodillas formen unos 90°.","Empuja con todo el pie para volver a la posición inicial, botando el aire.","Repite las repeticiones indicadas y, al terminar, pon bien los seguros: no quieres la plataforma cargada encima."],"en":"Leg Press","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Leg_Pull-In":{"nombre":"Recogida de piernas","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Fuerza","inst":["Acuéstate en una colchoneta con las piernas estiradas y las manos con las palmas abajo, a los lados o bajo los glúteos. Esta es la posición inicial.","Flecta las rodillas y lleva los muslos hacia el abdomen botando el aire, hasta que las rodillas lleguen a la altura del pecho. Contrae el abdomen y sostén un segundo. Las canillas se mantienen paralelas al suelo.","Vuelve a la posición inicial inspirando.","Repite las repeticiones indicadas."],"en":"Leg Pull-In","ines":1,"f":"pull","m":"c"},"fdb-Leverage_Chest_Press":{"nombre":"Press de pecho en máquina de palanca","grupos":["pectoral"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Carga la máquina y ajusta el asiento a tu altura: al inicio, los agarres quedan a la altura de la parte baja o media del pecho.","Pecho y cabeza arriba, escápulas retraídas. Esta es la posición inicial.","Empuja los agarres al frente extendiendo los codos.","Tras una breve pausa, vuelve hasta justo antes de los topes, sin apoyar la carga hasta terminar la serie."],"en":"Leverage Chest Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Leverage_Deadlift":{"nombre":"Peso muerto en máquina de palanca","grupos":["cuadriceps"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Carga la máquina y párate justo entre los agarres. Toma los agarres inferiores con un agarre cómodo y baja la cadera mientras tomas aire. Mira al frente y mantén el pecho arriba. Esta es la posición inicial.","Empuja el suelo con los talones extendiendo cadera y rodillas hasta quedar de pie, con los brazos estirados y los hombros atrás al final.","Vuelve a la posición inicial."],"en":"Leverage Deadlift","ines":1,"f":"pull","m":"c","sec":["gluteos","isquios"]},"fdb-Leverage_Decline_Chest_Press":{"nombre":"Press declinado en máquina de palanca","grupos":["pectoral"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Carga la máquina y ajusta el asiento: al inicio, los agarres quedan a la altura de la parte baja del pecho. Pecho y cabeza arriba, escápulas retraídas. Esta es la posición inicial.","Empuja los agarres al frente extendiendo los codos.","Tras una breve pausa, vuelve hasta justo antes de los topes, sin apoyar la carga hasta terminar la serie."],"en":"Leverage Decline Chest Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Leverage_High_Row":{"nombre":"Remo alto en máquina de palanca","grupos":["dorsales"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Carga la máquina y ajusta el asiento para alcanzar justo los agarres sobre ti. Ajusta el cojín de las rodillas para no levantarte. Toma los agarres en prono. Esta es la posición inicial.","Tira los agarres hacia el torso juntando las escápulas y flectando los codos.","Pausa abajo y vuelve lento a la posición inicial.","Entre repeticiones, no apoyes la carga en los topes para mantener la tensión."],"en":"Leverage High Row","ines":1,"f":"pull","m":"c"},"fdb-Leverage_Incline_Chest_Press":{"nombre":"Press inclinado en máquina de palanca","grupos":["pectoral"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Carga la máquina y ajusta el asiento: al inicio, los agarres quedan a la altura de la parte alta del pecho. Pecho y cabeza arriba, escápulas retraídas. Esta es la posición inicial.","Empuja los agarres al frente extendiendo los codos.","Tras una breve pausa, vuelve hasta justo antes de los topes, sin apoyar la carga hasta terminar la serie."],"en":"Leverage Incline Chest Press","ines":1,"f":"push","m":"c","sec":["hombros","triceps"]},"fdb-Leverage_Iso_Row":{"nombre":"Remo iso en máquina de palanca","grupos":["dorsales"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Carga la máquina y ajusta el asiento para que los agarres queden a la altura del pecho. Tómalos en neutro o prono. Esta es la posición inicial.","Tira los agarres hacia el torso juntando las escápulas y flectando los codos.","Pausa atrás y vuelve lento. Entre repeticiones, no apoyes la carga en los topes."],"en":"Leverage Iso Row","ines":1,"f":"pull","m":"c","sec":["biceps"]},"fdb-Leverage_Shoulder_Press":{"nombre":"Press de hombros en máquina de palanca","grupos":["hombros"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Carga la máquina y ajusta el asiento: al inicio, los agarres quedan a la altura de la parte alta de los hombros. Pecho y cabeza arriba, agarre prono. Esta es la posición inicial.","Empuja los agarres hacia arriba extendiendo los codos.","Tras una breve pausa, vuelve hasta justo antes de los topes, sin apoyar la carga hasta terminar la serie."],"en":"Leverage Shoulder Press","ines":1,"f":"push","m":"c","sec":["triceps"]},"fdb-Leverage_Shrug":{"nombre":"Encogimiento en máquina de palanca","grupos":["trapecio"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Carga la máquina y párate justo entre los agarres.","Toma los agarres superiores y baja la cadera mientras tomas aire. Mira al frente con el pecho arriba.","Empuja con los talones extendiendo cadera y rodillas hasta quedar de pie, con los brazos estirados y los hombros atrás. Esta es la posición inicial.","Sube los hombros hacia las orejas, en línea recta.","Pausa arriba y vuelve a la posición inicial."],"en":"Leverage Shrug","ines":1,"f":"pull","m":"i","sec":["antebrazos"]},"fdb-Linear_3-Part_Start_Technique":{"nombre":"Técnica de salida lineal en 3 partes","grupos":["isquios"],"eq":"","niv":"Principiante","cat":"Pliometría","inst":["This drill helps you accelerate as quickly as possible into a sprint from a dead stop. It helps to use a line to start from. Begin with two feet on the line. Place your left foot with the toe next to your right ankle. Place your right foot 4-6 inches behind the left.","Place your right hand onto the line, and thing bring your nose close to your left knee.","Squat down as you lean foward, your head being lower than your hips and your weight loaded onto the left leg. This will be your starting position.","Take your left hand up so that it is parallel to the ground, pointing behind you, and explode out when ready."],"en":"Linear 3-Part Start Technique","f":"push","m":"c","sec":["cuadriceps","gemelos"]},"fdb-Linear_Acceleration_Wall_Drill":{"nombre":"Ejercicio de aceleración lineal en pared","grupos":["isquios"],"eq":"","niv":"Principiante","cat":"Pliometría","inst":["Lean at around 45 degrees against a wall. Your feet should be together, glutes contracted.","Begin by lifting your right knee quickly, pausing, and then driving it straight down into the ground.","Switch legs, raising the opposite knee, and then attacking the ground straight down.","Repeat once more with your right leg, and as soon as the right foot strikes the ground hammer them out rapidly, alternating left and right as fast as you can."],"en":"Linear Acceleration Wall Drill","m":"c","sec":["cuadriceps","gemelos","gluteos"]},"fdb-Linear_Depth_Jump":{"nombre":"Salto en profundidad lineal","grupos":["cuadriceps"],"eq":"Otro","niv":"Intermedio","cat":"Pliometría","inst":["You will need two boxes or benches spaced a few feet away from each other. Begin by standing on one box facing towards the other platform.","To initiate the movement, gently drop down to the ground between your platforms, allowing the knees and hips to flex.","Reverse the motion by exploding, extending through the hips, knees, and ankles to jump onto the other platform.","Land softly, asborbing the impact through the legs."],"en":"Linear Depth Jump","f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Log_Lift":{"nombre":"Levantamiento de tronco (log)","grupos":["hombros"],"eq":"Otro","niv":"Intermedio","cat":"Strongman","inst":["De pie con el tronco (log) frente a ti, toma los agarres y empieza el clean. Inclinado, intenta subirlo lo más alto posible pegándolo al pecho, y extiende cadera y rodillas para completar el clean.","Echa la cabeza atrás y mira arriba para formar un apoyo en el pecho. Inicia el press flectando un poco las rodillas e invirtiendo el movimiento; ese push press le da impulso vertical. Sigue extendiendo los codos hasta subir el log sobre la cabeza, pasando la cabeza adelante en cada repetición. No hay reglas estrictas de técnica: usa la que te resulte más eficiente.","Repite lo más que puedas, controlando la bajada del log al suelo."],"en":"Log Lift","ines":1,"f":"push","m":"c","sec":["core","cuadriceps","dorsales","espalda_baja","gluteos","isquios","pectoral","trapecio","triceps"]},"fdb-London_Bridges":{"nombre":"Puentes de Londres","grupos":["dorsales"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Cuelga una cuerda de escalar de una viga alta. Debajo, deja la barra de una Smith bloqueada con los seguros (o usa un cajón firme).","Párate sobre la barra afirmándote de la cuerda. Esta es la posición inicial.","Con el cuerpo recto, inclínate hacia atrás bajando mano sobre mano por la cuerda hasta quedar perpendicular al suelo.","Con el cuerpo recto, sube mano sobre mano hasta la posición inicial."],"en":"London Bridges","ines":1,"f":"pull","m":"c","sec":["antebrazos","biceps"]},"fdb-Looking_At_Ceiling":{"nombre":"Mirar al techo","grupos":["cuadriceps"],"eq":"","niv":"Principiante","cat":"Elongación","inst":["Kneel on the floor, holding your heels with both hands.","Lift your buttocks up and forward while bringing your head back to look up at the ceiling, to give an arch in your back."],"en":"Looking At Ceiling","f":"static","m":"i"},"fdb-Low_Cable_Crossover":{"nombre":"Cruce de poleas bajo","grupos":["pectoral"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon las poleas abajo, elige la carga y toma un agarre en cada mano.","Da un paso al frente para tensar los cables, palmas al frente, manos bajo la cintura y brazos estirados. Esta es la posición inicial.","Con los codos levemente flectados, sube las manos hacia la línea media hasta juntarlas frente al pecho, palmas hacia arriba.","Tras una breve pausa, vuelve a la posición inicial."],"en":"Low Cable Crossover","ines":1,"f":"push","m":"i","sec":["hombros"]},"fdb-Low_Cable_Triceps_Extension":{"nombre":"Extensión de tríceps en polea baja","grupos":["triceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Elige la carga y acuéstate boca arriba en el banco de la máquina de remo bajo con cuerda, con la cabeza hacia la polea.","Toma los extremos de la cuerda en agarre neutro.","Codos flectados a 90° y brazos perpendiculares al torso, apuntando al techo, con los antebrazos hacia la polea. Codos adentro. Esta es la posición inicial.","Botando el aire, extiende los antebrazos hasta dejarlos rectos y verticales; solo se mueven los antebrazos. Aprieta fuerte un segundo.","Vuelve lento inspirando.","Repite las repeticiones indicadas."],"en":"Low Cable Triceps Extension","ines":1,"f":"push","m":"i"},"fdb-Low_Pulley_Row_To_Neck":{"nombre":"Remo al cuello en polea baja","grupos":["hombros"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Siéntate en la máquina de remo bajo con cuerda.","Toma los extremos en prono, espalda recta y casi vertical, rodillas levemente flectadas y brazos estirados al frente. Esta es la posición inicial.","Sin mover el torso, sube los codos y tira la cuerda hacia el cuello botando el aire, con los brazos paralelos al suelo, hasta que las manos queden casi junto a las orejas y los codos abiertos.","Sostén un segundo y vuelve lento inspirando, sin mover el torso.","Repite las repeticiones indicadas."],"en":"Low Pulley Row To Neck","ines":1,"f":"pull","m":"c","sec":["biceps","dorsales","trapecio"]},"fdb-Lower_Back-SMR":{"nombre":"Zona lumbar con foam roller","grupos":["espalda_baja"],"eq":"Foam roller","niv":"Principiante","cat":"Elongación","inst":["In a seated position, place a foam roll under your lower back. Cross your arms in front of you and protract your shoulders. This will be your starting position.","Raise your hips off of the floor and lean back, keeping your weight on your lower back. Now shift your weight slightly to one side, keeping your weight off of the spine and on the muscles to the side of it. Roll over your lower back, holding points of tension for 10-30 seconds. Repeat on the other side."],"en":"Lower Back-SMR","f":"static"},"fdb-Lower_Back_Curl":{"nombre":"Curl lumbar","grupos":["core"],"eq":"Peso corporal","niv":"Principiante","cat":"Elongación","inst":["Lie on your stomach with your arms out to your sides. This will be your starting position.","Using your lower back muscles, extend your spine lifting your chest off of the ground. Do not use your arms to push yourself up. Keep your head up during the movement. Repeat for 10-20 repetitions."],"en":"Lower Back Curl","f":"static"},"fdb-Lunge_Pass_Through":{"nombre":"Zancada con pase","grupos":["isquios"],"eq":"Kettlebell","niv":"Intermedio","cat":"Fuerza","inst":["De pie, erguido, con una kettlebell en la mano derecha. Esta es la posición inicial.","Da un paso al frente con el pie izquierdo y baja flectando cadera y rodilla, torso erguido, hasta que la rodilla de atrás casi toque el suelo.","Mientras bajas, pasa la kettlebell por debajo de la pierna de adelante a la otra mano.","Empuja con el pie de adelante para volver a la posición inicial.","Repite las repeticiones indicadas alternando piernas."],"en":"Lunge Pass Through","ines":1,"f":"push","m":"c","sec":["cuadriceps","gemelos","gluteos"]},"fdb-Lunge_Sprint":{"nombre":"Sprint en zancada","grupos":["cuadriceps"],"eq":"Máquina","niv":"Intermedio","cat":"Fuerza","inst":["Ajusta la barra de la Smith a la altura adecuada y apóyala en la parte alta de la espalda. Desbloquéala y separa los pies, uno adelante y otro atrás. Esta es la posición inicial.","Baja la rodilla de atrás casi hasta el suelo flectando las rodillas.","Abajo, invierte de inmediato: empuja explosivo con el pie de adelante y un poco con el de atrás, salta y cambia la posición de las piernas.","Repite las repeticiones indicadas."],"en":"Lunge Sprint","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Lying_Bent_Leg_Groin":{"nombre":"Estiramiento de ingle acostado con piernas flectadas","grupos":["aductores"],"eq":"Otro","niv":"Avanzado","cat":"Elongación","inst":["Lie on your back with your knees bent and the soles of the feet pressed together. Have your partner hold your knees. This will be your starting position.","Attempt to squeeze your knees together, while your partner prevents any movement from occurring.","After 10-20 seconds, relax your muscles as your partner gently pushes your knees towards the floor. Be sure to inform your helper when the stretch is adequate to prevent injury or overstretching."],"en":"Lying Bent Leg Groin","f":"static"},"fdb-Lying_Cable_Curl":{"nombre":"Curl acostado en polea","grupos":["biceps"],"eq":"Polea","niv":"Intermedio","cat":"Fuerza","inst":["Toma con ambas manos una barra recta o Z enganchada a la polea baja, en supino y al ancho de hombros.","Acuéstate de espaldas en una colchoneta frente a la máquina, con los pies contra la estructura y las piernas estiradas.","Con los brazos estirados y los codos cerca del cuerpo, flecta levemente los codos. Esta es la posición inicial.","Sin mover los brazos, sube la barra lento hacia el pecho botando el aire y apretando el bíceps.","Aprieta un segundo arriba y vuelve lento.","Repite las repeticiones indicadas."],"en":"Lying Cable Curl","ines":1,"f":"pull","m":"i"},"fdb-Lying_Cambered_Barbell_Row":{"nombre":"Remo acostado con barra curvada","grupos":["dorsales"],"eq":"Barra","niv":"Principiante","cat":"Fuerza","inst":["Pon una barra curvada bajo un banco.","Acuéstate boca abajo en el banco y toma la barra en prono, más ancho que los hombros. Esta es la posición inicial.","Botando el aire, rema la barra con los codos cerca del cuerpo: hacia el pecho para enfatizar la espalda alta-media, o hacia el abdomen para los dorsales.","Sostén un segundo y baja lento inspirando."],"en":"Lying Cambered Barbell Row","ines":1,"f":"pull","m":"i","sec":["biceps","trapecio"]},"fdb-Lying_Close-Grip_Bar_Curl_On_High_Pulley":{"nombre":"Curl acostado en polea alta agarre cerrado","grupos":["biceps"],"eq":"Polea","niv":"Principiante","cat":"Fuerza","inst":["Pon un banco plano frente a una polea alta o máquina de jalón.","Toma la barra recta en supino, al ancho de hombros.","Acuéstate de espaldas con la cabeza en el extremo del banco.","Estira los brazos sobre los hombros, a 90° del torso, con los codos adentro. Esta es la posición inicial.","Botando el aire, flecta los codos llevando la barra en semicírculo hasta el mentón. Aprieta un segundo. Solo se mueven los antebrazos; los brazos quedan perpendiculares.","Vuelve lento.","Repite las repeticiones indicadas."],"en":"Lying Close-Grip Bar Curl On High Pulley","ines":1,"f":"pull","m":"i"},"fdb-Lying_Close-Grip_Barbell_Triceps_Extension_Behind_The_Head":{"nombre":"Extensión de tríceps acostado tras la cabeza con barra cerrada","grupos":["triceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Con una barra o barra Z en prono (barra al ancho de hombros; barra Z en los agarres internos), acuéstate en un banco plano con la cabeza cerca del extremo.","Estira los brazos al frente y llévalos en semicírculo, estirados, hasta quedar sobre la cabeza y paralelos al suelo. Codos siempre adentro. Esta es la posición inicial.","Inspirando, baja la barra flectando los codos sin mover los brazos, hasta que los antebrazos queden perpendiculares al suelo.","Botando el aire, vuelve en semicírculo hasta que los antebrazos queden paralelos al suelo. Aprieta fuerte un segundo. Solo se mueven los antebrazos.","Repite las repeticiones indicadas."],"en":"Lying Close-Grip Barbell Triceps Extension Behind The Head","ines":1,"f":"push","m":"i"},"fdb-Lying_Close-Grip_Barbell_Triceps_Press_To_Chin":{"nombre":"Press de tríceps al mentón con barra cerrada","grupos":["triceps"],"eq":"Barra Z","niv":"Intermedio","cat":"Fuerza","inst":["Con una barra o barra Z en prono (barra al ancho de hombros; barra Z en los agarres internos), acuéstate en un banco plano con la cabeza fuera del extremo.","Sostén la barra sobre el pecho con los brazos estirados, a 90° del torso. Esta es la posición inicial.","Inspirando, baja la barra en semicírculo flectando los codos, sin mover los brazos y con los codos adentro, hasta rozar el mentón.","Botando el aire, vuelve en semicírculo a la posición inicial. Aprieta fuerte un segundo. Solo se mueven los antebrazos.","Repite las repeticiones indicadas."],"en":"Lying Close-Grip Barbell Triceps Press To Chin","ines":1,"f":"push","m":"i"},"fdb-Lying_Crossover":{"nombre":"Cruce acostado (estiramiento)","grupos":["abductores"],"eq":"Peso corporal","niv":"Avanzado","cat":"Elongación","inst":["Lie on your back with your legs extended.","Cross one leg over your body with the knee bent, attempting to touch the knee to the ground. Your partner should kneel beside you, holding your shoulder down with one hand and controlling the crossed leg with the other. this will be your starting position.","Attempt to raise the bent knee off of the ground as your partner prevents any actual movement.","After 10-20 seconds, relax the leg as your partner gently presses the knee towards the floor. Repeat with the other side."],"en":"Lying Crossover","f":"static"},"fdb-Lying_Dumbbell_Tricep_Extension":{"nombre":"Extensión de tríceps acostado con mancuernas","grupos":["triceps"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate en un banco plano con dos mancuernas sobre ti, brazos estirados a 90° del torso, palmas enfrentadas y codos recogidos. Esta es la posición inicial.","Inspirando, sin mover los brazos y con los codos adentro, baja lento las mancuernas hasta cerca de las orejas.","Desde ahí, sube con los tríceps a la posición inicial botando el aire.","Repite las repeticiones indicadas."],"en":"Lying Dumbbell Tricep Extension","ines":1,"f":"push","m":"i","sec":["hombros","pectoral"]},"fdb-Lying_Face_Down_Plate_Neck_Resistance":{"nombre":"Resistencia de cuello boca abajo con disco","grupos":["cuello"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate boca abajo en un banco plano con los hombros justo pasado el borde, de modo que pecho alto, cuello y cara queden fuera. Sostén un disco detrás de la cabeza. Esta es la posición inicial.","Con el disco firme, baja lento la cabeza (como diciendo “sí”), inspirando.","Sube la cabeza en semicírculo botando el aire y sostén un segundo.","Repite las repeticiones indicadas."],"en":"Lying Face Down Plate Neck Resistance","ines":1,"f":"pull","m":"i"},"fdb-Lying_Face_Up_Plate_Neck_Resistance":{"nombre":"Resistencia de cuello boca arriba con disco","grupos":["cuello"],"eq":"Otro","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate boca arriba en un banco plano con los hombros justo pasado el borde, de modo que trapecios, cuello y cabeza queden fuera. Sostén un disco sobre la frente. Esta es la posición inicial.","Con el disco firme, baja lento la cabeza hacia atrás en semicírculo, inspirando.","Súbela en semicírculo botando el aire y sostén un segundo.","Repite las repeticiones indicadas."],"en":"Lying Face Up Plate Neck Resistance","ines":1,"f":"pull","m":"i"},"fdb-Lying_Glute":{"nombre":"Estiramiento de glúteo acostado","grupos":["gluteos"],"eq":"Peso corporal","niv":"Avanzado","cat":"Elongación","inst":["Lie on your back with your partner kneeling beside you.","Flex the hip of one leg, raising it off of the floor. Rotate the leg so the foot is over the opposite hip, the lower leg perpendicular to your body. Your partner should hold the knee and ankle in place. This will be your starting position.","Attempt to push your leg towards your partner, who should be preventing any actual movement of the leg.","After 10-20 seconds, completely relax as your partner gently pushes the ankle and knee towards your chest. Be sure to inform your helper when the stretch is adequate to prevent injury or overstretching."],"en":"Lying Glute","f":"static","sec":["abductores"]},"fdb-Lying_Hamstring":{"nombre":"Estiramiento de isquiotibiales acostado","grupos":["isquios"],"eq":"Otro","niv":"Avanzado","cat":"Elongación","inst":["Lie on your back with your legs extended. Your partner should be kneeling beside you. Raise one leg up towards the ceiling and have your partner hold the ankle. Your partner can use their shoulder to brace your leg if necessary. This will be your starting position.","With your partner holding your leg in place, attempt to flex the knee, contracting the hamstrings for 10-20 seconds.","Then relax your leg, allowing your partner to gently push the leg towards your head. Be sure to inform your helper when the stretch is adequate to prevent injury or overstretching. Switch sides once complete."],"en":"Lying Hamstring","f":"static","sec":["gemelos"]},"fdb-Lying_High_Bench_Barbell_Curl":{"nombre":"Curl con barra acostado en banco alto","grupos":["biceps"],"eq":"Barra","niv":"Intermedio","cat":"Fuerza","inst":["Acuéstate boca abajo en un banco plano alto con una barra en supino (barra al ancho de hombros; barra Z en los agarres internos). El pecho alto queda en el borde y la barra cuelga con los brazos estirados y perpendiculares al suelo. Esta es la posición inicial.","Con los codos adentro y sin mover los brazos, sube la barra en semicírculo contrayendo el bíceps, botando el aire. Sostén un segundo.","Inspirando, baja lento a la posición inicial, con control y sin balanceo. Solo se mueven los antebrazos.","Repite las repeticiones indicadas."],"en":"Lying High Bench Barbell Curl","ines":1,"f":"pull","m":"i"},"fdb-Lying_Leg_Curls":{"nombre":"Curl femoral acostado","grupos":["isquios"],"eq":"Máquina","niv":"Principiante","cat":"Fuerza","inst":["Ajusta la palanca a tu altura y acuéstate boca abajo en la máquina con el cojín sobre la parte baja de las piernas, unos centímetros bajo las pantorrillas. Mejor si la máquina es inclinada en vez de plana.","Con el torso plano en el banco y las piernas completamente estiradas, toma los agarres laterales. Puntas de los pies hacia abajo. Esta es la posición inicial.","Botando el aire, flecta las piernas lo más posible sin despegar los muslos del cojín. Sostén un segundo en la contracción máxima.","Vuelve inspirando a la posición inicial. Repite las repeticiones indicadas."],"en":"Lying Leg Curls","ines":1,"f":"pull","m":"i"},"fdb-Lying_Machine_Squat":{"nombre":"Sentadilla en máquina acostado","grupos":["cuadriceps"],"eq":"Máquina","niv":"Intermedio","cat":"Fuerza","inst":["Ajusta la máquina a una altura que te permita entrar con las rodillas flectadas y los muslos un poco bajo el paralelo.","Elige la carga y ubícate boca arriba en la máquina, con las rodillas flectadas un poco menos de 90°, espalda y cabeza apoyadas y hombros bajo los cojines.","Manos en los agarres y pies al ancho de hombros con las puntas levemente afuera. Esta es la posición inicial.","Empujando con la parte delantera de los pies, extiéndete por completo botando el aire y apretando los cuádriceps. Sostén un segundo. En la primera repetición puedes ayudarte empujando los muslos con las manos.","Baja lento inspirando, pero detente cuando los muslos queden paralelos a la plataforma (90°).","Repite las repeticiones indicadas."],"en":"Lying Machine Squat","ines":1,"f":"push","m":"c","sec":["gemelos","gluteos","isquios"]},"fdb-Lying_One-Arm_Lateral_Raise":{"nombre":"Elevación lateral acostado a una mano","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Con una mancuerna en una mano, acuéstate boca abajo en un banco plano. Con la otra mano puedes afirmarte del banco.","Palma neutra (hacia el torso), brazo estirado con el codo levemente flectado. Esta es la posición inicial.","Sube el brazo hacia el lado hasta que el codo llegue a la altura del hombro y el brazo quede casi paralelo al suelo, botando el aire. Brazo perpendicular al torso; sostén un segundo arriba.","Baja lento inspirando.","Repite las repeticiones indicadas."],"en":"Lying One-Arm Lateral Raise","ines":1,"f":"pull","m":"i"},"fdb-Lying_Prone_Quadriceps":{"nombre":"Estiramiento de cuádriceps boca abajo","grupos":["cuadriceps"],"eq":"Peso corporal","niv":"Avanzado","cat":"Elongación","inst":["Lay face down on the floor with your partner kneeling beside you. Flex one knee and raise that leg off the ground, attempting to touch your glutes with your foot. Your partner should hold the knee and ankle. This will be your starting position.","Attempt to extend your knee while your partner prevents any actual movement.","After 10-20 seconds, relax your muscles as your partner gently pushes the foot towards your glutes, further stretching the quadriceps and hip flexors.","After 10-20 seconds, switch sides."],"en":"Lying Prone Quadriceps"},"fdb-Lying_Rear_Delt_Raise":{"nombre":"Elevación posterior acostado","grupos":["hombros"],"eq":"Mancuernas","niv":"Intermedio","cat":"Fuerza","inst":["Con una mancuerna en cada mano, acuéstate boca abajo en un banco plano.","Palmas neutras (hacia el torso), brazos estirados con los codos levemente flectados. Esta es la posición inicial.","Sube los brazos hacia los lados hasta que los codos lleguen a la altura de los hombros y los brazos queden casi paralelos al suelo, botando el aire. Brazos perpendiculares al torso; sostén un segundo arriba.","Baja lento inspirando.","Repite las repeticiones indicadas."],"en":"Lying Rear
